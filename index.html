      {id:"moe-output",cat:"Architektur",title:"MoE-Ausgabe",expr:"y(x)=Σₑ∈TopK(x) gₑ(x) · Eₑ(x)",latex:"y(x)=\\sum_{e\\in\\operatorname{TopK}(x)}g_e(x)E_e(x)",read:"Mische Outputs der ausgewählten Experten mit Routergewichten.",purpose:"Sparse Aktivierung vieler Feed-Forward-Experten.",dims:"Jeder E_e(x) und y haben gleiche Modellform; g_e skalar pro Token/Experte.",vars:[["Eₑ","Experten-MLP"],["gₑ","Routergewicht"],["TopK","aktive Expertenmenge"]],intuition:"Jedes Token nutzt nur wenige Spezialisten.",pitfall:"Routergewichtung und Kapazitäts-/Load-Balance-Regeln sind Teil des Systems.",example:"K=2 aktiviert zwei von 64 Experten.",check:"Was skaliert mit Gesamt-, was mit aktiven Experten?",sources:["l04"],aliases:"mixture experts router top k sparse"},
      {id:"moe-capacity",cat:"Architektur",title:"MoE Expert Capacity",expr:"C_expert = ⌈c_f · T · k / E⌉",latex:"C_{expert}=\\left\\lceil c_f\\frac{Tk}{E}\\right\\rceil",read:"Multipliziere die gleichmäßige durchschnittliche Zahl von Expert Assignments mit dem Capacity Factor und runde auf.",purpose:"Legt ein explizites Slot-Budget pro Expert und Routinggruppe fest.",dims:"T, k, E und C_expert sind Zählwerte; c_f ist ein dimensionsloser Faktor.",vars:[["T","Tokens in der Routinggruppe"],["k","gewählte Experts pro Token"],["E","Gesamtzahl Experts"],["c_f","Capacity Factor"]],intuition:"T·k Assignments werden ideal gleichmäßig auf E Experts verteilt; Reserve fängt Load-Schwankungen ab.",pitfall:"Overflow weder still verwerfen noch mit Modellparameterkapazität verwechseln; die konkrete Overflow-Regel gehört zur Semantik.",example:"T=12,k=2,E=4,c_f=1 ⇒ C_expert=6.",check:"Wie viele Assignments laufen bei acht Zuweisungen und Capacity sechs in den Overflow?",sources:["l04"],aliases:"moe capacity factor overflow slots expert load"},
      {id:"moe-balance",cat:"Architektur",title:"MoE Auxiliary Balance Loss",expr:"L_bal = α_bal · E · Σ_i f_i P_i",latex:"\\mathcal L_{bal}=\\alpha_{bal}E\\sum_i f_iP_i",read:"Kopple den Anteil harter Zuweisungen eines Experts mit seiner mittleren weichen Routerwahrscheinlichkeit.",purpose:"Erzeugt Gradientendruck gegen dauerhaft über- oder unterausgelastete Experts.",dims:"f_i und P_i sind Anteile beziehungsweise Wahrscheinlichkeiten; L_bal ist ein skalarer Auxiliary Loss.",vars:[["f_i","Anteil Tokens, die hart Expert i wählen"],["P_i","mittlere Routerwahrscheinlichkeit für Expert i"],["E","Expertzahl"],["α_bal","Gewicht relativ zum Language-Model-Loss"]],intuition:"Ein Expert mit hohem harten Load und hoher weicher Wahrscheinlichkeit erhöht den Zusatzloss besonders.",pitfall:"Die gezeigte Form ist die Top-1-Variante; nicht mit Router z-loss oder einer garantierten perfekten Gleichverteilung verwechseln.",example:"Bei ideal gleichmäßiger Top-1-Verteilung gilt f_i=P_i=1/E.",check:"Welchen Zielkonflikt erzeugt ein zu großes α_bal?",sources:["l04"],aliases:"moe load balancing auxiliary loss switch router"},
      {id:"ring-allreduce",cat:"Parallelismus",title:"Ring All-Reduce Volumen",expr:"Bytes pro Rank ≈ 2·(W−1)/W · M",latex:"V_{rank}\\approx2\\frac{W-1}{W}M",read:"Reduce-Scatter plus All-Gather bewegen je fast einen Tensorumfang pro Rank.",purpose:"Bandbreitenmodell für Gradientsynchronisation.",dims:"Bytes pro Rank.",vars:[["W","World Size"],["M","Tensorgröße in Bytes"],["2","zwei Ringphasen"]],intuition:"Jeder Rank sendet kleine Chunks im Kreis, statt alles zu einem Zentrum zu schicken.",pitfall:"Latenzterm und Duplex-/Topologiedetails fehlen in dieser Näherung.",example:"Für großes W nähert sich das Volumen 2M.",check:"Warum wächst es nicht linear mit W?",sources:["l07","a2"],aliases:"all reduce reduce scatter all gather communication volume"},
      {id:"distributed-critical-path",cat:"Parallelismus",title:"Distributed kritischer Pfad",expr:"W_total=d·t·p   ·   B_global=B_micro·accum·d   ·   T_step≈T_compute+max(0,T_comm−T_overlap)",latex:"W_{total}=dtp,\\quad B_{global}=B_{micro}ad,\\quad T_{step}\\approx T_c+\\max(0,T_m-T_o)",read:"Multipliziere die Parallelitätsgrade für die Rankzahl, aber nur den Datenparallelgrad für den Batch; addiere nur nicht verdeckte Kommunikation zur Computezeit.",purpose:"Verhindert World-Size-Faktorfehler und macht sichtbar, welcher Kommunikationsanteil den tatsächlichen Step verlängert.",dims:"d,t,p und accumulation sind dimensionslos; B zählt Beispiele; alle T-Terme sind Zeiten in derselben Einheit.",vars:[["d,t,p","Daten-, Tensor- und Pipelineparallelgrad"],["B_micro","lokaler Microbatch"],["accum","Gradient-Accumulation-Schritte"],["T_overlap","tatsächlich mit Compute überlappte Kommunikationszeit"]],intuition:"Modellparallel-Ranks teilen Arbeit am selben Datenbatch; Overlap spart nur Zeit, wenn Kommunikation vor ihrer Abhängigkeit wirklich gleichzeitig laufen kann.",pitfall:"Gesamt-World-Size als Datenparallelgrad einzusetzen oder gestartete asynchrone Arbeit automatisch vollständig als Overlap zu verbuchen.",example:"d=4,t=4,p=2,B_micro=2,accum=4 ⇒ W_total=32 und B_global=32, nicht 256.",check:"Wann verschwindet Kommunikation in dieser Näherung vollständig vom kritischen Pfad?",sources:["l07","l08","a2"],aliases:"distributed world size global batch overlap critical path ddp process group"},
      {id:"pipeline-efficiency",cat:"Parallelismus",title:"Pipeline Bubble (vereinfachtes 1F1B-Modell)",expr:"E ≈ m / (m + p − 1)",latex:"E\\approx\\frac{m}{m+p-1}",read:"Microbatches geteilt durch Microbatches plus Füll-/Leer-Overhead.",purpose:"Grobe Effizienzabschätzung einer Pipeline mit p Stages.",dims:"Dimensionsloser Anteil.",vars:[["m","Microbatches pro Batch"],["p","Pipeline-Stages"]],intuition:"Mehr Microbatches amortisieren das Füllen der Pipeline.",pitfall:"Exakte Schedules, unbalancierte Stages und Kommunikation ändern den Wert.",example:"m=8,p=4 ⇒ E≈8/11≈73%.",check:"Welchen Preis hat sehr großes m?",sources:["l07","l08"],aliases:"pipeline parallel bubble microbatch efficiency"},
      {id:"scaling-law",cat:"Scaling",title:"Chinchilla-artiges Loss-Modell",expr:"L(N,D) = E + A/Nᵅ + B/Dᵝ",latex:"L(N,D)=E+\\frac{A}{N^\\alpha}+\\frac{B}{D^\\beta}",read:"Irreduzibler Loss plus parameter- und datenlimitierter Potenzterm.",purpose:"Modelliert Training-Loss über Modellgröße und Tokenzahl.",dims:"L,E dimensionslos (Nats/Token); N Parameter, D Tokens.",vars:[["E","asymptotischer Loss"],["A,B","Skalen"],["α,β","positive Exponenten"],["N","Parameter"],["D","Tokens"]],intuition:"Mehr Modell oder Daten hilft mit abnehmendem Grenznutzen.",pitfall:"Empirisches Fit-Modell; Architektur, Daten und Trainingsrezept müssen vergleichbar sein.",example:"Im log-log-Bereich ergibt jeder dominante Term ungefähr eine Gerade.",check:"Was passiert für N,D→∞?",sources:["l09","a3"],aliases:"power law chinchilla kaplan loss model data parameters"},
      {id:"isoflops",cat:"Scaling",title:"IsoFLOPs-Bedingung",expr:"D = C / (6N)",latex:"D=\\frac{C}{6N}",read:"Bei festem Compute bestimmt jede Modellgröße die bezahlbare Tokenzahl.",purpose:"Erzeugt Profile gleicher Trainings-FLOPs für Compute-Optimalität.",dims:"C FLOPs, N Parameter, D Tokens.",vars:[["C","Compute-Budget"],["N","Modellparameter"],["D","Trainingstokens"]],intuition:"Größeres Modell sieht bei gleichem Budget weniger Daten.",pitfall:"Gilt als grobe dichte-Transformer-Näherung, nicht als Abrechnung jeder Operation.",example:"N verdoppeln ⇒ D halbieren.",check:"Warum entsteht typischerweise ein Loss-Minimum entlang des Profils?",sources:["l09","a3"],aliases:"compute optimal isoflops 6nd model data tradeoff"},
      {id:"scaling-optimal-fit",cat:"Scaling",title:"Compute-optimaler Power-Law-Fit",expr:"log N_opt = a·log C + b   ⇒   N_opt(C) = exp(b)·Cᵃ",latex:"\\log N_{opt}=a\\log C+b,\\quad N_{opt}(C)=e^bC^a",read:"Fitte eine Gerade durch gültige IsoFLOPs-Minima im Lograum und transformiere die Vorhersage zurück.",purpose:"Extrapoliert die compute-optimale Modellgröße über mehrere Compute-Tiers.",dims:"C und N müssen in fest dokumentierten Einheiten positiv sein; a ist dimensionslos, b hängt von den Einheiten ab.",vars:[["C","Trainings-Compute"],["N_opt","inneres Loss-Minimum eines Compute-Tiers"],["a","Steigung beziehungsweise Scaling-Exponent"],["b","Achsenabschnitt in den gewählten Einheiten"]],intuition:"Eine multiplikative Beziehung N_opt∝Cᵃ wird nach dem Logarithmus linear.",pitfall:"Randminima oder unvollständige Runs als echte Optima fitten; eine Gerade kann dann sehr präzise aussehen und trotzdem systematisch falsch sein.",example:"C=[1,4,16] und N_opt=[10,20,40] Mio. ⇒ a=0.5, b=log(10), also N_opt=10√C Mio.",check:"Warum sollte ein Tier einmal aus dem Fit entfernt und anschließend vorhergesagt werden?",sources:["l09","l11","a3"],aliases:"lower envelope log log fit holdout leave one tier out scaling exponent"},
      {id:"compute-optimal-predictions",cat:"Scaling",title:"Compute-optimale N-, D- & Loss-Vorhersagen",expr:"N_opt=A_NCᵃ   ·   D_opt=A_DCᵇ   ·   L_opt=E+A_LC^(−γ)",latex:"N_{opt}=A_NC^a,\\quad D_{opt}=A_DC^b,\\quad L_{opt}=E+A_LC^{-\\gamma}",read:"Fitte Modellgröße, Tokenzahl und den über E verbleibenden Loss als getrennte Potenzgesetze über Compute.",purpose:"Macht die vollständige A3-Zielprognose einschließlich irreduziblem Loss-Offset und Konsistenzprüfung explizit.",dims:"N und D sind Zählgrößen, C ist Compute in fester Einheit, L und E haben dieselbe Loss-Skala; Exponenten sind dimensionslos.",vars:[["A_N,A_D,A_L","einheitenabhängige Vorfaktoren"],["a,b,γ","positive Scaling-Exponenten"],["E","irreduzibler beziehungsweise asymptotischer Loss-Offset"]],intuition:"Im Lograum werden N und D direkt linear; für den Loss wird nur der positive Abstand L_opt−E logarithmiert.",pitfall:"E ungeprüft auf null setzen oder a+b≈1 als Naturgesetz behandeln, obwohl D nicht konsistent aus C/(6N) konstruiert wurde.",example:"Bei abgeleitetem D und C≈6ND sollte a+b ungefähr eins sein; bei unabhängigen Fits ist eine Abweichung nicht automatisch ein Rechenfehler.",check:"Warum braucht ein unbekannter Offset E eine Sensitivitätsanalyse?",sources:["l09","l11","a3"],aliases:"n opt d opt l opt offset scaling predictions exponent sum"},
      {id:"mup-transfer",cat:"Scaling",title:"Lecture-11-μP-Rollenskalierung",expr:"r=M/M₀: Emb var×1, lr×1   ·   Hidden var×1/r, lr×1/r   ·   Readout var×1/r², lr×1/r",latex:"r=M/M_0:\\quad (v_e,\\eta_e)=(1,1),\\ (v_h,\\eta_h)=(r^{-1},r^{-1}),\\ (v_o,\\eta_o)=(r^{-2},r^{-1})",read:"Skaliere Initialisierungsvarianz und Adam-Lernrate gemäß der Rolle einer Matrix, nicht mit einem einzigen globalen Breitenfaktor.",purpose:"Dokumentiert den exakten Hyperparameter-Transfervertrag des in Lecture 11 behandelten Maximum-Update-Parametrization-Protokolls.",dims:"r ist dimensionslos; Varianzfaktoren multiplizieren die Basisvarianz, Lernratenfaktoren die Basis-Adam-Lernrate. Standardabweichung ist die Wurzel des Varianzfaktors.",vars:[["M,M₀","Ziel- und Basisbreite"],["r","Breitenverhältnis"],["var","Initialisierungsvarianzfaktor"],["lr","Adam-Lernratenfaktor"]],intuition:"Hidden- und Readout-Matrizen summieren unterschiedlich viele breite Beiträge und benötigen daher verschiedene Start- und Updategrößen.",pitfall:"Diese Tabelle ist protokollspezifisch, behandelt primär Breitenskalierung und darf nicht blind auf andere Optimizer, Tiefe oder Rollen übertragen werden.",example:"r=4 ⇒ Hidden std×1/2 und lr×1/4; Readout std×1/4 und lr×1/4; Embedding bleibt unverändert.",check:"Warum ist der Readout-Standardabweichungsfaktor 1/r und nicht 1/r²?",sources:["l11","a3"],aliases:"mup maximum update parametrization width transfer initialization adam learning rate wsd"},
      {id:"ngram-filter",cat:"Daten",title:"n-gram Maximum Likelihood & Backoff",expr:"p(w|h) = count(h,w) / count(h)",latex:"p(w\\mid h)=\\frac{c(h,w)}{c(h)}",read:"Zähle, wie häufig Wort w auf den Kontext h folgt, relativ zu allen Fortsetzungen von h.",purpose:"Grundlage eines n-gram Language Models wie KenLM für ein Target-Likelihood- oder Perplexity-Ranking.",dims:"p ist dimensionslos zwischen 0 und 1; Counts sind nichtnegative ganze Zahlen.",vars:[["h","Kontext aus den vorigen n−1 Tokens"],["w","vorhergesagtes nächstes Token"],["c(h,w)","Häufigkeit von Kontext und Fortsetzung"],["c(h)","Häufigkeit des Kontexts"]],intuition:"Lokale Zählungen werden zu bedingten Next-Token-Wahrscheinlichkeiten; die Produkt- beziehungsweise Logsumme bewertet den ganzen Text.",pitfall:"Ungesehene n-Gramme erhalten bei reinem MLE Wahrscheinlichkeit null. Kneser-Ney discountet gesehene Counts und backed off auf kürzere, fortsetzungsinformative Kontexte.",example:"Nach h folgt w dreimal unter zehn Fortsetzungen ⇒ p_MLE=0,3.",check:"Warum braucht ein praktisches n-gram Model Smoothing oder Backoff?",sources:["l14"],aliases:"kenlm ngram maximum likelihood kneser ney smoothing backoff"},
      {id:"fasttext-filter",cat:"Daten",title:"fastText Bag-of-n-Grams Classifier",expr:"h(x)=(1/L)Σᵢ E[hash(gᵢ) mod B];   p(y|x)=softmax(Uh+b)",latex:"h(x)=\\frac1L\\sum_{i=1}^{L}E_{\\operatorname{hash}(g_i)\\bmod B},\\quad p(y\\mid x)=\\operatorname{softmax}(Uh+b)",read:"Hash n-Grams in feste Buckets, mittlere ihre Embeddings und klassifiziere den Dokumentvektor linear.",purpose:"Schnelle Language-Identification sowie Quality- oder Topic-Classification auf sehr großen Corpora.",dims:"E hat [B,H], h [H], U [K,H] und p [K].",vars:[["gᵢ","Wort- oder Character-n-Gram i"],["B","Zahl der Hash-Buckets"],["E","gelernte Bucket-Embedding-Tabelle"],["H","Hidden-Dimension"],["K","Zahl der Klassen"],["U,b","gelernter Linear Classifier"]],intuition:"Der Mittelwert ist schnell und reihenfolgearm; der Classifier lernt, welche gehashten Muster Labels unterscheiden.",pitfall:"Hash-Kollisionen teilen Parameter, und der Outputscore übernimmt Bias sowie Labeldefinition der Trainingsdaten.",example:"Zwei n-Gramme im selben Bucket verwenden dieselbe Embeddingzeile, auch wenn ihre Bedeutung verschieden ist.",check:"Warum bleibt der Speicher trotz sehr vieler möglicher n-Gramme begrenzt?",sources:["l14","a4"],aliases:"fasttext hashed ngrams classifier language identification quality"},
      {id:"importance-resampling",cat:"Daten",title:"DSIR Importance Resampling",expr:"w(x)=p_T(x)/p_R(x);   w̃ᵢ=w(xᵢ)/Σⱼw(xⱼ)",latex:"w(x)=\\frac{p_T(x)}{p_R(x)},\\quad \\tilde w_i=\\frac{w(x_i)}{\\sum_j w(x_j)}",read:"Teile Target- durch Raw-Dichte und normalisiere die Ratios zu Resampling-Wahrscheinlichkeiten.",purpose:"Data Selection via Importance Resampling (DSIR) verschiebt einen Raw Corpus in Richtung einer Target Distribution, ohne nur nach Target-Likelihood zu sortieren.",dims:"w und w̃ sind dimensionslos; die normalisierten Gewichte summieren sich zu eins.",vars:[["p_T","geschätzte Target-Dichte auf gemeinsamen Features"],["p_R","geschätzte Raw- oder Proposal-Dichte"],["w(x)","unnormalisiertes Importance Weight"],["w̃ᵢ","normalisierte Auswahlwahrscheinlichkeit"]],intuition:"Ein Target-typisches Muster zählt besonders, wenn es im Raw Corpus relativ selten ist.",pitfall:"Fehlender oder winziger Raw Support erzeugt undefinierte beziehungsweise extreme Gewichte; Smoothing und Log-Space-Rechnung sind nötig. Top-k nach w ist nicht probabilistisches Resampling.",example:"A: .30/.60=.5; B: .20/.10=2 ⇒ B hat trotz kleinerem p_T vierfaches Ratio.",check:"Warum kann DSIR B häufiger wählen, obwohl p_T(B)&lt;p_T(A) gilt?",sources:["l14"],aliases:"dsir data selection density ratio target proposal importance sampling"},
      {id:"bloom-filter",cat:"Daten",title:"Bloom Filter: FPR & optimales k",expr:"f=[1−(1−1/m)^(kn)]^k ≈ (1−e^(−kn/m))^k;   k*= (m/n) ln 2",latex:"f=\\left[1-\\left(1-\\frac1m\\right)^{kn}\\right]^k\\approx\\left(1-e^{-kn/m}\\right)^k,\\quad k^*=\\frac mn\\ln2",read:"Berechne zuerst die Bitbelegung und dann die Chance, dass bei einer negativen Query alle k geprüften Bits zufällig eins sind.",purpose:"Plant Speicher, Insertions und Hashzahl eines probabilistischen Membership Filters.",dims:"m,n,k sind Counts; f ist eine Wahrscheinlichkeit zwischen 0 und 1.",vars:[["m","Zahl der Bits"],["n","Zahl eingefügter Elemente"],["k","Hash Functions pro Element und Query"],["f","theoretische False-Positive-Wahrscheinlichkeit"],["k*","reellwertiges Optimum, praktisch auf sinnvolle ganze Zahl prüfen"]],intuition:"Mehr Hashes verlangen mehr Treffer, setzen aber auch mehr Bits; das erzeugt ein inneres Optimum.",pitfall:"Am Optimum ist ungefähr die Hälfte der Bits gesetzt; die FPR selbst ist ungefähr 2^(−k), nicht 0,5. Empirische FPR ist FP/(FP+TN) über negative Queries.",example:"m=100,n=10 ⇒ k*≈6,93, also k=7 als erster Kandidat.",check:"Was bedeutet ein positives gegenüber einem negativen Query-Resultat?",sources:["l14"],aliases:"bloom filter membership false positive bit array hashes optimal k"},
      {id:"logistic",cat:"Daten",title:"Logistische Wahrscheinlichkeit",expr:"p(y=1|x)=σ(wᵀx+b)=1/(1+e^(−(wᵀx+b)))",latex:"p(y=1\\mid x)=\\sigma(w^Tx+b)",read:"Eine lineare Scorefunktion wird durch Sigmoid auf 0 bis 1 abgebildet.",purpose:"Einfaches Modell für Qualitäts- oder Sprachklassifikation.",dims:"x Featurevektor, w gleichförmig, p dimensionslos.",vars:[["x","Dokumentfeatures"],["w,b","gelernte Parameter"],["σ","Sigmoid"]],intuition:"Große positive Scores bedeuten hohe Klassenwahrscheinlichkeit.",pitfall:"Kalibrierung und Schwelle sind getrennte Fragen.",example:"Score 0 ⇒ p=0.5.",check:"Was ändert eine strengere Schwelle an Precision/Recall?",sources:["a4","l14"],aliases:"sigmoid classifier probability quality filter"},
      {id:"precision-recall",cat:"Evaluation",title:"Precision & Recall",expr:"Precision=TP/(TP+FP);   Recall=TP/(TP+FN)",latex:"P=\\frac{TP}{TP+FP},\\quad R=\\frac{TP}{TP+FN}",read:"Precision fragt: Wie viele gefundene sind richtig? Recall: Wie viele richtige wurden gefunden?",purpose:"Bewertet Filter, Safety- und PII-Erkennung.",dims:"Anteile zwischen 0 und 1.",vars:[["TP","korrekt positiv"],["FP","falsch positiv"],["FN","übersehen positiv"]],intuition:"Strengere Filter erhöhen oft Precision und senken Recall – oder umgekehrt je nach Positivdefinition.",pitfall:"Positivklasse explizit benennen; bei Datenfiltern kann „behalten“ oder „entfernen“ positiv sein.",example:"8 TP,2 FP,4 FN ⇒ P=.8,R=.667.",check:"Welcher Fehler ist bei PII riskanter?",sources:["a4","l12","l14"],aliases:"classification metric false positive false negative"},
      {id:"jaccard",cat:"Daten",title:"Jaccard-Ähnlichkeit",expr:"J(A,B)=|A∩B| / |A∪B|",latex:"J(A,B)=\\frac{|A\\cap B|}{|A\\cup B|}",read:"Schnittmenge geteilt durch Vereinigungsmenge.",purpose:"Ähnlichkeit von Shingle-Mengen für Near-Dedup.",dims:"Anteil 0 bis 1.",vars:[["A,B","Mengen von n-Gram-Shingles"]],intuition:"Gemeinsamer Inhalt relativ zu allem einzigartigen Inhalt.",pitfall:"Mengen ignorieren Häufigkeit; Normalisierung und Shinglegröße beeinflussen stark.",example:"{a,b} und {b,c} ⇒ 1/3.",check:"Wann ist J genau 1?",sources:["a4","l14"],aliases:"set similarity shingles dedup"},
      {id:"minhash",cat:"Daten",title:"MinHash-Eigenschaft",expr:"P[h_min(A)=h_min(B)] = J(A,B)",latex:"\\Pr[h_{min}(A)=h_{min}(B)]=J(A,B)",read:"Die Wahrscheinlichkeit gleicher MinHash-Werte entspricht der Jaccard-Ähnlichkeit.",purpose:"Schätzt Mengenähnlichkeit mit kompakter Signatur.",dims:"Wahrscheinlichkeit/Anteil.",vars:[["h_min","Minimum unter zufälliger Permutation/Hashordnung"],["J","Jaccard"]],intuition:"Das kleinste Element der Vereinigung liegt mit Jaccard-Wahrscheinlichkeit im Schnitt.",pitfall:"Eine Hashfunktion ist ein sehr verrauschter Schätzer; Signatur nutzt viele.",example:"100 Komponenten, 80 gleich ⇒ Schätzer 0.8.",check:"Warum braucht man unabhängige Hashordnungen?",sources:["a4","l14"],aliases:"near duplicate signature hash jaccard"},
      {id:"lsh",cat:"Daten",title:"LSH-Kandidatenwahrscheinlichkeit",expr:"P(candidate|s)=1−(1−sʳ)ᵇ",latex:"P=1-(1-s^r)^b",read:"Mindestens eines von b Bändern muss in allen r Zeilen übereinstimmen.",purpose:"Macht ähnliche MinHash-Signaturen skalierbar zu Kandidaten.",dims:"s und P zwischen 0 und 1; b,r ganze Zahlen.",vars:[["s","wahre/geschätzte Ähnlichkeit"],["r","Zeilen pro Band"],["b","Anzahl Bänder"]],intuition:"AND innerhalb eines Bands, OR über Bänder erzeugt eine S-Kurve; s*≈(1/b)^(1/r) markiert etwa einen Übergang, keinen exakten 50%-Punkt.",pitfall:"LSH erzeugt Kandidaten, nicht endgültige Duplikatentscheidungen. Der exakte 50%-Punkt ist (1−2^(−1/b))^(1/r).",example:"Mehr b erhöht Kandidaten-Recall und Rechenmenge.",check:"Was bewirkt größeres r?",sources:["a4","l14"],aliases:"locality sensitive hashing bands rows minhash probability threshold"},
      {id:"accuracy-se",cat:"Evaluation",title:"Accuracy & Standardfehler",expr:"Acc=k/n;   SE≈√(Acc(1−Acc)/n)",latex:"\\hat p=k/n,\\quad SE\\approx\\sqrt{\\hat p(1-\\hat p)/n}",read:"Trefferanteil plus approximative Stichprobenunsicherheit.",purpose:"Zeigt, ob kleine Benchmarkunterschiede plausibel messbar sind.",dims:"Anteile; n Zahl unabhängiger Aufgaben.",vars:[["k","korrekte Antworten"],["n","Aufgaben"],["SE","Standardfehler"]],intuition:"Mehr Beispiele senken Unsicherheit ungefähr mit 1/√n.",pitfall:"Aufgaben sind nicht immer unabhängig; Prompt-/Samplingvarianz kommt zusätzlich.",example:"Acc=.5,n=100 ⇒ SE≈.05.",check:"Wie vervierfachte n den SE?",sources:["l12","a5s"],aliases:"benchmark confidence uncertainty binomial"},
      {id:"sft-loss",cat:"Alignment",title:"SFT-Loss mit Antwortmaske",expr:"L_SFT = − Σₜ mₜ log πθ(yₜ|x,y&lt;ₜ) / Σₜ mₜ",latex:"\\mathcal L_{SFT}=-\\frac{\\sum_tm_t\\log\\pi_\\theta(y_t\\mid x,y_{<t})}{\\sum_tm_t}",read:"Cross-Entropy nur über die durch m markierten Antworttokens.",purpose:"Supervised Fine-Tuning (SFT) auf Instruktionsdaten.",dims:"Loss dimensionslos; m_t ∈ {0,1}.",vars:[["x","Prompt"],["y","Antwort"],["mₜ","Loss-Maske"],["πθ","Policy/LM"]],intuition:"Prompt liefert Kontext; das gewünschte Verhalten wird in der Antwort imitiert.",pitfall:"Chat-Template- und Paddingtokens korrekt maskieren.",example:"Nur drei Antworttokens ⇒ Nenner 3.",check:"Wann könnte man Prompttokens bewusst mittrainieren?",sources:["l15","a5s"],aliases:"supervised fine tuning instruction loss response mask"},
      {id:"bradley-terry",cat:"Alignment",title:"Bradley-Terry-Präferenzmodell",expr:"P(y⁺ ≻ y⁻ | x)=σ(r(x,y⁺)−r(x,y⁻))",latex:"P(y^+\\succ y^-\\mid x)=\\sigma(r(x,y^+)-r(x,y^-))",read:"Sigmoid der Reward-Differenz gibt die Wahrscheinlichkeit der beobachteten Präferenz.",purpose:"Trainiert Reward Models aus Antwortpaaren.",dims:"Rewards skalare Scores; Wahrscheinlichkeit 0 bis 1.",vars:[["y⁺","bevorzugte Antwort"],["y⁻","abgelehnte Antwort"],["r","Reward Model"]],intuition:"Nur relative Ordnung, nicht absoluter Nullpunkt, ist identifizierbar.",pitfall:"Beide Antworten müssen zum selben Prompt gehören.",example:"Gleiche Rewards ⇒ Präferenzwahrscheinlichkeit .5.",check:"Was passiert, wenn zu beiden Rewards dieselbe Konstante addiert wird?",sources:["l15","a5s"],aliases:"reward model preference pairwise sigmoid chosen rejected"},
      {id:"kl",cat:"Alignment",title:"KL-Divergenz",expr:"D_KL(p||q)=Σₓ p(x) log[p(x)/q(x)]",latex:"D_{KL}(p\\Vert q)=\\sum_xp(x)\\log\\frac{p(x)}{q(x)}",read:"Erwarteter Log-Wahrscheinlichkeitsunterschied unter p.",purpose:"Misst gerichtete Verteilungsabweichung, etwa Policy von Referenz.",dims:"Nats bei natürlichem Log; nicht negativ.",vars:[["p","erste Verteilung"],["q","Referenzverteilung"]],intuition:"Teuer, wenn p Masse legt, wo q wenig erwartet.",pitfall:"Nicht symmetrisch; D_KL(p||q) ≠ D_KL(q||p).",example:"p=q ⇒ KL=0.",check:"Warum kann KL unendlich werden?",sources:["l15","a5s"],aliases:"kullback leibler divergence reference policy regularization"},
      {id:"rlhf-objective",cat:"Alignment",title:"KL-regularisiertes RLHF-Ziel",expr:"J(π)=E₍x,y~π₎[r(x,y)] − β D_KL(π||π_ref)",latex:"J(\\pi)=\\mathbb E_{x,y\\sim\\pi}[r(x,y)]-\\beta D_{KL}(\\pi\\Vert\\pi_{ref})",read:"Maximiere erwarteten Reward, aber bestrafe Abweichung von der Referenzpolicy.",purpose:"Kontrolliert Rewardoptimierung und Sprachverteilungsdrift.",dims:"Reward und β·KL müssen kompatible Skala haben.",vars:[["π","trainierte Policy"],["π_ref","feste Referenz"],["r","Reward"],["β","KL-Stärke"]],intuition:"Reward zieht, Referenz hält fest.",pitfall:"β ist setupabhängig; gleicher Wert ist nicht universell.",example:"Großes β ⇒ konservativere Policy.",check:"Welche Gefahr steigt bei zu kleinem β?",sources:["l15","a5s"],aliases:"reinforcement human feedback objective reference reward"},
      {id:"dpo",cat:"Alignment",title:"DPO-Loss",expr:"L_DPO=−log σ( β[(logπθ(y⁺|x)−logπref(y⁺|x)) − (logπθ(y⁻|x)−logπref(y⁻|x))] )",latex:"\\mathcal L_{DPO}=-\\log\\sigma\\left(\\beta\\left[\\log\\frac{\\pi_\\theta(y^+|x)}{\\pi_{ref}(y^+|x)}-\\log\\frac{\\pi_\\theta(y^-|x)}{\\pi_{ref}(y^-|x)}\\right]\\right)",read:"Ordne bevorzugte gegenüber abgelehnter Antwort anhand ihrer Policy-zu-Referenz-Logratios.",purpose:"Direct Preference Optimization (DPO) ohne separaten On-Policy-RL-Loop.",dims:"Sequenz-Logwahrscheinlichkeiten und Loss dimensionslos.",vars:[["y⁺/y⁻","chosen/rejected"],["πθ","trainierte Policy"],["π_ref","feste Referenz"],["β","Skalierung"]],intuition:"Verbessere die relative Präferenz gegenüber dem Ausgangsmodell.",pitfall:"Logwahrscheinlichkeiten über exakt dieselben Antworttokens aggregieren.",example:"Wenn der DPO-Logit 0 ist, Loss=log 2.",check:"Warum reichen πθ-Logprobs allein nicht für diese Form?",sources:["l15","l16","a5s"],aliases:"direct preference optimization chosen rejected reference"},
      {id:"expected-reward",cat:"RL",title:"Erwarteter Reward",expr:"J(θ)=E₍x~ρ,y~πθ(.|x)₎[R(x,y)]",latex:"J(\\theta)=\\mathbb E_{x\\sim\\rho,y\\sim\\pi_\\theta(\\cdot|x)}[R(x,y)]",read:"Mittlerer Reward über Prompts und von der Policy gesampelte Antworten.",purpose:"Grundziel von RLVR und Policy-Gradient-Verfahren.",dims:"Einheit des Rewards.",vars:[["ρ","Promptverteilung"],["πθ","Policy"],["R","Outcome-Reward"]],intuition:"Die Policy bestimmt ihre eigenen Trainingsantworten.",pitfall:"Ein kleiner statischer Samplesatz ist nicht derselbe Erwartungswert nach Policyupdates.",example:"Binärer Verifierreward ⇒ J ist Erfolgsrate der Rollouts.",check:"Über welche zwei Zufallsquellen wird gemittelt?",sources:["l17","a5"],aliases:"reinforcement learning objective rollout verifier"},
      {id:"policy-gradient",cat:"RL",title:"Policy Gradient",expr:"∇θJ = E[ R(x,y) · ∇θ log πθ(y|x) ]",latex:"\\nabla_\\theta J=\\mathbb E[R(x,y)\\nabla_\\theta\\log\\pi_\\theta(y|x)]",read:"Gewichte den Log-Policy-Gradienten einer gesampelten Antwort mit ihrem Reward.",purpose:"Unverzerrter Samplegradient für nicht differenzierbaren Reward.",dims:"Gleiche Parameterform wie θ.",vars:[["J","erwarteter Reward"],["R","samplebarer Reward"],["πθ","Policy"],["∇θ logπ","Score Function"]],intuition:"Belohnte Samples wahrscheinlicher machen.",pitfall:"Hohe Varianz; in Praxis Advantage statt rohem Reward.",example:"R=0 liefert in der naiven binären Variante kein Update.",check:"Wo wird ∇π=π∇logπ benutzt?",sources:["l17","a5"],aliases:"reinforce score function log derivative"},
      {id:"advantage",cat:"RL",title:"Advantage & Baseline",expr:"A(x,y)=R(x,y)−b(x)",latex:"A(x,y)=R(x,y)-b(x)",read:"Vergleiche den Reward einer Antwort mit einer erwarteten Baseline für den Prompt.",purpose:"Reduziert Policy-Gradient-Varianz und liefert relatives Signal.",dims:"Gleiche Einheit wie Reward.",vars:[["R","beobachteter Reward"],["b(x)","aktionsunabhängige Baseline"],["A","relativer Vorteil"]],intuition:"Eine 9 kann schlecht sein, wenn für diesen Prompt 10 normal ist.",pitfall:"Baseline darf für Unverzerrtheit nicht von der gezogenen Aktion abhängen.",example:"R=9,b=10 ⇒ A=−1.",check:"Warum ändert das Abziehen von b den erwarteten Gradienten nicht?",sources:["l17","a5"],aliases:"baseline value variance reduction return"},
      {id:"grpo-advantage",cat:"RL",title:"GRPO-Gruppennormalisierung",expr:"Aᵢ = (Rᵢ−mean(R₁:G)) / (std(R₁:G)+ε)",latex:"A_i=\\frac{R_i-\\operatorname{mean}(R_{1:G})}{\\operatorname{std}(R_{1:G})+\\epsilon}",read:"Zentriere und skaliere Rewards mehrerer Antworten desselben Prompts.",purpose:"Group Relative Policy Optimization (GRPO) ohne gelerntes Value Model.",dims:"A dimensionslos, R beliebige Rewardskala.",vars:[["G","Antworten pro Prompt"],["Rᵢ","Reward von Antwort i"],["ε","Schutz bei gleicher Gruppe"]],intuition:"Vergleicht innerhalb derselben Aufgabenschwierigkeit.",pitfall:"Std-Normalisierung reweightet Gruppen nach Rewardstreuung und ist eine algorithmische Entscheidung.",example:"Rewards [0,1] ⇒ zentrierte Vorteile mit entgegengesetztem Vorzeichen.",check:"Was passiert bei [1,1,1]?",sources:["l17","a5"],aliases:"group relative policy optimization normalized reward dr grpo"},
      {id:"grpo-variants",cat:"RL",title:"GRPO-Variantenvertrag",expr:"A=(R−b)/(c+ε)   ·   loss=−Σ mask·A·logπ / Z",latex:"A=(R-b)/(c+\\epsilon),\\quad \\mathcal L=-\\frac{\\sum_t m_tA\\log\\pi_t}{Z}",read:"Eine Variante wird durch Reward-Baseline b, Advantage-Normalisierer c und Tokenloss-Nenner Z vollständig charakterisiert.",purpose:"Trennt Standard-GRPO, Constant, Dr. GRPO, RFT und MaxRL anhand der tatsächlich geänderten Gewichtungsmechanik.",dims:"R,b und c besitzen Rewardskala; A ist nach Division dimensionslos, sofern c verwendet wird; Z zählt Token oder ist eine feste Konstante.",vars:[["b","Gruppenbaseline oder null"],["c","Gruppenstandardabweichung, mittlerer Normalisierer oder eins"],["Z","Sequenzlänge, globaler Tokennenner oder feste Konstante"],["mask","Response-only-Maske"]],intuition:"Baseline steuert Vergleich, Normalisierer Promptgewicht und Nenner Längengewicht; dieselben Rollouts können deshalb unterschiedliche Gradienten liefern.",pitfall:"Varianten dürfen nur bei identischen Rollouts und unveränderten Sampling-, Batch- und Updatebudgets mechanisch verglichen werden.",example:"Dr. GRPO: b=Gruppenmittel, c=1, Z=konstant; RFT: b=0, c=1, Z=konstant und nur korrekte Samples.",check:"Welche Designachse ändert ein fester Nenner gegenüber dem Sequenzmittel?",sources:["l16","l17","a5"],aliases:"dr grpo rft maxrl constant denominator advantage normalization variants"},
      {id:"gspo-ratio",cat:"RL",title:"Sequenz-Importance & GSPO-Ratio",expr:"W(y)=exp(Σ_t∈resp Δlogπ_t)   ·   s_GSPO(y)=exp((1/n_y)Σ_t∈resp Δlogπ_t)",latex:"W(y)=\\exp\\sum_{t\\in y}\\Delta\\log\\pi_t,\\quad s_{GSPO}(y)=\\exp\\left(\\frac1{n_y}\\sum_{t\\in y}\\Delta\\log\\pi_t\\right)",read:"Das exakte Sequenzweight multipliziert alle Antworttoken-Ratios; GSPO verwendet ihren geometrischen Mittelwert als gemeinsamen Antwortskalar.",purpose:"Macht den Bias-Varianz-Trade-off zwischen exakter Off-Policy-Sequenzkorrektur und längenstabilerem GSPO-Surrogate sichtbar.",dims:"Beide Ratios sind positiv und dimensionslos; n_y zählt ausschließlich unmaskierte Antworttokens, und Δlogπ vergleicht Current mit genau der Old Rollout Policy.",vars:[["W(y)","exaktes Importance-Weight der vollständigen Antwort"],["s_GSPO(y)","geometrisches Mittel der Tokenratios"],["n_y","Zahl gültiger Antworttokens"],["Δlogπ_t","logπ_current−logπ_old am gespeicherten Token"]],intuition:"Summierte Logratios bilden das Sequenzprodukt; Division durch Länge dämpft dessen Wachstum, ändert aber bewusst den Schätzer.",pitfall:"Tokenlokale Ratios und GSPO sind keine exakte Sequenzkorrektur; old_logprobs und Response-Maske dürfen nach dem Rollout nicht neu berechnet werden.",example:"Bei zwei Tokenratios 4 und 1 ist W=4, während GSPO denselben Antwortskalar √4=2 auf beide Tokens legt.",check:"Wann sind W und s_GSPO trotz unterschiedlicher Definition beide eins?",sources:["l16","a5"],aliases:"gspo sequence importance weight geometric mean old logprobs response mask"},
      {id:"importance-ratio",cat:"RL",title:"Importance Ratio",expr:"ρₜ(θ)=πθ(aₜ|sₜ) / π_old(aₜ|sₜ) = exp(logπθ−logπ_old)",latex:"\\rho_t(\\theta)=\\frac{\\pi_\\theta(a_t|s_t)}{\\pi_{old}(a_t|s_t)}",read:"Wie viel wahrscheinlicher ist die gespeicherte Aktion unter der neuen gegenüber der Rollout-Policy?",purpose:"Korrigiert Off-Policy-Verteilungsverschiebung.",dims:"Positiver dimensionsloser Faktor.",vars:[["π_old","Policy beim Sampling"],["πθ","aktuelle Policy"],["aₜ,sₜ","Tokenaktion und Zustand"]],intuition:"Samples, die die neue Policy häufiger erzeugen würde, erhalten höheres Gewicht.",pitfall:"In Lograum differenzieren und erst dann exponentieren; große Ratios sind hochvariant.",example:"Gleiche Policies ⇒ ρ=1.",check:"Warum müssen alte Logprobs gespeichert werden?",sources:["a5","l16"],aliases:"off policy importance sampling ratio logprob"},
      {id:"ppo-clip",cat:"RL",title:"PPO-Clipped Surrogate",expr:"L = −min(ρA, clip(ρ,1−ε,1+ε)A)",latex:"\\mathcal L=-\\min(\\rho A,\\operatorname{clip}(\\rho,1-\\epsilon,1+\\epsilon)A)",read:"Nutze das pessimistischere von freiem und begrenztem Ratio-Update.",purpose:"Proximal Policy Optimization (PPO) begrenzt schädlich große Policyänderungen auf alten Rollouts.",dims:"Loss in Reward-/Advantage-Skala.",vars:[["ρ","Importance Ratio"],["A","Advantage"],["ε","Clipbereich"]],intuition:"Verbesserungen jenseits des Vertrauensbereichs werden nicht weiter belohnt.",pitfall:"Vorzeichen von A bestimmt, welche Ratioseite begrenzt.",example:"A&gt;0 und ρ&gt;1+ε ⇒ Term bei 1+ε gedeckelt.",check:"Was passiert bei negativem A und sehr kleinem ρ?",sources:["l16","a5"],aliases:"proximal policy optimization clipping surrogate gspo"}
    ];

    const FORMULA_ANSWERS = {
      "mean-var": "Jede quadratische Abweichung (x−μ)² ist mindestens null. Ein Mittelwert beziehungsweise Erwartungswert aus ausschließlich nichtnegativen Zahlen kann daher ebenfalls nicht negativ werden.",
      "matmul": "Die gemeinsame innere Achse k verschwindet, weil über alle k Beiträge summiert wird. Die äußeren Achsen m und n bezeichnen weiterhin, für welche Zeile und Spalte jeweils ein Ergebnis entsteht.",
      "linear-map": "Das erste Outputfeature ist y₁=2·1+(−1)·3+0.5=−0.5. Bei X [B,T,2] wird dieselbe Rechnung separat für jedes [b,t] ausgeführt: Nur die letzte Featureachse wird von 2 auf 3 abgebildet; verschiedene Batchbeispiele und Tokenpositionen werden nicht miteinander vermischt.",
      "chain-rule": "Für einen skalaren Loss braucht Backpropagation an jeder Operation nur den ankommenden Gradient multipliziert mit ihrer lokalen Ableitung, also ein Vector-Jacobian Product; der vollständige Jacobian wird nicht materialisiert. Erreichen zwei Rechenpfade dasselbe x, addiert Autograd deren Gradientbeiträge, weil beide Änderungen den Loss beeinflussen.",
      "softmax": "Bei LM-Logits [B,T,V] wird über V normalisiert; bei Attention-Scores [B,H,T_q,T_k] über T_k, damit jede Query Gewichte über ihre Keys erhält. Das Subtrahieren von m multipliziert Zähler und Nenner mit demselben exp(−m), der sich herauskürzt und die Verteilung nicht verändert.",
      "logsumexp": "Nach der Stabilisierung lauten die Exponenten zⱼ−m und sind alle kleiner oder gleich null; mindestens einer ist genau null. Ihre Exponentialwerte liegen damit in (0,1], wodurch ein Overflow vermieden wird.",
      "autoregressive": "Der Logarithmus erfüllt log(a·b)=log(a)+log(b). Daher wird das Produkt der bedingten Tokenwahrscheinlichkeiten zur Summe ihrer Logwahrscheinlichkeiten.",
      "next-token-batch": "Der Input benötigt die Indizes s bis s+m−1, das Target die Indizes s+1 bis s+m. Deshalb muss s+m≤n−1 gelten, also s<n−m; n−m ist der exklusive Zufallsrand. X und Y haben beide [B,m], und für jedes Batchbeispiel b gilt Y_b[:-1]=X_b[1:]. Bei einer Memory-Map müssen Dateiformat, exakter dtype, erwartete Länge und 0≤Token-ID<V geprüft werden, ohne das gesamte Array zu kopieren.",
      "cross-entropy": "Bei einer uniformen Verteilung hat jedes der V Tokens die Wahrscheinlichkeit 1/V, also ist der Loss −log(1/V)=log(V). Der Logitgradient ist p−onehot(y): Für das Ziel ist p_y−1 negativ, sodass Gradient Descent seinen Logit anhebt; für Nichtziele ist p_j positiv, sodass ihre Logits relativ sinken.",
      "perplexity": "Perplexity ist exp(Loss), und exp(0)=1. Ein Loss von null bedeutet außerdem, dass jedem korrekten Token Wahrscheinlichkeit eins gegeben wird, also effektiv nur eine Möglichkeit verbleibt.",
      "ngram-filter": "Ohne Smoothing macht bereits ein einziges ungesehenes n-Gramm den Faktor p(w|h)=0. Das Produkt aller Tokenwahrscheinlichkeiten wird dadurch null und die Negative Log-Likelihood unendlich, obwohl der übrige Text plausibel sein kann. Backoff verwendet kürzere Kontexte, und Kneser-Ney verteilt discounted Probability Mass anhand informativer Fortsetzungsstatistik neu.",
      "fasttext-filter": "Die theoretisch unbegrenzte n-Gram-Vocabulary wird nicht als eigene Zeile pro n-Gram gespeichert. hash(g) mod B ordnet jedes Feature einer von genau B Embeddingzeilen zu, daher bleibt E immer [B,H]. Der Preis sind Kollisionen: Verschiedene n-Grams können dieselbe Zeile und damit denselben gelernten Beitrag teilen.",
      "importance-resampling": "Für A ist w_A=0,30/0,60=0,5; für B ist w_B=0,20/0,10=2. Das Verhältnis von B ist viermal so groß, weil B im Target relativ zu seiner Häufigkeit im Raw Corpus stärker vertreten ist. Normalisiert über nur diese beiden Kandidaten wären die Auswahlgewichte 0,2 und 0,8.",
      "bloom-filter": "Ein negatives Resultat bedeutet, dass mindestens eines der k erforderlichen Bits null ist; ein korrekt eingefügtes Element hätte alle gesetzt und ist daher definitiv nicht enthalten. Ein positives Resultat bedeutet nur, dass alle Bits eins sind; andere Elemente können diese Kombination zufällig erzeugt haben, also bleibt ein False Positive möglich.",
      "embedding-lookup": "Der Lookup ersetzt jede skalare ID-Achse durch die ausgewählte D-dimensionale Tabellenzeile: [B,T] wird [B,T,D]. Zwei gleiche IDs beginnen mit derselben Zeile, erhalten aber andere Positionssignale und tauschen über Attention Informationen mit unterschiedlichen Kontexten aus; ihre späteren kontextuellen Zustände können daher verschieden sein.",
      "embedding-params": "Bei festem D verdoppelt eine Verdopplung von V die V·D Embedding-Parameter und auch die Zahl der Output-Logits pro Position. Die Sequenzen können durch zusätzliche längere Tokens kürzer werden, aber weder Ausmaß noch Eintritt dieser Verkürzung sind garantiert und hängen vom gelernten Vokabular ab.",
      "linear-params": "Die Gewichtsmatrix desselben Linear Layers wird an allen T Tokenpositionen wiederverwendet und nicht pro Position neu gespeichert. Deshalb beeinflusst T, wie oft die gelernte Abbildung ausgeführt wird und damit die Rechenarbeit des Forward Pass, aber nicht die einmal gespeicherte Parameterzahl.",
      "parameter-init": "Linear: σ=sqrt(2/(d_in+d_out)); trunc_normal_ erhält mean=0, std=σ, a=−3σ und b=3σ. Embedding: mean=0, std=1, a=−3 und b=3. RMSNorm: der Gain startet vollständig bei eins. Ein Test prüft Formel, Grenzen und Modultypen; er verlangt wegen Truncation und endlicher Stichprobe nicht, dass die empirische Varianz exakt σ² ist.",
      "rmsnorm": "Bei X [B,T,D] läuft der quadratische Mittelwert nur über D; g hat [D] und wird über B und T gebroadcastet. Die Sequenzlänge bleibt gleich, weil RMSNorm jedes Token separat skaliert und weder Positionen zusammenfasst noch neue erzeugt.",
      "swiglu": "Das elementweise Produkt zweier x-abhängiger Zweige erzeugt bereits eine multiplikative Nichtlinearität; SiLU formt den Gate-Zweig zusätzlich glatt und kann Features dämpfen oder verstärken. T wird nicht gemischt. W₂ muss F wieder auf D abbilden, damit die Ausgabe dieselbe [B,T,D]-Shape wie der Residual Stream besitzt.",
      "rope": "A1 verwendet θ_i,k=i/Θ^((2k−2)/d) und benachbarte 1-basierte Paare (2k−1,2k), also 0-basiert [0,1],[2,3],…. R(θ) berechnet x′₀=x₀cosθ−x₁sinθ und x′₁=x₀sinθ+x₁cosθ. RoPE liegt nach Q/K und vor QKᵀ; V bleibt unverändert. Die feste Tabelle wird einmal geteilt als nicht-persistenter Buffer registriert, nicht als Parameter.",
      "attention": "Q und K erzeugen Compatibility Scores darüber, wo gelesen wird; V liefert den zu mischenden Inhalt. Aus [B,H,T_q,d_k] und [B,H,T_k,d_k] entstehen Scores [B,H,T_q,T_k], Softmax läuft über T_k. Die Division durch √d_k hält die typische Score-Skala bei wachsender Headbreite stabil.",
      "causal-attention": "Das strikt obere Dreieck enthält −∞, also alle Einträge mit Spaltenindex j größer als dem Zeilenindex i. Diese Felder stehen für zukünftige Keypositionen, die eine Query noch nicht sehen darf.",
      "residual": "Der direkte Pfad liegt im unveränderten Summanden x; seine Ableitung enthält die Identität unabhängig vom Seitenzweig F. Elementweise Addition verlangt identische Shapes. Im zweiten Update eines seriellen Transformer-Blocks ist die Residualbasis bereits x plus Attention-Korrektur.",
      "transformer-params": "Die großen Gewichtsmatrizen eines Blocks verbinden Dimensionen, die beide proportional zu D sind, etwa D×D oder D×D_ff mit D_ff proportional zu D. Dadurch kostet jeder Block hauptsächlich einen konstanten Faktor mal D² Parameter.",
      "temperature": "Eine höhere Temperatur T>1 glättet die Verteilung und erhöht typischerweise die Sampling-Diversität. Eine niedrigere positive Temperatur schärft sie und konzentriert mehr Masse auf die größten Logits.",
      "adamw": "Ein L2-Term wird bei Adam zum Gradienten addiert und anschließend zusammen mit ihm durch die adaptiven Momentenschätzer skaliert. AdamW wendet Weight Decay dagegen als separaten, direkten Schrumpfschritt auf die Parameter an, sodass die Decay-Wirkung nicht von der koordinatenweisen Adam-Skalierung abhängt.",
      "cosine-lr": "Am definierten Ende des Decays t=T gilt η=η_min. Der Kosinusterm erreicht dort seinen Endwert, sofern T tatsächlich als letzter Scheduler-Step und nicht als Anzahl mit abweichender Indexierung verwendet wird.",
      "gradient-clip": "Beim globalen Clipping werden alle Gradienteneinträge mit demselben positiven Skalar multipliziert. Dadurch bleiben ihre Verhältnisse und damit die Richtung des Gesamtvektors erhalten; nur seine Länge ändert sich. Unterhalb der Grenze c ist der Faktor eins, oberhalb von c wird er ungefähr c/||g||₂.",
      "global-batch": "In W gehören nur Datenparallel-Ranks, die unterschiedliche Datenbeispiele verarbeiten und ihre Gradienten für ein gemeinsames Update zusammenführen. Reine Tensor- oder Pipelineparallel-Ranks teilen dagegen dieselben Beispiele beziehungsweise das Modell und vergrößern den globalen Datenbatch nicht automatisch.",
      "training-flops": "Für dichte Matrixgewichte kostet der Forward Pass grob 2 FLOPs pro Parameter und Token. Der Backward Pass berechnet sowohl Aktivierungs- als auch Parametergradienten und kostet näherungsweise weitere 4, sodass insgesamt etwa 6ND_tokens entstehen.",
      "mfu": "Wenn die Datenpipeline nicht rechtzeitig Batches liefert, wartet die GPU und führt während dieser Zeit keine Modelloperationen aus. Die gemessenen Modell-FLOP/s sinken, während der theoretische Hardware-Peak gleich bleibt, also fällt die Model FLOPs Utilization.",
      "speedup": "Mit mehr Ressourcen wachsen Kommunikations-, Synchronisations- und Scheduling-Overhead, während serielle Arbeit nicht beschleunigt wird. Dadurch fällt T_p meist langsamer als 1/p, sodass S(p)/p und damit die Effizienz sinkt.",
      "arithmetic-intensity": "Fusion hält Zwischenwerte zwischen mehreren Operationen auf dem Chip und vermeidet deren Schreiben in sowie erneutes Lesen aus dem High Bandwidth Memory. Bei nahezu gleicher Rechenarbeit sinkt damit die übertragene Bytezahl, also steigen FLOPs pro Byte.",
      "triton-grid-mask": "Bei Floor Division würden nur vollständig gefüllte Tiles gestartet. Alle Indizes ab P·BLOCK_SIZE bis N−1 hätten dann keinen Besitzer; bei N=17 und BLOCK_SIZE=8 wäre das Index 16. Ceil Division startet stattdessen ein drittes Program mit sieben Tail-Lanes. Diese Lanes existieren, aber ihre Speicherzugriffe werden durch offsets<N maskiert.",
      "roofline": "Am Ridge Point sind Compute-Dach und Bandbreitendach gleich: P_peak=BW·AI. Daher gilt AI_ridge=P_peak/BW mit der Einheit FLOPs pro Byte.",
      "online-softmax": "Pro Queryzeile reichen das bisherige Maximum m und die dazu passend skalierte Exponentialsumme ℓ. Mit beiden Größen lassen sich neue Blöcke stabil einbeziehen und am Ende die korrekte Normalisierung bestimmen; ein Output-Akkumulator wird zusätzlich für die gewichteten Values geführt.",
      "memory-state": "ZeRO-1 shardet die Optimizerzustände, ZeRO-2 zusätzlich die Gradienten und ZeRO-3 zusätzlich die Modellparameter über die Datenparallel-Ranks. Bei ZeRO-3 werden benötigte Parameter für die Berechnung vorübergehend gesammelt, bleiben außerhalb dieser Phasen aber geshardet.",
      "kv-cache": "Der Faktor zwei zählt Keys und Values als zwei gleich große Tensoren. S zählt jede bereits verarbeitete Position, deren K und V später wieder gelesen werden. Q gilt nur für die gerade rechnende Position und wird nicht als Historie benötigt. GQA reduziert H_kv und damit Cachegröße und Speicherverkehr.",
      "inference-params-gqa": "Die Queryprojektion bildet D auf H_q·d_head=D ab und bleibt daher D×D; auch die Outputprojektion bildet die zusammengefügten H_q Heads zurück auf D und bleibt D×D. Nur K und V bilden auf H_kv·d_head ab, sodass ihre beiden Terme mit H_kv sinken.",
      "mlp-arithmetic-intensity": "T_q erhöht die Zahl gleichzeitig durch dieselben drei MLP-Gewichtsmatrizen laufender Tokenzeilen. Im Prefill gilt T_q=S; dadurch wächst die Rechenarbeit pro einmal gelesenem Gewicht, obwohl die Matrizen und damit die Parameterzahl unverändert bleiben.",
      "attention-arithmetic-intensity": "Für Decode ist T_q=1, daher wird AI=S/(S+1). Zähler und Nenner wachsen beide nahezu gleich mit S; ihr Verhältnis nähert sich von unten eins, statt proportional zu S weiterzuwachsen.",
      "decode-bandwidth": "Die Division durch eine ideale Bandbreite berücksichtigt nur unvermeidbaren Datentransfer und lässt alle weiteren Kosten weg; reale Latenz kann deshalb nur größer sein. Weil Throughput als B/t berechnet wird, kann eine größere reale Zeit nur eine kleinere Tokenrate liefern, also ist der Idealwert eine Obergrenze.",
      "ssm-recurrence": "Der Pfad läuft über den festen Zustand h_{t−1}: Frühere Inputs haben ihn über wiederholte Updates verändert, und C liest die darin verbleibende Information aus. Anders als Full Attention existiert dabei kein separat adressierbarer KV-Eintrag pro früherer Position.",
      "diffusion-generation": "Innerhalb eines Übergangs x_k→x_{k−1} können alle Sequenzpositionen parallel berechnet werden. Die Übergänge über k bleiben sequenziell, weil Schritt k−1 erst das vollständige Resultat des vorherigen Schritts als Input benötigt.",
      "moe-output": "Mit der Gesamtzahl der Experten wachsen vor allem gespeicherte Parameter und Modellkapazität. Rechenarbeit pro Token und die unmittelbar verwendeten Expertenaktivierungen skalieren dagegen hauptsächlich mit TopK, also der Zahl tatsächlich aktiver Experten; Kommunikation und Load Balancing kommen als zusätzliche Systemkosten hinzu.",
      "ring-allreduce": "Der Tensor wird in W Chunks geteilt, und jeder Rank bewegt in jeder der zwei Ringphasen nur W−1 Chunks der Größe M/W. Das Gesamtvolumen 2(W−1)M/W nähert sich deshalb für großes W dem konstanten Wert 2M, statt linear mit W zu wachsen.",
      "pipeline-efficiency": "Sehr großes m reduziert zwar den relativen Pipeline-Bubble, erzeugt aber mehr Scheduling- und Kommunikationsvorgänge. Bei festem globalem Batch werden die einzelnen Microbatches außerdem kleiner und können Matrixmultiplikationen schlechter auslasten; bei fester Microbatchgröße wachsen stattdessen Batch und Latenz.",
      "scaling-law": "Für positive Exponenten verschwinden A/N^α und B/D^β, wenn N und D gegen unendlich gehen. Das modellierte Loss-Limit ist daher der irreduzible Term E.",
      "isoflops": "Bei sehr kleinem N ist das Modell trotz vieler bezahlbarer Tokens kapazitätslimitiert; bei sehr großem N bleiben wegen D=C/(6N) zu wenige Trainingstokens. Zwischen diesen Extremen entsteht typischerweise ein compute-optimaler Kompromiss mit minimalem Loss.",
      "scaling-optimal-fit": "Leave-one-tier-out prüft echte Interpolation oder Extrapolation: Der Fit sieht das entfernte Minimum nicht und muss es aus den übrigen Tiers vorhersagen. Ein kleiner Trainingsfehler auf denselben Fitpunkten zeigt dagegen nur Anpassung; er erkennt weder empfindliche Exponenten noch systematische Abweichungen an neuen Compute-Budgets.",
      "logistic": "Eine strengere, also höhere Schwelle klassifiziert weniger Beispiele als positiv. Der Recall kann dadurch nicht steigen und sinkt meist, während die Precision häufig steigt, weil schwächere positive Scores entfallen; eine Precision-Steigerung ist ohne Annahmen über die Scorequalität jedoch nicht garantiert.",
      "precision-recall": "Wenn „positiv“ bedeutet, dass personenbezogene Informationen erkannt und entfernt werden, ist ein False Negative sicherheitskritischer: Die PII bleibt unentdeckt im Datensatz. Ein False Positive entfernt dagegen unproblematische Daten und schadet primär der Datenmenge oder -qualität.",
      "jaccard": "Für Mengen mit nichtleerer Vereinigung ist J genau eins, wenn A und B dieselben Elemente enthalten, also A=B. Der Sonderfall zweier leerer Mengen benötigt eine explizite Konvention, weil die Formel dort 0/0 ergibt.",
      "minhash": "Unabhängige Hashordnungen liefern annähernd unabhängige Bernoulli-Beobachtungen dafür, ob die Minima übereinstimmen. Ihr Mittelwert schätzt Jaccard mit sinkender Varianz; stark korrelierte Hashordnungen würden kaum zusätzliche Information beitragen.",
      "lsh": "Ein größeres r verlangt mehr übereinstimmende Signaturzeilen innerhalb jedes Bands und macht die Kandidatenbedingung strenger. Für 0<s<1 sinken s^r und damit die Kandidatenwahrscheinlichkeit, wodurch Recall und Kandidatenmenge meist fallen, aber False Positives abnehmen.",
      "accuracy-se": "Wird n vervierfacht, wächst √n um den Faktor zwei. Der Standardfehler, der ungefähr proportional zu 1/√n ist, halbiert sich daher.",
      "sft-loss": "Prompttokens kann man bewusst mittrainieren, wenn das Ziel nicht nur Antwortimitation ist, sondern das vollständige Gesprächsformat oder eine ganze Textsequenz modelliert werden soll. Dann muss klar dokumentiert sein, dass auch Nutzer- und Template-Inhalte Teil des Lernziels sind.",
      "bradley-terry": "Die gemeinsame Konstante kürzt sich in (r⁺+c)−(r⁻+c) vollständig heraus. Reward-Differenz, Sigmoid-Wahrscheinlichkeit und Bradley-Terry-Loss bleiben deshalb unverändert.",
      "kl": "KL(p||q) wird unendlich, wenn es ein Ereignis mit p(x)>0, aber q(x)=0 gibt. Dann enthält die Summe den positiv gewichteten Term log(p(x)/0)=+∞.",
      "rlhf-objective": "Bei zu kleinem β ist die Bindung an die Referenzpolicy schwach, sodass die Policy den Reward-Proxy aggressiv ausnutzen kann. Dadurch steigen Risiken wie Reward Hacking, Sprachqualitätsverlust, Mode Collapse und starke Verteilungsdrift.",
      "dpo": "Die Referenz-Logwahrscheinlichkeiten messen, wie stark die trainierte Policy die bevorzugte gegenüber der abgelehnten Antwort relativ zum Ausgangsmodell umordnet. Ohne sie fehlt genau diese KL-bezogene Vergleichsbasis; übrig bliebe ein anderes paarweises Policy-Ziel, nicht der angegebene DPO-Loss.",
      "expected-reward": "Gemittelt wird erst über Prompts x aus der Promptverteilung ρ und dann über Antworten y, die aus der Policy πθ(.|x) gesampelt werden. Die zufälligen Tokenentscheidungen einer Antwort sind dabei in der Zufallsvariable y enthalten.",
      "policy-gradient": "Man startet mit ∇J=Σ p(x)∇πθ(y|x)R(x,y) und ersetzt dort ∇πθ durch πθ∇logπθ. Der dadurch auftauchende Faktor πθ macht die Summe wieder zu einem Erwartungswert über von der Policy gesampelte Antworten.",
      "advantage": "Da b(x) nicht von der gezogenen Antwort abhängt, gilt E_y[b(x)∇logπθ(y|x)]=b(x)∇Σ_yπθ(y|x)=b(x)∇1=0. Das Abziehen verändert somit nicht den erwarteten Gradienten, kann aber seine Varianz senken.",
      "grpo-advantage": "Für Rewards [1,1,1] ist der Gruppenmittelwert eins und jeder zentrierte Advantage null, also gibt es kein relatives Lernsignal. Die Standardabweichung ist ebenfalls null und muss bei einer Normalisierung durch ε oder eine definierte Sonderbehandlung abgesichert werden.",
      "importance-ratio": "Das Importance Ratio benötigt im Nenner die Wahrscheinlichkeit unter genau der Policy, die das Sample erzeugt hat. Nach einem Update lässt sie sich aus der neuen Policy nicht rekonstruieren; neu berechnete „alte“ Logprobs würden typischerweise ein falsches Ratio bis hin zu eins ergeben.",
      "ppo-clip": "Für A<0 und ρ<1−ε wählt das Minimum den geclippten Term (1−ε)A, weil das negative Vorzeichen die Größenordnung umkehrt. Ein weiteres Absenken der Wahrscheinlichkeit dieser schlechten Aktion wird damit nicht zusätzlich belohnt und liefert in diesem Bereich keinen weiteren Gradientenanreiz.",
      "transformer-ledger": "Der fehlende Term ist die dritte SwiGLU-Matrix: Zwei D×F-Projektionen erzeugen Gate und Value-Zweig, die F×D-Rückprojektion bringt das Produkt wieder in den Residual Stream. Jede kostet 2TDF FLOPs, zusammen also 6TDF statt 4TDF.",
      "flash-backward": "Softmax ist invariant gegenüber einer gemeinsamen Verschiebung aller Logits einer Zeile. Die Ableitung entlang dieser Offsetrichtung muss deshalb null sein, also summiert dS über die erlaubten Keys zu ungefähr null. Eine deutliche Abweichung weist oft auf falsche Achse, Maske, Skalierung oder D_row hin.",
      "distributed-critical-path": "Wenn T_overlap mindestens T_comm erreicht, wird max(0,T_comm−T_overlap)=0 und die Kommunikation verlängert den modellierten Step nicht. Das setzt echte Gleichzeitigkeit und eine erst nach Kommunikationsabschluss eintretende Abhängigkeit voraus; ein bloßer async-Aufruf beweist diesen Overlap nicht.",
      "compute-optimal-predictions": "Verschiedene plausible Werte von E verändern den positiven Rest L_opt−E und damit seine Logarithmen, die gefittete Steigung γ sowie die extrapolierte Loss-Kurve. Weil E und γ stark gekoppelt sein können, muss man E beschränken oder mehrere plausible Offsets als Sensitivitätsbereich berichten.",
      "mup-transfer": "Die Formel gibt für Readout die Varianz mit Faktor 1/r² an. Standardabweichung ist die Quadratwurzel der Varianz, daher gilt sqrt(1/r²)=1/r für positives Breitenverhältnis r; 1/r² als std würde die Varianz fälschlich um 1/r⁴ skalieren.",
      "grpo-variants": "Ein Sequenzmittel setzt Z auf die Zahl gültiger Antworttokens und gibt dadurch jeder Antwort unabhängig von ihrer Länge ein ähnliches äußeres Gesamtgewicht. Ein fester Nenner lässt dagegen die Zahl beitragender Tokens im Gesamtgewicht stehen, sodass längere Antworten bei sonst gleichen Tokenbeiträgen stärker wirken.",
      "gspo-ratio": "Beide Faktoren sind eins, wenn die Summe der Antwort-Logratios null ist. Das gilt insbesondere bei identischer Current und Old Policy für jedes gespeicherte Token; es kann aber auch entstehen, wenn positive und negative Logratios sich über die Antwort exakt aufheben.",
      "z-loss": "Softmax und Cross-Entropy hängen nur von Differenzen zwischen Logits ab. Eine gemeinsame Verschiebung z→z+a lässt sie deshalb unverändert, aber logsumexp(z+a)=logsumexp(z)+a. z-loss misst genau diese Log-Partition und verändert sich daher mit dem sonst schwach bestimmten gemeinsamen Offset.",
      "logit-soft-cap": "Für |z| viel kleiner als c gilt tanh(z/c)≈z/c und damit cap_c(z)≈z. Für |z| viel größer als c nähert sich tanh dem Vorzeichen ±1 und das Ergebnis sättigt weich bei ±c.",
      "moe-capacity": "Bei Capacity sechs und acht eintreffenden Assignments liegen zwei im Overflow. Ob sie verworfen, umgeleitet oder durch eine variable-capacity Sparse Operation verarbeitet werden, muss die Implementierung explizit definieren.",
      "moe-balance": "Ein zu großes α_bal kann den Router vor allem auf gleichmäßige Auslastung optimieren, obwohl eine ungleichmäßige Spezialisierung den Language-Model-Loss verbessern würde. Der Koeffizient handelt Systems-Auslastung gegen Routingqualität und das Hauptziel aus."
};

      "a1": [
            "UTF-8 kodiert einen Unicode-Codepoint je nach Zeichen mit einem bis vier Bytes. Ein einzelnes Fortsetzungsbyte, auf Englisch continuation byte, enthält nicht genug Information und ist für sich oft keine gültige UTF-8-Sequenz; erst die vollständig zusammengesetzte Bytefolge darf dekodiert werden.",
            "Aus einem Eingang X mit Form [B,T,D] entstehen Q, K und V zunächst jeweils mit [B,T,D], wenn D=H·d_head gilt. Beim Head-Split wird D in H parallele Attention Heads, also getrennte Attention-Unterräume, zerlegt und meist zu [B,H,T,d_head] umgeordnet. Das Produkt QKᵀ summiert über d_head und liefert Scores mit [B,H,T,T].",
            "Die Maske muss vor Softmax wirken, damit verbotene Zukunftspositionen einen Score von minus unendlich und damit exakt Gewicht null erhalten; zugleich werden die erlaubten Positionen weiterhin auf Summe eins normalisiert. Die Division durch √d_k hält die typische Größe der Query-Key-Dot-Products bei wachsender Head-Breite stabil und verhindert eine früh gesättigte Softmax.",

      "a2": [
            "GPU-Aufrufe werden meist asynchron gestartet: Die CPU erhält die Kontrolle zurück, bevor der Kernel auf der GPU fertig ist. Ohne Synchronisation misst ein CPU-Timer daher vor allem die kurze Startzeit; eine passende Barriere oder GPU-Zeitmessung muss sicherstellen, dass die gemessene Arbeit wirklich abgeschlossen ist.",
            "Die Einordnung braucht Messdaten im Verhältnis zu den Hardwaregrenzen: erreichte FLOP/s, erreichte Speicherbandbreite und Arithmetic Intensity, also Rechenoperationen pro übertragenem Byte. Liegt die Leistung nahe am Bandbreitendach des Roofline-Modells und steigt mit weniger Speichertraffic, ist der Kernel memory-bound; liegt sie nahe am Compute-Peak und reagiert vor allem auf weniger Rechenoperationen, ist er compute-bound. Ein Profiler sollte diese Hypothese durch Kernelzeiten und Speichertransfers stützen.",
            "Online Softmax benötigt pro Queryzeile ein laufendes Maximum m und die auf dieses Maximum bezogene laufende Exponentialsumme ℓ. Ändert sich m durch einen neuen Block, werden die alten Beiträge auf die neue Skala umgerechnet; für das vollständige Attention-Ergebnis wird zusätzlich ein entsprechend reskalierter Value-Akkumulator geführt.",
            "Bei Fully Sharded Data Parallel (FSDP) liegen Parameter, Gradienten und Optimizerzustände zwischen den Berechnungsphasen grundsätzlich nur als Shard, also Teilstück, auf jedem Rank. Für den Forward Pass und den nötigen Teil des Backward Pass werden die Parameter eines Layers per All-Gather vorübergehend vollständig zusammengesetzt. Danach werden sie wieder freigegeben beziehungsweise resharded, und die Gradienten werden per Reduce-Scatter auf ihre Besitzer verteilt, sodass der dauerhafte Zustand erneut geshardet ist."

      "a3": [
            "Für einen dichten Transformer wird der Trainingscompute grob als C≈6ND angenähert, mit N Parametern und D verarbeiteten Tokens. Hält man C fest und teilt beide Seiten durch 6N, folgt direkt D=C/(6N); die Beziehung ist eine Planungsnäherung und keine exakte Zählung jeder Operation.",
            "Ein gemessenes Optimum ist nur dann wirklich eingeklammert, wenn es im Inneren des getesteten Größenbereichs liegt und auf beiden Seiten größere Loss-Werte beobachtet wurden. Ist der beste Run der kleinste oder größte Messpunkt, zeigt das nur ein Randminimum; das wahre Optimum kann außerhalb des Suchbereichs liegen.",
            "Eine ungleichmäßige Lernratenabstimmung kann den geschätzten Scaling-Exponenten verfälschen: Werden etwa große Modelle sorgfältig getunt, kleine Modelle aber mit einer ungeeigneten festen Lernrate trainiert, erscheint der Nutzen zusätzlicher Parameter zu groß. Ebenso problematisch ist es, Architektur oder Trainingsrezept systematisch mit der Größe zu ändern, weil der Fit dann mehrere Effekte dem Skalieren zuschreibt.",
            "Die Endprognose ist robust, wenn plausible Fit-Varianten, Datenauswahlen und Leave-one-tier-out-Tests ähnliche Zielwerte für N, D und Loss liefern. Verschieben sich diese Werte stark, wird die Aussage von wenigen Modellierungsentscheidungen getragen und muss als empfindlich mit entsprechend breitem Unsicherheitsbereich berichtet werden. Ohne die konkreten Runs lässt sich diese Empfindlichkeit nicht als einzelne Zahl angeben."

      "a4": [
            "In Quellcode sehen E-Mail-ähnliche Platzhalter, IP-Adressen für lokale Tests, UUIDs, Versionsnummern oder lange numerische IDs oft wie Personally Identifiable Information (PII), also personenbezogene Daten, aus. Auch Dokumentationsbeispiele und Testdaten können Telefonnummern oder Adressen absichtlich enthalten, ohne eine reale Person zu bezeichnen. Ein rein syntaktischer Filter markiert solche Fälle als False Positives und kann dadurch nützlichen Code beschädigen.",
            "Bei fester Signaturlänge bedeutet mehr Bänder im Locality-Sensitive Hashing (LSH), dass jedes Band weniger Zeilen enthält und leichter vollständig übereinstimmt. Dadurch steigt die Wahrscheinlichkeit, ein ähnliches Paar als Kandidat zu finden, also der Recall. Gleichzeitig entstehen mehr Kandidaten und False Positives, sodass Speicherbedarf, Vergleiche und Gesamtkosten steigen und die Precision typischerweise sinkt.",
            "LSH ist ein probabilistischer Retrieval-Schritt und erzeugt bewusst auch Kollisionen zwischen Paaren unterhalb der gewünschten Ähnlichkeitsschwelle. Erst ein genauer Vergleich, etwa die echte Jaccard-Ähnlichkeit der normalisierten Shingle-Mengen, entscheidet, ob ein Kandidatenpaar tatsächlich als Duplikat gelten soll. Ohne diese Verification würden zufällige Bucket-Treffer ganze Cluster und Löschentscheidungen verfälschen.",
            "Frühe, günstige Filter können den Datenumfang stark reduzieren und dadurch teure spätere Classifier oder Deduplizierung beschleunigen. Die Reihenfolge verändert aber auch die Verteilung, auf der spätere Stufen arbeiten, und ein früh verworfenes Dokument kann später nicht mehr korrekt klassifiziert oder geclustert werden. Deshalb sind Filter im Allgemeinen nicht vertauschbar, und Stage Counts sowie Gründe für Verwerfen müssen je Reihenfolge auditiert werden."

            "Das Sampling eines Token-Index ist eine diskrete Auswahl und ändert sich nicht glatt mit kleinen Änderungen der Logits; durch den gezogenen Index existiert daher kein gewöhnlicher differenzierbarer Pfad zum Reward. Policy Gradient, also die Gradientenmethode für eine stochastische Policy, umgeht das mit dem Log-Derivative Trick und gewichtet den Gradienten der Logwahrscheinlichkeit des gesampelten Verlaufs mit Reward oder Advantage.",
            "Eine Baseline bleibt im üblichen Policy-Gradient-Schätzer unverzerrt, wenn sie für einen gegebenen Zustand beziehungsweise Prompt nicht von der gerade gesampelten Aktion oder Antwort abhängt. Dann ist ihr erwarteter Beitrag b(x)·E[∇log π(y|x)] gleich null, weil sich die Wahrscheinlichkeiten über alle Antworten zu eins summieren. Sie darf also vom Prompt abhängen und gelernt sein, muss im Policy-Update aber als aktionsunabhängiger Vergleichswert behandelt werden.",

      "shapes": "Verdoppelt sich nur T, werden Aktivierungen wie B×T×D sowie Q, K und V mit B×H×T×d_head entlang der Sequenzachse doppelt so lang. Die Attention-Scores mit B×H×T×T enthalten dagegen viermal so viele Elemente, weil beide Positionsachsen wachsen. Parameterzahlen wie V_vocab×D für das Embedding oder D×D_out für Gewichtsmatrizen bleiben gleich, da trainierbare Matrizen nicht von der Länge einer konkreten Eingabesequenz abhängen.",
      "pytorch-debugger": "Ein Forward Pass prüft nur einen konkreten Wertpfad mit den gerade verwendeten Shapes, Devices und Zuständen. Ein Modul kann dabei richtige Zahlen liefern, obwohl Untermodule nicht registriert sind, Buffer beim Device-Wechsel zurückbleiben, eine spätere nicht zusammenhängende View scheitert oder Gradienten im zweiten Step ungewollt akkumulieren. Ein belastbarer Testvertrag prüft daher zusätzlich Registrierung und state_dict, Device/Dtype, Grenz-Shapes und Strides, skalaren Loss, Gradienten beziehungsweise Updates sowie Save/Reload.",
      "bpe": "Ein größeres Byte-Pair-Encoding-Vokabular enthält meist längere gelernte Teilwörter und kann denselben Text deshalb mit weniger Tokens darstellen. Dafür wächst die Embeddingmatrix proportional zu V×D; ohne Weight Tying kommt eine ebenso mit V wachsende Outputmatrix hinzu. Seltene oder datenarme Sprachen profitieren nur, wenn ihre Muster in den Merge-Daten häufig genug vorkommen, sonst bleiben sie trotz des größeren Gesamtvokabulars stark fragmentiert.",
      "attention": "Ein Beispiel ist der Scorevektor [2, 2, 2] über drei erlaubte Keypositionen. Durch Division mit jeder positiven Temperatur bleiben alle drei Werte gleich, daher liefert Softmax stets [1/3, 1/3, 1/3]. Temperatur verändert nur Unterschiede zwischen Scores; bei identischen Scores gibt es keine Unterschiede zu verstärken oder abzuschwächen.",
      "optimizer": "Zusammen mit Modell und Optimizer muss mindestens der globale Optimizer-Step beziehungsweise der vollständige Schedulerzustand gespeichert werden. Der Warmup- oder Cosine-Schedule berechnet die aktuelle Lernrate aus genau diesem Fortschritt und kann ihn nicht zuverlässig aus den AdamW-Momenten ableiten. Bei Gradient Accumulation zählt dabei der tatsächliche Parameterupdate-Step, nicht die Zahl gelesener Microbatches.",
      "resources": "Die Näherung nimmt im Kern einen dichten Transformer an, bei dem Gesamtparameter und pro Token aktive Parameter weitgehend übereinstimmen. Bei einer Mixture of Experts werden nur wenige Experten pro Token aktiviert, sodass Gesamtparameter, aktive Rechenarbeit, Routing und Kommunikation getrennt gerechnet werden müssen. Bei sehr langen Kontexten werden zudem die quadratischen T×T-Attention-Terme und ihre Aktivierungen so wichtig, dass die grobe Rechnung 6ND beziehungsweise eine rein parameterbasierte Speicherabschätzung nicht mehr ausreicht.",
      "triton-tile": "Ein maskierter Load verhindert nur das Lesen ungültiger Adressen und liefert für diese Lanes einen Ersatzwert. Die Lanes existieren im Program trotzdem weiter und können daraus ein Ergebnis berechnen. Ohne dieselbe Bedingung beim Store würden sie anschließend hinter y[0:N] schreiben und fremden Speicher überschreiben. Korrektheit verlangt daher, dass jeder potenziell außerhalb liegende Speicherzugriff – Load wie Store – durch offsets < N geschützt ist.",
      "online-softmax-kata": "Nach jedem Tile repräsentieren m, ℓ und O exakt dieselben globalen Summen wie ein direkter Softmax über alle bisher gesehenen Scores, nur relativ zum aktuellen Maximum m. Steigt das Maximum, multipliziert α=e^(m_alt−m_neu) alle alten Exponentialbeiträge mit genau dem Faktor, der ihre Bezugsgröße von m_alt auf m_neu ändert. Neue Beiträge werden bereits relativ zu m_neu addiert. Nach dem letzten Tile ist O/ℓ daher dieselbe gewichtete Value-Summe wie beim direkten stabilen Softmax; die quadratische Scorematrix muss dafür nicht im High Bandwidth Memory gespeichert werden.",
      "roofline": "Eine konkrete Änderung ist, mehrere aufeinanderfolgende elementweise Operationen zu einem Kernel zu fusionieren. Zwischenwerte bleiben dann in Registern oder schnellem On-Chip-Speicher, statt nach jedem Schritt in High Bandwidth Memory geschrieben und erneut gelesen zu werden. Bei ähnlicher Zahl von Rechenoperationen sinkt die Zahl übertragener Bytes, dadurch steigt die Arithmetic Intensity und der Punkt wandert im Roofline-Diagramm nach rechts.",
      "parallelism": "Innerhalb eines Nodes würde ich Tensor Parallelism auf die schnell verbundenen GPUs legen, weil dabei in vielen Layern All-Reduce- oder All-Gather-Operationen anfallen und Verbindungen wie NVLink entscheidend sind. Über langsamere Verbindungen zwischen Nodes eignet sich häufig Pipeline Parallelism, weil benachbarte Stages vor allem Aktivierungen punktweise austauschen und Microbatches die Pipeline auslasten können. Das ist keine universelle Regel: Modellgröße, Batchgröße, Bubble-Anteil und die konkrete Netzwerktopologie müssen vor der endgültigen Aufteilung gemessen werden.",
      "scaling": "Ich würde bei demselben Compute-Budget zusätzliche Modellgrößen auf beiden Seiten des bisher besten Punkts trainieren und dabei Datenmenge, Tuningregeln und Auswertung vergleichbar halten. Ein belastbares IsoFLOPs-Minimum ist erst eingeklammert, wenn der Loss sowohl für kleinere als auch für größere Modelle wieder steigt. Verbessert sich der Loss bis zum neuen Rand weiter, war der vorherige Gewinner nur ein Randminimum und der Suchbereich muss erneut erweitert werden.",
      "scaling-fit": "Ein Randminimum liefert nur eine Ungleichung: Das Optimum liegt möglicherweise noch weiter außerhalb des getesteten N-Bereichs. Sein beobachtetes N als exakten N_opt-Wert zu fitten zieht die Steigung in eine unbekannte Richtung und unterschätzt die Unsicherheit. Der Run bleibt nützliche Evidenz für die nächste Suchrichtung, wird aber erst nach Messpunkten auf beiden Seiten zu einem gültigen Lower-Envelope-Punkt.",
      "filtering-mechanics": "A hat das größere p_T, aber DSIR teilt durch die Raw-Dichte: w_A=0,30/0,60=0,5 und w_B=0,20/0,10=2. B ist im Target also relativ zu seinem Auftreten im Raw Corpus viermal stärker vertreten. Unter nur diesen zwei Kandidaten wären die normalisierten Resampling Weights 0,2 und 0,8; sie sind Auswahlwahrscheinlichkeiten und keine Garantie, dass B in jedem einzelnen Sample gewählt wird.",
      "bloom-filter": "Ein korrekt eingefügtes Element hat bei der Insertion alle k später geprüften Bits gesetzt. Findet die Query auch nur ein Nullbit, kann das Element deshalb nicht enthalten sein. Sind dagegen alle k Bits eins, ist die Ursache nicht eindeutig: Andere eingefügte Elemente können dieselben Positionen gemeinsam gesetzt haben. Das ist der mögliche False Positive; ohne Löschung und Implementierungsfehler gibt es für Inserts keine False Negatives.",
      "data-pipeline": "Ich würde verworfene Beispiele nahe an jeder Filterschwelle stratifiziert nach Sprache, Quelle, Domäne und Ablehnungsgrund ziehen. Besonders wichtig sind Minderheitensprachen sowie legitime medizinische, historische, technische oder identitätsbezogene Texte, weil einfache Qualitäts- und Safety-Heuristiken diese Gruppen überproportional treffen können. Pro Gruppe würde ich den Anteil fälschlich verworfener Dokumente und konkrete Fehlerarten protokollieren, statt nur die gesamte Behalterate der Pipeline anzusehen.",
      "dedup-pipeline": "Bei τ=0.5 bestehen die exakt verifizierten Kanten A–B und B–C. Connected Components verwenden Erreichbarkeit, deshalb verbindet der Pfad A→B→C alle drei Dokumente, obwohl A–C selbst keine akzeptierte Kante besitzt. A–D kollidiert zwar in einem LSH-Band, hat aber exakt nur J=2/6≈0.333 und scheitert an J>0.5. LSH liefert also Kandidaten für die teure Prüfung, nicht die endgültige Duplicate-Entscheidung.",
      "evaluation": "Schon der Tokenizer, das Prompt- oder Chat-Template, die Kontextbehandlung und die Decoding-Parameter können einen Score verändern, obwohl die Modellgewichte identisch bleiben. Bei offenen Antworten kommen außerdem Extraktionsregeln oder ein Judge-Modell hinzu, bei toolgestützten Systemen auch Retrieval und Werkzeuge. Ein Benchmark bewertet daher das vollständig festgelegte Evaluationssystem und nicht isoliert eine Gewichtedatei.",
      "inference-budget": "Zuerst würde ich den anfrageabhängigen Cacheterm 2·L·B·S·H_kv·d_head·b_KV rechnen: H_kv durch GQA oder MQA zu senken und KV-Elemente mit weniger Bytes zu speichern wirkt direkt auf den mit B und S wachsenden Anteil. Unabhängig davon würde ich den Weight-Speicher P·b_w aus der exakten Architekturzerlegung rechnen und geeignete Weight Quantization prüfen. Beide Hebel brauchen Qualitäts- und Kernelmessungen; ein kleinerer Cache löst kein zu großes Gewichtemodell und kleinere Gewichte lösen keine Cacheexplosion bei langem Kontext.",
      "policy-loss-tracer": "Beim Sequenzmittel wird jede Antwort zuerst durch ihre eigene Zahl gültiger Token geteilt. Die kurze und die lange Antwort erhalten dadurch dasselbe äußere Gewicht im Batch: (0.30−0.60)/2=−0.15. Das globale Tokenmittel addiert dagegen alle drei gültigen Token und teilt erst danach: (0.20+0.40−0.60)/3=0. Längere Antworten tragen dort mehr Summanden bei. Die verwendeten Token sind gleich, aber die Reduktionsregel definiert eine andere Gewichtung der Sequenzen.",
      "grpo": "Bei Group Relative Policy Optimization wird ein Rewardunterschied innerhalb jeder Promptgruppe durch deren Standardabweichung geteilt. Derselbe absolute Abstand erhält dadurch in einer Gruppe mit kleiner Streuung ein größeres Gewicht und in einer Gruppe mit großer Streuung ein kleineres, sodass Promptgruppen nach ihrer Rewardstreuung neu gewichtet werden. Haben alle Antworten einer Gruppe denselben Reward, ist der zentrierte Zähler null und die Gruppe liefert trotz Stabilisierungsterm kein relatives Lernsignal.",
      "transformer-ledger": "Bei verdoppeltem T verdoppeln sich die Projektions-, SwiGLU- und LM-Head-Terme, weil sie jede zusätzliche Tokenzeile einmal verarbeiten. Der Term 4T²D aus QKᵀ und PV vervierfacht sich, weil Query- und Keypositionsachse wachsen. Parameterzahlen bleiben vollständig unverändert.",
      "kernel-contracts": "dX_rd=g_r·w_d gehört genau zu einem Outputelement und kann ohne konkurrierende Schreiber pro Tile erzeugt werden. In dw_d=Σ_r X_rd·g_r tragen dagegen alle Zeilentiles zum selben Feature d bei. Ohne Atomics schreibt deshalb jedes Zeilentile einen Partial-Wert, der anschließend über die Tileachse reduziert wird.",
      "distributed-runtime": "Ein kleiner Bucket kann starten, sobald seine wenigen Gradienten bereit sind, und dadurch mehr Backward-Compute überlappen. Gleichzeitig gibt es mehr Collective-Aufrufe und jeder transportiert weniger Bytes, sodass der feste Latenzterm α häufiger und relativ stärker bezahlt wird. Das Optimum muss gemessen werden.",
      "scaling-transfer": "Gefittet wird log(L_opt−E), nicht log L_opt. Ein verändertes E verschiebt vor allem kleine Restabstände stark und verändert dadurch die Steigung γ im Lograum. Weil dieselbe Fitkurve mit gekoppelten E- und γ-Werten plausibel aussehen kann, braucht die Extrapolation beschränkte Offsets oder Sensitivitätsintervalle.",
      "moe-routing": "Perfekte Expertbalance zählt Assignments pro Expert, aber nicht automatisch Bytes, Topologie oder Expert-zu-Gerät-Zuordnung. Mehrere gleich belastete Experts können auf demselben Gerät liegen, Tokenziele können ungleich über Links verteilt sein, und ein langsamer Rank oder ungünstige All-to-All-Route kann weiterhin den Straggler bestimmen.",
