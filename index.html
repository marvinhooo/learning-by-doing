    function updateGrpo(){
      const rewards=[...document.querySelectorAll(".grpoReward")].map((x,i)=>{const value=+x.value;document.getElementById("grpoOut"+i).value=value.toFixed(2);return value}),lengths=[...document.querySelectorAll(".grpoLength")].map((x,i)=>{const value=+x.value;document.getElementById("grpoLenOut"+i).value=value;return value}),mean=rewards.reduce((a,b)=>a+b,0)/rewards.length,stdMode=document.getElementById("grpoStdMode").value,stdDenominator=stdMode==="sample"?rewards.length-1:rewards.length,variance=rewards.reduce((sum,value)=>sum+(value-mean)**2,0)/stdDenominator,std=Math.sqrt(variance),normStd=document.getElementById("grpoStd").checked,aggregation=document.getElementById("grpoAggregation").value,advantages=rewards.map(reward=>(reward-mean)/(normStd?std+1e-8:1)),totalTokens=lengths.reduce((a,b)=>a+b,0),fixedDenominator=16,tr=value=>esc(localizedUi(value)),rewardSum=rewards.map(value=>value.toFixed(2)).join(" + ");

      const previous=user.diagnostic?.transfer||{},transferMarkup=DIAGNOSTIC_TRANSFER_CHECKS.map((check,index)=>{const saved=previous[check.id]||{},name=`diag-transfer-${check.id}`;return `<fieldset class="question"><legend><strong>T${index+1}. ${esc(localizedUi(check.prompt))}</strong></legend><label class="field"><span>Deine kurze Herleitung</span><textarea class="textarea" name="${name}-text" placeholder="Formuliere Achsen, Zustand oder Invariante in mindestens 20 Zeichen.">${esc(saved.response||"")}</textarea></label><div class="option-list"><label class="option"><input type="radio" name="${name}" value="know" ${saved.status==="know"?"checked":""} required><span>Ich kann es herleiten und erklären</span></label><label class="option"><input type="radio" name="${name}" value="unknown" ${saved.status==="unknown"?"checked":""}><span>Ich weiß es noch nicht</span></label></div></fieldset>`}).join("");
      openModal("Grundlagen-Diagnose","15–20 Minuten · ohne Hilfsmittel",`<p class="muted">Beantworte aus deinem aktuellen Verständnis. „Ich weiß es nicht“ ist wertvolle Information. Die vier kurzen Herleitungen verhindern, dass Recognition allein ganze Prerequisites überspringt.</p><form id="diagnosticForm">${DIAGNOSTIC.map((q,i)=>quizQuestionHtml(q,i,"diag")).join("")}<section class="reading-section" style="margin-top:1rem"><p class="eyebrow">Angewandte Foundation-Checks</p><h3>Erst selbst herleiten, danach Rubrik öffnen</h3><p class="muted">Wähle ehrlich „Ich weiß es noch nicht“, wenn du nur raten würdest. Die Rubriken erscheinen nach der Auswertung und dienen dann direkt als Lernhilfe.</p>${transferMarkup}</section><button class="button primary" type="submit" style="margin-top:1rem">Auswerten</button></form><div id="diagnosticResult" role="status" aria-live="polite"></div>`);
      document.getElementById("diagnosticForm").onsubmit=e=>{e.preventDefault();const groups={};DIAGNOSTIC.forEach((q,i)=>{groups[q.area]||={n:0,ok:0};groups[q.area].n++;const chosen=document.querySelector(`input[name="diag-${i}"]:checked`);if(chosen&&+chosen.value===q.a)groups[q.area].ok++});if(document.querySelectorAll('#diagnosticForm input[name^="diag-"]:checked:not([name^="diag-transfer-"])').length<DIAGNOSTIC.length){toast("Bitte beantworte alle Auswahlfragen.");return}const transfer={};for(const check of DIAGNOSTIC_TRANSFER_CHECKS){const status=document.querySelector(`input[name="diag-transfer-${check.id}"]:checked`)?.value,response=document.querySelector(`[name="diag-transfer-${check.id}-text"]`)?.value.trim()||"";if(!status){toast("Bitte beantworte alle angewandten Checks.");return}if(status==="know"&&response.length<20){toast("Begründete Transferantworten brauchen mindestens 20 Zeichen.");return}transfer[check.id]={status,response}}const scores=Object.fromEntries(Object.entries(groups).map(([k,v])=>[k,Math.round(v.ok/v.n*100)])),transferEvidence=DIAGNOSTIC_TRANSFER_CHECKS.every(check=>transfer[check.id].status==="know"&&transfer[check.id].response.length>=20),transferStatus=localizedUi(transferEvidence?"4/4 selbst begründet":"offene Foundations werden priorisiert");user.diagnostic={scores,transfer,transferEvidence,at:new Date().toISOString()};saveUser(true);document.getElementById("diagnosticResult").innerHTML=`<div class="callout accent" style="margin-top:1rem"><strong>Gespeichert.</strong> Niedrigste Bereiche: ${Object.entries(scores).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([k,v])=>`${k} ${v}%`).join(" · ")}. Transferchecks: ${esc(transferStatus)}.</div><div class="accordion-list" style="margin-top:1rem">${DIAGNOSTIC_TRANSFER_CHECKS.map((check,index)=>`<details class="answer-disclosure"><summary>${esc(localizedUi(`Rubrik T${index+1} anzeigen`))}</summary><p>${esc(localizedUi(check.rubric))}</p></details>`).join("")}</div><p class="muted">Schließe den Dialog für deinen aktualisierten Fokus.</p>`;renderDashboard()}
    }

    let reviewSession=[],reviewIndex=0,reviewSessionId="",reviewSessionResults={again:0,hard:0,good:0};
    function openFlashcards(){
      reviewSession=prioritizedReviewCards(10);reviewIndex=0;reviewSessionResults={again:0,hard:0,good:0};
      if(!reviewSession.length){const nextConcept=recommendedConcept();if(nextConcept)navigate("detail",{type:"concept",id:nextConcept.id});return}
      reviewSessionId=globalThis.crypto?.randomUUID?.()||`review-${Date.now()}-${Math.random().toString(36).slice(2)}`;
      renderFlashcardModal();
    }
    function rateReviewCard(card,rating){
      user.reviewState[card.id]=REVIEW_POLICY.next(user.reviewState[card.id],rating,Date.now(),reviewSessionId);reviewSessionResults[rating]++;
      if(card.conceptId&&conceptLevel(card.conceptId)>=3&&conceptRetained(card.conceptId))user.conceptLevels[card.conceptId]=4;
      saveUser(true);reviewIndex++;if(reviewIndex<reviewSession.length)renderFlashcardModal();else finishReviewSession();
    }
    function finishReviewSession(){const stats=reviewStats(),heading=document.getElementById("reviewDeckHeading"),deckStats=document.getElementById("reviewDeckStats"),button=document.getElementById("flashcardButton");if(heading)heading.textContent=`${stats.eligible} Karten verfügbar · ${stats.retained}/${stats.explained} erklärte Concepts durch Abruf bestätigt`;if(deckStats)deckStats.textContent=`${stats.newCards} Karten nie abgerufen · ${stats.again} zuletzt nicht gewusst · ${stats.hard} zuletzt schwer · ${stats.good} zuletzt gewusst`;if(button)button.textContent=`Abrufsitzung starten (${Math.min(stats.eligible,10)})`;openModal("Abrufsitzung abgeschlossen","Abruf vor Wiederlesen",`<div class="stage-metric"><div class="metric"><strong>${reviewSessionResults.good}</strong><span>Gewusst</span></div><div class="metric"><strong>${reviewSessionResults.hard}</strong><span>Schwer</span></div><div class="metric"><strong>${reviewSessionResults.again}</strong><span>Noch nicht</span></div></div><div class="callout accent" style="margin-top:1rem"><strong>Du entscheidest, wann du wieder übst.</strong><p>Alle Karten bleiben jederzeit verfügbar und werden nach Lernbedarf sortiert. Du kannst die nächste Sitzung sofort oder später starten. Für Stufe 4 braucht jede Concept-Frage zwei „Gewusst“-Bewertungen aus selbst gestarteten Sitzungen; es gibt keine Mindestwartezeit. Nach der Bestätigung zeigt die Concept-Seite die beobachteten Sitzungsabstände als Lernverlauf.</p></div>`);requestAnimationFrame(()=>document.getElementById("modalClose")?.focus())}
    function renderFlashcardModal(){
      const card=reviewSession[reviewIndex],module=byId(MODULES,card.module);
      openModal("Aktiver Abruf",`${card.type==="formula"?"Formel":"Concept"} · ${module?.n||""} ${module?.title||""}`,`<article class="panel flashcard" aria-labelledby="flashQuestion"><div class="flashcard-inner"><p class="eyebrow">Karte ${reviewIndex+1} / ${reviewSession.length}</p><h3 id="flashQuestion">${esc(card.front)}</h3><p class="answer" id="flashAnswer" tabindex="-1" role="status" hidden>${esc(card.back)}</p><button class="button" id="flashReveal" aria-controls="flashAnswer reviewRatings" aria-expanded="false">Musterantwort anzeigen</button></div></article><div class="card-actions" id="reviewRatings" style="justify-content:center;margin-top:1rem" hidden><button class="button" id="reviewAgain">Noch nicht</button><button class="button" id="reviewHard">Schwer</button><button class="button primary" id="reviewGood">Gewusst</button></div><p class="muted small" style="text-align:center">Bewerte die Qualität deiner eigenen Erklärung, nicht ob die Musterantwort vertraut aussieht.</p>`);
      document.getElementById("flashReveal").onclick=event=>{const answer=document.getElementById("flashAnswer");answer.hidden=false;document.getElementById("reviewRatings").hidden=false;event.currentTarget.setAttribute("aria-expanded","true");event.currentTarget.textContent="Musterantwort sichtbar";event.currentTarget.disabled=true;answer.focus()};
      document.getElementById("reviewAgain").onclick=()=>rateReviewCard(card,"again");document.getElementById("reviewHard").onclick=()=>rateReviewCard(card,"hard");document.getElementById("reviewGood").onclick=()=>rateReviewCard(card,"good");requestAnimationFrame(()=>document.getElementById("flashReveal")?.focus());
    }

    function exportProgress(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:user},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=currentLanguage==="en"?"cs336-progress.json":"cs336-lernfortschritt.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Fortschritt exportiert")}
    function importProgress(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);user=normalizeUser(parsed.data||parsed);saveUser(true);applyTheme();renderCurrent();toast("Fortschritt importiert")}catch{toast("Ungültige Fortschrittsdatei")}};reader.readAsText(file)}

    function buildSearchIndex(){return [
      ...MODULES.map(x=>({type:"Modul",title:x.n+" · "+x.title,desc:x.description,id:x.id,kind:"module",text:[x.title,x.description,x.outcome,x.stage].join(" ")})),
      ...CONCEPTS.map(x=>({type:"Konzept",title:x.title,desc:x.summary,id:x.id,kind:"concept",text:[x.title,x.summary,x.context,x.why,x.terms,x.mental,x.details,x.pitfalls,x.checks,x.answers,x.formulas].flat(Infinity).join(" ")})),
      ...FORMULAS.map(x=>({type:"Formel",title:x.title,desc:strip(x.expr),id:x.id,kind:"formula",text:Object.values(x).flat(3).join(" ")})),
      ...SYMBOLS.map(x=>({type:"Symbol",title:x.symbol+" · "+x.meaning,desc:x.context+" — "+x.dimension,id:x.id,kind:"symbol",text:Object.values(x).join(" ")})),
      ...ASSIGNMENTS.map(x=>({type:"Assignment",title:x.label+" · "+x.title,desc:x.goal,id:x.id,kind:"assignment",text:Object.values(x).flat(3).join(" ")})),
      ...LABS.map(x=>({type:"Lab",title:x.title,desc:x.desc,id:x.id,kind:"lab",text:Object.values(x).flat(3).join(" ")})),
      ...GLOSSARY.map(x=>({type:"Glossar",title:x.term,desc:x.def,id:x.id,kind:"glossary",text:x.term+" "+x.def+" "+x.detail+" "+x.cat}))
    ];}
    let SEARCH_INDEX=buildSearchIndex();
    function searchAll(query){const q=norm(query);if(q.length<2)return[];return SEARCH_INDEX.map(item=>{const title=norm(item.title),text=norm(item.text);let score=0;if(title===q)score=100;if(title.startsWith(q))score=Math.max(score,70);if(title.includes(q))score=Math.max(score,50);if(text.includes(q))score=Math.max(score,20);return{...item,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||currentCollator.compare(a.title,b.title)).slice(0,14)}
    function setSearchOpen(open){const input=document.getElementById("globalSearch"),box=document.getElementById("searchResults");box.hidden=!open;input.setAttribute("aria-expanded",String(open));if(!open){activeSearchIndex=-1;input.removeAttribute("aria-activedescendant");box.querySelectorAll('[role="option"]').forEach(option=>{option.classList.remove("is-active");option.setAttribute("aria-selected","false")})}}
    function setActiveSearchResult(index){if(!searchItems.length)return;activeSearchIndex=(index+searchItems.length)%searchItems.length;const input=document.getElementById("globalSearch"),options=[...document.querySelectorAll("#searchResults [role=option]")];options.forEach((option,i)=>{const active=i===activeSearchIndex;option.classList.toggle("is-active",active);option.setAttribute("aria-selected",String(active))});const active=options[activeSearchIndex];if(active){input.setAttribute("aria-activedescendant",active.id);active.scrollIntoView({block:"nearest"})}}
    function renderSearchResults(){const input=document.getElementById("globalSearch"),box=document.getElementById("searchResults"),status=document.getElementById("searchStatus");searchItems=searchAll(input.value);activeSearchIndex=-1;input.removeAttribute("aria-activedescendant");if(input.value.trim().length<2){box.innerHTML="";status.textContent="";setSearchOpen(false);return}box.innerHTML=searchItems.length?searchItems.map((item,i)=>`<div class="search-result" id="search-option-${i}" role="option" aria-selected="false" data-search-i="${i}"><span class="result-type">${item.type}</span><span class="result-copy"><strong>${esc(item.title)}</strong><small>${formulaText(item.desc)}</small></span></div>`).join(""):`<div class="search-empty" role="option" aria-disabled="true" aria-selected="false"><strong>Kein Treffer</strong><p class="muted small">Probiere englische Begriffe, Unicode-Symbole oder Codebezeichner wie d_model.</p></div>`;status.textContent=searchItems.length?`${searchItems.length} Suchergebnisse verfügbar. Mit Pfeiltasten auswählen.`:"Keine Suchergebnisse.";setSearchOpen(true);box.querySelectorAll("[data-search-i]").forEach(option=>{option.addEventListener("mousedown",event=>event.preventDefault());option.onclick=()=>openSearchItem(searchItems[+option.dataset.searchI])})}
    function handleSearchKeydown(event){const box=document.getElementById("searchResults");if(event.key==="ArrowDown"||event.key==="ArrowUp"){event.preventDefault();if(box.hidden)renderSearchResults();if(searchItems.length){const direction=event.key==="ArrowDown"?1:-1,next=activeSearchIndex<0?(direction>0?0:searchItems.length-1):activeSearchIndex+direction;setActiveSearchResult(next)}return}if(event.key==="Enter"&&!box.hidden&&searchItems.length){event.preventDefault();openSearchItem(searchItems[activeSearchIndex>=0?activeSearchIndex:0]);return}if(event.key==="Escape"&&!box.hidden){event.preventDefault();setSearchOpen(false)}}
    function openSearchItem(item){setSearchOpen(false);document.getElementById("globalSearch").value="";document.getElementById("searchStatus").textContent="";if(["module","concept","formula","assignment","lab"].includes(item.kind)){navigate("detail",{type:item.kind,id:item.id});return}if(item.kind==="symbol"){appState.formulaMode="symbols";appState.formulaQuery=item.title.split(" · ")[0];navigate("formulas");return}if(item.kind==="glossary"){appState.glossaryQuery=item.title;navigate("glossary")}}

    function applyTheme(){document.documentElement.dataset.theme=user.theme;document.querySelector('meta[name="theme-color"]').content=user.theme==="dark"?"#09111f":"#f5f7fb";document.getElementById("themeButton").textContent=user.theme==="dark"?"☼":"☾";document.getElementById("themeButton").setAttribute("aria-label",localizedUi(user.theme==="dark"?"Helles Farbschema":"Dunkles Farbschema"))}
    function parseHash(){const route=routeFromLocation();appState.view=route.view;appState.detail=route.detail}
    function init(){
      parseHash();applyStaticLanguage();startI18nObserver();initNav();applyTheme();localizeSubtree(document.querySelector(".topbar"));
      const syncMobileNav=()=>setMobileNav(false,true);if(mobileNavMedia.addEventListener)mobileNavMedia.addEventListener("change",syncMobileNav);else mobileNavMedia.addListener(syncMobileNav);
      document.getElementById("themeButton").onclick=()=>{user.theme=user.theme==="dark"?"light":"dark";saveUser();applyTheme()};
      document.getElementById("languageButton").onclick=()=>setLanguage(currentLanguage==="en"?"de":"en");
      document.getElementById("notesQuickButton").onclick=()=>navigate("notes");
      document.getElementById("accountButton").onclick=openAccount;
      document.getElementById("menuButton").onclick=()=>setMobileNav(!document.getElementById("sidebar").classList.contains("is-open"));
      document.getElementById("sidebarCloseButton").onclick=()=>setMobileNav(false);
      document.getElementById("navScrim").onclick=()=>setMobileNav(false);
      document.getElementById("modalClose").onclick=closeModal;document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
      document.addEventListener("keydown",e=>{const backdrop=document.getElementById("modalBackdrop"),sidebar=document.getElementById("sidebar");if(!backdrop.hidden){if(e.key==="Escape"){e.preventDefault();closeModal()}else trapFocus(e,backdrop.querySelector(".modal"));return}if(sidebar.classList.contains("is-open")){if(e.key==="Escape"){e.preventDefault();setMobileNav(false)}else trapFocus(e,sidebar);return}if(e.key==="Escape")setSearchOpen(false)});
      document.getElementById("globalSearch").addEventListener("input",renderSearchResults);document.getElementById("globalSearch").addEventListener("keydown",handleSearchKeydown);document.getElementById("globalSearch").addEventListener("blur",()=>requestAnimationFrame(()=>setSearchOpen(false)));
      document.addEventListener("click",e=>{const source=e.target.closest("[data-source-id]");if(source){e.preventDefault();void openSource(source.dataset.sourceId,source.dataset.sourcePage||"")}});
      document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))setSearchOpen(false)});
      document.querySelector(".skip-link").addEventListener("click",e=>{e.preventDefault();document.getElementById("mainContent").focus()});
      window.addEventListener("popstate",handleHistoryNavigation);window.addEventListener("hashchange",handleHistoryNavigation);
      window.addEventListener("online",()=>{setCloudStatus(cloud.session?"syncing":cloud.configured?"signedout":"local");scheduleCloudSync(100)});
      window.addEventListener("offline",()=>setCloudStatus("offline"));
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){const notes=document.getElementById("notesArea");if(notes&&user.notes!==notes.value){user.notes=notes.value;saveUser(true)}}else void refreshCloudState()});
      window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event});
      navigate(appState.view,appState.detail,{historyMode:"replace",focusMain:false});registerPwa();void initCloud();
    }
    init();
  </script>
