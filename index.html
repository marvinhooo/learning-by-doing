    const GLOSSARY_DETAILS = {
      "Autograd": "Autograd zeichnet während des Forward Pass auf, welche Tensoroperationen zu einem Ergebnis geführt haben, und berechnet im Backward Pass mit der Kettenregel die benötigten Ableitungen. Dadurch müssen Gradienten auch für komplexe Modelle nicht von Hand hergeleitet werden. Der Komfort kostet Speicher für Zwischenwerte; außerdem addiert PyTorch Gradienten standardmäßig, bis sie explizit zurückgesetzt werden.",
      "BPE": "Byte-Pair Encoding (BPE) startet mit kleinen Einheiten und verschmilzt wiederholt das häufigste benachbarte Paar zu einem neuen Token. Byte-basiertes BPE kann dadurch jeden Eingabetext ohne unbekannte Zeichen darstellen. Mehr Merges verkürzen typischerweise Sequenzen, vergrößern aber das Vokabular und können seltene oder sprachübergreifende Muster ungünstig zerlegen.",
      "BF16": "Brain Floating Point 16 (BF16), meist BFloat16 genannt, verwendet wie FP32 acht Exponentenbits, aber deutlich weniger Bits für die Mantisse. Sein großer Wertebereich macht Über- und Unterläufe beim Mixed-Precision-Training seltener als bei FP16, während Speicherbedarf und Datentransfer gegenüber FP32 sinken. Die geringere Präzision kann kleine Aktualisierungen verschlucken, weshalb kritische Zustände wie Optimizer-Momente häufig in FP32 bleiben.",
      "Checkpoint": "Ein Checkpoint speichert neben den Modellparametern idealerweise auch Optimizer State, Learning-Rate-Scheduler, Trainingsschritt, Zufallszustände und die Position in der Datenpipeline. Damit lässt sich ein unterbrochener Lauf möglichst reproduzierbar fortsetzen oder ein früherer Modellstand evaluieren. Activation Checkpointing ist etwas anderes: Es verwirft ausgewählte Aktivierungen und berechnet sie im Backward Pass erneut, um Speicher gegen zusätzliche Rechenzeit zu tauschen.",
      "Collective": "Eine Collective Communication ist eine gemeinsam ausgeführte Kommunikationsoperation, an der mehrere Ranks, also Prozesse oder Geräte, teilnehmen. All-Reduce synchronisiert beispielsweise aggregierte Werte auf allen Ranks, während Reduce-Scatter das Ergebnis verteilt und All-Gather verteilte Teile wieder zusammensetzt. Alle Teilnehmer müssen Collectives in kompatibler Reihenfolge aufrufen; viele kleine Operationen leiden zudem besonders unter Kommunikationslatenz.",
      "CUDA": "Compute Unified Device Architecture (CUDA) ist NVIDIAs Plattform und Programmiermodell für allgemeine Berechnungen auf Graphics Processing Units (GPUs). Der Host startet dabei GPU-Kernel, deren viele Threads Daten parallel verarbeiten; Compiler, Laufzeit und Bibliotheken übernehmen wesentliche Teile der Hardwareansteuerung. CUDA bietet ein ausgereiftes Ökosystem, bindet Anwendungen jedoch an NVIDIA-Hardware.",
      "DDP": "Distributed Data Parallel (DDP) hält auf jedem Rank eine vollständige Modellkopie und verarbeitet dort einen anderen Teil des Mini-Batches. Während des Backward Pass werden Gradient-Buckets per All-Reduce synchronisiert, sodass alle Kopien anschließend denselben Parameter-Update ausführen. DDP erhöht den Trainingsdurchsatz, reduziert aber den Speicherbedarf des Modell- und Optimizerzustands pro Gerät nicht.",
      "DPO": "Direct Preference Optimization (DPO) erhöht für ein Präferenzpaar die relative Wahrscheinlichkeit der bevorzugten gegenüber der abgelehnten Antwort, jeweils im Vergleich zu einer eingefrorenen Referenz-Policy. Eine logistische Loss-Funktion steuert dabei, wie stark die trainierte Policy von der Referenz abweichen darf. DPO benötigt während der Optimierung weder neue On-Policy-Rollouts noch ein separates Reward Model, bleibt aber empfindlich gegenüber Datenqualität, dem β-Parameter sowie Längen- und Formatbias.",
      "EOS": "End of Sequence (EOS) ist ein spezielles Token, dessen Wahrscheinlichkeit das Modell wie die jedes anderen nächsten Tokens lernt. Wird EOS bei der Generierung gewählt, kann das Decoding beendet werden; es sollte dabei klar von Padding zur Batch-Auffüllung getrennt sein. Fehlende oder falsch maskierte EOS-Beispiele führen leicht zu unnötig langen, abrupt abgeschnittenen oder vorzeitig beendeten Ausgaben.",
      "FLOP": "Eine Floating-Point Operation (FLOP) bezeichnet eine einzelne Gleitkommaoperation und dient als grobes Maß für Rechenarbeit. Bei Zählungen wird eine kombinierte Multiplikation und Addition häufig als zwei FLOPs gewertet, weshalb die verwendete Konvention genannt werden sollte. FLOP/s misst dagegen eine Rechenrate, und ein niedriger theoretischer FLOP-Bedarf garantiert wegen Speicherzugriffen und Kommunikation noch keine kurze Laufzeit.",
      "FSDP": "Fully Sharded Data Parallel (FSDP) verteilt Parameter, Gradienten und Optimizerzustände auf mehrere Ranks, anstatt sie überall vollständig zu replizieren. Für die Berechnung eines Layers werden benötigte Parameter typischerweise per All-Gather vorübergehend zusammengesetzt und die resultierenden Gradienten anschließend per Reduce-Scatter wieder verteilt. Das ermöglicht größere Modelle pro Gerät, kostet jedoch zusätzliche Kommunikation und kann durch kurzzeitig vollständige Parameter sowie Prefetching neue Speicherspitzen erzeugen.",
      "GQA": "Grouped-Query Attention (GQA) ordnet mehrere Query Heads jeweils einer gemeinsamen Key- und Value-Gruppe zu. Gegenüber Multi-Head Attention verkleinert das den Key-Value-Cache und senkt besonders beim autoregressiven Decoding den Speicherverkehr; gegenüber Multi-Query Attention bleiben mehr getrennte Key-Value-Repräsentationen erhalten. GQA ist damit ein Qualitäts-Effizienz-Kompromiss, erfordert aber eine saubere Zuordnung und meist teilbare Head-Zahlen.",
      "GRPO": "Group Relative Policy Optimization (GRPO) erzeugt mehrere Antworten pro Prompt und leitet ihre Advantages aus den relativen Rewards innerhalb dieser Gruppe ab, ohne ein eigenes Value Model zu trainieren. Diese Advantages gewichten einen Policy-Gradienten, der häufig zusätzlich durch Importance Ratios, Clipping oder eine Referenz-Regularisierung begrenzt wird. Das spart den Kritiker, benötigt aber mehrere Generationen; erhalten alle Antworten denselben Reward, entsteht aus der Gruppe kein relatives Lernsignal.",
      "HBM": "High Bandwidth Memory (HBM) ist gestapelter dynamischer Arbeitsspeicher mit sehr breiter Anbindung, der als großer externer Speicher moderner Beschleuniger dient. Trotz seiner hohen Bandbreite ist HBM im Vergleich zu Registern oder gemeinsamem On-Chip-Speicher weiter entfernt und oft der Engpass datenintensiver Kernel. Tiling, Kernel-Fusion und Verfahren wie FlashAttention beschleunigen Berechnungen deshalb vor allem, indem sie unnötige HBM-Transfers vermeiden.",
      "Head": "Bei klassischer Multi-Head Attention (MHA) verwendet ein Attention Head eigene Slices der Query-, Key- und Value-Parameter und berechnet daraus ein separates Attention-Muster. Bei Grouped-Query Attention (GQA) oder Multi-Query Attention (MQA) bleiben Query-Slices getrennt, während mehrere oder alle Query Heads dieselben Key- und Value-Slices teilen. In üblichen Implementierungen erzeugt ein gemeinsamer oder fused Linear Layer die Aktivierungen vieler Heads auf einmal; erst danach werden sie in Head-Slices umgeformt. Bei konstanter Modelldimension verkleinern mehr Heads die Dimension jedes einzelnen Heads und erhöhen die Kapazität daher nicht automatisch.",
      "IsoFLOPs": "IsoFLOPs-Experimente halten den gesamten Trainingscompute näherungsweise konstant und variieren dafür Modellgröße und Zahl der Trainingstokens. Mit der Näherung C ≈ 6ND folgt bei gegebenem Budget C und Modellgröße N eine Tokenzahl D ≈ C/(6N), sodass sich der verlustärmste Kompromiss empirisch suchen lässt. Das Minimum muss durch Messpunkte auf beiden Seiten eingeklammert werden und gilt nur für die untersuchte Architektur, Datenverteilung und Compute-Konvention.",
      "Jaccard": "Die Jaccard-Ähnlichkeit zweier Mengen ist das Verhältnis ihrer Schnittmenge zu ihrer Vereinigungsmenge und liegt zwischen null und eins. Bei der Text-Deduplizierung werden häufig Mengen aus Zeichen- oder Wort-Shingles verglichen, wodurch lokale Überlappung erfasst wird, nicht aber deren Häufigkeit oder vollständige Reihenfolge. MinHash kann Jaccard effizient schätzen, während Locality-Sensitive Hashing Kandidaten findet, die anschließend möglichst exakt geprüft werden.",
      "Kernel": "Ein GPU-Kernel ist eine Funktion, die nach einem Start durch den Host parallel von vielen Threads eines Grids ausgeführt wird. Seine Laufzeit hängt nicht nur von der Zahl der Rechenoperationen ab, sondern auch von Speicherzugriffen, Thread-Divergenz, Belegung der Recheneinheiten und Arithmetic Intensity. Kernel-Fusion kann Startaufwand und HBM-Zwischenwerte sparen, doch übermäßige Fusion erhöht mitunter Registerbedarf und senkt die Parallelität.",
      "KL": "Die Kullback-Leibler-Divergenz D_KL(P||Q) misst, wie stark die betrachtete Verteilung P von der Referenzverteilung Q abweicht, indem sie unter P den Logarithmus des Verhältnisses P/Q mittelt. Beim Training von Sprachmodellen kann sie beispielsweise verhindern, dass sich eine optimierte Policy zu weit von einem Referenzmodell entfernt. Sie ist gerichtet und daher keine symmetrische Distanz; weist Q einem unter P möglichen Ereignis die Wahrscheinlichkeit null zu, kann die Divergenz sogar unendlich werden.",
      "KV-Cache": "Der Key-Value-Cache (KV-Cache) speichert in jedem Attention Layer die bereits berechneten Keys und Values früherer Tokens. Beim autoregressiven Decoding muss das Modell dadurch für einen neuen Token nur dessen neue Werte berechnen und kann direkt auf die gespeicherten Werte zugreifen. Das beschleunigt die Inferenz deutlich, benötigt aber Speicher, der linear mit Kontextlänge, Batchgröße, Layerzahl und Zahl der Key-Value Heads wächst.",
      "Logit": "Ein Logit ist ein unnormalisierter Score, den das Modell jedem möglichen nächsten Token zuweist. Softmax wandelt die Logits in Wahrscheinlichkeiten um, wobei nur ihre relativen Unterschiede zählen und eine gemeinsame additive Konstante nichts verändert. Durch Skalierung mit einer Temperatur lässt sich die Verteilung schärfer oder flacher machen, ohne die Reihenfolge der Logits zu ändern.",
      "LSH": "Locality-Sensitive Hashing (LSH) organisiert ähnliche MinHash-Signaturen so, dass nicht jedes Dokument mit jedem anderen verglichen werden muss. Dazu wird eine Signatur typischerweise in Bänder aufgeteilt; stimmen alle Werte eines Bands überein, wird das Dokumentpaar als Kandidat betrachtet. Anzahl und Größe der Bänder steuern den Trade-off zwischen übersehenen Duplikaten und zusätzlichen Fehlkandidaten, weshalb anschließend meist noch ein genauer Ähnlichkeitsvergleich folgt.",
      "MFU": "Model FLOPs Utilization (MFU) setzt die pro Sekunde für das Modell ausgeführten Gleitkommaoperationen ins Verhältnis zur theoretischen Spitzenleistung der Hardware. Ein niedriger Wert kann auf Speicherzugriffe, Kommunikation, kleine Matrizen oder andere Wartezeiten hinweisen, während ein hoher Wert eine gute Nutzung der Recheneinheiten signalisiert. Da die gezählten Modelloperationen und Hardware-Peaks von Konvention und Zahlenformat abhängen, sind MFU-Werte nur bei vergleichbarer Berechnung sinnvoll gegenüberzustellen.",
      "MinHash": "MinHash bildet eine Menge, etwa die Shingles eines Dokuments, durch die kleinsten Werte mehrerer unabhängiger Hashordnungen auf eine kompakte Signatur ab. Der erwartete Anteil gleicher Signaturkomponenten zweier Mengen entspricht ihrer Jaccard-Ähnlichkeit. Das spart Speicher und beschleunigt die Suche nach ähnlichen Dokumenten, bleibt aber ein probabilistischer Schätzer und sollte für endgültige Duplikatentscheidungen durch einen exakten Vergleich ergänzt werden.",
      "MLP": "Ein Multi-Layer Perceptron (MLP) ist im Transformer meist das positionsweise Feed-Forward Network aus einem erweiternden Linear Layer, einer Nichtlinearität oder Gating-Funktion und einem verkleinernden Linear Layer. Es verarbeitet jede Tokenposition unabhängig und transformiert deren Features, während Attention Informationen zwischen Positionen austauscht. MLP-Blöcke enthalten häufig einen großen Anteil der Modellparameter und verursachen entsprechend viel Rechenaufwand.",
      "MoE": "Bei einer Mixture of Experts (MoE) wählt ein Router für jeden Token nur wenige spezialisierte Feed-Forward-Experten aus. Dadurch kann die Gesamtzahl der Parameter stark wachsen, ohne dass für jeden Token alle Experten berechnet werden müssen. Dem Kapazitätsgewinn stehen zusätzliche Kommunikation, hoher Speicherbedarf und mögliche Lastungleichgewichte gegenüber, wenn der Router manche Experten deutlich häufiger auswählt als andere.",
      "MQA": "Bei Multi-Query Attention (MQA) behalten die Query Heads getrennte Query-Parameter-Slices und Query-Aktivierungen, teilen sich aber ein einziges Paar aus Key und Value Head. Ein gemeinsamer oder fused Linear Layer kann die Slices effizient in einer Operation erzeugen. Das verkleinert den Key-Value-Cache und reduziert insbesondere beim Decoding den Speicherbandbreitenbedarf; Grouped-Query Attention ist ein Kompromiss mit mehreren, aber weniger Key-Value-Gruppen als Query Heads.",
      "NCCL": "Die NVIDIA Collective Communications Library (NCCL) stellt optimierte kollektive Kommunikationsoperationen wie All-Reduce, All-Gather und Reduce-Scatter für mehrere GPUs bereit. Distributed Data Parallel nutzt beispielsweise All-Reduce, um die Gradienten der Modellreplikate zu synchronisieren. Die Leistung hängt stark von Netzwerktopologie, Nachrichtengröße und Überlappung mit Berechnungen ab; NCCL ist dabei die Kommunikationsschicht und nicht selbst der Parallelisierungsalgorithmus.",
      "NLL": "Die Negative Log-Likelihood (NLL) eines Zieltokens ist der negative Logarithmus der Wahrscheinlichkeit, die das Modell diesem Token zuweist. Über eine Sequenz werden die Werte addiert und beim Training häufig über alle gültigen Tokens gemittelt; ihre Minimierung entspricht bei One-Hot-Zielen der Minimierung der Cross-Entropy. Die logarithmische Form bestraft sehr kleine Zielwahrscheinlichkeiten stark, und das Exponential der mittleren Token-NLL ergibt die Perplexity.",
      "Occupancy": "Die Occupancy einer GPU beschreibt, welcher Anteil der maximal möglichen Warps gleichzeitig auf einem Streaming Multiprocessor aktiv sein kann. Registerbedarf, gemeinsam genutzter Speicher und Blockgröße begrenzen, wie viele Blöcke gleichzeitig resident bleiben und Wartezeiten verdecken können. Eine höhere Occupancy ist jedoch nicht automatisch schneller, weil auch Speicherbandbreite, Befehlsparallelität und effiziente Wiederverwendung von Daten entscheidend sind.",
      "On-policy": "On-policy bedeutet im Reinforcement Learning, dass die Trainingsdaten von der aktuell optimierten Policy erzeugt wurden. Nach einer größeren Aktualisierung stammen ältere Trajektorien streng genommen von einer anderen Policy und können deshalb nicht unbegrenzt unverändert wiederverwendet werden. Das verringert Verteilungsabweichungen zwischen Datenerzeugung und Update, ist aber meist weniger sample-effizient als Off-policy-Verfahren.",
      "Perplexity": "Perplexity ist das Exponential der mittleren Negative Log-Likelihood pro Token und kann als effektive Zahl plausibler Fortsetzungen interpretiert werden. Ein niedrigerer Wert bedeutet, dass das Modell den Tokens eines festgelegten Evaluationskorpus im Mittel höhere Wahrscheinlichkeit zuweist. Aussagekräftige Vergleiche erfordern denselben Tokenizer, dieselbe Kontextbehandlung und dieselbe Datenaufbereitung; Faktentreue, Instruktionsfolge oder Sicherheit misst die Kennzahl nicht direkt.",
      "PII": "Personally Identifiable Information (PII) umfasst Informationen, durch die eine Person direkt oder in Kombination mit anderen Merkmalen identifiziert werden kann. Dazu zählen neben Namen und Kennnummern auch kontextabhängige Kombinationen aus Standort-, Kontakt- oder biografischen Daten. Erkennung und Entfernung vor dem Training verringern Datenschutz- und Memorierungsrisiken, sind aber fehleranfällig und müssen mit gelabelten Stichproben auf übersehene sowie fälschlich entfernte Inhalte geprüft werden.",
      "Policy": "Eine Policy ordnet im Reinforcement Learning jedem Zustand oder bisherigen Verlauf eine Wahrscheinlichkeitsverteilung über mögliche Aktionen zu. Bei einem Sprachmodell sind die Aktionen die nächsten Tokens, und die Wahrscheinlichkeit einer gesamten Antwort entsteht aus dem Produkt der bedingten Tokenwahrscheinlichkeiten. Die Policy erzeugt das Verhalten und ist damit vom Reward Model, das Antworten bewertet, sowie vom Value Model, das erwartete zukünftige Belohnung schätzt, zu unterscheiden.",
      "PPO": "Proximal Policy Optimization (PPO) ist ein Policy-Gradient-Verfahren, das das Wahrscheinlichkeitsverhältnis zwischen neuer und datenerzeugender Policy verwendet und dieses im Optimierungsziel begrenzt. Das Vorzeichen des Advantage bestimmt, ob eine beobachtete Aktion wahrscheinlicher oder unwahrscheinlicher werden soll, während das Clipping übermäßig große Updates unattraktiv macht. PPO ist dadurch oft stabiler als ein ungebegrenztes Policy-Gradient-Update, benötigt aber frische Trajektorien und garantiert trotz Clipping keine harte obere Grenze der tatsächlichen Policy-Änderung.",
      "Pretokenization": "Pretokenization zerlegt Rohtext zunächst in Segmente, bevor ein Verfahren wie Byte-Pair Encoding (BPE) seine gelernten Subword-Merges anwendet. Regeln für Leerzeichen, Satzzeichen, Unicode-Zeichen oder Bytefolgen bestimmen dabei, zwischen welchen Bereichen spätere Merges überhaupt möglich sind. Diese frühe Entscheidung beeinflusst Vokabular, Sequenzlängen und Zeichen-Offsets und muss deshalb bei Training und Inferenz identisch umgesetzt werden.",
      "Rank": "Ein Rank ist ein eindeutig nummerierter Prozess innerhalb einer verteilten Prozessgruppe und wird häufig genau einem Beschleuniger zugeordnet. Kollektive Kommunikationsoperationen verwenden diese Nummer, um die beteiligten Prozesse zu unterscheiden. Der globale Rank gilt über alle Maschinen hinweg, während der lokale Rank nur die Prozesse innerhalb einer Maschine nummeriert.",
      "Residual Stream": "Der Residual Stream enthält für jedes Token einen Vektor in Modelldimension, der durch alle Transformer-Blöcke weitergereicht wird. Attention und Feed-Forward Network ersetzen diesen Vektor nicht, sondern addieren jeweils eine berechnete Korrektur. Dieser Identitätspfad bewahrt Informationen und erleichtert den Gradientenfluss durch tiefe Modelle, verlangt aber identische Shapes bei jeder Residualaddition.",
      "RLHF": "Reinforcement Learning from Human Feedback (RLHF) nutzt menschliche Präferenzurteile, um meist zunächst ein Reward Model zu trainieren. Anschließend wird die Sprachmodell-Policy so optimiert, dass sie hohen vorhergesagten Reward erhält und durch eine Regularisierung nahe an einer Referenz-Policy bleibt. Das kann schwer formalisierbare menschliche Präferenzen abbilden, ist aber teuer und anfällig für Fehler oder ausnutzbare Schwächen des Reward Models.",
      "RLVR": "Reinforcement Learning from Verifiable Rewards (RLVR) bewertet erzeugte Antworten mit automatisch prüfbaren Kriterien wie exakten Lösungen, Programmiertests oder formalen Beweisen. Die Policy lernt aus ihren eigenen Rollouts, welche Antworten häufiger zu einem erfolgreichen Prüfergebnis führen. Dadurch werden kein gelerntes Reward Model und weniger menschliche Labels benötigt, doch das Verfahren ist vor allem auf Domänen mit zuverlässigen Verifizierern beschränkt und kann unter spärlichen Rewards leiden.",
      "RMSNorm": "Root Mean Square Normalization (RMSNorm) teilt den Aktivierungsvektor jedes Tokens durch seine quadratische mittlere Größe und multipliziert ihn anschließend mit lernbaren Skalierungswerten. Anders als Layer Normalization zieht sie den Mittelwert nicht ab und ist dadurch etwas einfacher und günstiger. Sie stabilisiert Aktivierungsskalen, entfernt jedoch keinen gemeinsamen Offset; außerdem müssen Normalisierungsachse und Stabilitätskonstante korrekt gewählt werden.",
      "Roofline": "Das Roofline-Modell begrenzt die erreichbare Rechenleistung durch das kleinere von maximaler Rechenleistung und Speicherbandbreite mal Arithmetic Intensity. Unterhalb des Ridge Points ist ein Kernel typischerweise memory-bound, oberhalb davon compute-bound. Das Modell hilft bei der Wahl zwischen Datenwiederverwendung, Fusion und Rechenoptimierung, beschreibt aber nur eine theoretische Obergrenze und keine garantierte Laufzeit.",
      "RoPE": "Rotary Position Embedding (RoPE) rotiert Paare von Query- und Key-Features mit positions- und frequenzabhängigen Winkeln. Dadurch hängt ihr Skalarprodukt von der relativen Positionsdifferenz ab, ohne einen separaten Positionsvektor zu den Aktivierungen zu addieren. Die Methode erhält die Tensorform und funktioniert gut innerhalb des Trainingskontexts, doch sehr lange Kontextextrapolation kann zusätzliche Frequenzskalierung erfordern.",
      "SFT": "Supervised Fine-Tuning (SFT) trainiert ein vortrainiertes Modell mit gewünschten Prompt-Antwort-Paaren und einem Cross-Entropy-Loss. Beim Teacher Forcing soll es jeweils das nächste Zieltoken aus dem korrekten bisherigen Kontext vorhersagen. Das Verfahren ist stabil und vergleichsweise einfach, imitiert jedoch nur die Trainingsbeispiele und optimiert weder direkt menschliche Präferenzen noch den Erfolg einer vollständigen Antwort.",
      "SIMT": "Single Instruction, Multiple Threads (SIMT) ist ein Ausführungsmodell, bei dem viele logisch getrennte Threads dieselbe Instruktion gleichzeitig auf unterschiedlichen Daten anwenden. Eine GPU bündelt solche Threads typischerweise in Warps und plant sie gemeinsam ein. Regelmäßige Berechnungen sind dadurch sehr effizient, während unterschiedliche Verzweigungen innerhalb eines Warps nacheinander ausgeführt werden müssen und Leistung kosten.",
      "SwiGLU": "Die Swish-Gated Linear Unit (SwiGLU) berechnet die Ausgaben zweier Linear Layers des Inputs, aktiviert eine davon mit der Sigmoid Linear Unit (SiLU) und multipliziert beide elementweise. Ein dritter Linear Layer bildet das gegatete Ergebnis zurück auf die Modelldimension ab. Das datenabhängige Gate ist oft leistungsfähiger als ein einfaches Feed-Forward Network mit ReLU oder GELU, benötigt aber drei Gewichtsmatrizen und daher eine passend reduzierte innere Breite für faire Parametervergleiche.",
      "Tensor Parallelism": "Tensor Parallelism teilt die Gewichts- und Rechenachsen einzelner Layer auf mehrere Geräte auf, sodass jeder Rank nur einen Teil einer großen Matrixoperation ausführt. Die Teilergebnisse müssen innerhalb des Layers durch kollektive Kommunikation zusammengeführt oder weiterverteilt werden. Damit lassen sich Layer ausführen, die auf ein einzelnes Gerät nicht passen, allerdings entsteht häufige Kommunikation; anders als bei Data Parallelism besitzt ein Rank keine vollständige Modellkopie.",
      "Tiling": "Beim Tiling werden große Tensoroperationen in Blöcke zerlegt, deren Daten in Register, Shared Memory oder Cache passen. Ein Block kann geladene Werte mehrfach verwenden, bevor erneut auf den langsameren globalen Speicher zugegriffen werden muss. Geeignete Kachelgrößen erhöhen die Arithmetic Intensity, während zu große Kacheln Registerdruck und zu kleine Kacheln Ladeaufwand verursachen; Randkacheln benötigen zusätzlich korrekte Maskierung.",
      "Tokenizer": "Ein Tokenizer wandelt Text nach festen Regeln reversibel in eine Folge diskreter Token-IDs um und dekodiert diese wieder zurück. Bei Subword-Tokenizern werden häufige Byte- oder Zeichenfolgen gelernt, nicht deren Bedeutung. Die Wahl des Vokabulars beeinflusst Sequenzlänge, Embedding-Parameter, Sprachabdeckung und Rechenkosten; deshalb müssen auch Sondertokens, unbekannte Schriften und die exakte Roundtrip-Rekonstruktion geprüft werden.",
      "Triton": "Triton ist eine Python-nahe, domänenspezifische Sprache zum Schreiben eigener GPU-Kernel. Entwickler beschreiben blockweise Programme und Speicherzugriffe, während der Compiler die Ausführung auf Threads und Hardwareinstruktionen abbildet. Triton erleichtert Kernel-Fusion und Tiling gegenüber hardwarenaher Programmierung, nimmt einem aber die Wahl effizienter Layouts, Kachelgrößen und Randmasken nicht ab.",
      "Warp": "Ein Warp ist auf NVIDIA-GPUs eine Gruppe von üblicherweise 32 Threads, die nach dem Prinzip Single Instruction, Multiple Threads (SIMT) gemeinsam eingeplant wird. Zusammenhängende Speicherzugriffe der Threads können effizient gebündelt werden, während unterschiedliche Kontrollflusspfade innerhalb des Warps serialisiert werden. Ein Warp ist eine Hardware-Ausführungseinheit und nicht mit einem frei synchronisierbaren Threadblock gleichzusetzen.",
      "Weight Tying": "Beim Weight Tying verwendet das Modell dieselben Parameter für die Input-Embeddingmatrix und, transponiert, für den Output Linear Layer zu den Logits. Dadurch entfallen ungefähr Vokabulargröße mal Modelldimension zusätzliche Parameter und Ein- sowie Ausgaberepräsentationen werden direkt gekoppelt. Die Technik setzt kompatible Dimensionen voraus und schränkt die beiden Rollen auf einen gemeinsamen Repräsentationsraum ein, was nicht für jede Architektur optimal sein muss.",
      "World Size": "Die World Size ist die Gesamtzahl der Ranks, die zu einer bestimmten verteilten Prozessgruppe gehören. Sie bestimmt, wie viele Teilnehmer eine kollektive Operation wie All-Reduce gemeinsam ausführen. In hybriden Setups können globale, datenparallele und tensorparallele Gruppen unterschiedliche World Sizes besitzen, weshalb die Gesamtzahl der Geräte nicht automatisch der datenparallelen Skalierung entspricht.",
      "ZeRO": "Der Zero Redundancy Optimizer (ZeRO) verteilt redundante Trainingszustände über die datenparallelen Ranks. Stufe 1 shardet Optimizerzustände, Stufe 2 zusätzlich Gradienten und Stufe 3 außerdem Modellparameter. Das senkt den persistenten Speicherbedarf pro Rank stark, erfordert jedoch zusätzliche kollektive Kommunikation und kann während der temporären Rekonstruktion von Parametern relevante Speicherspitzen erzeugen.",
      "Linear Layer / Projection": "Für einen Input-Vektor x berechnet ein Linear Layer typischerweise y = xW + b mit einer gelernten Gewichtsmatrix W und einem optionalen Bias b. Er kann die Feature-Dimension verändern oder neue Mischungen der vorhandenen Features erzeugen; dieselbe Matrix wird dabei auf jede Tokenposition angewendet. Der in LLM-Texten häufige Ausdruck Projection meint meist genau diese gelernte lineare Abbildung und nicht zwingend eine geometrische, orthogonale Projektion. Die Query, Key, Value und Output Linear Layers der Attention sind typische Beispiele."
    };

    function renderQuiz(){ const el=document.getElementById("view-quiz"); el.innerHTML=viewHeader("Abruftraining","Kannst du es ohne Vorlage erklären?","Beantworte erst aus dem Gedächtnis. Feedback erklärt den Grund, nicht nur richtig oder falsch.")+`<div class="quiz-wrap"><div class="panel" style="margin-bottom:1rem"><h2>12 Kernfragen</h2><p class="muted">Die Fragen decken A1 bis A5 ab. Dein Resultat verändert nicht automatisch den Kompetenzstatus – entscheide danach bewusst.</p><button class="button" id="flashcardButton">Stattdessen Karteikarten</button></div>${QUIZ.map((q,i)=>quizQuestionHtml(q,i,"quiz")).join("")}<button class="button primary" id="checkQuiz" style="margin-top:1rem">Antworten prüfen</button><div id="quizResult" aria-live="polite"></div></div>`; document.getElementById("checkQuiz").onclick=()=>gradeQuestions(QUIZ,"quiz",document.getElementById("quizResult")); document.getElementById("flashcardButton").onclick=openFlashcards; }
    function quizQuestionHtml(q,i,prefix){ const options=prefix==="diag"?[...q.opts,localizedUi("Ich weiß es nicht")]:q.opts;return `<fieldset class="question"><legend><strong>${i+1}. ${esc(q.q)}</strong></legend><div class="option-list">${options.map((o,j)=>`<label class="option"><input type="radio" name="${prefix}-${i}" value="${prefix==="diag"&&j===q.opts.length?"unknown":j}" ${prefix==="diag"&&j===0?"required":""}><span>${esc(o)}</span></label>`).join("")}</div><div class="feedback" id="${prefix}-feedback-${i}" hidden></div></fieldset>`; }
    function gradeQuestions(items,prefix,result){ let score=0; items.forEach((q,i)=>{const chosen=document.querySelector(`input[name="${prefix}-${i}"]:checked`);const good=chosen&&Number(chosen.value)===q.a;score+=good?1:0;const fb=document.getElementById(`${prefix}-feedback-${i}`);fb.hidden=false;fb.className="feedback "+(good?"good":"bad");fb.textContent=(good?"Richtig. ":"Noch nicht. ")+q.why;}); result.innerHTML=`<div class="callout ${score/items.length>=.75?"accent":"warning"}" style="margin-top:1rem"><strong>${score}/${items.length}</strong> richtig. ${score/items.length>=.75?"Erkläre jetzt drei Antworten laut ohne auf die Optionen zu schauen.":"Öffne die betroffenen Konzepte und beantworte die Frage später erneut."}</div>`; }

    function renderLabDetail(el,lab){ if(!lab)return; const mod=byId(MODULES,lab.module); el.innerHTML=`${backButton("labs","Labs")}<div class="view-header" style="margin-top:1rem"><p class="eyebrow">Interaktives Lab · ${esc(lab.time)}</p><h1>${esc(lab.title)}</h1><p class="lede">${esc(lab.desc)}</p></div>${labPrimerMarkup(lab)}<div id="labMount">${labMarkup(lab.id)}</div><div class="panel" style="margin-top:1rem"><h3>Transfer</h3><p class="muted">Formuliere zuerst selbst eine Begründung. Öffne danach die Lösungsidee und vergleiche die Ursache, nicht nur das Ergebnis.</p><p class="self-check-question" id="labTransfer">${esc(lab.transferQuestion)}</p>${answerDisclosure(lab.transferAnswer,"Lösungsidee anzeigen")}<button class="button ${user.labDone[lab.id]?"primary":""}" id="labDoneButton">${user.labDone[lab.id]?"✓ Als angewandt markiert":"Als angewandt markieren"}</button></div><div class="panel" style="margin-top:1rem"><h3>Quellen</h3><div class="meta-row">${(mod?.sources||[]).map(id=>sourceAnchor(id)).join("")}</div></div>`; bindBack(el); const formulaRecall=el.querySelector(".lab-formula-recall");formulaRecall.ontoggle=()=>{if(formulaRecall.open)appState.openLabFormulaIds.add(lab.id);else appState.openLabFormulaIds.delete(lab.id)}; document.getElementById("labDoneButton").onclick=()=>markLabDone(lab.id); initLab(lab.id); }
    function labMarkup(id){
      if(id==="shapes") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Eingaben</h2><div class="lab-quick-result" id="shapeQuick" role="status" aria-live="polite"></div><label class="field">Batchgröße B <input id="shapeB" type="range" min="1" max="8" value="3"><output id="shapeBOut">3</output></label><label class="field">Tokens pro Sequenz T <input id="shapeT" type="range" min="2" max="32" value="11"><output id="shapeTOut">11</output></label><label class="field">Modelldimension D <select class="select" id="shapeD"><option>64</option><option>128</option><option selected>256</option><option>512</option></select></label><label class="field">Attention Heads H <select class="select" id="shapeH"><option>1</option><option>2</option><option>4</option><option selected>8</option></select></label><p class="lab-note">Ändere genau einen Wert. Lies danach jede Shape mit ihren Achsennamen, nicht nur als Zahlenfolge.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="shapeStage"></div></div>`;
      if(id==="bpe") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Mini-Korpus</h2><label class="field">Wörter mit Leerzeichen <textarea class="textarea" id="bpeText">low low low lower newest widest</textarea></label><div class="card-actions"><button class="button" id="bpeReset">Zurücksetzen</button><button class="button primary" id="bpeStep">Häufigstes Paar mergen</button></div><p class="lab-note">Ties werden hier lexikographisch gelöst, damit das Resultat deterministisch bleibt.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" aria-live="polite" id="bpeStage"></div></div>`;
      if(id==="attention") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Kontrollen</h2><label class="field">Queryposition <select class="select" id="attnQuery">${["Der","Hund","jagt","ihn"].map((token,i)=>`<option value="${i}" ${i===2?"selected":""}>${i} · ${esc(localizedUi(token))}</option>`).join("")}</select></label><label class="field">Temperatur <input id="attnTemp" type="range" min="0.35" max="2.5" step="0.05" value="1"><output id="attnTempOut">1.00</output></label><label class="option"><input id="attnMask" type="checkbox" checked><span>Kausale Maske aktiv</span></label><p class="lab-note">Die Scores sind didaktische, feste QKᵀ/√d-Werte. Beobachte nur Softmax und Maske.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="attnStage"></div></div>`;
      if(id==="optimizer") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Schedule & Update</h2><label class="field">Aktueller Step <input id="optStep" type="range" min="0" max="100" value="20"><output id="optStepOut">20</output></label><label class="field">Warmup-Steps <input id="optWarmup" type="range" min="1" max="40" value="10"><output id="optWarmupOut">10</output></label><label class="field">Max-Lernrate η <input id="optLr" type="range" min="0.0001" max="0.01" step="0.0001" value="0.003"><output id="optLrOut">0.0030</output></label><label class="field">Gradient g <input id="optGrad" type="range" min="-2" max="2" step="0.05" value="0.6"><output id="optGradOut">0.60</output></label><label class="field">Weight Decay λ <input id="optWd" type="range" min="0" max="0.2" step="0.01" value="0.1"><output id="optWdOut">0.10</output></label></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="optStage"></div></div>`;
      if(id==="resources") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Modellannahmen</h2><label class="field">Layer L <input id="resL" type="range" min="2" max="80" value="24"><output id="resLOut">24</output></label><label class="field">Modelldimension D_model <select class="select" id="resD"><option>512</option><option>1024</option><option selected>2048</option><option>4096</option><option>8192</option></select></label><label class="field">Vokabular V <select class="select" id="resV"><option>32000</option><option selected>50000</option><option>100000</option></select></label><label class="field">Sequenz T <select class="select" id="resT"><option>512</option><option selected>2048</option><option>8192</option><option>32768</option></select></label><label class="field">Trainingstokens D_tokens <select class="select" id="resTokens"><option value="1e9">1B</option><option value="1e11" selected>100B</option><option value="1e12">1T</option></select></label></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="resStage"></div></div>`;
      if(id==="roofline") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Hardware & Kernel</h2><label class="field">Arithmetic Intensity <input id="roofAI" type="range" min="0.25" max="500" step="0.25" value="20"><output id="roofAIOut">20 FLOP/Byte</output></label><label class="field">HBM-Bandbreite <input id="roofBW" type="range" min="0.5" max="5" step="0.1" value="2"><output id="roofBWOut">2.0 TB/s</output></label><label class="field">Compute Peak <input id="roofPeak" type="range" min="20" max="2000" step="10" value="500"><output id="roofPeakOut">500 TFLOP/s</output></label><p class="lab-note">Ridge Point = Peak/Bandbreite. Links davon dominiert HBM-Traffic.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="roofStage"></div></div>`;
      if(id==="parallelism") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Strategie</h2><label class="field">Parallelisierungsart <select class="select" id="parMode"><option value="ddp">DDP</option><option value="zero2">ZeRO-2</option><option value="fsdp">FSDP / ZeRO-3</option><option value="tp">Tensor Parallel</option><option value="pp">Pipeline Parallel</option></select></label><label class="field">World Size <select class="select" id="parWorld"><option>2</option><option selected>4</option><option>8</option></select></label><p class="lab-note">Frage zuerst: Wem gehört Parameter, Gradient und Optimizer-State zu jedem Zeitpunkt?</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="parStage"></div></div>`;
      if(id==="scaling") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Compute-Budget</h2><label class="field">GPU-Stunden <input id="scaleHours" type="range" min="10" max="10000" step="10" value="1000"><output id="scaleHoursOut">1000 h</output></label><label class="field">Effektive PFLOP/s pro GPU <input id="scalePflops" type="range" min="0.05" max="1.5" step="0.05" value="0.4"><output id="scalePflopsOut">0.40</output></label><label class="field">Token/Parameter-Verhältnis r=D_tokens/N <input id="scaleRatio" type="range" min="5" max="100" value="20"><output id="scaleRatioOut">20</output></label><p class="lab-note">Der Regler wählt nur eine compute-kompatible Aufteilung. Das Lossprofil ist schematisch; in A3 muss ein günstiges r aus mehreren eingeklammerten IsoFLOPs-Profilen geschätzt werden.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="scaleStage"></div></div>`;
      if(id==="data-pipeline") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Filterstufen</h2><label class="option"><input type="checkbox" id="dataLang" checked><span>Englisch-Sprachfilter</span></label><label class="option"><input type="checkbox" id="dataPII" checked><span>PII maskieren</span></label><label class="option"><input type="checkbox" id="dataQuality" checked><span>Qualitätsschwelle</span></label><label class="option"><input type="checkbox" id="dataDedup" checked><span>Near-Dedup</span></label><label class="field">Qualitätsschwelle <input id="dataThreshold" type="range" min="0" max="1" step="0.05" value="0.55"><output id="dataThresholdOut">0.55</output></label><p class="lab-note">Audit immer sowohl verworfene als auch behaltene Beispiele.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="dataStage"></div></div>`;
      if(id==="evaluation") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Behauptung</h2><label class="field">Was möchtest du belegen? <select class="select" id="evalClaim"><option value="likelihood">Das Modell sagt Domänentext gut voraus</option><option value="knowledge">Es beantwortet Wissensfragen</option><option value="instruction">Es folgt Instruktionen</option><option value="safety">Es verweigert schädliche Anfragen angemessen</option><option value="systems">Es ist kosteneffizient im Einsatz</option></select></label><label class="field">Gewählte Metrik <select class="select" id="evalMetric"><option value="ppl">Perplexity</option><option value="mmlu">MMLU-Accuracy</option><option value="judge">Pairwise Judge Win Rate</option><option value="safety">Safety-Test Recall + False Positives</option><option value="latency">Latenz, Durchsatz und Kosten</option></select></label><button class="button primary" id="evalCheck">Paarung prüfen</button></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" aria-live="polite" id="evalStage"></div></div>`;
      if(id==="grpo") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Rewards einer Promptgruppe</h2>${[0,1,2,3].map((_,i)=>`<label class="field">R${i+1} <input class="grpoReward" data-i="${i}" type="range" min="0" max="1" step="0.05" value="${[0,0.3,0.8,1][i]}"><output id="grpoOut${i}">${[0,0.3,0.8,1][i].toFixed(2)}</output></label>`).join("")}<label class="option"><input id="grpoStd" type="checkbox" checked><span>Durch Gruppen-Std normalisieren</span></label><p class="lab-note">Mean-Centering vergleicht innerhalb des Prompts; Std-Normalisierung ändert zusätzlich die Gruppengewichtung.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="grpoStage"></div></div>`;
      return `<div class="panel">Lab folgt.</div>`;
    }

    function initLab(id){
      if(id==="shapes"){["shapeB","shapeT","shapeD","shapeH"].forEach(x=>document.getElementById(x).oninput=()=>updateShapes(x));updateShapes()}
      if(id==="bpe"){document.getElementById("bpeReset").onclick=resetBpe;document.getElementById("bpeStep").onclick=stepBpe;resetBpe()}
      if(id==="attention"){["attnQuery","attnTemp","attnMask"].forEach(x=>document.getElementById(x).oninput=updateAttention);updateAttention()}
      if(id==="optimizer"){["optStep","optWarmup","optLr","optGrad","optWd"].forEach(x=>document.getElementById(x).oninput=updateOptimizer);updateOptimizer()}
      if(id==="resources"){["resL","resD","resV","resT","resTokens"].forEach(x=>document.getElementById(x).oninput=updateResources);updateResources()}
      if(id==="roofline"){["roofAI","roofBW","roofPeak"].forEach(x=>document.getElementById(x).oninput=updateRoofline);updateRoofline()}
      if(id==="parallelism"){["parMode","parWorld"].forEach(x=>document.getElementById(x).oninput=updateParallelism);updateParallelism()}
      if(id==="scaling"){["scaleHours","scalePflops","scaleRatio"].forEach(x=>document.getElementById(x).oninput=updateScaling);updateScaling()}
      if(id==="data-pipeline"){["dataLang","dataPII","dataQuality","dataDedup","dataThreshold"].forEach(x=>document.getElementById(x).oninput=updateDataPipeline);updateDataPipeline()}
      if(id==="evaluation"){document.getElementById("evalCheck").onclick=updateEvaluation;updateEvaluation(false)}
      if(id==="grpo"){document.querySelectorAll(".grpoReward,#grpoStd").forEach(x=>x.oninput=updateGrpo);updateGrpo()}
    }

    function updateShapes(changed=""){
      const B=+document.getElementById("shapeB").value,T=+document.getElementById("shapeT").value,D=+document.getElementById("shapeD").value,H=+document.getElementById("shapeH").value,d=D/H,tr=value=>esc(localizedUi(value));
      document.getElementById("shapeBOut").value=B;document.getElementById("shapeTOut").value=T;
      const axes=items=>`<div class="shape-axes">${items.map(([symbol,value,label])=>`<span><strong>${esc(symbol)}</strong> = ${esc(value)} · ${tr(label)}</span>`).join("")}</div>`;
      const changeExplanation={
        shapeB:"B zählt unabhängige Sequenzen. Es bleibt deshalb die erste Achse jedes Aktivierungstensors und vergrößert die Elementzahl linear, ohne die Formen der Gewichtsmatrizen zu ändern.",
        shapeT:"T zählt Tokenpositionen. In Q, K und V steht es an dritter Stelle, weil beim Aufteilen zusätzlich H vor die Tokenachse gesetzt wird: [B, H, T, d_head]. In den Scores steht T zweimal – einmal für Queryposition i und einmal für Keyposition j.",
        shapeD:"D ist die Gesamtzahl der Merkmale pro Token. Bei festem H ändert sich damit d_head = D/H; Batch-, Head- und Tokenachsen bleiben unverändert.",
        shapeH:"H ändert die Zahl der Heads und bei festem D entgegengesetzt d_head = D/H. Das Produkt H·d_head bleibt D, deshalb endet der Block wieder mit D Merkmalen pro Token.",
        initial:"Die Reihenfolge der Achsen ist ein Vertrag: X beginnt als [B, T, D]. Beim Aufteilen der letzten Achse wird daraus zunächst [B, T, H, d_head] und durch Transpose [B, H, T, d_head]."
      };
      const currentWhy=changeExplanation[changed]||changeExplanation.initial;
      document.getElementById("shapeQuick").innerHTML=`<strong>${tr("Sofortergebnis")}</strong><span>Q, K, V: [B=${B}, H=${H}, T=${T}, d_head=${d}] = (${B}, ${H}, ${T}, ${d})</span><span>S_raw, A: [B=${B}, H=${H}, T_query=${T}, T_key=${T}] = (${B}, ${H}, ${T}, ${T})</span>${changed?`<span>${tr(currentWhy)}</span>`:""}`;
      document.getElementById("shapeStage").innerHTML=`
        <h2>${tr("Shape Ledger: vom Token zum Attention-Output")}</h2>
        <p class="muted">${tr("Jede Zeile zeigt erst die Bedeutung, dann die aktuelle Shape, danach Achsen und Rechnung. Q, K und V sind drei verschiedene Tensoren mit derselben Shape.")}</p>
        <div class="shape-ledger">
          <article class="shape-step"><span class="shape-step-number">1</span><div><h3>${tr("Eingabe: Token-IDs")}</h3><p>${tr("Die Eingabe enthält für jede Sequenz T ganzzahlige Token-IDs. Eine ID ist nur ein Index in die Embedding-Tabelle und noch kein gelernter Merkmalsvektor.")}</p><strong class="shape-value">token_ids: (${B}, ${T})</strong>${axes([["B",B,"Sequenzen im Batch"],["T",T,"Tokenpositionen je Sequenz"]])}<div class="shape-equation">token_ids ∈ ℕ<sup>B×T</sup></div></div></article>
          <article class="shape-step"><span class="shape-step-number">2</span><div><h3>${tr("Embedding-Lookup erzeugt X")}</h3><p>${tr("Die gelernte Tabelle E_vocab hat V_vocab Zeilen für das Vokabular und D Spalten für Merkmale. Für jede Token-ID wird eine Zeile nachgeschlagen. Das Ergebnis heißt konventionell X: der aktuelle Aktivierungstensor im Residual Stream. V_vocab ist die Vokabulargröße; V bezeichnet später den Value-Tensor.")}</p><strong class="shape-value">X: (${B}, ${T}, ${D})</strong>${axes([["B",B,"Sequenzen"],["T",T,"Tokenpositionen"],["D",D,"Merkmale pro Token"]])}<div class="shape-equation">E_vocab ∈ ℝ<sup>V_vocab×D</sup> · X[b,t,:] = E_vocab[token_ids[b,t],:]</div></div></article>
          <article class="shape-step"><span class="shape-step-number">3</span><div><h3>${tr("Drei Linear Layers erzeugen Q, K und V")}</h3><p>${tr("Dasselbe X läuft durch drei getrennte gelernte Gewichtsmatrizen. Danach wird D in H Heads aufgeteilt und die Head-Achse nach vorn verschoben. Jede der drei Größen Q, K und V besitzt die folgende vierdimensionale Shape.")}</p><strong class="shape-value">Q, K, V: (${B}, ${H}, ${T}, ${d})</strong>${axes([["B",B,"Sequenzen"],["H",H,"Attention Heads"],["T",T,"Tokenpositionen"],["d_head",d,"Merkmale pro Head"]])}<div class="shape-equation">Q = XW_Q · K = XW_K · V = XW_V · (${B},${T},${D}) → reshape (${B},${T},${H},${d}) → transpose (${B},${H},${T},${d})</div></div></article>
          <article class="shape-step"><span class="shape-step-number">4</span><div><h3>${tr("QKᵀ erzeugt rohe Compatibility Scores")}</h3><p>${tr("Für jeden Head vergleicht jede Queryposition i ihren Query-Vektor mit dem Key-Vektor jeder Position j. Der Dot Product ist ein roher Compatibility Score: größer bedeutet im aktuellen Merkmalsraum passender. Erst Maske und Softmax machen daraus Gewichte.")}</p><strong class="shape-value">S_raw = QKᵀ/√d_head: (${B}, ${H}, ${T}, ${T})</strong>${axes([["B",B,"Sequenzen"],["H",H,"Heads"],["T_query",T,"Querypositionen i"],["T_key",T,"Keypositionen j"]])}<div class="shape-equation">Q (${T}×${d}) · Kᵀ (${d}×${T}) → S_raw (${T}×${T}) → S_raw[b,h,i,j] = q<sub>i</sub>·k<sub>j</sub>/√${d}</div></div></article>
          <article class="shape-step"><span class="shape-step-number">5</span><div><h3>${tr("Maske und Softmax erzeugen Attention-Gewichte")}</h3><p>${tr("Eine kausale Maske setzt unerlaubte zukünftige Keys auf −∞. Zusammen mit S_raw entstehen die maskierten Logits L. Softmax läuft für jede Query über die letzte Achse T_key; deshalb summiert sich jede erlaubte Queryzeile auf 1. Die Shape bleibt gleich.")}</p><strong class="shape-value">L, A: (${B}, ${H}, ${T}, ${T})</strong>${axes([["B",B,"Sequenzen"],["H",H,"Heads"],["T_query",T,"Querypositionen"],["T_key",T,"Gewichte über Keys"]])}<div class="shape-equation">L = S_raw + M → A = softmax(L, axis = T_key) → Σ<sub>j</sub>A[b,h,i,j] = 1</div></div></article>
          <article class="shape-step"><span class="shape-step-number">6</span><div><h3>${tr("Values mischen, Heads verbinden, Output abbilden")}</h3><p>${tr("A bildet pro Query eine gewichtete Summe der Value-Vektoren. Z liegt noch als [B, H, T, d_head] vor: Vor dem Verbinden werden H und T zurückgetauscht, dann werden H·d_head Merkmale zu D zusammengefasst und durch W_O gemischt.")}</p><strong class="shape-value">Y: (${B}, ${T}, ${D})</strong>${axes([["B",B,"Sequenzen"],["T",T,"Tokenpositionen"],["D",D,"verbundene Merkmale"]])}<div class="shape-equation">Z = AV: (${B},${H},${T},${d}) → transpose (${B},${T},${H},${d}) → reshape/concat (${B},${T},${D}) → Y = Concat(Z)W_O</div></div></article>
        </div>
        <div class="calculation-ledger" aria-label="${tr("Aktuelle Kurzrechnung")}"><div class="calculation-row"><span>${tr("Head-Breite")}</span><strong>d_head = D/H = ${D}/${H} = ${d}</strong></div><div class="calculation-row"><span>${tr("Score-Kontraktion pro Head")}</span><strong>(${T}×${d}) · (${d}×${T}) = (${T}×${T})</strong></div><div class="calculation-row"><span>${tr("Score-Elemente insgesamt")}</span><strong>B·H·T² = ${B}·${H}·${T}² = ${(B*H*T*T).toLocaleString(localeCode())}</strong></div></div>
        <div class="shape-change"><strong>${tr(changed?"Warum änderte sich genau das?":"Warum stehen die Achsen an diesen Stellen?")}</strong><span>${tr(currentWhy)}</span></div>
        <p class="lab-note">${tr("Merksatz: Aktivierungsshapes hängen von B und T ab; Shapes gelernter Gewichtsmatrizen wie W_Q ∈ ℝ^(D×D) nicht. Deshalb ändert längerer Kontext den Rechen- und Aktivierungsspeicher, aber nicht die Parameterzahl.")}</p>`;
    }

    function resetBpe(){const text=document.getElementById("bpeText").value.trim();bpeLabState={words:text.split(/\s+/).filter(Boolean).map(w=>["▁",...w]),merges:[]};renderBpe()}
    function bpePairs(){const counts=new Map();bpeLabState.words.forEach(w=>{for(let i=0;i<w.length-1;i++){const k=w[i]+"¦"+w[i+1];counts.set(k,(counts.get(k)||0)+1)}});return [...counts.entries()].sort((a,b)=>b[1]-a[1]||currentCollator.compare(a[0],b[0]))}
    function stepBpe(){const pair=bpePairs()[0];if(!pair){toast("Keine Paare mehr");return;}const [a,b]=pair[0].split("¦");bpeLabState.words=bpeLabState.words.map(w=>{const out=[];for(let i=0;i<w.length;i++){if(i<w.length-1&&w[i]===a&&w[i+1]===b){out.push(a+b);i++}else out.push(w[i])}return out});bpeLabState.merges.push([a,b,pair[1]]);renderBpe()}

      const lang=document.getElementById("dataLang").checked,pii=document.getElementById("dataPII").checked,quality=document.getElementById("dataQuality").checked,dedup=document.getElementById("dataDedup").checked,th=+document.getElementById("dataThreshold").value,tr=value=>esc(localizedUi(value));
      document.getElementById("dataThresholdOut").value=th.toFixed(2);
      const seen=new Set(),rows=dataDocs.map(d=>{const reasons=[];if(lang&&d.lang!=="en")reasons.push("Sprache");if(quality&&d.q<th)reasons.push("Qualität");if(dedup&&seen.has(d.dup))reasons.push("Near-Dup");seen.add(d.dup);const keep=!reasons.length;return{...d,reasons,keep,masked:pii&&d.pii}}),kept=rows.filter(x=>x.keep).length,active=[lang?"language_ok":"",quality?`q(d) ≥ ${th.toFixed(2)}`:"",dedup?"not_duplicate":""].filter(Boolean).join(" ∧ ")||"true";
      document.getElementById("dataStage").innerHTML=`<h2>${tr(`${kept}/${rows.length} Dokumente behalten`)}</h2><div class="calculation-ledger"><div class="calculation-row"><span>${tr("Entscheidungsregel")}</span><strong>keep(d) = ${active}</strong></div><div class="calculation-row"><span>${tr("Aktuelles Ergebnis")}</span><strong>${kept}/${rows.length} = ${(kept/rows.length*100).toFixed(1)}% ${tr("Behalterate")}</strong></div></div><p class="lab-note">${tr("PII-Maskierung ist hier eine Transformation und kein Ausschlussfilter: Sie verändert markierte Inhalte, entscheidet aber nicht über keep(d).")}</p><div style="display:grid;gap:.5rem">${rows.map(d=>`<div class="metric" style="border-left:4px solid ${d.keep?"var(--success)":"var(--danger)"}"><strong style="font-size:1rem">${d.keep?"✓":"×"} ${tr(d.name)}</strong><span>lang=${d.lang} · quality=${d.q.toFixed(2)} · ${d.masked?tr("PII maskiert"):d.pii?tr("PII sichtbar"):tr("keine PII")} ${d.reasons.length?`${tr("· verworfen:")} ${d.reasons.map(tr).join(", ")}`:""}</span></div>`).join("")}</div><p class="lab-note">${tr("Beobachte den möglichen False Positive „Deutscher Fachartikel“ und den kontextabhängigen Grenzfall „Counter-Speech-Zitat“.")}</p>`;
    }

    function updateEvaluation(show=true){const claim=document.getElementById("evalClaim").value,metric=document.getElementById("evalMetric").value,map={likelihood:"ppl",knowledge:"mmlu",instruction:"judge",safety:"safety",systems:"latency"},good=map[claim]===metric,notes={likelihood:"Perplexity braucht gleichen Tokenizer, Kontext und Korpus.",knowledge:"Accuracy braucht Prompt-/Scoringregeln und Kontaminationsprüfung.",instruction:"Pairwise Judges brauchen Judge-Bias-, Kosten- und Einzelfallanalyse.",safety:"Berichte sowohl gefährliche Durchlässe als auch Überverweigerung.",systems:"Latenz allein reicht nicht; Throughput, Batch, Hardware und Kosten gehören dazu."},tr=value=>esc(localizedUi(value)),heading=show?(good?"Plausible Primärmetrik":"Metrik passt nicht zur Behauptung"):"Design vor dem Score",lead=show?(good?"Gute Richtung. ":"Wähle eine Metrik, die das behauptete Verhalten direkt operationalisiert. "):"Wähle zuerst Behauptung und Messregel – erst danach darf ein Score Bedeutung bekommen. ";document.getElementById("evalStage").innerHTML=`<h2>${tr(heading)}</h2><div class="callout ${good?"accent":"warning"}">${tr(lead)}${tr(notes[claim])}</div><h3 style="margin-top:1rem">${tr("Immer zusätzlich prüfen")}</h3><ul class="check-list"><li>${tr("Einzelinstanzen und Failure Modes")}</li><li>${tr("Prompting, Sampling und Scorer")}</li><li>${tr("Kontamination, Streuung und Kosten")}</li></ul>`;}

    function updateGrpo(){const rewards=[...document.querySelectorAll(".grpoReward")].map((x,i)=>{const v=+x.value;document.getElementById("grpoOut"+i).value=v.toFixed(2);return v}),mean=rewards.reduce((a,b)=>a+b,0)/rewards.length,variance=rewards.reduce((s,x)=>s+(x-mean)**2,0)/rewards.length,std=Math.sqrt(variance),normStd=document.getElementById("grpoStd").checked,adv=rewards.map(r=>(r-mean)/(normStd?std+1e-8:1)),tr=value=>esc(localizedUi(value)),rewardSum=rewards.map(value=>value.toFixed(2)).join(" + "),signal=std<1e-7?tr("Alle Rewards sind gleich: Nach Zentrierung gibt es kein relatives Lernsignal."):`${tr("Positive Advantages erhöhen im idealisierten Gradient-Ascent die Logwahrscheinlichkeit; negative senken sie.")} ${tr(normStd?"Durch σ teilen macht die Skala gruppenabhängig.":"Ohne σ bleibt die Rewardskala erhalten.")}`;document.getElementById("grpoStage").innerHTML=`<h2>${tr("Gruppenrelatives Lernsignal")}</h2><div class="calculation-ledger"><div class="calculation-row"><span>${tr("Gruppenmittel")}</span><strong>μ = (${rewardSum})/${rewards.length} = ${mean.toFixed(3)}</strong></div><div class="calculation-row"><span>${tr("Streuung")}</span><strong>σ = √[(1/${rewards.length})Σ(R_i−μ)²] = ${std.toFixed(3)}</strong></div><div class="calculation-row"><span>${tr("Advantage je Antwort")}</span><strong>A_i = (R_i−μ)${normStd?"/(σ+ε)":""}</strong></div></div><div class="bar-list" style="margin-top:1rem">${adv.map((a,i)=>`<div class="bar-row"><span>${tr(`Antwort ${i+1}`)}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.abs(a)/(Math.max(...adv.map(Math.abs),1e-8))*100)}%;background:${a>=0?"var(--success)":"var(--danger)"}"></div></div><strong>${a.toFixed(2)}</strong></div>`).join("")}</div><div class="callout ${std<1e-7?"warning":"accent"}" style="margin-top:1rem">${signal}</div>`;}

    function openModal(title,eyebrow,body){const backdrop=document.getElementById("modalBackdrop"),opening=backdrop.hidden;if(opening)modalInvoker=document.activeElement;document.getElementById("modalTitle").textContent=title;document.getElementById("modalEyebrow").textContent=eyebrow;document.getElementById("modalBody").innerHTML=body;backdrop.hidden=false;document.getElementById("appShell").inert=true;document.body.style.overflow="hidden";if(opening)requestAnimationFrame(()=>document.getElementById("modalClose").focus())}
    function closeModal(){const backdrop=document.getElementById("modalBackdrop");if(backdrop.hidden)return;backdrop.hidden=true;document.getElementById("appShell").inert=false;document.body.style.overflow="";const target=modalInvoker?.isConnected&&!modalInvoker.closest("[inert]")?modalInvoker:document.getElementById("mainContent");modalInvoker=null;requestAnimationFrame(()=>target.focus())}
    function openDiagnostic(){openModal("Grundlagen-Diagnose","12 Minuten · ohne Hilfsmittel",`<p class="muted">Beantworte aus deinem aktuellen Verständnis. Das Ergebnis priorisiert den Lernpfad, benotet dich aber nicht.</p><form id="diagnosticForm">${DIAGNOSTIC.map((q,i)=>quizQuestionHtml(q,i,"diag")).join("")}<button class="button primary" type="submit" style="margin-top:1rem">Auswerten</button></form><div id="diagnosticResult" role="status" aria-live="polite"></div>`);document.getElementById("diagnosticForm").onsubmit=e=>{e.preventDefault();const groups={};DIAGNOSTIC.forEach((q,i)=>{groups[q.area]||={n:0,ok:0};groups[q.area].n++;const chosen=document.querySelector(`input[name="diag-${i}"]:checked`);if(chosen&&+chosen.value===q.a)groups[q.area].ok++});if(document.querySelectorAll('#diagnosticForm input[type="radio"]:checked').length<DIAGNOSTIC.length){toast("Bitte beantworte alle Fragen.");return;}const scores=Object.fromEntries(Object.entries(groups).map(([k,v])=>[k,Math.round(v.ok/v.n*100)]));user.diagnostic={scores,at:new Date().toISOString()};saveUser(true);document.getElementById("diagnosticResult").innerHTML=`<div class="callout accent" style="margin-top:1rem"><strong>Gespeichert.</strong> Niedrigste Bereiche: ${Object.entries(scores).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([k,v])=>`${k} ${v}%`).join(" · ")}. Schließe den Dialog für deinen aktualisierten Fokus.</div>`;renderDashboard()}; }

    let flashIndex=0;
    function openFlashcards(){flashIndex=0;renderFlashcardModal()}
    function renderFlashcardModal(){const cards=[...QUIZ.map(q=>({front:q.q,back:q.opts[q.a]+" — "+q.why})),...FORMULAS.slice(0,15).map(f=>({front:`Erkläre ${f.title} ohne Vorlage.`,back:`${strip(f.expr)} — ${f.intuition}`}))],card=cards[flashIndex%cards.length];openModal("Karteikarten","Aktives Abrufen",`<article class="panel flashcard" aria-labelledby="flashQuestion"><div class="flashcard-inner"><p class="eyebrow">Karte ${flashIndex+1} / ${cards.length}</p><h3 id="flashQuestion">${esc(card.front)}</h3><p class="answer" id="flashAnswer" hidden>${formulaText(card.back)}</p><button class="button" id="flashReveal" aria-controls="flashAnswer" aria-expanded="false">Antwort anzeigen</button></div></article><div class="card-actions" style="justify-content:center;margin-top:1rem"><button class="button" id="flashPrev" ${flashIndex===0?"disabled":""}>Zurück</button><button class="button primary" id="flashNext">Nächste Karte</button></div>`);document.getElementById("flashReveal").onclick=event=>{document.getElementById("flashAnswer").hidden=false;event.currentTarget.setAttribute("aria-expanded","true");event.currentTarget.textContent="Antwort sichtbar";event.currentTarget.disabled=true};document.getElementById("flashPrev").onclick=()=>{flashIndex=Math.max(0,flashIndex-1);renderFlashcardModal()};document.getElementById("flashNext").onclick=()=>{flashIndex=(flashIndex+1)%cards.length;renderFlashcardModal()};requestAnimationFrame(()=>document.getElementById("flashReveal")?.focus())}

    function exportProgress(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:user},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=currentLanguage==="en"?"cs336-progress.json":"cs336-lernfortschritt.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Fortschritt exportiert")}
    function importProgress(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);user=normalizeUser(parsed.data||parsed);saveUser(true);applyTheme();renderCurrent();toast("Fortschritt importiert")}catch{toast("Ungültige Fortschrittsdatei")}};reader.readAsText(file)}

    function buildSearchIndex(){return [
      ...MODULES.map(x=>({type:"Modul",title:x.n+" · "+x.title,desc:x.description,id:x.id,kind:"module",text:[x.title,x.description,x.outcome,x.stage].join(" ")})),
      ...CONCEPTS.map(x=>({type:"Konzept",title:x.title,desc:x.summary,id:x.id,kind:"concept",text:[x.title,x.summary,x.mental,x.details,x.pitfalls,x.checks,x.answers,x.formulas].flat().join(" ")})),
      ...FORMULAS.map(x=>({type:"Formel",title:x.title,desc:strip(x.expr),id:x.id,kind:"formula",text:Object.values(x).flat(3).join(" ")})),
      ...SYMBOLS.map(x=>({type:"Symbol",title:x.symbol+" · "+x.meaning,desc:x.context+" — "+x.dimension,id:x.id,kind:"symbol",text:Object.values(x).join(" ")})),
      ...ASSIGNMENTS.map(x=>({type:"Assignment",title:x.label+" · "+x.title,desc:x.goal,id:x.id,kind:"assignment",text:Object.values(x).flat(3).join(" ")})),
      ...LABS.map(x=>({type:"Lab",title:x.title,desc:x.desc,id:x.id,kind:"lab",text:Object.values(x).flat(3).join(" ")})),
      ...GLOSSARY.map(x=>({type:"Glossar",title:x.term,desc:x.def,id:x.id,kind:"glossary",text:x.term+" "+x.def+" "+x.detail+" "+x.cat}))
    ];}
    let SEARCH_INDEX=buildSearchIndex();
    function searchAll(query){const q=norm(query);if(q.length<2)return[];return SEARCH_INDEX.map(item=>{const title=norm(item.title),text=norm(item.text);let score=0;if(title===q)score=100;if(title.startsWith(q))score=Math.max(score,70);if(title.includes(q))score=Math.max(score,50);if(text.includes(q))score=Math.max(score,20);return{...item,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||currentCollator.compare(a.title,b.title)).slice(0,14)}
    function setSearchOpen(open){const input=document.getElementById("globalSearch"),box=document.getElementById("searchResults");box.hidden=!open;input.setAttribute("aria-expanded",String(open));if(!open){activeSearchIndex=-1;input.removeAttribute("aria-activedescendant");box.querySelectorAll('[role="option"]').forEach(option=>{option.classList.remove("is-active");option.setAttribute("aria-selected","false")})}}
    function setActiveSearchResult(index){if(!searchItems.length)return;activeSearchIndex=(index+searchItems.length)%searchItems.length;const input=document.getElementById("globalSearch"),options=[...document.querySelectorAll("#searchResults [role=option]")];options.forEach((option,i)=>{const active=i===activeSearchIndex;option.classList.toggle("is-active",active);option.setAttribute("aria-selected",String(active))});const active=options[activeSearchIndex];if(active){input.setAttribute("aria-activedescendant",active.id);active.scrollIntoView({block:"nearest"})}}
    function renderSearchResults(){const input=document.getElementById("globalSearch"),box=document.getElementById("searchResults"),status=document.getElementById("searchStatus");searchItems=searchAll(input.value);activeSearchIndex=-1;input.removeAttribute("aria-activedescendant");if(input.value.trim().length<2){box.innerHTML="";status.textContent="";setSearchOpen(false);return}box.innerHTML=searchItems.length?searchItems.map((item,i)=>`<div class="search-result" id="search-option-${i}" role="option" aria-selected="false" data-search-i="${i}"><span class="result-type">${item.type}</span><span class="result-copy"><strong>${esc(item.title)}</strong><small>${formulaText(item.desc)}</small></span></div>`).join(""):`<div class="search-empty" role="option" aria-disabled="true" aria-selected="false"><strong>Kein Treffer</strong><p class="muted small">Probiere englische Begriffe, Unicode-Symbole oder Codebezeichner wie d_model.</p></div>`;status.textContent=searchItems.length?`${searchItems.length} Suchergebnisse verfügbar. Mit Pfeiltasten auswählen.`:"Keine Suchergebnisse.";setSearchOpen(true);box.querySelectorAll("[data-search-i]").forEach(option=>{option.addEventListener("mousedown",event=>event.preventDefault());option.onclick=()=>openSearchItem(searchItems[+option.dataset.searchI])})}
    function handleSearchKeydown(event){const box=document.getElementById("searchResults");if(event.key==="ArrowDown"||event.key==="ArrowUp"){event.preventDefault();if(box.hidden)renderSearchResults();if(searchItems.length){const direction=event.key==="ArrowDown"?1:-1,next=activeSearchIndex<0?(direction>0?0:searchItems.length-1):activeSearchIndex+direction;setActiveSearchResult(next)}return}if(event.key==="Enter"&&!box.hidden&&searchItems.length){event.preventDefault();openSearchItem(searchItems[activeSearchIndex>=0?activeSearchIndex:0]);return}if(event.key==="Escape"&&!box.hidden){event.preventDefault();setSearchOpen(false)}}
    function openSearchItem(item){setSearchOpen(false);document.getElementById("globalSearch").value="";document.getElementById("searchStatus").textContent="";if(["module","concept","formula","assignment","lab"].includes(item.kind)){navigate("detail",{type:item.kind,id:item.id});return}if(item.kind==="symbol"){appState.formulaMode="symbols";appState.formulaQuery=item.title.split(" · ")[0];navigate("formulas");return}if(item.kind==="glossary"){appState.glossaryQuery=item.title;navigate("glossary")}}

    function applyTheme(){document.documentElement.dataset.theme=user.theme;document.querySelector('meta[name="theme-color"]').content=user.theme==="dark"?"#09111f":"#f5f7fb";document.getElementById("themeButton").textContent=user.theme==="dark"?"☼":"☾";document.getElementById("themeButton").setAttribute("aria-label",localizedUi(user.theme==="dark"?"Helles Farbschema":"Dunkles Farbschema"))}
    function parseHash(){const route=routeFromLocation();appState.view=route.view;appState.detail=route.detail}
    function init(){
      parseHash();applyStaticLanguage();startI18nObserver();initNav();applyTheme();localizeSubtree(document.querySelector(".topbar"));
      const syncMobileNav=()=>setMobileNav(false,true);if(mobileNavMedia.addEventListener)mobileNavMedia.addEventListener("change",syncMobileNav);else mobileNavMedia.addListener(syncMobileNav);
      document.getElementById("themeButton").onclick=()=>{user.theme=user.theme==="dark"?"light":"dark";saveUser();applyTheme()};
      document.getElementById("languageButton").onclick=()=>setLanguage(currentLanguage==="en"?"de":"en");
      document.getElementById("notesQuickButton").onclick=()=>navigate("notes");
      document.getElementById("accountButton").onclick=openAccount;
      document.getElementById("menuButton").onclick=()=>setMobileNav(!document.getElementById("sidebar").classList.contains("is-open"));
      document.getElementById("sidebarCloseButton").onclick=()=>setMobileNav(false);
      document.getElementById("navScrim").onclick=()=>setMobileNav(false);
      document.getElementById("modalClose").onclick=closeModal;document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
      document.addEventListener("keydown",e=>{const backdrop=document.getElementById("modalBackdrop"),sidebar=document.getElementById("sidebar");if(!backdrop.hidden){if(e.key==="Escape"){e.preventDefault();closeModal()}else trapFocus(e,backdrop.querySelector(".modal"));return}if(sidebar.classList.contains("is-open")){if(e.key==="Escape"){e.preventDefault();setMobileNav(false)}else trapFocus(e,sidebar);return}if(e.key==="Escape")setSearchOpen(false)});
      document.getElementById("globalSearch").addEventListener("input",renderSearchResults);document.getElementById("globalSearch").addEventListener("keydown",handleSearchKeydown);document.getElementById("globalSearch").addEventListener("blur",()=>requestAnimationFrame(()=>setSearchOpen(false)));
      document.addEventListener("click",e=>{const source=e.target.closest("[data-source-id]");if(source){e.preventDefault();void openSource(source.dataset.sourceId,source.dataset.sourcePage||"")}});
      document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))setSearchOpen(false)});
      document.querySelector(".skip-link").addEventListener("click",e=>{e.preventDefault();document.getElementById("mainContent").focus()});
      window.addEventListener("popstate",handleHistoryNavigation);window.addEventListener("hashchange",handleHistoryNavigation);
      window.addEventListener("online",()=>{setCloudStatus(cloud.session?"syncing":cloud.configured?"signedout":"local");scheduleCloudSync(100)});
      window.addEventListener("offline",()=>setCloudStatus("offline"));
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){const notes=document.getElementById("notesArea");if(notes&&user.notes!==notes.value){user.notes=notes.value;saveUser(true)}}else void refreshCloudState()});
      window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event});
      navigate(appState.view,appState.detail,{historyMode:"replace",focusMain:false});registerPwa();void initCloud();
    }
    init();
  </script>
