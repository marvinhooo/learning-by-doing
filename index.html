        details:["Ein Sprachmodell verarbeitet meist X ∈ ℝ^(B×T×D). Ein Linear-Layer wirkt auf die letzte Achse und lässt B und T stehen.","Bei <code>einsum</code> benennen Buchstaben Achsen. Buchstaben, die im Output fehlen, werden summiert; neue oder falsch zugeordnete Buchstaben verändern die Semantik."],
        pitfalls:["B und T unbemerkt vertauschen","reshape statt semantisch korrektem rearrange","Broadcasting als zufällige Reparatur"], checks:["Welche Form hat Q nach Projektion und Aufteilung in H Köpfe?","Welche Achse wird bei Softmax in Attention normalisiert?"], formulas:["matmul","attention"], sources:["l02","a1"] },
      { id:"matmul", module:"foundations", title:"Matrixmultiplikation & Batch-Matmul", level:"Basis", summary:"Matrixmultiplikation kombiniert Features; sie ist nicht elementweise und kontrahiert genau eine gemeinsame Achse.",
        mental:"A @ B fragt: Wie stark passt jede Zeile von A zu jeder Spalte von B? Die innere Dimension verschwindet, die äußeren bleiben.",
        details:["Für A ∈ ℝ^(m×k) und B ∈ ℝ^(k×n) liegt C = AB in ℝ^(m×n).","Batch-Achsen werden nicht kontrahiert. In Attention erzeugt QKᵀ aus T Query- und T Key-Positionen eine T×T-Kompatibilitätsmatrix pro Batch und Kopf."],
        pitfalls:["Hadamard-Produkt mit Matrixprodukt verwechseln","Transpose nur nach Gefühl setzen","FLOPs zählen, ohne Dimensionen einzusetzen"], checks:["Warum ist QKᵀ quadratisch in T?","Wie viele Multiply-Adds hat eine m×k mit k×n Multiplikation?"], formulas:["matmul","linear-params"], sources:["l02","a1"] },
      { id:"probability", module:"foundations", title:"Wahrscheinlichkeit, Erwartungswert & Varianz", level:"Basis", summary:"Modelle liefern Verteilungen; Training und RL optimieren Erwartungswerte mit verrauschten Stichproben.",
        mental:"Erwartungswert ist der langfristige Mittelwert, Varianz die Streuung eines Schätzers. Ein unverzerrter Schätzer kann trotzdem so stark rauschen, dass Lernen langsam wird.",
        details:["Softmax wandelt Logits in eine kategoriale Verteilung. Sampling zieht ein Token aus dieser Verteilung.","In Policy Gradients ändert eine Baseline den Erwartungswert des Gradienten nicht, kann aber seine Varianz stark senken."],
        pitfalls:["Wahrscheinlichkeit und Logit gleichsetzen","niedrige Varianz mit kleinem Fehler verwechseln","Korrelation kausal lesen"], checks:["Warum darf eine zustandsabhängige Baseline abgezogen werden?","Was bedeutet Varianz eines Gradienten-Schätzers praktisch?"], formulas:["mean-var","softmax","advantage"], sources:["a1","l17"] },
      { id:"logs", module:"foundations", title:"Logarithmen, Log-Sum-Exp & numerische Stabilität", level:"Basis", summary:"Logs machen Produkte zu Summen und extrem kleine Wahrscheinlichkeiten numerisch handhabbar.",
        mental:"Ein negativer Logarithmus bestraft kleine Zielwahrscheinlichkeiten stark. Subtrahiere vor exp stets das Maximum: Die Verteilung bleibt gleich, Overflow verschwindet.",
        details:["Sequenzwahrscheinlichkeiten sind Produkte vieler bedingter Wahrscheinlichkeiten. Im Lograum werden daraus addierbare Log-Wahrscheinlichkeiten.","Log-Sum-Exp ist die stabile Brücke zwischen Logits und normalisierten Log-Wahrscheinlichkeiten."],
        pitfalls:["log(0) nicht absichern","Softmax vor Cross-Entropy materialisieren","Perplexity und Loss linear vergleichen"], checks:["Warum ändert das Subtrahieren eines konstanten Logit-Maximums Softmax nicht?","Warum addieren sich Token-NLLs?"], formulas:["logsumexp","cross-entropy","perplexity"], sources:["a1","a2"] },
      { id:"gradients", module:"foundations", title:"Gradient, Kettenregel & Autograd", level:"Basis", summary:"Der Gradient zeigt die lokale Änderungsrichtung des Loss; Backpropagation ist die effiziente Kettenregel auf einem Graphen.",
        mental:"Jede Operation speichert genug Kontext für ihren lokalen Rückwärtsweg. Der Upstream-Gradient wird mit der lokalen Ableitung verkettet.",
        details:["Der Gradient hat dieselbe Form wie der Parameter. Bei gemeinsam genutzten Pfaden addieren sich Beiträge.","Aktivierungen werden für Backward gespeichert. Activation Checkpointing tauscht Speicher gegen erneute Vorwärtsrechnung."],
        pitfalls:["Gradienten zwischen Steps nicht nullen","in-place Änderungen an benötigten Aktivierungen","Skalarableitung auf Vektoren übertragen, ohne Jacobian-Vektor-Produkt zu verstehen"], checks:["Warum werden Gradienten an Verzweigungen addiert?","Welche Daten muss Backward für eine Matrixmultiplikation kennen?"], formulas:["chain-rule","gradient-clip"], sources:["l02","a1","a2"] },
      { id:"resource-accounting", module:"foundations", title:"Ressourcenrechnung: Parameter, Bytes & FLOPs", level:"Kern", summary:"Grobe Rechnungen entscheiden, ob ein Experiment überhaupt in Speicher und Zeit passt.",
        mental:"Trenne Modellzustand, Optimizerzustand, Gradienten und Aktivierungen. Trenne theoretische FLOPs von tatsächlich erreichter Hardwareleistung.",
        details:["Ein Dense Transformer hat grob 12Ld² Nicht-Embedding-Parameter. Training kostet näherungsweise 6ND FLOPs für N Parameter und D Tokens.","BF16 reduziert viele Tensorbytes, AdamW hält aber oft FP32-Momente und gegebenenfalls Mastergewichte."],
        pitfalls:["GB und GiB mischen","nur Gewichte zählen","Peak-TFLOP/s als dauerhaft erreichbare Leistung annehmen"], checks:["Welche vier Speicherblöcke dominieren AdamW-Training?","Wie ändert verdoppelte Sequenzlänge Attention-Aktivierungen?"], formulas:["transformer-params","training-flops","mfu"], sources:["l02","a1","a2"] },
      { id:"unicode", module:"tokenization", title:"Unicode, Codepoints & UTF-8", level:"Basis", summary:"Text ist nicht gleich Bytes. Unicode definiert Zeichen; UTF-8 kodiert Codepoints in variable Bytefolgen.",
        mental:"Gehe immer über drei Ebenen: sichtbares Graphem → Unicode-Codepoint(s) → Bytes. Ein sichtbares Zeichen kann mehrere Codepoints haben.",
        details:["Byte-level Tokenisierung garantiert, dass jede Eingabe darstellbar ist. Häufige Bytefolgen werden später zu Subword-Tokens zusammengeführt.","Normalisierung kann visuell ähnliche Texte vereinheitlichen, verändert aber die exakte Bytefolge und muss bewusst entschieden werden."],
        pitfalls:["Python-Stringlänge als Bytezahl lesen","Codepoint und sichtbares Zeichen gleichsetzen","mitten in einer UTF-8-Folge dekodieren"], checks:["Warum ist ein Byte-Vokabular vollständig?","Weshalb kann len(text) von len(text.encode('utf-8')) abweichen?"], formulas:[], sources:["l01","a1"] },
      { id:"bpe", module:"tokenization", title:"BPE (Byte-Pair Encoding)", level:"Kern", summary:"BPE lernt ein Vokabular, indem das häufigste benachbarte Tokenpaar iterativ verschmolzen wird.",
        mental:"Starte fein genug, dass alles kodierbar ist. Jede Merge-Regel komprimiert ein häufiges Muster; die geordnete Regelliste ist Teil des Modells.",
        details:["Training zählt Paare über eine Wort- oder Pretoken-Gewichtung, wählt deterministisch ein Paar und aktualisiert betroffene Nachbarschaften.","Encoding wendet die gelernte Rangfolge an. Effiziente Implementierungen vermeiden, nach jedem Merge den gesamten Korpus neu zu zählen."],
        pitfalls:["Sondertokens als normale Zeichen splitten","Ties nicht deterministisch lösen","Merge-Häufigkeit nach lokalen Änderungen falsch aktualisieren"], checks:["Warum genügt eine ungeordnete Menge von Merges nicht?","Welche Paare ändern sich nach dem Verschmelzen von A B?"], formulas:[], sources:["l01","a1"] },
      { id:"tokenizer-tradeoffs", module:"tokenization", title:"Tokenizer-Trade-offs", level:"Kern", summary:"Vokabulargröße, Sequenzlänge, Sprachabdeckung und Rechenkosten hängen direkt zusammen.",
        mental:"Größeres Vokabular verkürzt Sequenzen, vergrößert aber Embedding und Output-Projektion. Seltene Sprachen dürfen nicht durch schlechte Segmentierung unsichtbar teuer werden.",
        details:["Tokenfertilität bezeichnet grob, wie viele Tokens pro Textmenge benötigt werden. Sie beeinflusst Kontextfenster und Kosten.","Tokenizer-Evaluation braucht reale Stichproben: Kompression, Roundtrip, Sondertokens und Verhalten auf ungesehenen Schriften."],
        pitfalls:["nur englische Beispiele prüfen","Kompressionsrate ohne Embeddingkosten optimieren","unkorrektes Decoding bei beliebigen Bytes ignorieren"], checks:["Warum ist ein sehr großes Vokabular nicht kostenlos?","Welche Tests sichern encode/decode-Roundtrip?"], formulas:["embedding-params"], sources:["a1"] },
      { id:"lm-objective", module:"transformer", title:"Autoregressives Sprachmodell", level:"Kern", summary:"Das Modell faktorisiert eine Sequenz in bedingte Wahrscheinlichkeiten für jeweils das nächste Token.",
        mental:"Bei Position t darf das Modell nur x≤t sehen und sagt x(t+1) voraus. Training parallelisiert alle Positionen, obwohl Generierung sequenziell ist.",
        details:["Teacher Forcing nutzt echte vorherige Tokens als Kontext. Der Loss wird über verschobene Input-/Target-Sequenzen berechnet.","Die gemeinsame Sequenzwahrscheinlichkeit ist das Produkt der bedingten Tokenwahrscheinlichkeiten; im Lograum die Summe."],
        pitfalls:["Target nicht um eins verschieben","zukünftige Tokens durch falsche Maske leaken","Training und freie Generierung als identische Verteilung behandeln"], checks:["Warum ist Training über T Positionen parallel möglich?","Warum bleibt Decoding ohne spezielle Verfahren sequenziell?"], formulas:["autoregressive","cross-entropy"], sources:["a1"] },
      { id:"embeddings", module:"transformer", title:"Embeddings & Output-Logits", level:"Kern", summary:"Ein Embedding ist eine lernbare Lookup-Tabelle; der LM-Head projiziert Zustände auf Vokabular-Logits.",
        mental:"Token-ID → Zeile in E. Am Ende fragt ein Skalarprodukt mit jeder Vokabularzeile, welches Token zum Zustand passt.",
        details:["Input-Embedding E liegt in ℝ^(V×D). Weight Tying verwendet dieselbe Matrix transponiert für den Output-Head und spart Parameter.","Logits sind unnormalisierte Scores. Erst Softmax erzeugt Wahrscheinlichkeiten."],
        pitfalls:["IDs als kontinuierliche Zahlen behandeln","Logits als Wahrscheinlichkeiten interpretieren","Vokabulargröße bei Parameterrechnung vergessen"], checks:["Welche Form haben Embeddingmatrix und Logits?","Was spart Weight Tying?"], formulas:["embedding-params","softmax"], sources:["a1","l03"] },
      { id:"rmsnorm", module:"transformer", title:"RMSNorm & Residualpfad", level:"Kern", summary:"Root Mean Square Normalization skaliert Aktivierungen über ihre quadratische mittlere Größe, ohne den Mittelwert abzuziehen.",
        mental:"Der Residualpfad ist die Datenautobahn. Pre-Norm normalisiert nur den Seitenzweig vor Attention oder MLP und hält die Hauptbahn direkt.",
        details:["RMSNorm besitzt pro Feature einen lernbaren Scale. Ein ε verhindert Division durch null.","Pre-Norm verbessert in modernen tiefen LMs meist die Optimierungsstabilität gegenüber klassischem Post-Norm."],
        pitfalls:["über Batch oder Sequenz normalisieren","ε außerhalb der Wurzel anders behandeln","Residualaddition bei ungleichen Formen"], checks:["Über welche Achse normalisiert RMSNorm?","Warum bleibt der Pre-Norm-Residualpfad unverändert?"], formulas:["rmsnorm","residual"], sources:["a1","l03"] },
      { id:"swiglu", module:"transformer", title:"SwiGLU Feed-Forward-Netz", level:"Kern", summary:"SwiGLU nutzt einen lernbaren Gate-Zweig und einen Value-Zweig im positionsweisen MLP.",
        mental:"Für jedes Token separat entscheidet das Gate, welche erweiterten Features passieren. Die Sequenzpositionen mischen sich hier nicht.",
        details:["Zwei Projektionen gehen hoch in die Hidden-Dimension, werden nach SiLU und Multiplikation gegatet und anschließend zurückprojiziert.","Die Hidden-Breite wird häufig so gewählt, dass der Parameterumfang zu einem klassischen 4D-MLP passt."],
        pitfalls:["über T statt D projizieren","SiLU und GLU-Komponenten vertauschen","Parametervergleich ohne dritte Matrix"], checks:["Welche Operation mischt in einem Transformer Positionen, welche Features?","Warum hat SwiGLU drei Gewichtsmatrizen?"], formulas:["swiglu"], sources:["a1","l03"] },
      { id:"rope", module:"transformer", title:"RoPE (Rotary Position Embedding)", level:"Kern", summary:"RoPE rotiert Query- und Key-Paare abhängig von ihrer Position, sodass Dot-Products relative Abstände tragen.",
        mental:"Position wird nicht addiert, sondern als Winkel auf 2D-Featurepaare angewendet. Die Differenz der Winkel hängt von i−j ab.",
        details:["Jede Frequenz rotiert ein anderes Featurepaar. RoPE wird auf Q und K, nicht auf V, angewandt.","Caching von Sinus/Cosinus und korrekte Broadcasting-Achsen sind für Effizienz und Formen wichtig."],
        pitfalls:["ungerade Head-Dimension","Q und K mit unterschiedlichen Konventionen rotieren","absolute Position mit Token-ID verwechseln"], checks:["Warum hängt das rotierte Q·K von relativer Position ab?","Welche Tensorachsen teilen Sinus/Cosinus?"], formulas:["rope"], sources:["a1","l03"] },
      { id:"attention", module:"transformer", title:"Scaled Dot-Product Attention", level:"Kern", summary:"Attention bildet aus Query-Key-Kompatibilität Gewichte und mischt damit Values.",
        mental:"Query = was suche ich, Key = was biete ich, Value = welche Information gebe ich weiter. Softmax macht aus Scores ein konvexes Mischgewicht.",
        details:["Durch √d_k teilen verhindert, dass Dot-Products mit größerer Head-Dimension so stark wachsen, dass Softmax sättigt.","Multi-Head Attention führt mehrere kleinere Suchräume parallel und verbindet deren Outputs."],
        pitfalls:["Softmax über Query- statt Key-Achse","Skalierung nach Softmax","Maske mit falschem Vorzeichen oder falscher Broadcastform"], checks:["Warum summiert jede Attention-Zeile zu 1?","Welche Form hat die Score-Matrix pro Kopf?"], formulas:["attention","softmax"], sources:["a1","l03"] },
      { id:"causal-mask", module:"transformer", title:"Kausale Maske", level:"Kern", summary:"Die kausale Maske setzt Scores für zukünftige Keys vor Softmax effektiv auf −∞.",
        mental:"Zeile i darf nur Spalten j≤i sehen. Maskieren nach Softmax wäre zu spät, weil verbotene Positionen bereits Normalisierungsmasse erhielten.",
        details:["Die Maske ist T×T und wird über Batch und Köpfe gebroadcastet.","Numerisch nutzt man einen ausreichend negativen Wert oder −∞ in einem sicheren Datentyp."],
        pitfalls:["Dreieck umdrehen","Maske nach Softmax","voll maskierte Zeile erzeugen"], checks:["Wie sieht Zeile 0 der Maske aus?","Warum muss vor Softmax maskiert werden?"], formulas:["causal-attention"], sources:["a1"] },
      { id:"transformer-block", module:"transformer", title:"Pre-Norm Transformer-Block", level:"Kern", summary:"Ein moderner Block besteht aus zwei Residualupdates: Attention und positionsweises SwiGLU-MLP, jeweils mit Norm davor.",
        mental:"x ← x + Attention(Norm(x)); x ← x + MLP(Norm(x)). Aufmerksamkeit mischt Positionen, MLP mischt Features.",
        details:["Dropout ist in vielen großen Pretraining-Setups gering oder null; die genaue Architektur bleibt empirisch.","Der vollständige LM stapelt L Blöcke, normalisiert final und projiziert auf Vokabular-Logits."],
        pitfalls:["Residual auf normiertes statt ursprüngliches x addieren","Attention- und MLP-Zweig seriell ohne Residualupdate","Outputnorm vergessen"], checks:["Welche Achsen werden in welchem Zweig gemischt?","Wo liegen die beiden Residualadditionen?"], formulas:["residual","transformer-params"], sources:["a1","l03"] },
      { id:"cross-entropy", module:"training", title:"Cross-Entropy & Negative Log-Likelihood", level:"Kern", summary:"Cross-Entropy bestraft die negative Log-Wahrscheinlichkeit des korrekten nächsten Tokens.",
        mental:"Das Modell zahlt wenig, wenn es dem Ziel fast alle Masse gibt, und sehr viel, wenn es das Ziel für unmöglich hält.",
        details:["Eine stabile Implementierung arbeitet direkt mit Logits über Log-Sum-Exp.","Padding oder nicht bewertete Tokens werden mit einer Maske aus Mittelwert und Nenner entfernt."],
        pitfalls:["Softmax und danach log separat","über falsche Achsen mitteln","Padding im Nenner belassen"], checks:["Was ist der Loss bei gleichverteiltem Vokabular?","Warum ist Cross-Entropy nicht symmetrisch?"], formulas:["cross-entropy","logsumexp","perplexity"], sources:["a1"] },
      { id:"adamw", module:"training", title:"AdamW", level:"Kern", summary:"AdamW kombiniert geglätteten ersten und zweiten Gradientenmoment-Schätzer mit entkoppeltem Weight Decay.",
        mental:"m schätzt Richtung, v skaliert nach typischer Gradientengröße. Bias Correction korrigiert den kalten Start; Weight Decay schrumpft Parameter separat.",
        details:["AdamW ist nicht einfach Adam plus L2-Term im Gradienten. Die Entkopplung macht die Regularisierungsstärke klarer.","ε stabilisiert die Division. Parametergruppen können Norm- und Biasparameter vom Decay ausnehmen, wenn das Setup es vorsieht."],
        pitfalls:["Step-Zähler bei 0 falsch potenzieren","Momentzustände in falscher Präzision","Weight Decay doppelt anwenden"], checks:["Warum braucht Adam Bias Correction?","Was bedeutet entkoppeltes Weight Decay?"], formulas:["adamw"], sources:["a1","l02"] },
      { id:"schedules", module:"training", title:"Warmup & Cosine Schedule", level:"Kern", summary:"Warmup verhindert zu große frühe Updates; Cosine Decay senkt die Lernrate glatt bis zu einem Minimum.",
        mental:"Früh sind Momentschätzer und Aktivierungsskalen unreif. Spät reduziert eine kleinere Lernrate das Rauschen um ein gutes Becken.",
        details:["Vor Warmup-Ende steigt η linear. Danach interpoliert der Kosinus zwischen η_max und η_min.","Ein Scheduler ist nur sinnvoll zusammen mit klar definiertem Step, Tokenbudget und Gradient Accumulation."],
        pitfalls:["Optimizer-Steps und Microbatches verwechseln","Off-by-one am Warmup-Übergang","Resume ohne Schedulerzustand"], checks:["Welche Lernrate gilt exakt am Warmup-Ende?","Was ist bei Gradient Accumulation ein Step?"], formulas:["cosine-lr"], sources:["a1","l11"] },
      { id:"clipping", module:"training", title:"Globales Gradient Clipping", level:"Kern", summary:"Clipping skaliert alle Gradienten gemeinsam, wenn ihre globale Norm einen Grenzwert überschreitet.",
        mental:"Behalte die Richtung des Gesamtgradienten, begrenze nur seine Länge. Elementweises Abschneiden ändert die Richtung.",
        details:["Die globale L2-Norm wird über alle Parametergradienten berechnet. Der Skalierungsfaktor ist min(1, c/(norm+ε)).","In Mixed Precision wird typischerweise erst unscaled und dann geclippt."],
        pitfalls:["pro Tensor separat clippen","vor Unscale clippen","NaN als große endliche Norm behandeln"], checks:["Warum bleibt die Richtung bei globalem Clipping erhalten?","Wann ist der Faktor genau 1?"], formulas:["gradient-clip"], sources:["a1"] },
      { id:"training-loop", module:"training", title:"Datenbatches, Checkpoints & Reproduzierbarkeit", level:"Kern", summary:"Ein guter Trainingsloop verwaltet Datenposition, Zufall, Optimizer, Scheduler, Logging und Checkpoints als einen Zustand.",
        mental:"Ein Checkpoint ist eine pausierbare Maschine, nicht nur eine Gewichtedatei.",
        details:["Random Seeds helfen, garantieren auf GPU aber nicht immer bitweise Identität. Reproduzierbarkeit bedeutet auch Versionen und Datenreihenfolge.","Logging sollte Loss, Lernrate, Tokenzahl, Durchsatz, Speicherspitze und Validierung mit klaren Bezugsgrößen enthalten."],
        pitfalls:["nur model.state_dict speichern","Validierungsdaten trainieren lassen","Samples statt Tokens als Fortschritt zählen"], checks:["Was muss für echtes Resume gespeichert werden?","Welche Metrik trennt Datenpipeline- von Rechenbottleneck?"], formulas:["global-batch","mfu"], sources:["l02","a1"] },
      { id:"sampling", module:"training", title:"Autoregressives Sampling", level:"Kern", summary:"Generierung wiederholt Forward, Logit-Transformation, Ziehung und Anhängen eines Tokens bis zum Stop.",
        mental:"Temperatur formt die Verteilung; Top-k oder Top-p beschneidet Kandidaten. Greedy Decoding ist ein Sonderfall, nicht automatisch die beste Sequenz.",
        details:["KV-Caching speichert Keys und Values vorheriger Positionen und vermeidet deren Neuberechnung.","Evaluation von Samples braucht mehrere Seeds und klar getrennte Qualitäts- und Diversitätskriterien."],
        pitfalls:["Temperatur 0 in eine Division geben","Stop-Token nicht behandeln","ohne KV-Cache quadratisch viel Arbeit wiederholen"], checks:["Was bewirkt T<1 auf Logits?","Warum maximiert Greedy nicht zwingend die gesamte Sequenzwahrscheinlichkeit?"], formulas:["temperature","autoregressive"], sources:["a1"] },
      { id:"pre-post-norm", module:"architecture", title:"Pre-Norm vs. Post-Norm", level:"Vertiefung", summary:"Pre-Norm legt die Normalisierung vor den Unterblock und hält einen direkten Residualpfad; Post-Norm normalisiert nach der Addition.",
        mental:"In tiefen Netzen muss Gradienteninformation durch viele Blöcke. Ein möglichst unveränderter Identitätspfad erleichtert den Transport.",
        details:["Moderne Decoder-LMs verwenden fast durchgehend Pre-Norm oder verwandte Varianten.","Post-Norm kann funktionieren, benötigt aber oft sorgfältigere Initialisierung und Lernraten."],
        pitfalls:["Architekturvarianten ohne kontrollierte Ablation vergleichen","finale Norm bei Pre-Norm vergessen"], checks:["Zeichne den Identitätspfad beider Varianten.","Welche Variable wird im Pre-Norm-Residual addiert?"], formulas:["residual"], sources:["l03","a1"] },
      { id:"attention-variants", module:"architecture", title:"MHA, MQA & GQA", level:"Vertiefung", summary:"Multi-Head Attention (MHA) hat pro Kopf eigene K/V; Multi-Query Attention (MQA) teilt sie global, Grouped-Query Attention (GQA) gruppenweise.",
        mental:"Weniger K/V-Köpfe verkleinern den KV-Cache und beschleunigen Inferenz, während viele Query-Köpfe Ausdrucksstärke behalten.",
        details:["GQA ist ein verbreiteter Kompromiss zwischen MHA-Qualität und MQA-Effizienz.","Formen und Broadcasting müssen die Zuordnung von Query- zu K/V-Gruppen explizit machen."],
        pitfalls:["Trainings-FLOPs und Decode-Bandbreite vermischen","Headzahl ohne Teilbarkeit der Dimension ändern"], checks:["Welcher Speicherblock schrumpft bei GQA?","Wie werden H_q Query-Köpfe H_kv Gruppen zugeordnet?"], formulas:["kv-cache"], sources:["l03"] },
      { id:"moe", module:"architecture", title:"MoE (Mixture of Experts)", level:"Vertiefung", summary:"MoE ersetzt meist das dichte MLP durch viele Experten, von denen ein Router pro Token nur wenige aktiviert.",
        mental:"Mehr Gesamtparameter bei nahezu konstanten aktiven FLOPs – bezahlt mit Routing, Kommunikation, Kapazitätsgrenzen und Lastbalancierung.",
        details:["Top-k-Routing erzeugt Gewichte und Expertenzuweisungen. Expert Parallelism verteilt Experten über Geräte.","Auxiliary Load-Balancing Losses oder bias-basierte Verfahren verhindern, dass wenige Experten überlaufen."],
        pitfalls:["Gesamt- und aktive Parameter verwechseln","all-to-all Kommunikation ignorieren","Expertenkapazität ohne Dropping/Overflow-Strategie"], checks:["Warum bleiben aktive FLOPs bei mehr Experten ungefähr stabil?","Welche neue Kommunikationsoperation dominiert?"], formulas:["moe-output"], sources:["l04"] },
      { id:"gpu-model", module:"gpu", title:"GPU-Ausführungs- & Speichermodell", level:"Systems", summary:"GPUs maximieren Durchsatz mit vielen Threads; schnelle Recheneinheiten sind nutzlos, wenn Daten nicht rechtzeitig ankommen.",
        mental:"Threads bilden Warps, Warps laufen in Blocks auf Streaming Multiprocessors (SMs). Register/shared memory sind nah und klein, High Bandwidth Memory (HBM) groß und langsamer.",
        details:["SIMT bedeutet Single Instruction, Multiple Threads: Divergierende Branches innerhalb eines Warps serialisieren Pfade.","Coalesced Access, Wiederverwendung in shared memory und genügend aktive Warps verstecken Latenz."],
        pitfalls:["CPU-Latenzdenken auf GPU übertragen","alle Speicherarten als gleich teuer behandeln","Kernelstart und Synchronisation beim Timing ignorieren"], checks:["Warum schadet Warp-Divergenz?","Welche Daten eignen sich für shared memory?"], formulas:["arithmetic-intensity","roofline"], sources:["l05","l06"] },
      { id:"roofline", module:"gpu", title:"Arithmetic Intensity & Roofline", level:"Systems", summary:"Arithmetic Intensity misst FLOPs pro übertragenem Byte; der Roofline-Grenzwert ist Minimum aus Peak-Compute und Bandbreite×Intensität.",
        mental:"Links vom Ridge Point bist du speicherlimitiert, rechts computelimitiert. Mehr Rechenleistung hilft links kaum; mehr Datenwiederverwendung schon.",
        details:["Elementweise Operationen haben meist geringe Intensität, große Matrixmultiplikationen können Daten vielfach wiederverwenden.","Gemessene Leistung liegt unter dem Roofline-Dach; die Rechnung identifiziert nur den prinzipiellen Engpass."],
        pitfalls:["Cache-Traffic falsch zählen","Peakwerte verschiedener Datentypen mischen","theoretisches Dach als Benchmarkziel garantieren"], checks:["Wie verschiebt Kernel-Fusion die Intensität?","Was ist der Ridge Point?"], formulas:["arithmetic-intensity","roofline"], sources:["l05","a2"] },
      { id:"profiling", module:"gpu", title:"Benchmarking & Profiling", level:"Systems", summary:"Benchmarking beantwortet wie schnell; Profiling beantwortet wo Zeit und Speicher hingehen.",
        mental:"Erst End-to-End messen, dann Timeline/Kernel analysieren, dann Hypothese testen. Synchronisation und Warmup sind Teil des Experiments.",
        details:["GPU-Operationen sind asynchron zur CPU. Timing ohne Event oder Synchronisation misst oft nur Dispatch.","Profiler verändern das System. Nutze sie zur Ursachenanalyse, nicht als exakte Produktionslatenz."],
        pitfalls:["ersten kalten Lauf messen","zu kurze Intervalle","Mikrobenchmarkgewinn ungeprüft als End-to-End-Gewinn melden"], checks:["Warum braucht GPU-Timing Synchronisation?","Wann ist ein Profiler-Trace aussagekräftiger als ein Timer?"], formulas:["speedup"], sources:["l06","a2"] },
      { id:"fusion-tiling", module:"gpu", title:"Kernel-Fusion & Tiling", level:"Systems", summary:"Fusion vermeidet Zwischenwerte in HBM; Tiling hält wiederverwendete Daten in schnellem On-Chip-Speicher.",
        mental:"Die Fabrik soll Material nicht nach jedem kleinen Schritt zurück ins entfernte Lager tragen.",
        details:["Fusion ist besonders wertvoll für Ketten einfacher Operationen. Tiling zerlegt Aggregationen so, dass ein Block lokale Teile wiederverwendet.","Zu große Tiles erhöhen Registerdruck und senken Occupancy; die beste Form ist hardware- und problemabhängig."],
        pitfalls:["mehr Fusion immer besser","Tilegrößen ohne Messung","Korrektheit bei Rand-Tiles vergessen"], checks:["Welche HBM-Schreibvorgänge spart Fusion?","Warum kann ein zu großes Tile langsamer sein?"], formulas:["arithmetic-intensity"], sources:["l05","l06","a2"] },
      { id:"flash-attention", module:"gpu", title:"FlashAttention als IO-Algorithmus", level:"Systems", summary:"FlashAttention berechnet exakte Attention blockweise, ohne die vollständige T×T-Matrix in HBM zu materialisieren.",
        mental:"Halte laufendes Maximum, Normierungssumme und Output pro Query-Block; reskaliere sie stabil, wenn neue Key-Blöcke eintreffen.",
        details:["Online Softmax erlaubt blockweise Normalisierung trotz unbekanntem globalem Maximum.","Die asymptotische Rechenkomplexität bleibt O(T²D), aber HBM-I/O und gespeicherte Aktivierungen sinken drastisch."],
        pitfalls:["als approximative sparse Attention beschreiben","laufende Summe ohne Maximums-Reskalierung","kausale Rand-Tiles falsch maskieren"], checks:["Was wird nicht mehr in HBM gespeichert?","Warum bleibt das Ergebnis exakt?"], formulas:["online-softmax","attention"], sources:["l05","a2"] },
      { id:"checkpointing", module:"gpu", title:"Activation Checkpointing", level:"Systems", summary:"Checkpointing speichert nur ausgewählte Aktivierungen und rekonstruiert andere beim Backward durch erneuten Forward.",
        mental:"Speicher gegen Rechenzeit tauschen. Gespeicherte Blockgrenzen sind Anker für die Rekonstruktion.",
        details:["Optimale Strategien hängen von Blockkosten und Speicherbudget ab. Randomness muss bei Recomputation konsistent sein.","Checkpointing reduziert Aktivierungsspeicher, nicht Parameter- oder Optimizerzustand."],
        pitfalls:["alle Aktivierungen speichern und trotzdem checkpoint nennen","Dropout-RNG nicht reproduzieren","Rechenoverhead nicht messen"], checks:["Welche Speicherklasse wird reduziert?","Warum kann Recomputation andere Zufallswerte erzeugen?"], formulas:["memory-state"], sources:["a2"] },
      { id:"collectives", module:"distributed", title:"Collective Communication", level:"Systems", summary:"Broadcast, All-Reduce, Reduce-Scatter und All-Gather beschreiben koordinierte Datenbewegung über viele Ranks.",
        mental:"Ein Rank ist ein Prozess/Gerät, World Size ihre Anzahl. Collectives beschreiben das Muster; Netzwerk und Algorithmus bestimmen die Kosten.",
        details:["Ring All-Reduce lässt sich als Reduce-Scatter plus All-Gather verstehen und nähert sich im bandbreitenlimitierten Regime dem Optimum.","Latenz dominiert viele kleine Nachrichten, Bandbreite wenige große. Bucket-Größe steuert diesen Trade-off."],
        pitfalls:["Summe und Mittelwert verwechseln","Kommunikationsvolumen pro Rank mit Gesamtvolumen mischen","Deadlock durch unterschiedliche Collective-Reihenfolge"], checks:["Was besitzt jeder Rank nach Reduce-Scatter?","Warum sind viele kleine All-Reduces teuer?"], formulas:["ring-allreduce","global-batch"], sources:["l07","l08","a2"] },
      { id:"ddp-zero-fsdp", module:"distributed", title:"DDP, ZeRO & FSDP", level:"Systems", summary:"Distributed Data Parallel (DDP) repliziert State; ZeRO und Fully Sharded Data Parallel (FSDP) teilen zunehmend Optimizer, Gradienten und Parameter.",
        mental:"Sharding spart Speicher, erzeugt aber Kommunikation, um gerade benötigten Zustand zusammenzusetzen.",
        details:["Naives DDP teilt den Batch und All-Reduced Gradienten. ZeRO-1 shardet Optimizer State, ZeRO-2 zusätzlich Gradienten, ZeRO-3/FSDP zusätzlich Parameter.","Overlap versteckt Kommunikation hinter Backward, sofern Buckets rechtzeitig fertig sind."],
        pitfalls:["Peak-Speicher während All-Gather ignorieren","lokale und globale Batchgröße verwechseln","Kommunikation ohne Netzwerkhierarchie rechnen"], checks:["Welcher Zustand wird auf jeder ZeRO-Stufe geshardet?","Wann kann Gradient All-Reduce überlappt werden?"], formulas:["memory-state","ring-allreduce","global-batch"], sources:["l07","l08","a2"] },
      { id:"model-parallelism", module:"distributed", title:"Tensor-, Pipeline- & Sequenzparallelismus", level:"Systems", summary:"Tensorparallelismus teilt Breite, Pipelineparallelismus Tiefe, Sequenzparallelismus Tokenachsen.",
        mental:"Wähle die Achse, deren Daten du verteilen musst; jede Wahl erzeugt ein charakteristisches Kommunikationsmuster.",
        details:["Tensor Parallelism braucht häufig All-Reduce/All-Gather innerhalb eines Layers. Pipeline Parallelism tauscht Aktivierungen zwischen Stages und hat Bubble-Overhead.","Mehrdimensionale Parallelität kombiniert Daten- und Modellachsen entlang der Hardwaretopologie."],
        pitfalls:["Pipeline-Bubbles ignorieren","TP über langsame Nodes spannen","Produkt der Parallelitätsgrade ungleich World Size"], checks:["Welche Tensorachse teilt Column Parallel Linear?","Wodurch entsteht eine Pipeline Bubble?"], formulas:["pipeline-efficiency"], sources:["l07","l08","a2"] },
      { id:"power-laws", module:"scaling", title:"Empirische Power Laws", level:"Scaling", summary:"Viele LM-Loss-Kurven sind über Größenordnungen ungefähr linear im Log-Log-Raum und damit als Potenzgesetz modellierbar.",
        mental:"Ein einfacher Trend ist ein Werkzeug zur Extrapolation, kein Naturgesetz. Residuen und Bereichsgrenzen sind Teil des Ergebnisses.",
        details:["Loss kann als irreduzibler Term plus parameter- und datenlimitierte Terme modelliert werden.","Log-Transformation macht Exponenten sichtbar, aber Messrauschen und Additivkonstante erschweren naive lineare Regression."],
        pitfalls:["außerhalb des Messbereichs blind extrapolieren","schlechte Runs als saubere Daten behandeln","nur R² statt Vorhersagefehler prüfen"], checks:["Was bedeutet eine Gerade im Log-Log-Plot?","Warum stört ein irreduzibler Loss-Term die Linearität?"], formulas:["scaling-law"], sources:["l09","a3"] },
      { id:"isoflops", module:"scaling", title:"IsoFLOPs & Compute-Optimum", level:"Scaling", summary:"Bei festem Compute C variiert man Modellgröße N und setzt Token D≈C/(6N), um den Verlustminimierer zu finden.",
        mental:"Zu klein: Modellkapazität limitiert. Zu groß: zu wenige Tokens/Updates. Das Minimum balanciert beide.",
        details:["Mehrere Compute-Budgets liefern optimale N- und D-Punkte, deren Trends zum Zielbudget extrapoliert werden.","Lernrate, Batch und Architektur müssen fair skaliert werden; sonst misst man Tuningfehler statt Scaling."],
        pitfalls:["Early-Stopping-Punkte wie unabhängige voll trainierte Runs behandeln","Compute inkonsistent zählen","nur eine Seite des U-förmigen Profils sampeln"], checks:["Warum gilt D=C/(6N)?","Welche Runs brauchst du, um ein IsoFLOPs-Minimum zu sehen?"], formulas:["training-flops","isoflops"], sources:["l09","a3"] },
      { id:"scaling-practice", module:"scaling", title:"Scaling in der Praxis & μP", level:"Scaling", summary:"Maximum Update Parametrization (μP) soll Updategrößen über Modellbreiten stabilisieren und Hyperparametertransfer erleichtern.",
        mental:"Skalieren heißt nicht nur mehr Layer/Width: Initialisierung, Lernrate, Batch und Parametergruppen müssen in einer konsistenten Familie liegen.",
        details:["μP definiert unterschiedliche Skalierungsregeln für Matrizen je nach Rolle. Es ist ein System, kein einzelner Lernratenfaktor.","WSD-Schedules (Warmup-Stable-Decay) können Scaling-Experimente wiederverwenden, erfordern aber saubere Vergleichsregeln."],
        pitfalls:["Standard-Parametrisierung und μP-Regeln mischen","kleinstes Modell als perfekte Basis annehmen","Hyperparameterunsicherheit ausblenden"], checks:["Welches Problem soll μP lösen?","Warum ist Hyperparametertransfer eine Scaling-Frage?"], formulas:["scaling-law"], sources:["l11","a3"] },
      { id:"data-pipeline", module:"data", title:"Webdaten-Pipeline", level:"Data", summary:"Rohdaten werden konvertiert, klassifiziert, gefiltert, dedupliziert, gemischt und erst dann tokenisiert.",
        mental:"Jeder Filter verändert die spätere Modellverteilung. Speichere Entscheidungssignale, damit du Fehler analysieren und Schwellen neu setzen kannst.",
        details:["HTML-to-Text muss Navigation, Skripte und Boilerplate entfernen, ohne Inhalt zu zerstören.","Pipeline-Reihenfolge beeinflusst Kosten: billige grobe Filter früh, teure Modelle nur auf verbliebenen Daten; Deduplikation benötigt konsistente Normalisierung."],
        pitfalls:["nur Gesamtbehalterate messen","Validierungsdaten in Pretraining-Korpus","Schwellen ohne manuelle Stichprobe"], checks:["Welche Auditdaten speicherst du pro Dokument?","Warum ist Filterreihenfolge relevant?"], formulas:[], sources:["l13","a4"] },
      { id:"quality-filtering", module:"data", title:"Regeln & Quality Classifier", level:"Data", summary:"Heuristiken entfernen offensichtlichen Müll; ein Klassifikator lernt Ähnlichkeit zu erwünschten Qualitätsdaten.",
        mental:"Qualität ist ein operationalisiertes Ziel, keine objektive Eigenschaft. Der Trainingssatz des Filters definiert seine Vorlieben.",
        details:["Gopher-artige Regeln prüfen etwa Wortlängen, Symbolanteile und Wiederholungen.","Ein probabilistischer Classifier liefert Scores; Schwellen steuern Precision/Recall und sollten nach Domäne geprüft werden."],
        pitfalls:["Classifier-Score als Wahrheit","Minderheitensprachen überfiltern","Testbeispiele zur Schwellenwahl wiederverwenden"], checks:["Welche Fehler sind bei hartem Filter irreversibel?","Wie prüfst du Domänenbias?"], formulas:["logistic"], sources:["l13","a4"] },
      { id:"pii-harm", module:"data", title:"PII, schädliche Inhalte & Governance", level:"Data", summary:"Personally Identifiable Information (PII) und schädliche Inhalte brauchen Erkennung, Maskierung, Dokumentation und bewusste Policy.",
        mental:"Ein Filter ist nie perfekt. Denke in Risiko, Fehlertypen und Eskalation statt in einer magischen Binärfunktion.",
        details:["Regex-Muster decken strukturierte Identifikatoren ab, kontextabhängige PII braucht Modelle oder strengere Quellenkontrolle.","Safety-Filter können legitime medizinische, historische oder Minderheiteninhalte treffen; Stichproben nach Subgruppe sind notwendig."],
        pitfalls:["Secrets aus Daten in Logs schreiben","False Positives nicht auditieren","rechtliche und ethische Entscheidung als reine Metrik behandeln"], checks:["Welche PII lässt sich regelbasiert erkennen?","Was dokumentierst du für einen entfernten Datensatz?"], formulas:["precision-recall"], sources:["a4","l13"] },
      { id:"dedup", module:"data", title:"Exact Dedup, MinHash & LSH", level:"Data", summary:"Exakte Deduplikation entfernt identische Einheiten; MinHash plus Locality-Sensitive Hashing (LSH) findet ähnliche Dokumente skalierbar.",
        mental:"Jaccard misst Überlappung von Shingle-Mengen. MinHash schätzt Jaccard; LSH macht Kandidaten, der exakte Vergleich entscheidet.",
        details:["Zeilen-Dedup kann häufige Boilerplate entfernen, aber auch sinnvolle Standardsätze löschen.","Bei LSH werden Signaturen in b Bänder mit r Zeilen geteilt. Die S-Kurve steuert, ab welcher Ähnlichkeit Kandidaten wahrscheinlich kollidieren."],
        pitfalls:["Kandidatenkollision als endgültige Gleichheit","Normalisierung nach Hashing","Train/Valid-Kontamination separat von Intra-Train-Dedup vergessen"], checks:["Warum ist P(MinHash gleich)=Jaccard?","Wie verändern mehr Bänder den Recall?"], formulas:["jaccard","minhash","lsh"], sources:["a4"] },
      { id:"perplexity-eval", module:"evaluation", title:"Perplexity & Likelihood-Evaluation", level:"Eval", summary:"Perplexity ist exp der mittleren Token-NLL und misst, wie überrascht das Modell unter einem Tokenizer ist.",
        mental:"Perplexity ist die effektive Verzweigungszahl pro Token – aber nur innerhalb gleicher Tokenisierung und Datenaufbereitung direkt vergleichbar.",
        details:["NLL steht für Negative Log-Likelihood. Lange Kontexte können mit Sliding Windows bewertet werden; Kontextreset verändert die Aufgabe.","Niedrige Perplexity bedeutet gute Modellierung des Korpus, nicht automatisch Faktentreue, Instruktionsfolge oder Sicherheit."],
        pitfalls:["verschiedene Tokenizer vergleichen","Trainingsdatenleckage","Perplexity als universelle Qualitätszahl"], checks:["Warum kann gleicher Text mit anderem Tokenizer andere PPL haben?","Welche Fähigkeiten misst Likelihood nicht?"], formulas:["perplexity","cross-entropy"], sources:["l12","a1"] },
      { id:"benchmark-validity", module:"evaluation", title:"Benchmarks, Validität & Kontamination", level:"Eval", summary:"Ein Benchmark ist nur aussagekräftig, wenn Aufgabe, Prompting, Scoring, Datenherkunft und Kosten zur Behauptung passen.",
        mental:"Frage zuerst: Welche Behauptung soll der Score stützen? Dann prüfe Realismus, Validität, Kontamination und Einzelfehler.",
        details:["Few-shot, Chain-of-Thought, Samplingbudget und Judge-Modell sind Teil des Systems und müssen berichtet werden.","Aggregate Scores verbergen Subgruppen und Fehlerarten. Inspektion einzelner Instanzen ist Pflicht."],
        pitfalls:["Methoden- mit Modellvergleich mischen","Testset mehrfach tunen","Standardfehler und Kosten nicht berichten"], checks:["Welche Regeln des Spiels müssen fix sein?","Warum reicht ein Gesamtscore nicht?"], formulas:["accuracy-se","precision-recall"], sources:["l12","a5s"] },
      { id:"sft", module:"alignment", title:"SFT (Supervised Fine-Tuning)", level:"Alignment", summary:"SFT trainiert ein Basismodell auf Prompt-Antwort-Beispielen mit derselben Token-Cross-Entropy wie Pretraining.",
        mental:"Wir ändern nicht die Grundmechanik, sondern die Datenverteilung und meist die Loss-Maske: Antworttokens lernen, Prompttokens liefern Kontext.",
        details:["Datenqualität, Format, Rollenmarker und Mischung zählen oft mehr als rohe Menge.","Catastrophic Forgetting und Stilüberanpassung werden durch Lernrate, Epochen und Datenmix beeinflusst."],
        pitfalls:["Prompttokens versehentlich mitlernen, wenn das Ziel nur Antworten sind","Chat-Template zwischen Train und Eval wechseln","Output-Qualität nur auf Trainingsformat testen"], checks:["Welche Tokens gehen in den SFT-Loss ein?","Warum kann zu viel SFT Fähigkeiten verschlechtern?"], formulas:["sft-loss"], sources:["l15","a5s"] },
      { id:"reward-models", module:"alignment", title:"Präferenzdaten & Reward Model", level:"Alignment", summary:"Ein Reward Model ordnet Antworten einen Skalar zu und wird häufig aus Paarpräferenzen trainiert.",
        mental:"Nicht absolute Wahrheit lernen, sondern Wahrscheinlichkeit, dass Antwort y⁺ gegenüber y⁻ bevorzugt wird.",
        details:["Das Bradley-Terry-Modell nutzt die Sigmoid-Differenz zweier Rewards.","Annotatoren, Promptverteilung und Richtlinie definieren das Ziel. Reward-Hacking entsteht, wenn die Policy Modellfehler ausnutzt."],
        pitfalls:["Reward mit echter Qualität gleichsetzen","Positionsbias in Paaren","Train/Eval-Präferenzen nicht trennen"], checks:["Warum genügt die Reward-Differenz?","Wie erkennst du Reward-Overoptimization?"], formulas:["bradley-terry"], sources:["l15","a5s"] },
      { id:"rlhf", module:"alignment", title:"RLHF (Reinforcement Learning from Human Feedback)", level:"Alignment", summary:"RLHF optimiert erwarteten Reward und hält die Policy mit einer KL-Strafe nahe an einer Referenz.",
        mental:"Reward zieht zum gewünschten Verhalten, Kullback-Leibler-Divergenz (KL) verhindert, dass das Modell die gelernte Sprachverteilung zu aggressiv verlässt.",
        details:["Der klassische Stack besteht aus SFT-Policy, Reward Model, Referenzmodell und On-Policy-Rollouts.","Zu starke Optimierung kann Reward-Hacking und Mode Collapse erzeugen; Reward, KL, Entropie und echte Evals müssen gemeinsam beobachtet werden."],
        pitfalls:["höherer Proxy-Reward = besseres Modell","KL-Richtung oder Tokenaggregation unklar","Rollout- und Trainingspolicy stark auseinanderlaufen lassen"], checks:["Welche vier Modelle/Zustände können im RLHF-Loop beteiligt sein?","Was kontrolliert β?"], formulas:["rlhf-objective","kl"], sources:["l15","a5s"] },
      { id:"dpo", module:"alignment", title:"DPO (Direct Preference Optimization)", level:"Alignment", summary:"DPO optimiert Präferenzpaare direkt mit Policy- und Referenz-Logratios, ohne separaten On-Policy-RL-Loop.",
        mental:"Erhöhe relativ zur Referenz die Wahrscheinlichkeit der bevorzugten Antwort und senke die der abgelehnten – stärker, wenn das Paar noch falsch geordnet ist.",
        details:["Die Herleitung setzt eine nichtparametrische Optimalpolicy für KL-regularisierten Reward voraus und parametrisiert den impliziten Reward über Logratios.","DPO ist operativ einfacher, bleibt aber abhängig von Präferenzdaten, Referenz, β und Längen-/Formatbias."],
        pitfalls:["als gewöhnliches positives/negatives SFT ohne Gewichtung erklären","Referenzlogprobs vergessen","Längenbias ignorieren"], checks:["Welche vier Sequenz-Logwahrscheinlichkeiten stehen im DPO-Logit?","Welche Rolle spielt β?"], formulas:["dpo"], sources:["l16","a5s"] },
      { id:"rl-setup", module:"rlvr", title:"Sprache als RL-Problem", level:"RL", summary:"Prompt plus bisherige Antwort bilden Zustand, nächstes Token die Aktion, die fertige Antwort eine Trajektorie mit Outcome-Reward.",
        mental:"Transitionen sind deterministisch: Zustand plus Token ergibt den nächsten Zustand. Zufall liegt in der Policy; Reward kommt meist am Ende.",
        details:["RLVR nutzt automatisch prüfbare Rewards, etwa exakte Mathematikantwort oder Tests. Das vermeidet einen gelernten Reward-Proxy, begrenzt aber Domänen.","Inference ist Teil des Trainingssystems: Rollouts erzeugen die Daten, auf denen die Policy aktualisiert wird."],
        pitfalls:["SFT-Datensatz als statisch ansehen","Tokenreward erfinden, obwohl nur Outcome messbar","Verifier-Fehler als Wahrheit"], checks:["Was sind Zustand, Aktion und Episode beim LM?","Warum ist die Datenverteilung on-policy beweglich?"], formulas:["expected-reward"], sources:["l16","l17","a5"] },
      { id:"policy-gradient", module:"rlvr", title:"Log-Derivative Trick & Policy Gradient", level:"RL", summary:"Der Gradient des erwarteten Rewards wird als Erwartung von Reward × Gradient der Log-Policy geschrieben und per Samples geschätzt.",
        mental:"Mache zufällig gewählte gute Aktionen wahrscheinlicher und schlechte relativ unwahrscheinlicher; eine Baseline senkt Rauschen.",
        details:["∇π = π∇logπ macht den unbekannten Summen-/Integralgradienten samplebar.","Eine Baseline, die nicht von der gezogenen Aktion abhängt, ändert den Erwartungsgradienten nicht. Advantage A=R−b steuert Vorzeichen und Stärke."],
        pitfalls:["Reward durch backpropagieren wollen","Baseline aktionsabhängig machen","hohen Reward zwischen unterschiedlich schweren Prompts direkt vergleichen"], checks:["Leite ∇E[R] in drei Schritten her.","Warum kann ein Reward 9 einen negativen Advantage haben?"], formulas:["policy-gradient","advantage"], sources:["l17","a5"] },
      { id:"grpo", module:"rlvr", title:"GRPO (Group Relative Policy Optimization)", level:"RL", summary:"GRPO sampelt mehrere Antworten pro Prompt und nutzt ihre gruppenrelativen Rewards als Advantage ohne Value Model.",
        mental:"Vergleiche Antworten nur mit Geschwistern derselben Frage. So wird Schwierigkeit des Prompts zur lokalen Baseline.",
        details:["Typisch werden Rewards um Gruppenmittel zentriert und optional durch Gruppenstandardabweichung geteilt.","Token- oder Sequenznormalisierung verändert, wie Antwortlänge gewichtet wird. Wenn alle Rewards gleich sind, liefert die Gruppe kein Lernsignal."],
        pitfalls:["Standardabweichung 0 nicht behandeln","Gruppen über Prompts mischen","Längennormalisierung als harmlose Skalierung betrachten"], checks:["Warum ersetzt die Gruppe ein Value Model?","Welche Reweightings entstehen durch Std- und Längennormalisierung?"], formulas:["grpo-advantage","policy-gradient"], sources:["l16","l17","a5"] },
      { id:"off-policy", module:"rlvr", title:"Off-Policy Importance Ratios & Clipping", level:"RL", summary:"Wenn Rollouts von einer alten Policy stammen, korrigiert das Verhältnis neuer zu alter Wahrscheinlichkeit die Verteilungsverschiebung.",
        mental:"ρ sagt, wie viel wahrscheinlicher die neue Policy dieselbe Aktion gemacht hätte. Große Ratios sind korrekt, aber hochvariant; Clipping stabilisiert mit Bias.",
        details:["Token-level und sequence-level Ratios gewichten unterschiedlich und können Längenbias erzeugen.","Proximal Policy Optimization (PPO) clippt den Surrogate-Term so, dass Updates nicht unbegrenzt von alten Samples getrieben werden."],
        pitfalls:["alte Logprobs nach Policyupdate neu berechnen","Ratio statt Logratio numerisch instabil bilden","Clipping als exakte unverzerrte Korrektur beschreiben"], checks:["Wann ist ρ=1?","Welchen Trade-off führt Clipping ein?"], formulas:["importance-ratio","ppo-clip"], sources:["l16","a5"] }
    ];

    const FORMULAS = [
      {id:"mean-var",cat:"Grundlagen",title:"Mittelwert & Varianz",expr:"μ = (1/n) Σᵢ xᵢ   ·   Var(X) = E[(X−μ)²]",latex:"\\mu=\\frac1n\\sum_i x_i,\\quad \\mathrm{Var}(X)=\\mathbb E[(X-\\mu)^2]",read:"Mittelwert ist die Summe durch n; Varianz ist die erwartete quadratische Abweichung.",purpose:"Beschreibt Lage und Streuung; zentral für Initialisierung, Normalisierung und Policy-Gradient-Varianz.",dims:"xᵢ und μ haben dieselbe Einheit; Varianz hat deren Quadrat.",vars:[["n","Anzahl Beobachtungen"],["xᵢ","Beobachtung i"],["μ","Mittelwert"],["E","Erwartungswert"]],intuition:"Quadrate verhindern, dass sich positive und negative Abweichungen aufheben.",pitfall:"Standardabweichung σ ist √Var und hat wieder die Einheit von x.",example:"Für [1,3] ist μ=2, Varianz (mit 1/n)=1.",check:"Warum ist Varianz nie negativ?",sources:["a5","l17"],aliases:"mean average standard deviation sigma erwartungswert"},
      {id:"matmul",cat:"Lineare Algebra",title:"Matrixmultiplikation",expr:"Cᵢⱼ = Σₖ Aᵢₖ Bₖⱼ    |    (m×k)(k×n) → (m×n)",latex:"C_{ij}=\\sum_k A_{ik}B_{kj}",read:"Jeder Output ist das Skalarprodukt einer A-Zeile mit einer B-Spalte.",purpose:"Grundoperation von linearen Projektionen, Attention und MLPs.",dims:"Innere Dimension k muss übereinstimmen; äußere m,n bleiben.",vars:[["m","Anzahl Zeilen/Objekte"],["k","kontrahierte Featureachse"],["n","Outputfeatures"],["Cᵢⱼ","Output an Zeile i, Spalte j"]],intuition:"Viele gewichtete Summen gleichzeitig.",pitfall:"Nicht mit elementweisem A⊙B verwechseln.",example:"(B·T×D) @ (D×D_out) → (B·T×D_out).",check:"Welche Achse verschwindet und warum?",sources:["l02","a1"],aliases:"matrix multiplication matmul einsum dot product"},
      {id:"chain-rule",cat:"Grundlagen",title:"Kettenregel",expr:"∂L/∂x = (∂L/∂y)(∂y/∂x)",latex:"\\frac{\\partial L}{\\partial x}=\\frac{\\partial L}{\\partial y}\\frac{\\partial y}{\\partial x}",read:"Der Upstream-Gradient wird mit der lokalen Ableitung verkettet.",purpose:"Mathematische Grundlage von Backpropagation.",dims:"∂L/∂x hat dieselbe Form wie x; in Vektorfällen ist dies ein Jacobian-Vektor-Produkt.",vars:[["L","skalare Zielfunktion"],["x","Eingabe/Parameter"],["y","Zwischenergebnis"]],intuition:"Wie stark ändert x den Zwischenwert und dieser den Loss?",pitfall:"Bei Verzweigungen addieren sich mehrere Pfadbeiträge.",example:"y=x², L=3y ⇒ dL/dx=3·2x.",check:"Warum ist kein voller Jacobian nötig?",sources:["l02","a1"],aliases:"gradient backprop derivative jacobian vjp"},
      {id:"softmax",cat:"Wahrscheinlichkeit",title:"Softmax",expr:"pᵢ = exp(zᵢ−m) / Σⱼ exp(zⱼ−m),   m=maxⱼ zⱼ",latex:"p_i=\\frac{e^{z_i-m}}{\\sum_j e^{z_j-m}},\\quad m=\\max_j z_j",read:"Exponentiere stabilisierte Logits und normiere sie auf Summe eins.",purpose:"Macht aus relativen Scores eine kategoriale Wahrscheinlichkeitsverteilung.",dims:"z und p haben gleiche Form; Normalisierung erfolgt über genau eine Kategorieachse.",vars:[["zᵢ","Logit der Kategorie i"],["pᵢ","Wahrscheinlichkeit"],["m","maximaler Logit zur Stabilisierung"]],intuition:"Nur Differenzen zwischen Logits zählen; Verschieben aller Logits ändert nichts.",pitfall:"In Attention über Keys, nicht über Queries normalisieren.",example:"z=[0,0] ⇒ p=[0.5,0.5].",check:"Warum verändert −m das Resultat nicht?",sources:["a1"],aliases:"probability logits normalization exp"},
      {id:"logsumexp",cat:"Numerik",title:"Log-Sum-Exp",expr:"LSE(z) = m + log Σⱼ exp(zⱼ−m)",latex:"\\operatorname{LSE}(z)=m+\\log\\sum_j e^{z_j-m}",read:"Ziehe das Maximum heraus, summiere sichere Exponentialwerte und addiere es zurück.",purpose:"Stabile Normalisierung von Logits und Cross-Entropy.",dims:"Skalar pro normalisierter Zeile; gleiche Log-Einheit wie z.",vars:[["z","Logitvektor"],["m","max(z)"],["LSE","Logarithmus der Exponentialsumme"]],intuition:"Vermeidet Overflow bei großen und Underflow bei kleinen Logits.",pitfall:"Naives log(sum(exp(z))) kann inf ergeben, obwohl das mathematische Resultat endlich ist.",example:"z=[1000,1000] ⇒ LSE=1000+log 2.",check:"Welche exp-Argumente entstehen nach Stabilisierung?",sources:["a1","a2"],aliases:"log sum exp numerical stability"},
      {id:"autoregressive",cat:"Sprachmodell",title:"Autoregressive Faktorisierung",expr:"p(x₁:ₜ) = ∏ₜ p(xₜ | x&lt;ₜ)   ⇔   log p = Σₜ log p(xₜ | x&lt;ₜ)",latex:"p(x_{1:T})=\\prod_{t=1}^T p(x_t\\mid x_{<t})",read:"Die Sequenzwahrscheinlichkeit ist das Produkt bedingter Next-Token-Wahrscheinlichkeiten.",purpose:"Definiert Training und Generierung eines Decoder-Sprachmodells.",dims:"Ein Skalar pro Sequenz; jede bedingte Verteilung hat V Kategorien.",vars:[["T","Sequenzlänge"],["xₜ","Token an Position t"],["x&lt;ₜ","alle vorherigen Tokens"]],intuition:"Komplexe Sequenzen werden in lokale Vorhersagen zerlegt.",pitfall:"Die kausale Bedingung darf beim parallelen Training nicht verletzt werden.",example:"p(a,b)=p(a)·p(b|a).",check:"Warum wird das Produkt im Lograum zur Summe?",sources:["a1"],aliases:"language model next token likelihood factorization"},
      {id:"cross-entropy",cat:"Loss",title:"Cross-Entropy / NLL",expr:"L = −(1/M) Σᵢ log softmax(zᵢ)ᵧᵢ",latex:"\\mathcal L=-\\frac1M\\sum_i \\log\\operatorname{softmax}(z_i)_{y_i}",read:"Mittlere negative Log-Wahrscheinlichkeit des korrekten Tokens.",purpose:"Standard-Loss für Next-Token-Training; NLL bedeutet Negative Log-Likelihood.",dims:"Dimensionsloser Skalar; M ist Zahl bewerteter Tokens.",vars:[["zᵢ","Logits für Tokenposition i"],["yᵢ","Ziel-ID"],["M","Anzahl unmaskierter Ziele"]],intuition:"Falsche Sicherheit kostet besonders viel.",pitfall:"Padding muss aus Summe und Nenner entfernt werden.",example:"Zielwahrscheinlichkeit 0.5 ⇒ Loss ≈0.693.",check:"Welcher Loss entsteht bei uniformer Verteilung über V Tokens?",sources:["a1"],aliases:"ce loss nll negative log likelihood token loss"},
      {id:"perplexity",cat:"Evaluation",title:"Perplexity",expr:"PPL = exp( (1/M) Σᵢ −log p(yᵢ|x&lt;ᵢ) ) = exp(L)",latex:"\\operatorname{PPL}=\\exp\\left(-\\frac1M\\sum_i\\log p(y_i\\mid x_{<i})\\right)",read:"Exponentiere die mittlere Token-NLL.",purpose:"Likelihood-basierte Modellgüte auf festem Korpus und Tokenizer.",dims:"Dimensionslose positive Zahl, mindestens 1.",vars:[["M","Zahl bewerteter Tokens"],["p","Zieltoken-Wahrscheinlichkeit"],["L","mittlere Cross-Entropy"]],intuition:"Effektive Verzweigungszahl pro Token.",pitfall:"Zwischen verschiedenen Tokenizern nicht direkt vergleichbar.",example:"Loss log(10) ⇒ PPL 10.",check:"Warum ist PPL bei Loss 0 gleich 1?",sources:["l12","a1"],aliases:"ppl evaluation likelihood"},
      {id:"embedding-params",cat:"Ressourcen",title:"Embedding-Parameter",expr:"N_embed = V · D",latex:"N_{\\text{embed}}=Vd_{\\text{model}}",read:"Vokabulargröße mal Modelldimension.",purpose:"Parameter- und Speicherrechnung für Token-Embedding; mit Weight Tying kann der Output-Head dieselbe Matrix nutzen.",dims:"Parameteranzahl; Bytes = N_embed×Bytes pro Element.",vars:[["V","Vokabulargröße"],["D","Modelldimension"]],intuition:"Für jedes Token eine D-dimensionale Zeile.",pitfall:"Ohne Weight Tying den LM-Head ein zweites Mal zählen.",example:"V=32k, D=4096 ⇒ rund 131M Parameter.",check:"Wie verändert Verdopplung von V die Sequenz- und Parameterkosten?",sources:["a1","l03"],aliases:"vocab embedding table lm head weight tying"},
      {id:"linear-params",cat:"Ressourcen",title:"Linear-Layer: Parameter & FLOPs",expr:"N = d_in·d_out (+ d_out);   FLOPs ≈ 2·B·T·d_in·d_out",latex:"N=d_{in}d_{out}+d_{out},\\quad F\\approx2BTd_{in}d_{out}",read:"Gewichtsmatrix plus optionaler Bias; Multiply-Add zählt ungefähr zwei FLOPs.",purpose:"Schnelle Plausibilitätsrechnung für Projektionen.",dims:"N ist Parameterzahl, FLOPs Operationen pro Forward.",vars:[["d_in","Inputfeatures"],["d_out","Outputfeatures"],["B","Batch"],["T","Tokens pro Sequenz"]],intuition:"Jedes Token nutzt dieselbe Matrix.",pitfall:"Forward- und Trainings-FLOPs nicht gleichsetzen.",example:"Biasfreie D×D-Projektion hat D² Parameter.",check:"Warum taucht T nicht in der Parameterzahl auf?",sources:["l02","a1"],aliases:"dense projection parameter count flops"},
      {id:"rmsnorm",cat:"Transformer",title:"RMSNorm",expr:"RMSNorm(x) = g ⊙ x / √( (1/D)Σⱼ xⱼ² + ε )",latex:"\\operatorname{RMSNorm}(x)=g\\odot\\frac{x}{\\sqrt{\\frac1D\\sum_jx_j^2+\\epsilon}}",read:"Teile durch die quadratische mittlere Größe und skaliere pro Feature.",purpose:"Stabilisiert Aktivierungsskalen ohne Mittelwertzentrierung.",dims:"Input und Output […]×D; g ∈ ℝ^D.",vars:[["x","Aktivierungsvektor"],["D","Featurebreite"],["g","lernbarer Scale"],["ε","Stabilitätskonstante"]],intuition:"Bringt die typische Vektorgröße auf eine kontrollierte Skala.",pitfall:"Über die letzte Featureachse, nicht Batch oder Tokens, normieren.",example:"Bei D=2, x=[3,4] ist RMS=√12.5.",check:"Welche Form muss g für Broadcasting haben?",sources:["a1","l03"],aliases:"root mean square normalization layer norm"},
      {id:"swiglu",cat:"Transformer",title:"SwiGLU",expr:"FFN(x) = W₂( SiLU(W₁x) ⊙ W₃x )",latex:"\\operatorname{FFN}(x)=W_2(\\operatorname{SiLU}(W_1x)\\odot W_3x)",read:"Ein SiLU-Gate multipliziert einen zweiten Featurezweig, danach Projektion zurück.",purpose:"Modernes positionsweises Feed-Forward-Netz.",dims:"x: […]×D → zwei Zweige […]×D_ff → Output […]×D.",vars:[["W₁,W₃","Up-/Gate-Projektionen"],["W₂","Down-Projektion"],["⊙","elementweise Multiplikation"]],intuition:"Das Gate entscheidet datenabhängig, welche erweiterten Features passieren.",pitfall:"Drei statt zwei Gewichtsmatrizen in der Parameterrechnung.",example:"Sequenzpositionen bleiben unabhängig; nur Features mischen sich.",check:"Welche Achse wird nicht gemischt?",sources:["a1","l03"],aliases:"mlp ffn silu glu feed forward"},
      {id:"rope",cat:"Transformer",title:"RoPE-Rotation",expr:"[x′₂ᵢ, x′₂ᵢ₊₁]ᵀ = R(θₚ,ᵢ)[x₂ᵢ, x₂ᵢ₊₁]ᵀ",latex:"x'_{(2i:2i+2)}=R(\\theta_{p,i})x_{(2i:2i+2)}",read:"Rotiere jedes Featurepaar mit einem positions- und frequenzabhängigen Winkel.",purpose:"Kodiert relative Position in Q·K-Dot-Products.",dims:"Form bleibt B×H×T×d_k; d_k muss paarweise zerlegbar sein.",vars:[["p","Tokenposition"],["i","Frequenzpaar"],["R(θ)","2×2-Rotationsmatrix"]],intuition:"Winkeldifferenzen tragen relative Distanz.",pitfall:"Nur Q und K rotieren; nicht V.",example:"Position 0 hat Winkel 0 und bleibt unverändert.",check:"Warum ist eine gerade Head-Dimension praktisch?",sources:["a1","l03"],aliases:"rotary positional embedding relative position rotation"},
      {id:"attention",cat:"Transformer",title:"Scaled Dot-Product Attention",expr:"Attention(Q,K,V) = softmax(QKᵀ / √dₖ) V",latex:"\\operatorname{Attention}(Q,K,V)=\\operatorname{softmax}\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right)V",read:"Berechne skalierte Query-Key-Scores, normalisiere über Keys und mische Values.",purpose:"Inhaltsabhängiger Informationsaustausch zwischen Sequenzpositionen.",dims:"Q: …×T_q×d_k; K,V: …×T_k×d_k/d_v; Scores: …×T_q×T_k; Output: …×T_q×d_v.",vars:[["Q","Queries: Gesuchtes"],["K","Keys: Angebotsbeschreibung"],["V","Values: übertragener Inhalt"],["dₖ","Key-/Head-Dimension"]],intuition:"Jede Query baut eine gewichtete Mischung aller erlaubten Values.",pitfall:"Softmax über T_k, nicht T_q.",example:"Identische Scores ergeben gleichmäßige Mittelung der Values.",check:"Warum teilt man durch √dₖ?",sources:["a1","l03"],aliases:"self attention q k v scaled dot product"},
      {id:"causal-attention",cat:"Transformer",title:"Kausale Attention-Maske",expr:"Sᵢⱼ = (qᵢ·kⱼ)/√dₖ + Mᵢⱼ,   Mᵢⱼ=0 für j≤i, sonst −∞",latex:"S_{ij}=q_i^Tk_j/\\sqrt{d_k}+M_{ij},\\quad M_{ij}=\\begin{cases}0&j\\le i\\\\-\\infty&j>i\\end{cases}",read:"Zukünftige Keypositionen erhalten vor Softmax unmögliche Scores.",purpose:"Verhindert Informationsleck beim Next-Token-Training.",dims:"M und S: T_q×T_k, über Batch/Köpfe gebroadcastet.",vars:[["i","Queryposition"],["j","Keyposition"],["M","additive Maske"]],intuition:"Zeile i darf nur Vergangenheit und Gegenwart sehen.",pitfall:"Maskieren mit 0 nach Softmax ist falsch.",example:"Zeile 0 hat nur Spalte 0 erlaubt.",check:"Welches Dreieck enthält −∞?",sources:["a1"],aliases:"mask triangular autoregressive future"},
      {id:"residual",cat:"Transformer",title:"Pre-Norm Residualupdate",expr:"x′ = x + F(Norm(x))",latex:"x'=x+F(\\operatorname{Norm}(x))",read:"Normalisiere den Seitenzweig, transformiere ihn und addiere ihn zum unveränderten Residualstrom.",purpose:"Erleichtert Optimierung tiefer Netze und bewahrt einen Identitätspfad.",dims:"x und F-Ausgabe müssen exakt gleiche Form besitzen.",vars:[["x","Residual Stream"],["F","Attention oder MLP"],["Norm","RMSNorm/LayerNorm"]],intuition:"Jeder Block schreibt eine Korrektur in einen stabilen Hauptstrom.",pitfall:"Nicht Norm(x) statt x als Residualbasis addieren.",example:"Zwei solcher Updates pro Transformer-Block.",check:"Wo liegt der direkte Gradientenpfad?",sources:["l03","a1"],aliases:"skip connection prenorm postnorm residual stream"},
      {id:"transformer-params",cat:"Ressourcen",title:"Grobe Transformer-Parameterzahl",expr:"N_non-embed ≈ 12 · L · D²",latex:"N_{\\text{non-embed}}\\approx12Ld_{\\text{model}}^2",read:"Zwölf mal Layerzahl mal Modelldimension zum Quadrat.",purpose:"Napkin Math für dichten Decoder mit Attention und etwa 4D-MLP.",dims:"Parameteranzahl; Architekturdetails ändern den Faktor.",vars:[["L","Anzahl Blöcke"],["D","Modelldimension"],["12","ca. 4D² Attention + 8D² MLP"]],intuition:"Breite kostet quadratisch, Tiefe linear.",pitfall:"Embeddings, GQA, SwiGLU-Breite und Bias können die Näherung ändern.",example:"L verdoppeln ⇒ N ungefähr doppelt; D verdoppeln ⇒ vierfach.",check:"Warum dominiert D²?",sources:["l02","a1"],aliases:"model size parameter count decoder 12ld2"},
      {id:"temperature",cat:"Sampling",title:"Temperatur",expr:"pᵢ(T) = softmax(zᵢ / T),   T&gt;0",latex:"p_i(T)=\\operatorname{softmax}(z_i/T)",read:"Teile Logits vor Softmax durch eine positive Temperatur.",purpose:"Steuert Schärfe und Diversität beim Sampling.",dims:"T dimensionsloser Skalar.",vars:[["zᵢ","Logit"],["T","Temperatur"],["pᵢ","angepasste Wahrscheinlichkeit"]],intuition:"T&lt;1 vergrößert Differenzen, T&gt;1 glättet.",pitfall:"T=0 nicht numerisch einsetzen; Greedy separat behandeln.",example:"T→∞ nähert sich uniform, T→0 konzentriert auf Maxima.",check:"Welche Richtung erhöht Diversität?",sources:["a1"],aliases:"sampling logits entropy decoding"},
      {id:"adamw",cat:"Optimierung",title:"AdamW-Update",expr:"mₜ=β₁mₜ₋₁+(1−β₁)gₜ;   vₜ=β₂vₜ₋₁+(1−β₂)gₜ²;   θₜ←(1−ηλ)θₜ₋₁−η m̂ₜ/(√v̂ₜ+ε)",latex:"m_t=\\beta_1m_{t-1}+(1-\\beta_1)g_t,\\quad v_t=\\beta_2v_{t-1}+(1-\\beta_2)g_t^2",read:"Glätte Richtung und Quadratgröße, korrigiere Startbias, normiere das Update und wende Weight Decay separat an.",purpose:"Adaptiver Standardoptimizer für Transformer-Training.",dims:"m,v,θ,g haben Parameterform; β,η,λ,ε sind Skalare.",vars:[["gₜ","Gradient"],["mₜ","erstes Moment"],["vₜ","zweites Rohmoment"],["β₁,β₂","Glättung"],["η","Lernrate"],["λ","Weight Decay"]],intuition:"Selten große Gradienten werden relativ gedämpft; konsistente Richtung akkumuliert.",pitfall:"m̂=m/(1−β₁ᵗ), v̂=v/(1−β₂ᵗ) nicht vergessen.",example:"Beim ersten Step ist Bias Correction besonders groß.",check:"Warum ist AdamW-Decay nicht derselbe Term wie L2 in Adam?",sources:["a1","l02"],aliases:"optimizer moment weight decay bias correction"},
      {id:"cosine-lr",cat:"Optimierung",title:"Warmup + Cosine Decay",expr:"η(t)=ηₘᵢₙ + ½(ηₘₐₓ−ηₘᵢₙ)[1+cos(π(t−T_w)/(T−T_w))]",latex:"\\eta(t)=\\eta_{min}+\\frac12(\\eta_{max}-\\eta_{min})\\left[1+\\cos\\left(\\pi\\frac{t-T_w}{T-T_w}\\right)\\right]",read:"Nach linearem Warmup fällt die Lernrate kosinusförmig vom Maximum zum Minimum.",purpose:"Stabile frühe Schritte und sanfter später Decay.",dims:"t,T,T_w in Optimizer-Steps; η ist Lernrate.",vars:[["T_w","Warmup-Steps"],["T","Gesamtsteps"],["η_max/min","Grenzlernrate"]],intuition:"Keine harte Kante im Decay; Steigung ist an beiden Enden null.",pitfall:"Für t&lt;T_w gilt eine separate lineare Formel.",example:"In der Mitte des Decays liegt η genau mittig zwischen min und max.",check:"Welche η gilt bei t=T?",sources:["a1","l11"],aliases:"learning rate scheduler warmup cosine"},
      {id:"gradient-clip",cat:"Optimierung",title:"Globales Norm-Clipping",expr:"g ← g · min(1, c/(||g||₂+ε))",latex:"g\\leftarrow g\\min\\left(1,\\frac{c}{\\lVert g\\rVert_2+\\epsilon}\\right)",read:"Skaliere alle Gradienten gemeinsam nur dann, wenn ihre globale Norm c überschreitet.",purpose:"Begrenzt extreme Updates, ohne Gradientenrichtung zu verändern.",dims:"c hat Einheit der Gradientennorm.",vars:[["g","Konkatenation aller Gradienten"],["c","maximale Norm"],["ε","Stabilisierung"]],intuition:"Ein langer Pfeil wird gekürzt, nicht komponentenweise gestutzt.",pitfall:"Bei Mixed Precision erst unscale, dann clip.",example:"||g||=10,c=1 ⇒ alle Komponenten ×0.1.",check:"Warum bleibt der Winkel gleich?",sources:["a1"],aliases:"clip grad norm exploding gradient"},
      {id:"global-batch",cat:"Training",title:"Globale Batchgröße",expr:"B_global = B_micro · G_accum · W",latex:"B_{global}=B_{micro}G_{accum}W",read:"Microbatch pro Rank mal Accumulation-Steps mal World Size.",purpose:"Verbindet Datenmenge pro Optimizer-Step mit verteiltem Setup.",dims:"Anzahl Sequenzen; Tokens pro Step zusätzlich ×T.",vars:[["B_micro","Sequenzen pro Forward und Rank"],["G_accum","Gradient-Accumulation"],["W","Anzahl Data-Parallel-Ranks"]],intuition:"Alle Beiträge werden vor einem gemeinsamen Update zusammengeführt.",pitfall:"Bei Tensorparallelismus erhöht nicht jeder Rank die Datenbatchgröße.",example:"2×8×16=256 Sequenzen global.",check:"Welche Parallelitätsachse gehört in W?",sources:["a1","l07","a2"],aliases:"batch accumulation world size tokens per step"},
      {id:"training-flops",cat:"Ressourcen",title:"Training-Compute",expr:"C ≈ 6 · N · D_tokens",latex:"C\\approx6ND",read:"Ungefähr sechs FLOPs pro Parameter und Trainingstoken.",purpose:"Grobe Compute- und Scaling-Rechnung für dichte Transformer.",dims:"C in FLOPs, N Parameter, D_tokens Tokenzahl.",vars:[["C","gesamter Trainingscompute"],["N","Nicht-Embedding- oder Modellparameter je Konvention"],["D_tokens","verarbeitete Tokens"]],intuition:"Forward etwa 2N, Backward grob doppelt so viel zusätzlich.",pitfall:"Konvention für N und Attention-Zusatzkosten offenlegen.",example:"Verdopple Tokens ⇒ ungefähr doppelter Compute.",check:"Woher kommt der Faktor 6 grob?",sources:["l02","l09","a3"],aliases:"6nd compute flops tokens model size"},
      {id:"mfu",cat:"Ressourcen",title:"MFU (Model FLOPs Utilization)",expr:"MFU = modellierte FLOP/s ÷ Hardware-Peak-FLOP/s",latex:"\\operatorname{MFU}=\\frac{\\text{model FLOP/s}}{\\text{peak hardware FLOP/s}}",read:"Teile nützliche modellierte Rechenrate durch theoretische Peakrate.",purpose:"Vergleicht End-to-End-Trainingseffizienz grob über Setups.",dims:"Dimensionsloser Anteil oder Prozent.",vars:[["Model FLOP/s","nach Konvention gezählte LM-Operationen pro Sekunde"],["Peak","Hardwaremaximum für passenden Datentyp"]],intuition:"Wie viel des idealisierten Rechendachs wird als Modellarbeit umgesetzt?",pitfall:"Andere FLOP-Konventionen oder sparsity machen Vergleiche schief.",example:"400 TFLOP/s bei 1000 Peak ⇒ 40% MFU.",check:"Warum kann schlechte Datenpipeline MFU senken?",sources:["l02","a2"],aliases:"model flops utilization throughput efficiency"},
      {id:"speedup",cat:"Systems",title:"Speedup & Skalierungseffizienz",expr:"S(p)=T₁/Tₚ;   E(p)=S(p)/p",latex:"S(p)=T_1/T_p,\\quad E(p)=S(p)/p",read:"Speedup vergleicht Laufzeit; Effizienz teilt zusätzlich durch Ressourcenzahl p.",purpose:"Bewertet parallele Beschleunigung.",dims:"Beide dimensionslos; T in gleicher Zeiteinheit.",vars:[["p","Geräte/Prozesse"],["T₁","Laufzeit auf einer Ressource"],["Tₚ","Laufzeit auf p Ressourcen"]],intuition:"Linearer Speedup p bedeutet 100% Skalierungseffizienz.",pitfall:"Strong und Weak Scaling nicht vermischen.",example:"1 GPU 8s, 4 GPUs 2.5s ⇒ S=3.2,E=80%.",check:"Warum kann E mit p sinken?",sources:["l06","l07","a2"],aliases:"parallel scaling strong weak efficiency amdahl"},
      {id:"arithmetic-intensity",cat:"GPU",title:"Arithmetic Intensity",expr:"AI = FLOPs / Bytes aus langsamem Speicher",latex:"AI=\\frac{\\text{FLOPs}}{\\text{bytes transferred}}",read:"Nützliche Rechenoperationen pro übertragenem Byte.",purpose:"Klassifiziert, ob ein Kernel eher Bandbreite oder Rechenleistung braucht.",dims:"FLOPs/Byte.",vars:[["FLOPs","Operationen"],["Bytes","relevanter Speichertraffic, meist HBM"]],intuition:"Daten oft wiederverwenden, bevor sie zurück ins langsame HBM gehen.",pitfall:"Welche Cacheebene gezählt wird, muss benannt sein.",example:"200 FLOPs bei 100 Byte ⇒ AI=2 FLOPs/Byte.",check:"Warum erhöht Fusion meist AI?",sources:["l05","a2"],aliases:"compute intensity operational intensity bytes memory"},

      {id:"online-softmax",cat:"GPU",title:"Online Softmax-Update",expr:"m′=max(m,m_b);   ℓ′=e^(m−m′)ℓ + Σⱼ e^(sⱼ−m′)",latex:"m'=\\max(m,m_b),\\quad \\ell'=e^{m-m'}\\ell+\\sum_j e^{s_j-m'}",read:"Aktualisiere laufendes Maximum und reskaliere die bisherige Normierung, bevor ein neuer Block addiert wird.",purpose:"Ermöglicht exakte blockweise Softmax in FlashAttention.",dims:"m,ℓ skalar pro Queryzeile; s_j Block-Scores.",vars:[["m","bisheriges Maximum"],["m_b","Blockmaximum"],["ℓ","bisherige Exponentialsumme"],["sⱼ","neue Scores"]],intuition:"Wenn ein größeres Maximum erscheint, müssen alte Beiträge in die neue Skala umgerechnet werden.",pitfall:"Output-Akkumulator muss mit demselben Faktor reskaliert werden.",example:"Neues Maximum +2 ⇒ alte exp-Summe ×e⁻².",check:"Welche zwei Statistiken reichen für die Normalisierung?",sources:["a2","l05"],aliases:"flash attention running max sum logsumexp"},

      {id:"logistic",cat:"Daten",title:"Logistische Wahrscheinlichkeit",expr:"p(y=1|x)=σ(wᵀx+b)=1/(1+e^(−(wᵀx+b)))",latex:"p(y=1\\mid x)=\\sigma(w^Tx+b)",read:"Eine lineare Scorefunktion wird durch Sigmoid auf 0 bis 1 abgebildet.",purpose:"Einfaches Modell für Qualitäts- oder Sprachklassifikation.",dims:"x Featurevektor, w gleichförmig, p dimensionslos.",vars:[["x","Dokumentfeatures"],["w,b","gelernte Parameter"],["σ","Sigmoid"]],intuition:"Große positive Scores bedeuten hohe Klassenwahrscheinlichkeit.",pitfall:"Kalibrierung und Schwelle sind getrennte Fragen.",example:"Score 0 ⇒ p=0.5.",check:"Was ändert eine strengere Schwelle an Precision/Recall?",sources:["a4"],aliases:"sigmoid classifier probability quality filter"},
      {id:"precision-recall",cat:"Evaluation",title:"Precision & Recall",expr:"Precision=TP/(TP+FP);   Recall=TP/(TP+FN)",latex:"P=\\frac{TP}{TP+FP},\\quad R=\\frac{TP}{TP+FN}",read:"Precision fragt: Wie viele gefundene sind richtig? Recall: Wie viele richtige wurden gefunden?",purpose:"Bewertet Filter, Safety- und PII-Erkennung.",dims:"Anteile zwischen 0 und 1.",vars:[["TP","korrekt positiv"],["FP","falsch positiv"],["FN","übersehen positiv"]],intuition:"Strengere Filter erhöhen oft Precision und senken Recall – oder umgekehrt je nach Positivdefinition.",pitfall:"Positivklasse explizit benennen; bei Datenfiltern kann „behalten“ oder „entfernen“ positiv sein.",example:"8 TP,2 FP,4 FN ⇒ P=.8,R=.667.",check:"Welcher Fehler ist bei PII riskanter?",sources:["a4","l12"],aliases:"classification metric false positive false negative"},

      {id:"minhash",cat:"Daten",title:"MinHash-Eigenschaft",expr:"P[h_min(A)=h_min(B)] = J(A,B)",latex:"\\Pr[h_{min}(A)=h_{min}(B)]=J(A,B)",read:"Die Wahrscheinlichkeit gleicher MinHash-Werte entspricht der Jaccard-Ähnlichkeit.",purpose:"Schätzt Mengenähnlichkeit mit kompakter Signatur.",dims:"Wahrscheinlichkeit/Anteil.",vars:[["h_min","Minimum unter zufälliger Permutation/Hashordnung"],["J","Jaccard"]],intuition:"Das kleinste Element der Vereinigung liegt mit Jaccard-Wahrscheinlichkeit im Schnitt.",pitfall:"Eine Hashfunktion ist ein sehr verrauschter Schätzer; Signatur nutzt viele.",example:"100 Komponenten, 80 gleich ⇒ Schätzer 0.8.",check:"Warum braucht man unabhängige Hashordnungen?",sources:["a4"],aliases:"near duplicate signature hash jaccard"},

      {id:"accuracy-se",cat:"Evaluation",title:"Accuracy & Standardfehler",expr:"Acc=k/n;   SE≈√(Acc(1−Acc)/n)",latex:"\\hat p=k/n,\\quad SE\\approx\\sqrt{\\hat p(1-\\hat p)/n}",read:"Trefferanteil plus approximative Stichprobenunsicherheit.",purpose:"Zeigt, ob kleine Benchmarkunterschiede plausibel messbar sind.",dims:"Anteile; n Zahl unabhängiger Aufgaben.",vars:[["k","korrekte Antworten"],["n","Aufgaben"],["SE","Standardfehler"]],intuition:"Mehr Beispiele senken Unsicherheit ungefähr mit 1/√n.",pitfall:"Aufgaben sind nicht immer unabhängig; Prompt-/Samplingvarianz kommt zusätzlich.",example:"Acc=.5,n=100 ⇒ SE≈.05.",check:"Wie vervierfachte n den SE?",sources:["l12","a5s"],aliases:"benchmark confidence uncertainty binomial"},
      {id:"sft-loss",cat:"Alignment",title:"SFT-Loss mit Antwortmaske",expr:"L_SFT = − Σₜ mₜ log πθ(yₜ|x,y&lt;ₜ) / Σₜ mₜ",latex:"\\mathcal L_{SFT}=-\\frac{\\sum_tm_t\\log\\pi_\\theta(y_t\\mid x,y_{<t})}{\\sum_tm_t}",read:"Cross-Entropy nur über die durch m markierten Antworttokens.",purpose:"Supervised Fine-Tuning (SFT) auf Instruktionsdaten.",dims:"Loss dimensionslos; m_t ∈ {0,1}.",vars:[["x","Prompt"],["y","Antwort"],["mₜ","Loss-Maske"],["πθ","Policy/LM"]],intuition:"Prompt liefert Kontext; das gewünschte Verhalten wird in der Antwort imitiert.",pitfall:"Chat-Template- und Paddingtokens korrekt maskieren.",example:"Nur drei Antworttokens ⇒ Nenner 3.",check:"Wann könnte man Prompttokens bewusst mittrainieren?",sources:["l15","a5s"],aliases:"supervised fine tuning instruction loss response mask"},
      {id:"bradley-terry",cat:"Alignment",title:"Bradley-Terry-Präferenzmodell",expr:"P(y⁺ ≻ y⁻ | x)=σ(r(x,y⁺)−r(x,y⁻))",latex:"P(y^+\\succ y^-\\mid x)=\\sigma(r(x,y^+)-r(x,y^-))",read:"Sigmoid der Reward-Differenz gibt die Wahrscheinlichkeit der beobachteten Präferenz.",purpose:"Trainiert Reward Models aus Antwortpaaren.",dims:"Rewards skalare Scores; Wahrscheinlichkeit 0 bis 1.",vars:[["y⁺","bevorzugte Antwort"],["y⁻","abgelehnte Antwort"],["r","Reward Model"]],intuition:"Nur relative Ordnung, nicht absoluter Nullpunkt, ist identifizierbar.",pitfall:"Beide Antworten müssen zum selben Prompt gehören.",example:"Gleiche Rewards ⇒ Präferenzwahrscheinlichkeit .5.",check:"Was passiert, wenn zu beiden Rewards dieselbe Konstante addiert wird?",sources:["l15","a5s"],aliases:"reward model preference pairwise sigmoid chosen rejected"},
      {id:"kl",cat:"Alignment",title:"KL-Divergenz",expr:"D_KL(p||q)=Σₓ p(x) log[p(x)/q(x)]",latex:"D_{KL}(p\\Vert q)=\\sum_xp(x)\\log\\frac{p(x)}{q(x)}",read:"Erwarteter Log-Wahrscheinlichkeitsunterschied unter p.",purpose:"Misst gerichtete Verteilungsabweichung, etwa Policy von Referenz.",dims:"Nats bei natürlichem Log; nicht negativ.",vars:[["p","erste Verteilung"],["q","Referenzverteilung"]],intuition:"Teuer, wenn p Masse legt, wo q wenig erwartet.",pitfall:"Nicht symmetrisch; D_KL(p||q) ≠ D_KL(q||p).",example:"p=q ⇒ KL=0.",check:"Warum kann KL unendlich werden?",sources:["l15","a5s"],aliases:"kullback leibler divergence reference policy regularization"},
