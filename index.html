<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Interactive learning companion for Stanford CS336 Language Models from Scratch">
  <meta name="theme-color" content="#09111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CS336">
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>CS336 Learning Lab - Language Models from Scratch</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111f;
      --surface: #111c2f;
      --surface-2: #17243a;
      --surface-3: #20304a;
      --text: #f4f7fb;
      --muted: #a7b5ca;
      --border: #2a3b57;
      --control-border: #61738f;
      --primary: #74a7ff;
      --on-primary: #07111f;
      --focus-ring: #74a7ff;
      --primary-soft: rgba(116, 167, 255, .14);
      --accent: #59d8c5;
      --accent-soft: rgba(89, 216, 197, .12);
      --warning: #f0bd68;
      --danger: #ff8b98;
      --success: #72d6a0;
      --shadow: 0 18px 50px rgba(0, 0, 0, .24);
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #edf2f8;
      --surface-3: #e5ecf5;
      --text: #142033;
      --muted: #5c6d83;
      --border: #d5dfeb;
      --control-border: #718096;
      --primary: #315fbb;
      --on-primary: #ffffff;
      --focus-ring: #315fbb;
      --primary-soft: rgba(49, 95, 187, .1);
      --accent: #087f72;
      --accent-soft: rgba(8, 127, 114, .1);
      --warning: #825300;
      --danger: #bb3042;
      --success: #176c42;
      --shadow: 0 18px 50px rgba(34, 54, 83, .1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(5.5rem + env(safe-area-inset-top)); }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 4%, var(--primary-soft), transparent 28rem),
        radial-gradient(circle at 85% 15%, var(--accent-soft), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.58;
    }

    button, input, select, textarea { font: inherit; }
    a { color: var(--primary); }
    code, .mono { font-family: var(--mono); }
    code {
      padding: .1rem .35rem;
      border-radius: 6px;
      background: var(--surface-3);
      color: var(--text);
    }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, main:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }
    button:active, summary:active, a:active { transform: translateY(1px); }
    ::selection { background: var(--primary); color: var(--bg); }

    .skip-link {
      position: fixed;
      z-index: 200;
      top: max(.65rem, env(safe-area-inset-top));
      left: max(.65rem, env(safe-area-inset-left));
      padding: .7rem 1rem;
      border: 2px solid var(--focus-ring);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      transform: translateY(-180%);
    }
    .skip-link:focus { transform: translateY(0); }

    .app-shell {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding: calc(1.35rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) calc(1.35rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
      z-index: 20;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .2rem .45rem .7rem;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(145deg, var(--primary), var(--accent));
      color: var(--on-primary);
      font-family: var(--mono);
      font-weight: 800;
      box-shadow: 0 9px 24px color-mix(in srgb, var(--primary), transparent 65%);
    }

    .brand strong { display: block; font-size: 1rem; letter-spacing: -.02em; }
    .brand span { display: block; color: var(--muted); font-size: .72rem; }

    .nav-list { display: grid; gap: .3rem; }
    .nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .68rem .8rem;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-button:hover { background: var(--surface-2); color: var(--text); }
    .nav-button.is-active {
      border-color: color-mix(in srgb, var(--primary), transparent 62%);
      background: var(--primary-soft);
      color: var(--text);
    }
    .nav-icon { width: 1.35rem; text-align: center; font-family: var(--mono); color: var(--primary); }

    .sidebar-progress {
      margin-top: auto;
      padding: .9rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .sidebar-progress .label-row { display: flex; justify-content: space-between; color: var(--muted); font-size: .78rem; }

    .progress-track {
      height: 8px;
      margin-top: .55rem;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-3);
    }
    .progress-bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width .35s ease;
    }

    .main-shell { min-width: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      display: grid;
      grid-template-columns: minmax(240px, 620px) auto;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: calc(1rem + env(safe-area-inset-top)) max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-right)) 1rem max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-left));
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 84%, transparent);
      backdrop-filter: blur(18px);
    }

    .search-wrap, .search-field { position: relative; min-width: 0; }
    .search-input {
      width: 100%;
      padding: .72rem 1rem .72rem 2.65rem;
      border: 1px solid var(--control-border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }
    .search-input::placeholder { color: var(--muted); }
    .search-glyph { position: absolute; left: .95rem; top: .73rem; color: var(--muted); }
    .search-results {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + .45rem);
      max-height: min(60vh, 520px);
      overflow: auto;
      border: 1px solid var(--control-border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      z-index: 30;
    }
    .search-results[hidden] { display: none; }
    .search-result {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .75rem;
      padding: .75rem .9rem;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    .search-result:last-child { border-bottom: 0; }
    .search-result:hover, .search-result:active, .search-result.is-active, .search-result[aria-selected="true"] { background: var(--surface-2); }
    .result-type { color: var(--accent); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
    .result-copy { min-width: 0; }
    .result-copy strong, .result-copy small { overflow-wrap: anywhere; }
    .result-copy small { display: block; color: var(--muted); }
    .search-empty { padding: 1rem; }

    .toolbar { display: flex; gap: .5rem; }
    .account-button { position: relative; }
    .account-button::after {
      content: "";
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--muted);
    }
    .account-button[data-cloud-status="synced"]::after { background: var(--success); }
    .account-button[data-cloud-status="syncing"]::after { background: var(--warning); }
    .account-button[data-cloud-status="offline"]::after,
    .account-button[data-cloud-status="error"]::after { background: var(--danger); }
    .icon-button, .button, .chip, .seg-button {
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .icon-button { width: 44px; height: 44px; display: grid; place-items: center; }
    .language-button { font-size: .76rem; font-weight: 800; letter-spacing: .04em; }
    .icon-button:hover, .button:hover, .chip:hover, .seg-button:hover { border-color: var(--primary); }
    .button { padding: .6rem .9rem; font-weight: 650; }
    .button.primary { border-color: transparent; background: var(--primary); color: var(--on-primary); }
    .button.ghost { background: transparent; }
    .button.danger { color: var(--danger); }
    .button.small { padding: .42rem .65rem; font-size: .82rem; }
    .button[disabled] { opacity: .45; cursor: not-allowed; }

    main { width: min(1480px, 100%); margin: 0 auto; padding: 2rem max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-right)) calc(5rem + env(safe-area-inset-bottom)) max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-left)); scroll-margin-top: calc(5.5rem + env(safe-area-inset-top)); }
    .view[hidden] { display: none; }
    .view-header { margin-bottom: 1.6rem; }
    .eyebrow { margin: 0 0 .35rem; color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1, h2, h3, h4 { margin-top: 0; line-height: 1.2; letter-spacing: -.025em; }
    h1 { margin-bottom: .55rem; font-size: clamp(2rem, 5vw, 3.65rem); max-width: 20ch; }
    h2 { margin-bottom: .7rem; font-size: clamp(1.45rem, 2.5vw, 2rem); }
    h3 { margin-bottom: .5rem; font-size: 1.12rem; }
    p { margin-top: 0; }
    .lede { max-width: 78ch; color: var(--muted); font-size: 1.04rem; }
    .muted { color: var(--muted); }
    .small { font-size: .82rem; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(280px, .7fr);
      gap: 1.25rem;
      align-items: stretch;
      margin-bottom: 1.5rem;
    }
    .hero-main {
      position: relative;
      overflow: hidden;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      border: 1px solid var(--control-border);
      border-radius: 24px;
      background: linear-gradient(145deg, var(--surface), color-mix(in srgb, var(--surface-2), var(--primary) 8%));
      box-shadow: var(--shadow);
    }
    .hero-main::after {
      content: "Σ  ∇  QKᵀ  π  ⊕";
      position: absolute;
      right: -1rem;
      bottom: -1.4rem;
      color: color-mix(in srgb, var(--primary), transparent 87%);
      font: 800 clamp(2rem, 7vw, 6rem)/1 var(--mono);
      transform: rotate(-6deg);
      pointer-events: none;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.2rem; }
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .panel { padding: clamp(1rem, 2.5vw, 1.5rem); }
    .panel + .panel { margin-top: 1rem; }

    .section-row { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin: 2rem 0 1rem; }
    .section-row h2 { margin: 0; }
    .section-row p { margin: .25rem 0 0; color: var(--muted); }

    .card-actions, .filter-row, .meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: .55rem; }
    .module-index { color: var(--accent); font: 800 .8rem var(--mono); }
    .meta-row { color: var(--muted); font-size: .78rem; }

    .tag, .chip, .badge {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      width: fit-content;
      padding: .22rem .52rem;
      border-radius: 999px;
      font-size: .72rem;
    }
    .tag, .badge { border: 1px solid var(--border); color: var(--muted); background: var(--surface-2); }
    .badge.primary { border-color: color-mix(in srgb, var(--primary), transparent 55%); color: var(--primary); background: var(--primary-soft); }
    .badge.accent { border-color: color-mix(in srgb, var(--accent), transparent 55%); color: var(--accent); background: var(--accent-soft); }
    .chip { padding: .42rem .72rem; }
    .chip.is-active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

    .timeline { position: relative; display: grid; gap: 1rem; margin-left: .5rem; }
    .timeline::before { content: ""; position: absolute; left: 18px; top: 22px; bottom: 22px; width: 2px; background: var(--border); }
    .timeline-item { position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 1rem; }
    .timeline-marker { z-index: 1; width: 38px; height: 38px; display: grid; place-items: center; border: 2px solid var(--border); border-radius: 50%; background: var(--bg); color: var(--muted); font: 800 .76rem var(--mono); }
    .timeline-marker.done { border-color: var(--success); color: var(--success); }
    .timeline-marker.active { border-color: var(--warning); color: var(--warning); }
    .timeline-content { padding: .2rem 0 1rem; }

    .filters {
      display: grid;
      grid-template-columns: minmax(200px, 1fr) auto;
      gap: .8rem;
      margin: 1rem 0 1.25rem;
    }
    .filter-row { justify-content: flex-end; }
    .input, .select, .textarea {
      width: 100%;
      padding: .68rem .78rem;
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }
    .textarea { min-height: 140px; resize: vertical; }
    .field { display: grid; gap: .35rem; }
    .field label, label.field { color: var(--muted); font-size: .82rem; }
    .field output { color: var(--text); font-family: var(--mono); }
    input[type="range"] { width: 100%; accent-color: var(--primary); }

    .detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 1.25rem; align-items: start; }
    .detail-body { min-width: 0; }
    .detail-aside { position: sticky; top: 88px; display: grid; gap: .8rem; }
    .detail-section { margin-bottom: 1.5rem; }
    .detail-section h3 { padding-bottom: .45rem; border-bottom: 1px solid var(--border); }
    .reading-section { padding-block: .25rem 1.35rem; border-bottom: 1px solid var(--border); }
    .reading-section + .reading-section { padding-top: 1.35rem; }
    .callout { padding: .9rem 1rem; border-left: 4px solid var(--primary); border-radius: 0 12px 12px 0; background: var(--primary-soft); }
    .callout.warning { border-color: var(--warning); background: color-mix(in srgb, var(--warning), transparent 90%); }
    .callout.accent { border-color: var(--accent); background: var(--accent-soft); }
    .check-list { display: grid; gap: .55rem; padding: 0; list-style: none; }
    .check-list li { display: grid; grid-template-columns: 1.25rem 1fr; gap: .5rem; }
    .check-list li::before { content: "→"; color: var(--accent); font-family: var(--mono); }
    .self-check-list { display: grid; gap: 1.1rem; padding-left: 1.4rem; }
    .self-check-list > li { padding-left: .25rem; }
    .self-check-question { margin: 0 0 .45rem; font-weight: 650; }
    .answer-disclosure { padding-left: .85rem; border-left: 2px solid var(--border); }
    .answer-disclosure > summary {
      display: flex;
      align-items: center;
      width: fit-content;
      min-height: 44px;
      color: var(--primary);
      font-weight: 650;
      cursor: pointer;
    }
    .answer-disclosure[open] > summary { margin-bottom: .35rem; }
    .answer-disclosure > p { max-width: 78ch; margin-bottom: .35rem; }
    .answer-disclosure + .button { margin-top: .65rem; }
    .detail-pagination { display: flex; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--border); }
    .detail-next {
      display: grid;
      gap: .15rem;
      width: min(100%, 34rem);
      padding: .8rem 1rem;
      text-align: left;
    }
    .detail-next-label { font: 800 .75rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .detail-next-title { font-size: 1rem; }
    .source-link { display: inline-flex; align-items: center; gap: .35rem; font-size: .82rem; }
    button.source-link { min-height: 24px; padding: 0; border: 0; background: transparent; color: var(--primary); text-align: left; cursor: pointer; }

    .formula-display {
      overflow: visible;
      padding: .9rem;
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font: 650 1rem/1.65 var(--mono);
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .formula-vars { display: grid; grid-template-columns: auto 1fr; gap: .3rem .7rem; margin: 0; font-size: .82rem; }
    .formula-vars dt { color: var(--accent); font-family: var(--mono); }
    .formula-vars dd { margin: 0; color: var(--muted); }
    .symbol { color: var(--accent); font: 700 1.05rem var(--mono); }

    .hero.is-single { display: block; }
    .next-focus {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: .3rem .8rem;
      max-width: 820px;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .next-focus span { color: var(--muted); }
    .next-focus strong { font-size: 1.05rem; }
    .next-focus .next-focus-label { color: var(--accent); font: 800 .76rem var(--mono); text-transform: uppercase; letter-spacing: .08em; }

    .progress-strip {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0 1.5rem;
      padding: .85rem 0;
      border-block: 1px solid var(--border);
    }
    .progress-strip-main { min-width: 0; }
    .progress-strip-label { display: flex; justify-content: space-between; gap: 1rem; }
    .progress-strip-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem 1rem; color: var(--muted); font-size: .82rem; }

    .collection-list, .accordion-list { border-top: 1px solid var(--border); }
    .compact-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-width: 0;
      border-bottom: 1px solid var(--border);
      transition: background .15s ease;
    }
    .compact-row:hover { background: var(--surface-2); }
    .compact-row-main {
      min-width: 0;
      padding: .85rem .75rem;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .compact-row-actions { display: flex; align-items: center; gap: .4rem; padding-right: .65rem; }
    .compact-row-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: .35rem .7rem; }
    .compact-row-title { font-weight: 750; }
    .compact-row-summary {
      display: -webkit-box;
      margin-top: .25rem;
      overflow: hidden;
      color: var(--muted);
      font-size: .86rem;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .compact-row-meta { color: var(--muted); font-size: .76rem; }

    .quick-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border); }
    .quick-action {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: .2rem .7rem;
      padding: 1rem .75rem;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .quick-action + .quick-action { border-left: 1px solid var(--border); }
    .quick-action:hover { background: var(--surface-2); }
    .quick-action-icon { grid-row: 1 / 3; color: var(--primary); font: 800 1.1rem var(--mono); }
    .quick-action small { color: var(--muted); }

    .accordion-item, .group-disclosure, .timeline-disclosure { border-bottom: 1px solid var(--border); }
    .accordion-item > summary, .group-disclosure > summary, .timeline-disclosure > summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: .8rem;
      min-height: 58px;
      padding: .8rem .75rem;
      list-style: none;
      cursor: pointer;
      transition: background .15s ease;
    }
    .accordion-item > summary::-webkit-details-marker, .group-disclosure > summary::-webkit-details-marker, .timeline-disclosure > summary::-webkit-details-marker { display: none; }
    .accordion-item > summary:hover, .group-disclosure > summary:hover, .timeline-disclosure > summary:hover { background: var(--surface-2); }
    .accordion-chevron { color: var(--muted); transition: transform .18s ease; }

      {id:"swiglu",cat:"Transformer",title:"SwiGLU",expr:"FFN(x) = W₂( SiLU(W₁x) ⊙ W₃x )",latex:"\\operatorname{FFN}(x)=W_2(\\operatorname{SiLU}(W_1x)\\odot W_3x)",read:"Ein SiLU-Gate multipliziert einen zweiten Featurezweig; ein dritter Linear Layer bildet das Ergebnis zurück auf D.",purpose:"Modernes positionsweises Feed-Forward Network (FFN).",dims:"x: […]×D → zwei Zweige […]×D_ff → Output […]×D.",vars:[["W₁,W₃","Up und Gate Linear Layers"],["W₂","Down Linear Layer"],["⊙","elementweise Multiplikation"]],intuition:"Das Gate entscheidet datenabhängig, welche erweiterten Features passieren.",pitfall:"Drei statt zwei Gewichtsmatrizen in der Parameterrechnung.",example:"Sequenzpositionen bleiben unabhängig; nur Features mischen sich.",check:"Welche Achse wird nicht gemischt?",sources:["a1","l03"],aliases:"mlp ffn silu glu feed forward"},
      {id:"rope",cat:"Transformer",title:"RoPE-Rotation",expr:"[x′₂ᵢ, x′₂ᵢ₊₁]ᵀ = R(θₚ,ᵢ)[x₂ᵢ, x₂ᵢ₊₁]ᵀ",latex:"x'_{(2i:2i+2)}=R(\\theta_{p,i})x_{(2i:2i+2)}",read:"Rotiere jedes Featurepaar mit einem positions- und frequenzabhängigen Winkel.",purpose:"Kodiert relative Position in Q·K-Dot-Products.",dims:"Form bleibt B×H×T×d_k; d_k muss paarweise zerlegbar sein.",vars:[["p","Tokenposition"],["i","Frequenzpaar"],["R(θ)","2×2-Rotationsmatrix"]],intuition:"Winkeldifferenzen tragen relative Distanz.",pitfall:"Nur Q und K rotieren; nicht V.",example:"Position 0 hat Winkel 0 und bleibt unverändert.",check:"Warum ist eine gerade Head-Dimension praktisch?",sources:["a1","l03"],aliases:"rotary positional embedding relative position rotation"},
      {id:"attention",cat:"Transformer",title:"Scaled Dot-Product Attention",expr:"Attention(Q,K,V) = softmax(QKᵀ / √dₖ) V",latex:"\\operatorname{Attention}(Q,K,V)=\\operatorname{softmax}\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right)V",read:"Berechne skalierte Query-Key-Scores, normalisiere über Keys und mische Values.",purpose:"Inhaltsabhängiger Informationsaustausch zwischen Sequenzpositionen.",dims:"Q: …×T_q×d_k; K,V: …×T_k×d_k/d_v; Scores: …×T_q×T_k; Output: …×T_q×d_v.",vars:[["Q","Queries: Gesuchtes"],["K","Keys: Angebotsbeschreibung"],["V","Values: übertragener Inhalt"],["dₖ","Key beziehungsweise Head Dimension"]],intuition:"Jede Query baut eine gewichtete Mischung aller erlaubten Values.",pitfall:"Softmax über T_k, nicht T_q.",example:"Identische Scores ergeben gleichmäßige Mittelung der Values.",check:"Warum teilt man durch √dₖ?",sources:["a1","l03"],aliases:"self attention q k v scaled dot product"},
      {id:"causal-attention",cat:"Transformer",title:"Kausale Attention-Maske",expr:"Sᵢⱼ = (qᵢ·kⱼ)/√dₖ + Mᵢⱼ,   Mᵢⱼ=0 für j≤i, sonst −∞",latex:"S_{ij}=q_i^Tk_j/\\sqrt{d_k}+M_{ij},\\quad M_{ij}=\\begin{cases}0&j\\le i\\\\-\\infty&j>i\\end{cases}",read:"Zukünftige Keypositionen erhalten vor Softmax unmögliche Scores.",purpose:"Verhindert Informationsleck beim Next-Token-Training.",dims:"M und S: T_q×T_k, über Batch und Attention Heads gebroadcastet.",vars:[["i","Queryposition"],["j","Keyposition"],["M","additive Maske"]],intuition:"Zeile i darf nur Vergangenheit und Gegenwart sehen.",pitfall:"Maskieren mit 0 nach Softmax ist falsch.",example:"Zeile 0 hat nur Spalte 0 erlaubt.",check:"Welches Dreieck enthält −∞?",sources:["a1"],aliases:"mask triangular autoregressive future"},
      {id:"residual",cat:"Transformer",title:"Pre-Norm Residualupdate",expr:"x′ = x + F(Norm(x))",latex:"x'=x+F(\\operatorname{Norm}(x))",read:"Normalisiere den Seitenzweig, transformiere ihn und addiere ihn zum unveränderten Residualstrom.",purpose:"Erleichtert Optimierung tiefer Netze und bewahrt einen Identitätspfad.",dims:"x und F-Ausgabe müssen exakt gleiche Form besitzen.",vars:[["x","Residual Stream"],["F","Attention oder MLP"],["Norm","RMSNorm/LayerNorm"]],intuition:"Jeder Block schreibt eine Korrektur in einen stabilen Hauptstrom.",pitfall:"Nicht Norm(x) statt x als Residualbasis addieren.",example:"Zwei solcher Updates pro Transformer-Block.",check:"Wo liegt der direkte Gradientenpfad?",sources:["l03","a1"],aliases:"skip connection prenorm postnorm residual stream"},
      {id:"transformer-params",cat:"Ressourcen",title:"Grobe Transformer-Parameterzahl",expr:"N_non-embed ≈ 12 · L · D²",latex:"N_{\\text{non-embed}}\\approx12Ld_{\\text{model}}^2",read:"Zwölf mal Layerzahl mal Modelldimension zum Quadrat.",purpose:"Napkin Math für dichten Decoder mit Attention und etwa 4D-MLP.",dims:"Parameteranzahl; Architekturdetails ändern den Faktor.",vars:[["L","Anzahl Blöcke"],["D","Modelldimension"],["12","ca. 4D² Attention + 8D² MLP"]],intuition:"Breite kostet quadratisch, Tiefe linear.",pitfall:"Embeddings, GQA, SwiGLU-Breite und Bias können die Näherung ändern.",example:"L verdoppeln ⇒ N ungefähr doppelt; D verdoppeln ⇒ vierfach.",check:"Warum dominiert D²?",sources:["l02","a1"],aliases:"model size parameter count decoder 12ld2"},
      {id:"temperature",cat:"Sampling",title:"Temperatur",expr:"pᵢ(T) = softmax(zᵢ / T),   T&gt;0",latex:"p_i(T)=\\operatorname{softmax}(z_i/T)",read:"Teile Logits vor Softmax durch eine positive Temperatur.",purpose:"Steuert Schärfe und Diversität beim Sampling.",dims:"T dimensionsloser Skalar.",vars:[["zᵢ","Logit"],["T","Temperatur"],["pᵢ","angepasste Wahrscheinlichkeit"]],intuition:"T&lt;1 vergrößert Differenzen, T&gt;1 glättet.",pitfall:"T=0 nicht numerisch einsetzen; Greedy separat behandeln.",example:"T→∞ nähert sich uniform, T→0 konzentriert auf Maxima.",check:"Welche Richtung erhöht Diversität?",sources:["a1"],aliases:"sampling logits entropy decoding"},
      {id:"adamw",cat:"Optimierung",title:"AdamW-Update",expr:"mₜ=β₁mₜ₋₁+(1−β₁)gₜ;   vₜ=β₂vₜ₋₁+(1−β₂)gₜ²;   θₜ←(1−ηλ)θₜ₋₁−η m̂ₜ/(√v̂ₜ+ε)",latex:"m_t=\\beta_1m_{t-1}+(1-\\beta_1)g_t,\\quad v_t=\\beta_2v_{t-1}+(1-\\beta_2)g_t^2",read:"Glätte Richtung und Quadratgröße, korrigiere Startbias, normiere das Update und wende Weight Decay separat an.",purpose:"Adaptiver Standardoptimizer für Transformer-Training.",dims:"m,v,θ,g haben Parameterform; β,η,λ,ε sind Skalare.",vars:[["gₜ","Gradient"],["mₜ","erstes Moment"],["vₜ","zweites Rohmoment"],["β₁,β₂","Glättung"],["η","Lernrate"],["λ","Weight Decay"]],intuition:"Selten große Gradienten werden relativ gedämpft; konsistente Richtung akkumuliert.",pitfall:"m̂=m/(1−β₁ᵗ), v̂=v/(1−β₂ᵗ) nicht vergessen.",example:"Beim ersten Step ist Bias Correction besonders groß.",check:"Warum ist AdamW-Decay nicht derselbe Term wie L2 in Adam?",sources:["a1","l02"],aliases:"optimizer moment weight decay bias correction"},
      {id:"cosine-lr",cat:"Optimierung",title:"Warmup + Cosine Decay",expr:"η(t)=ηₘᵢₙ + ½(ηₘₐₓ−ηₘᵢₙ)[1+cos(π(t−T_w)/(T−T_w))]",latex:"\\eta(t)=\\eta_{min}+\\frac12(\\eta_{max}-\\eta_{min})\\left[1+\\cos\\left(\\pi\\frac{t-T_w}{T-T_w}\\right)\\right]",read:"Nach linearem Warmup fällt die Lernrate kosinusförmig vom Maximum zum Minimum.",purpose:"Stabile frühe Schritte und sanfter später Decay.",dims:"t,T,T_w in Optimizer-Steps; η ist Lernrate.",vars:[["T_w","Warmup-Steps"],["T","Gesamtsteps"],["η_max/min","Grenzlernrate"]],intuition:"Keine harte Kante im Decay; Steigung ist an beiden Enden null.",pitfall:"Für t&lt;T_w gilt eine separate lineare Formel.",example:"In der Mitte des Decays liegt η genau mittig zwischen min und max.",check:"Welche η gilt bei t=T?",sources:["a1","l11"],aliases:"learning rate scheduler warmup cosine"},
      {id:"gradient-clip",cat:"Optimierung",title:"Globales Norm-Clipping",expr:"g ← g · min(1, c/(||g||₂+ε))",latex:"g\\leftarrow g\\min\\left(1,\\frac{c}{\\lVert g\\rVert_2+\\epsilon}\\right)",read:"Skaliere alle Gradienten gemeinsam nur dann, wenn ihre globale Norm c überschreitet.",purpose:"Begrenzt extreme Updates, ohne Gradientenrichtung zu verändern.",dims:"c hat Einheit der Gradientennorm.",vars:[["g","Konkatenation aller Gradienten"],["c","maximale Norm"],["ε","Stabilisierung"]],intuition:"Ein langer Pfeil wird gekürzt, nicht komponentenweise gestutzt.",pitfall:"Bei Mixed Precision erst unscale, dann clip.",example:"||g||=10,c=1 ⇒ alle Komponenten ×0.1.",check:"Warum bleibt der Winkel gleich?",sources:["a1"],aliases:"clip grad norm exploding gradient"},

      {id:"logistic",cat:"Daten",title:"Logistische Wahrscheinlichkeit",expr:"p(y=1|x)=σ(wᵀx+b)=1/(1+e^(−(wᵀx+b)))",latex:"p(y=1\\mid x)=\\sigma(w^Tx+b)",read:"Eine lineare Scorefunktion wird durch Sigmoid auf 0 bis 1 abgebildet.",purpose:"Einfaches Modell für Qualitäts- oder Sprachklassifikation.",dims:"x Featurevektor, w gleichförmig, p dimensionslos.",vars:[["x","Dokumentfeatures"],["w,b","gelernte Parameter"],["σ","Sigmoid"]],intuition:"Große positive Scores bedeuten hohe Klassenwahrscheinlichkeit.",pitfall:"Kalibrierung und Schwelle sind getrennte Fragen.",example:"Score 0 ⇒ p=0.5.",check:"Was ändert eine strengere Schwelle an Precision/Recall?",sources:["a4"],aliases:"sigmoid classifier probability quality filter"},
      {id:"precision-recall",cat:"Evaluation",title:"Precision & Recall",expr:"Precision=TP/(TP+FP);   Recall=TP/(TP+FN)",latex:"P=\\frac{TP}{TP+FP},\\quad R=\\frac{TP}{TP+FN}",read:"Precision fragt: Wie viele gefundene sind richtig? Recall: Wie viele richtige wurden gefunden?",purpose:"Bewertet Filter, Safety- und PII-Erkennung.",dims:"Anteile zwischen 0 und 1.",vars:[["TP","korrekt positiv"],["FP","falsch positiv"],["FN","übersehen positiv"]],intuition:"Strengere Filter erhöhen oft Precision und senken Recall – oder umgekehrt je nach Positivdefinition.",pitfall:"Positivklasse explizit benennen; bei Datenfiltern kann „behalten“ oder „entfernen“ positiv sein.",example:"8 TP,2 FP,4 FN ⇒ P=.8,R=.667.",check:"Welcher Fehler ist bei PII riskanter?",sources:["a4","l12"],aliases:"classification metric false positive false negative"},
      {id:"jaccard",cat:"Daten",title:"Jaccard-Ähnlichkeit",expr:"J(A,B)=|A∩B| / |A∪B|",latex:"J(A,B)=\\frac{|A\\cap B|}{|A\\cup B|}",read:"Schnittmenge geteilt durch Vereinigungsmenge.",purpose:"Ähnlichkeit von Shingle-Mengen für Near-Dedup.",dims:"Anteil 0 bis 1.",vars:[["A,B","Mengen von n-Gram-Shingles"]],intuition:"Gemeinsamer Inhalt relativ zu allem einzigartigen Inhalt.",pitfall:"Mengen ignorieren Häufigkeit; Normalisierung und Shinglegröße beeinflussen stark.",example:"{a,b} und {b,c} ⇒ 1/3.",check:"Wann ist J genau 1?",sources:["a4"],aliases:"set similarity shingles dedup"},
      {id:"minhash",cat:"Daten",title:"MinHash-Eigenschaft",expr:"P[h_min(A)=h_min(B)] = J(A,B)",latex:"\\Pr[h_{min}(A)=h_{min}(B)]=J(A,B)",read:"Die Wahrscheinlichkeit gleicher MinHash-Werte entspricht der Jaccard-Ähnlichkeit.",purpose:"Schätzt Mengenähnlichkeit mit kompakter Signatur.",dims:"Wahrscheinlichkeit/Anteil.",vars:[["h_min","Minimum unter zufälliger Permutation/Hashordnung"],["J","Jaccard"]],intuition:"Das kleinste Element der Vereinigung liegt mit Jaccard-Wahrscheinlichkeit im Schnitt.",pitfall:"Eine Hashfunktion ist ein sehr verrauschter Schätzer; Signatur nutzt viele.",example:"100 Komponenten, 80 gleich ⇒ Schätzer 0.8.",check:"Warum braucht man unabhängige Hashordnungen?",sources:["a4"],aliases:"near duplicate signature hash jaccard"},
      {id:"lsh",cat:"Daten",title:"LSH-Kandidatenwahrscheinlichkeit",expr:"P(candidate|s)=1−(1−sʳ)ᵇ",latex:"P=1-(1-s^r)^b",read:"Mindestens eines von b Bändern muss in allen r Zeilen übereinstimmen.",purpose:"Macht ähnliche MinHash-Signaturen skalierbar zu Kandidaten.",dims:"s und P zwischen 0 und 1; b,r ganze Zahlen.",vars:[["s","wahre/geschätzte Ähnlichkeit"],["r","Zeilen pro Band"],["b","Anzahl Bänder"]],intuition:"AND innerhalb eines Bands, OR über Bänder erzeugt eine S-Kurve.",pitfall:"LSH erzeugt Kandidaten, nicht endgültige Duplikatentscheidungen.",example:"Mehr b erhöht Kandidaten-Recall und Rechenmenge.",check:"Was bewirkt größeres r?",sources:["a4"],aliases:"locality sensitive hashing bands rows minhash probability"},
      {id:"accuracy-se",cat:"Evaluation",title:"Accuracy & Standardfehler",expr:"Acc=k/n;   SE≈√(Acc(1−Acc)/n)",latex:"\\hat p=k/n,\\quad SE\\approx\\sqrt{\\hat p(1-\\hat p)/n}",read:"Trefferanteil plus approximative Stichprobenunsicherheit.",purpose:"Zeigt, ob kleine Benchmarkunterschiede plausibel messbar sind.",dims:"Anteile; n Zahl unabhängiger Aufgaben.",vars:[["k","korrekte Antworten"],["n","Aufgaben"],["SE","Standardfehler"]],intuition:"Mehr Beispiele senken Unsicherheit ungefähr mit 1/√n.",pitfall:"Aufgaben sind nicht immer unabhängig; Prompt-/Samplingvarianz kommt zusätzlich.",example:"Acc=.5,n=100 ⇒ SE≈.05.",check:"Wie vervierfachte n den SE?",sources:["l12","a5s"],aliases:"benchmark confidence uncertainty binomial"},
      {id:"sft-loss",cat:"Alignment",title:"SFT-Loss mit Antwortmaske",expr:"L_SFT = − Σₜ mₜ log πθ(yₜ|x,y&lt;ₜ) / Σₜ mₜ",latex:"\\mathcal L_{SFT}=-\\frac{\\sum_tm_t\\log\\pi_\\theta(y_t\\mid x,y_{<t})}{\\sum_tm_t}",read:"Cross-Entropy nur über die durch m markierten Antworttokens.",purpose:"Supervised Fine-Tuning (SFT) auf Instruktionsdaten.",dims:"Loss dimensionslos; m_t ∈ {0,1}.",vars:[["x","Prompt"],["y","Antwort"],["mₜ","Loss-Maske"],["πθ","Policy/LM"]],intuition:"Prompt liefert Kontext; das gewünschte Verhalten wird in der Antwort imitiert.",pitfall:"Chat-Template- und Paddingtokens korrekt maskieren.",example:"Nur drei Antworttokens ⇒ Nenner 3.",check:"Wann könnte man Prompttokens bewusst mittrainieren?",sources:["l15","a5s"],aliases:"supervised fine tuning instruction loss response mask"},
      {id:"bradley-terry",cat:"Alignment",title:"Bradley-Terry-Präferenzmodell",expr:"P(y⁺ ≻ y⁻ | x)=σ(r(x,y⁺)−r(x,y⁻))",latex:"P(y^+\\succ y^-\\mid x)=\\sigma(r(x,y^+)-r(x,y^-))",read:"Sigmoid der Reward-Differenz gibt die Wahrscheinlichkeit der beobachteten Präferenz.",purpose:"Trainiert Reward Models aus Antwortpaaren.",dims:"Rewards skalare Scores; Wahrscheinlichkeit 0 bis 1.",vars:[["y⁺","bevorzugte Antwort"],["y⁻","abgelehnte Antwort"],["r","Reward Model"]],intuition:"Nur relative Ordnung, nicht absoluter Nullpunkt, ist identifizierbar.",pitfall:"Beide Antworten müssen zum selben Prompt gehören.",example:"Gleiche Rewards ⇒ Präferenzwahrscheinlichkeit .5.",check:"Was passiert, wenn zu beiden Rewards dieselbe Konstante addiert wird?",sources:["l15","a5s"],aliases:"reward model preference pairwise sigmoid chosen rejected"},
      {id:"kl",cat:"Alignment",title:"KL-Divergenz",expr:"D_KL(p||q)=Σₓ p(x) log[p(x)/q(x)]",latex:"D_{KL}(p\\Vert q)=\\sum_xp(x)\\log\\frac{p(x)}{q(x)}",read:"Erwarteter Log-Wahrscheinlichkeitsunterschied unter p.",purpose:"Misst gerichtete Verteilungsabweichung, etwa Policy von Referenz.",dims:"Nats bei natürlichem Log; nicht negativ.",vars:[["p","erste Verteilung"],["q","Referenzverteilung"]],intuition:"Teuer, wenn p Masse legt, wo q wenig erwartet.",pitfall:"Nicht symmetrisch; D_KL(p||q) ≠ D_KL(q||p).",example:"p=q ⇒ KL=0.",check:"Warum kann KL unendlich werden?",sources:["l15","a5s"],aliases:"kullback leibler divergence reference policy regularization"},
      {id:"rlhf-objective",cat:"Alignment",title:"KL-regularisiertes RLHF-Ziel",expr:"J(π)=E₍x,y~π₎[r(x,y)] − β D_KL(π||π_ref)",latex:"J(\\pi)=\\mathbb E_{x,y\\sim\\pi}[r(x,y)]-\\beta D_{KL}(\\pi\\Vert\\pi_{ref})",read:"Maximiere erwarteten Reward, aber bestrafe Abweichung von der Referenzpolicy.",purpose:"Kontrolliert Rewardoptimierung und Sprachverteilungsdrift.",dims:"Reward und β·KL müssen kompatible Skala haben.",vars:[["π","trainierte Policy"],["π_ref","feste Referenz"],["r","Reward"],["β","KL-Stärke"]],intuition:"Reward zieht, Referenz hält fest.",pitfall:"β ist setupabhängig; gleicher Wert ist nicht universell.",example:"Großes β ⇒ konservativere Policy.",check:"Welche Gefahr steigt bei zu kleinem β?",sources:["l15","a5s"],aliases:"reinforcement human feedback objective reference reward"},
      {id:"dpo",cat:"Alignment",title:"DPO-Loss",expr:"L_DPO=−log σ( β[(logπθ(y⁺|x)−logπref(y⁺|x)) − (logπθ(y⁻|x)−logπref(y⁻|x))] )",latex:"\\mathcal L_{DPO}=-\\log\\sigma\\left(\\beta\\left[\\log\\frac{\\pi_\\theta(y^+|x)}{\\pi_{ref}(y^+|x)}-\\log\\frac{\\pi_\\theta(y^-|x)}{\\pi_{ref}(y^-|x)}\\right]\\right)",read:"Ordne bevorzugte gegenüber abgelehnter Antwort anhand ihrer Policy-zu-Referenz-Logratios.",purpose:"Direct Preference Optimization (DPO) ohne separaten On-Policy-RL-Loop.",dims:"Sequenz-Logwahrscheinlichkeiten und Loss dimensionslos.",vars:[["y⁺/y⁻","chosen/rejected"],["πθ","trainierte Policy"],["π_ref","feste Referenz"],["β","Skalierung"]],intuition:"Verbessere die relative Präferenz gegenüber dem Ausgangsmodell.",pitfall:"Logwahrscheinlichkeiten über exakt dieselben Antworttokens aggregieren.",example:"Wenn der DPO-Logit 0 ist, Loss=log 2.",check:"Warum reichen πθ-Logprobs allein nicht für diese Form?",sources:["l16","a5s"],aliases:"direct preference optimization chosen rejected reference"},
      {id:"expected-reward",cat:"RL",title:"Erwarteter Reward",expr:"J(θ)=E₍x~ρ,y~πθ(.|x)₎[R(x,y)]",latex:"J(\\theta)=\\mathbb E_{x\\sim\\rho,y\\sim\\pi_\\theta(\\cdot|x)}[R(x,y)]",read:"Mittlerer Reward über Prompts und von der Policy gesampelte Antworten.",purpose:"Grundziel von RLVR und Policy-Gradient-Verfahren.",dims:"Einheit des Rewards.",vars:[["ρ","Promptverteilung"],["πθ","Policy"],["R","Outcome-Reward"]],intuition:"Die Policy bestimmt ihre eigenen Trainingsantworten.",pitfall:"Ein kleiner statischer Samplesatz ist nicht derselbe Erwartungswert nach Policyupdates.",example:"Binärer Verifierreward ⇒ J ist Erfolgsrate der Rollouts.",check:"Über welche zwei Zufallsquellen wird gemittelt?",sources:["l17","a5"],aliases:"reinforcement learning objective rollout verifier"},
      {id:"policy-gradient",cat:"RL",title:"Policy Gradient",expr:"∇θJ = E[ R(x,y) · ∇θ log πθ(y|x) ]",latex:"\\nabla_\\theta J=\\mathbb E[R(x,y)\\nabla_\\theta\\log\\pi_\\theta(y|x)]",read:"Gewichte den Log-Policy-Gradienten einer gesampelten Antwort mit ihrem Reward.",purpose:"Unverzerrter Samplegradient für nicht differenzierbaren Reward.",dims:"Gleiche Parameterform wie θ.",vars:[["J","erwarteter Reward"],["R","samplebarer Reward"],["πθ","Policy"],["∇θ logπ","Score Function"]],intuition:"Belohnte Samples wahrscheinlicher machen.",pitfall:"Hohe Varianz; in Praxis Advantage statt rohem Reward.",example:"R=0 liefert in der naiven binären Variante kein Update.",check:"Wo wird ∇π=π∇logπ benutzt?",sources:["l17","a5"],aliases:"reinforce score function log derivative"},
      {id:"advantage",cat:"RL",title:"Advantage & Baseline",expr:"A(x,y)=R(x,y)−b(x)",latex:"A(x,y)=R(x,y)-b(x)",read:"Vergleiche den Reward einer Antwort mit einer erwarteten Baseline für den Prompt.",purpose:"Reduziert Policy-Gradient-Varianz und liefert relatives Signal.",dims:"Gleiche Einheit wie Reward.",vars:[["R","beobachteter Reward"],["b(x)","aktionsunabhängige Baseline"],["A","relativer Vorteil"]],intuition:"Eine 9 kann schlecht sein, wenn für diesen Prompt 10 normal ist.",pitfall:"Baseline darf für Unverzerrtheit nicht von der gezogenen Aktion abhängen.",example:"R=9,b=10 ⇒ A=−1.",check:"Warum ändert das Abziehen von b den erwarteten Gradienten nicht?",sources:["l17","a5"],aliases:"baseline value variance reduction return"},
      {id:"grpo-advantage",cat:"RL",title:"GRPO-Gruppennormalisierung",expr:"Aᵢ = (Rᵢ−mean(R₁:G)) / (std(R₁:G)+ε)",latex:"A_i=\\frac{R_i-\\operatorname{mean}(R_{1:G})}{\\operatorname{std}(R_{1:G})+\\epsilon}",read:"Zentriere und skaliere Rewards mehrerer Antworten desselben Prompts.",purpose:"Group Relative Policy Optimization (GRPO) ohne gelerntes Value Model.",dims:"A dimensionslos, R beliebige Rewardskala.",vars:[["G","Antworten pro Prompt"],["Rᵢ","Reward von Antwort i"],["ε","Schutz bei gleicher Gruppe"]],intuition:"Vergleicht innerhalb derselben Aufgabenschwierigkeit.",pitfall:"Std-Normalisierung reweightet Gruppen nach Rewardstreuung und ist eine algorithmische Entscheidung.",example:"Rewards [0,1] ⇒ zentrierte Vorteile mit entgegengesetztem Vorzeichen.",check:"Was passiert bei [1,1,1]?",sources:["l17","a5"],aliases:"group relative policy optimization normalized reward dr grpo"},
      {id:"importance-ratio",cat:"RL",title:"Importance Ratio",expr:"ρₜ(θ)=πθ(aₜ|sₜ) / π_old(aₜ|sₜ) = exp(logπθ−logπ_old)",latex:"\\rho_t(\\theta)=\\frac{\\pi_\\theta(a_t|s_t)}{\\pi_{old}(a_t|s_t)}",read:"Wie viel wahrscheinlicher ist die gespeicherte Aktion unter der neuen gegenüber der Rollout-Policy?",purpose:"Korrigiert Off-Policy-Verteilungsverschiebung.",dims:"Positiver dimensionsloser Faktor.",vars:[["π_old","Policy beim Sampling"],["πθ","aktuelle Policy"],["aₜ,sₜ","Tokenaktion und Zustand"]],intuition:"Samples, die die neue Policy häufiger erzeugen würde, erhalten höheres Gewicht.",pitfall:"In Lograum differenzieren und erst dann exponentieren; große Ratios sind hochvariant.",example:"Gleiche Policies ⇒ ρ=1.",check:"Warum müssen alte Logprobs gespeichert werden?",sources:["a5","l16"],aliases:"off policy importance sampling ratio logprob"},
      {id:"ppo-clip",cat:"RL",title:"PPO-Clipped Surrogate",expr:"L = −min(ρA, clip(ρ,1−ε,1+ε)A)",latex:"\\mathcal L=-\\min(\\rho A,\\operatorname{clip}(\\rho,1-\\epsilon,1+\\epsilon)A)",read:"Nutze das pessimistischere von freiem und begrenztem Ratio-Update.",purpose:"Proximal Policy Optimization (PPO) begrenzt schädlich große Policyänderungen auf alten Rollouts.",dims:"Loss in Reward-/Advantage-Skala.",vars:[["ρ","Importance Ratio"],["A","Advantage"],["ε","Clipbereich"]],intuition:"Verbesserungen jenseits des Vertrauensbereichs werden nicht weiter belohnt.",pitfall:"Vorzeichen von A bestimmt, welche Ratioseite begrenzt.",example:"A&gt;0 und ρ&gt;1+ε ⇒ Term bei 1+ε gedeckelt.",check:"Was passiert bei negativem A und sehr kleinem ρ?",sources:["l16","a5"],aliases:"proximal policy optimization clipping surrogate gspo"}
    ];

    const FORMULA_ANSWERS = {
      "mean-var": "Jede quadratische Abweichung (x−μ)² ist mindestens null. Ein Mittelwert beziehungsweise Erwartungswert aus ausschließlich nichtnegativen Zahlen kann daher ebenfalls nicht negativ werden.",
      "matmul": "Die gemeinsame innere Achse k verschwindet, weil über alle k Beiträge summiert wird. Die äußeren Achsen m und n bezeichnen weiterhin, für welche Zeile und Spalte jeweils ein Ergebnis entsteht.",
      "chain-rule": "Backpropagation benötigt für einen skalaren Loss nur das Produkt des ankommenden Gradienten mit dem lokalen Jacobian, also ein Vector-Jacobian Product. Der vollständige Jacobian muss deshalb weder materialisiert noch gespeichert werden.",
      "softmax": "Durch das Subtrahieren von m werden Zähler und Nenner mit demselben Faktor exp(−m) multipliziert. Dieser Faktor kürzt sich heraus, sodass die Wahrscheinlichkeiten unverändert bleiben.",
      "logsumexp": "Nach der Stabilisierung lauten die Exponenten zⱼ−m und sind alle kleiner oder gleich null; mindestens einer ist genau null. Ihre Exponentialwerte liegen damit in (0,1], wodurch ein Overflow vermieden wird.",
      "autoregressive": "Der Logarithmus erfüllt log(a·b)=log(a)+log(b). Daher wird das Produkt der bedingten Tokenwahrscheinlichkeiten zur Summe ihrer Logwahrscheinlichkeiten.",
      "cross-entropy": "Bei einer uniformen Verteilung hat jedes der V Tokens die Wahrscheinlichkeit 1/V. Der Loss für das korrekte Token ist deshalb −log(1/V)=log(V).",
      "perplexity": "Perplexity ist exp(Loss), und exp(0)=1. Ein Loss von null bedeutet außerdem, dass jedem korrekten Token Wahrscheinlichkeit eins gegeben wird, also effektiv nur eine Möglichkeit verbleibt.",
      "embedding-params": "Bei festem D verdoppelt eine Verdopplung von V die V·D Embedding-Parameter und auch die Zahl der Output-Logits pro Position. Die Sequenzen können durch zusätzliche längere Tokens kürzer werden, aber weder Ausmaß noch Eintritt dieser Verkürzung sind garantiert und hängen vom gelernten Vokabular ab.",
      "linear-params": "Die Gewichtsmatrix desselben Linear Layers wird an allen T Tokenpositionen wiederverwendet und nicht pro Position neu gespeichert. Deshalb beeinflusst T die Rechenarbeit des Forward Pass, aber nicht die Parameterzahl.",
      "rmsnorm": "Der lernbare Scale g braucht einen Eintrag pro Feature und hat daher die Form [D]. Für explizites Broadcasting kann er als [1,…,1,D] betrachtet werden, sodass alle Batch- und Tokenachsen dieselben D Werte verwenden.",
      "swiglu": "SwiGLU mischt die Featureachse D beziehungsweise D_ff, aber nicht die Sequenzachse T. Jede Tokenposition wird vom Feed-Forward Network unabhängig mit denselben Gewichten verarbeitet.",
      "rope": "RoPE fasst die Features paarweise als zweidimensionale Ebenen auf und rotiert jedes Paar. Bei geradem d_k bleiben deshalb keine ungepaarten Features übrig; eine ungerade Head-Dimension würde eine zusätzliche Sonderbehandlung erfordern.",
      "attention": "Wenn Query- und Key-Komponenten ungefähr Varianz eins haben, wächst die Varianz ihres Dot-Products proportional zu d_k. Die Division durch √d_k hält die Score-Skala ungefähr konstant und verhindert, dass Softmax bei breiten Heads früh sättigt.",
      "causal-attention": "Das strikt obere Dreieck enthält −∞, also alle Einträge mit Spaltenindex j größer als dem Zeilenindex i. Diese Felder stehen für zukünftige Keypositionen, die eine Query noch nicht sehen darf.",
      "residual": "Der direkte Gradientenpfad läuft durch den Summanden x der Addition x′=x+F(Norm(x)). Seine lokale Ableitung ist die Identität, sodass der Gradient Norm und F auf diesem Pfad umgehen kann.",
      "transformer-params": "Die großen Gewichtsmatrizen eines Blocks verbinden Dimensionen, die beide proportional zu D sind, etwa D×D oder D×D_ff mit D_ff proportional zu D. Dadurch kostet jeder Block hauptsächlich einen konstanten Faktor mal D² Parameter.",
      "temperature": "Eine höhere Temperatur T>1 glättet die Verteilung und erhöht typischerweise die Sampling-Diversität. Eine niedrigere positive Temperatur schärft sie und konzentriert mehr Masse auf die größten Logits.",
      "adamw": "Ein L2-Term wird bei Adam zum Gradienten addiert und anschließend zusammen mit ihm durch die adaptiven Momentenschätzer skaliert. AdamW wendet Weight Decay dagegen als separaten, direkten Schrumpfschritt auf die Parameter an, sodass die Decay-Wirkung nicht von der koordinatenweisen Adam-Skalierung abhängt.",
      "cosine-lr": "Am definierten Ende des Decays t=T gilt η=η_min. Der Kosinusterm erreicht dort seinen Endwert, sofern T tatsächlich als letzter Scheduler-Step und nicht als Anzahl mit abweichender Indexierung verwendet wird.",
      "gradient-clip": "Beim globalen Clipping werden alle Gradienteneinträge mit demselben positiven Faktor multipliziert. Dadurch ändert sich nur die Länge des Gesamtvektors, während seine Richtung und damit sein Winkel unverändert bleiben.",
      "global-batch": "In W gehören nur Datenparallel-Ranks, die unterschiedliche Datenbeispiele verarbeiten und ihre Gradienten für ein gemeinsames Update zusammenführen. Reine Tensor- oder Pipelineparallel-Ranks teilen dagegen dieselben Beispiele beziehungsweise das Modell und vergrößern den globalen Datenbatch nicht automatisch.",
      "training-flops": "Für dichte Matrixgewichte kostet der Forward Pass grob 2 FLOPs pro Parameter und Token. Der Backward Pass berechnet sowohl Aktivierungs- als auch Parametergradienten und kostet näherungsweise weitere 4, sodass insgesamt etwa 6ND_tokens entstehen.",
      "mfu": "Wenn die Datenpipeline nicht rechtzeitig Batches liefert, wartet die GPU und führt während dieser Zeit keine Modelloperationen aus. Die gemessenen Modell-FLOP/s sinken, während der theoretische Hardware-Peak gleich bleibt, also fällt die Model FLOPs Utilization.",
      "speedup": "Mit mehr Ressourcen wachsen Kommunikations-, Synchronisations- und Scheduling-Overhead, während serielle Arbeit nicht beschleunigt wird. Dadurch fällt T_p meist langsamer als 1/p, sodass S(p)/p und damit die Effizienz sinkt.",
      "arithmetic-intensity": "Fusion hält Zwischenwerte zwischen mehreren Operationen auf dem Chip und vermeidet deren Schreiben in sowie erneutes Lesen aus dem High Bandwidth Memory. Bei nahezu gleicher Rechenarbeit sinkt damit die übertragene Bytezahl, also steigen FLOPs pro Byte.",
      "roofline": "Am Ridge Point sind Compute-Dach und Bandbreitendach gleich: P_peak=BW·AI. Daher gilt AI_ridge=P_peak/BW mit der Einheit FLOPs pro Byte.",
      "online-softmax": "Pro Queryzeile reichen das bisherige Maximum m und die dazu passend skalierte Exponentialsumme ℓ. Mit beiden Größen lassen sich neue Blöcke stabil einbeziehen und am Ende die korrekte Normalisierung bestimmen; ein Output-Akkumulator wird zusätzlich für die gewichteten Values geführt.",
      "memory-state": "ZeRO-1 shardet die Optimizerzustände, ZeRO-2 zusätzlich die Gradienten und ZeRO-3 zusätzlich die Modellparameter über die Datenparallel-Ranks. Bei ZeRO-3 werden benötigte Parameter für die Berechnung vorübergehend gesammelt, bleiben außerhalb dieser Phasen aber geshardet.",
      "kv-cache": "Multi-Query Attention verwendet für viele Query Heads nur einen gemeinsamen Key und Value Head und verkleinert dadurch H_kv drastisch. Beim tokenweisen Decoding müssen alte Keys und Values ständig aus dem Speicher gelesen werden, sodass der kleinere Cache sowohl Kapazität als auch Speicherbandbreite spart.",
      "moe-output": "Mit der Gesamtzahl der Experten wachsen vor allem gespeicherte Parameter und Modellkapazität. Rechenarbeit pro Token und die unmittelbar verwendeten Expertenaktivierungen skalieren dagegen hauptsächlich mit TopK, also der Zahl tatsächlich aktiver Experten; Kommunikation und Load Balancing kommen als zusätzliche Systemkosten hinzu.",
      "ring-allreduce": "Der Tensor wird in W Chunks geteilt, und jeder Rank bewegt in jeder der zwei Ringphasen nur W−1 Chunks der Größe M/W. Das Gesamtvolumen 2(W−1)M/W nähert sich deshalb für großes W dem konstanten Wert 2M, statt linear mit W zu wachsen.",
      "pipeline-efficiency": "Sehr großes m reduziert zwar den relativen Pipeline-Bubble, erzeugt aber mehr Scheduling- und Kommunikationsvorgänge. Bei festem globalem Batch werden die einzelnen Microbatches außerdem kleiner und können Matrixmultiplikationen schlechter auslasten; bei fester Microbatchgröße wachsen stattdessen Batch und Latenz.",
      "scaling-law": "Für positive Exponenten verschwinden A/N^α und B/D^β, wenn N und D gegen unendlich gehen. Das modellierte Loss-Limit ist daher der irreduzible Term E.",
      "isoflops": "Bei sehr kleinem N ist das Modell trotz vieler bezahlbarer Tokens kapazitätslimitiert; bei sehr großem N bleiben wegen D=C/(6N) zu wenige Trainingstokens. Zwischen diesen Extremen entsteht typischerweise ein compute-optimaler Kompromiss mit minimalem Loss.",
      "logistic": "Eine strengere, also höhere Schwelle klassifiziert weniger Beispiele als positiv. Der Recall kann dadurch nicht steigen und sinkt meist, während die Precision häufig steigt, weil schwächere positive Scores entfallen; eine Precision-Steigerung ist ohne Annahmen über die Scorequalität jedoch nicht garantiert.",
      "precision-recall": "Wenn „positiv“ bedeutet, dass personenbezogene Informationen erkannt und entfernt werden, ist ein False Negative sicherheitskritischer: Die PII bleibt unentdeckt im Datensatz. Ein False Positive entfernt dagegen unproblematische Daten und schadet primär der Datenmenge oder -qualität.",
      "jaccard": "Für Mengen mit nichtleerer Vereinigung ist J genau eins, wenn A und B dieselben Elemente enthalten, also A=B. Der Sonderfall zweier leerer Mengen benötigt eine explizite Konvention, weil die Formel dort 0/0 ergibt.",
      "minhash": "Unabhängige Hashordnungen liefern annähernd unabhängige Bernoulli-Beobachtungen dafür, ob die Minima übereinstimmen. Ihr Mittelwert schätzt Jaccard mit sinkender Varianz; stark korrelierte Hashordnungen würden kaum zusätzliche Information beitragen.",
      "lsh": "Ein größeres r verlangt mehr übereinstimmende Signaturzeilen innerhalb jedes Bands und macht die Kandidatenbedingung strenger. Für 0<s<1 sinken s^r und damit die Kandidatenwahrscheinlichkeit, wodurch Recall und Kandidatenmenge meist fallen, aber False Positives abnehmen.",
      "accuracy-se": "Wird n vervierfacht, wächst √n um den Faktor zwei. Der Standardfehler, der ungefähr proportional zu 1/√n ist, halbiert sich daher.",
      "sft-loss": "Prompttokens kann man bewusst mittrainieren, wenn das Ziel nicht nur Antwortimitation ist, sondern das vollständige Gesprächsformat oder eine ganze Textsequenz modelliert werden soll. Dann muss klar dokumentiert sein, dass auch Nutzer- und Template-Inhalte Teil des Lernziels sind.",
      "bradley-terry": "Die gemeinsame Konstante kürzt sich in (r⁺+c)−(r⁻+c) vollständig heraus. Reward-Differenz, Sigmoid-Wahrscheinlichkeit und Bradley-Terry-Loss bleiben deshalb unverändert.",
      "kl": "KL(p||q) wird unendlich, wenn es ein Ereignis mit p(x)>0, aber q(x)=0 gibt. Dann enthält die Summe den positiv gewichteten Term log(p(x)/0)=+∞.",
      "rlhf-objective": "Bei zu kleinem β ist die Bindung an die Referenzpolicy schwach, sodass die Policy den Reward-Proxy aggressiv ausnutzen kann. Dadurch steigen Risiken wie Reward Hacking, Sprachqualitätsverlust, Mode Collapse und starke Verteilungsdrift.",
      "dpo": "Die Referenz-Logwahrscheinlichkeiten messen, wie stark die trainierte Policy die bevorzugte gegenüber der abgelehnten Antwort relativ zum Ausgangsmodell umordnet. Ohne sie fehlt genau diese KL-bezogene Vergleichsbasis; übrig bliebe ein anderes paarweises Policy-Ziel, nicht der angegebene DPO-Loss.",
      "expected-reward": "Gemittelt wird erst über Prompts x aus der Promptverteilung ρ und dann über Antworten y, die aus der Policy πθ(.|x) gesampelt werden. Die zufälligen Tokenentscheidungen einer Antwort sind dabei in der Zufallsvariable y enthalten.",
      "policy-gradient": "Man startet mit ∇J=Σ p(x)∇πθ(y|x)R(x,y) und ersetzt dort ∇πθ durch πθ∇logπθ. Der dadurch auftauchende Faktor πθ macht die Summe wieder zu einem Erwartungswert über von der Policy gesampelte Antworten.",
      "advantage": "Da b(x) nicht von der gezogenen Antwort abhängt, gilt E_y[b(x)∇logπθ(y|x)]=b(x)∇Σ_yπθ(y|x)=b(x)∇1=0. Das Abziehen verändert somit nicht den erwarteten Gradienten, kann aber seine Varianz senken.",
      "grpo-advantage": "Für Rewards [1,1,1] ist der Gruppenmittelwert eins und jeder zentrierte Advantage null, also gibt es kein relatives Lernsignal. Die Standardabweichung ist ebenfalls null und muss bei einer Normalisierung durch ε oder eine definierte Sonderbehandlung abgesichert werden.",
      "importance-ratio": "Das Importance Ratio benötigt im Nenner die Wahrscheinlichkeit unter genau der Policy, die das Sample erzeugt hat. Nach einem Update lässt sie sich aus der neuen Policy nicht rekonstruieren; neu berechnete „alte“ Logprobs würden typischerweise ein falsches Ratio bis hin zu eins ergeben.",
      "ppo-clip": "Für A<0 und ρ<1−ε wählt das Minimum den geclippten Term (1−ε)A, weil das negative Vorzeichen die Größenordnung umkehrt. Ein weiteres Absenken der Wahrscheinlichkeit dieser schlechten Aktion wird damit nicht zusätzlich belohnt und liefert in diesem Bereich keinen weiteren Gradientenanreiz."
};

      "a1": [
            "UTF-8 kodiert einen Unicode-Codepoint je nach Zeichen mit einem bis vier Bytes. Ein einzelnes Fortsetzungsbyte, auf Englisch continuation byte, enthält nicht genug Information und ist für sich oft keine gültige UTF-8-Sequenz; erst die vollständig zusammengesetzte Bytefolge darf dekodiert werden.",

      "a2": [
            "GPU-Aufrufe werden meist asynchron gestartet: Die CPU erhält die Kontrolle zurück, bevor der Kernel auf der GPU fertig ist. Ohne Synchronisation misst ein CPU-Timer daher vor allem die kurze Startzeit; eine passende Barriere oder GPU-Zeitmessung muss sicherstellen, dass die gemessene Arbeit wirklich abgeschlossen ist.",
            "Die Einordnung braucht Messdaten im Verhältnis zu den Hardwaregrenzen: erreichte FLOP/s, erreichte Speicherbandbreite und Arithmetic Intensity, also Rechenoperationen pro übertragenem Byte. Liegt die Leistung nahe am Bandbreitendach des Roofline-Modells und steigt mit weniger Speichertraffic, ist der Kernel memory-bound; liegt sie nahe am Compute-Peak und reagiert vor allem auf weniger Rechenoperationen, ist er compute-bound. Ein Profiler sollte diese Hypothese durch Kernelzeiten und Speichertransfers stützen.",
            "Online Softmax benötigt pro Queryzeile ein laufendes Maximum m und die auf dieses Maximum bezogene laufende Exponentialsumme ℓ. Ändert sich m durch einen neuen Block, werden die alten Beiträge auf die neue Skala umgerechnet; für das vollständige Attention-Ergebnis wird zusätzlich ein entsprechend reskalierter Value-Akkumulator geführt.",

      "a3": [

            "Ein gemessenes Optimum ist nur dann wirklich eingeklammert, wenn es im Inneren des getesteten Größenbereichs liegt und auf beiden Seiten größere Loss-Werte beobachtet wurden. Ist der beste Run der kleinste oder größte Messpunkt, zeigt das nur ein Randminimum; das wahre Optimum kann außerhalb des Suchbereichs liegen.",

      "a4": [
            "In Quellcode sehen E-Mail-ähnliche Platzhalter, IP-Adressen für lokale Tests, UUIDs, Versionsnummern oder lange numerische IDs oft wie Personally Identifiable Information (PII), also personenbezogene Daten, aus. Auch Dokumentationsbeispiele und Testdaten können Telefonnummern oder Adressen absichtlich enthalten, ohne eine reale Person zu bezeichnen. Ein rein syntaktischer Filter markiert solche Fälle als False Positives und kann dadurch nützlichen Code beschädigen.",
            "Bei fester Signaturlänge bedeutet mehr Bänder im Locality-Sensitive Hashing (LSH), dass jedes Band weniger Zeilen enthält und leichter vollständig übereinstimmt. Dadurch steigt die Wahrscheinlichkeit, ein ähnliches Paar als Kandidat zu finden, also der Recall. Gleichzeitig entstehen mehr Kandidaten und False Positives, sodass Speicherbedarf, Vergleiche und Gesamtkosten steigen und die Precision typischerweise sinkt.",

      "a5": [
            "Das Sampling eines Token-Index ist eine diskrete Auswahl und ändert sich nicht glatt mit kleinen Änderungen der Logits; durch den gezogenen Index existiert daher kein gewöhnlicher differenzierbarer Pfad zum Reward. Policy Gradient, also die Gradientenmethode für eine stochastische Policy, umgeht das mit dem Log-Derivative Trick und gewichtet den Gradienten der Logwahrscheinlichkeit des gesampelten Verlaufs mit Reward oder Advantage.",
