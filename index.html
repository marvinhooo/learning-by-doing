      if(id==="bpe") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Mini-Korpus</h2><label class="field">Wörter mit Leerzeichen <textarea class="textarea" id="bpeText">low low low lower newest widest</textarea></label><div class="card-actions"><button class="button" id="bpeReset">Zurücksetzen</button><button class="button primary" id="bpeStep">Häufigstes Paar mergen</button></div><p class="lab-note">Ties werden hier lexikographisch gelöst, damit das Resultat deterministisch bleibt.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" aria-live="polite" id="bpeStage"></div></div>`;
      if(id==="attention") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Kontrollen</h2><label class="field">Queryposition <select class="select" id="attnQuery"><option value="0">0 · Der</option><option value="1">1 · Hund</option><option value="2" selected>2 · jagt</option><option value="3">3 · ihn</option></select></label><label class="field">Temperatur <input id="attnTemp" type="range" min="0.35" max="2.5" step="0.05" value="1"><output id="attnTempOut">1.00</output></label><label class="option"><input id="attnMask" type="checkbox" checked><span>Kausale Maske aktiv</span></label><p class="lab-note">Die Scores sind didaktische, feste QKᵀ/√d-Werte. Beobachte nur Softmax und Maske.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="attnStage"></div></div>`;
      if(id==="optimizer") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Schedule & Update</h2><label class="field">Aktueller Step <input id="optStep" type="range" min="0" max="100" value="20"><output id="optStepOut">20</output></label><label class="field">Warmup-Steps <input id="optWarmup" type="range" min="1" max="40" value="10"><output id="optWarmupOut">10</output></label><label class="field">Max-Lernrate η <input id="optLr" type="range" min="0.0001" max="0.01" step="0.0001" value="0.003"><output id="optLrOut">0.0030</output></label><label class="field">Gradient g <input id="optGrad" type="range" min="-2" max="2" step="0.05" value="0.6"><output id="optGradOut">0.60</output></label><label class="field">Weight Decay λ <input id="optWd" type="range" min="0" max="0.2" step="0.01" value="0.1"><output id="optWdOut">0.10</output></label></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="optStage"></div></div>`;
      if(id==="resources") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Modellannahmen</h2><label class="field">Layer L <input id="resL" type="range" min="2" max="80" value="24"><output id="resLOut">24</output></label><label class="field">Breite D <select class="select" id="resD"><option>512</option><option>1024</option><option selected>2048</option><option>4096</option><option>8192</option></select></label><label class="field">Vokabular V <select class="select" id="resV"><option>32000</option><option selected>50000</option><option>100000</option></select></label><label class="field">Sequenz T <select class="select" id="resT"><option>512</option><option selected>2048</option><option>8192</option><option>32768</option></select></label><label class="field">Trainingstokens <select class="select" id="resTokens"><option value="1e9">1B</option><option value="1e11" selected>100B</option><option value="1e12">1T</option></select></label></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="resStage"></div></div>`;
      if(id==="roofline") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Hardware & Kernel</h2><label class="field">Arithmetic Intensity <input id="roofAI" type="range" min="0.25" max="500" step="0.25" value="20"><output id="roofAIOut">20 FLOP/Byte</output></label><label class="field">HBM-Bandbreite <input id="roofBW" type="range" min="0.5" max="5" step="0.1" value="2"><output id="roofBWOut">2.0 TB/s</output></label><label class="field">Compute Peak <input id="roofPeak" type="range" min="20" max="2000" step="10" value="500"><output id="roofPeakOut">500 TFLOP/s</output></label><p class="lab-note">Ridge Point = Peak/Bandbreite. Links davon dominiert HBM-Traffic.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="roofStage"></div></div>`;
      if(id==="parallelism") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Strategie</h2><label class="field">Parallelisierungsart <select class="select" id="parMode"><option value="ddp">DDP</option><option value="zero2">ZeRO-2</option><option value="fsdp">FSDP / ZeRO-3</option><option value="tp">Tensor Parallel</option><option value="pp">Pipeline Parallel</option></select></label><label class="field">World Size <select class="select" id="parWorld"><option>2</option><option selected>4</option><option>8</option></select></label><p class="lab-note">Frage zuerst: Wem gehört Parameter, Gradient und Optimizer-State zu jedem Zeitpunkt?</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="parStage"></div></div>`;
      if(id==="scaling") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Compute-Budget</h2><label class="field">GPU-Stunden <input id="scaleHours" type="range" min="10" max="10000" step="10" value="1000"><output id="scaleHoursOut">1000 h</output></label><label class="field">Effektive PFLOP/s pro GPU <input id="scalePflops" type="range" min="0.05" max="1.5" step="0.05" value="0.4"><output id="scalePflopsOut">0.40</output></label><label class="field">Token/Parameter-Verhältnis r=D/N <input id="scaleRatio" type="range" min="5" max="100" value="20"><output id="scaleRatioOut">20</output></label><p class="lab-note">Das Optimum ist schematisch. In A3 muss r aus mehreren eingeklammerten IsoFLOPs-Profilen geschätzt werden.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="scaleStage"></div></div>`;
      if(id==="data-pipeline") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Filterstufen</h2><label class="option"><input type="checkbox" id="dataLang" checked><span>Englisch-Sprachfilter</span></label><label class="option"><input type="checkbox" id="dataPII" checked><span>PII maskieren</span></label><label class="option"><input type="checkbox" id="dataQuality" checked><span>Qualitätsschwelle</span></label><label class="option"><input type="checkbox" id="dataDedup" checked><span>Near-Dedup</span></label><label class="field">Qualitätsschwelle <input id="dataThreshold" type="range" min="0" max="1" step="0.05" value="0.55"><output id="dataThresholdOut">0.55</output></label><p class="lab-note">Audit immer sowohl verworfene als auch behaltene Beispiele.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="dataStage"></div></div>`;
      if(id==="evaluation") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Behauptung</h2><label class="field">Was möchtest du belegen? <select class="select" id="evalClaim"><option value="likelihood">Das Modell sagt Domänentext gut voraus</option><option value="knowledge">Es beantwortet Wissensfragen</option><option value="instruction">Es folgt Instruktionen</option><option value="safety">Es verweigert schädliche Anfragen angemessen</option><option value="systems">Es ist kosteneffizient im Einsatz</option></select></label><label class="field">Gewählte Metrik <select class="select" id="evalMetric"><option value="ppl">Perplexity</option><option value="mmlu">MMLU-Accuracy</option><option value="judge">Pairwise Judge Win Rate</option><option value="safety">Safety-Test Recall + False Positives</option><option value="latency">Latenz, Durchsatz und Kosten</option></select></label><button class="button primary" id="evalCheck">Paarung prüfen</button></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" aria-live="polite" id="evalStage"></div></div>`;
      if(id==="grpo") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Rewards einer Promptgruppe</h2>${[0,1,2,3].map((_,i)=>`<label class="field">R${i+1} <input class="grpoReward" data-i="${i}" type="range" min="0" max="1" step="0.05" value="${[0,0.3,0.8,1][i]}"><output id="grpoOut${i}">${[0,0.3,0.8,1][i].toFixed(2)}</output></label>`).join("")}<label class="option"><input id="grpoStd" type="checkbox" checked><span>Durch Gruppen-Std normalisieren</span></label><p class="lab-note">Mean-Centering vergleicht innerhalb des Prompts; Std-Normalisierung ändert zusätzlich die Gruppengewichtung.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="grpoStage"></div></div>`;
      return `<div class="panel">Lab folgt.</div>`;
    }

    function initLab(id){
      if(id==="shapes"){["shapeB","shapeT","shapeD","shapeH"].forEach(x=>document.getElementById(x).oninput=updateShapes);updateShapes()}
      if(id==="bpe"){document.getElementById("bpeReset").onclick=resetBpe;document.getElementById("bpeStep").onclick=stepBpe;resetBpe()}
      if(id==="attention"){["attnQuery","attnTemp","attnMask"].forEach(x=>document.getElementById(x).oninput=updateAttention);updateAttention()}
      if(id==="optimizer"){["optStep","optWarmup","optLr","optGrad","optWd"].forEach(x=>document.getElementById(x).oninput=updateOptimizer);updateOptimizer()}
      if(id==="resources"){["resL","resD","resV","resT","resTokens"].forEach(x=>document.getElementById(x).oninput=updateResources);updateResources()}
      if(id==="roofline"){["roofAI","roofBW","roofPeak"].forEach(x=>document.getElementById(x).oninput=updateRoofline);updateRoofline()}
      if(id==="parallelism"){["parMode","parWorld"].forEach(x=>document.getElementById(x).oninput=updateParallelism);updateParallelism()}
      if(id==="scaling"){["scaleHours","scalePflops","scaleRatio"].forEach(x=>document.getElementById(x).oninput=updateScaling);updateScaling()}
      if(id==="data-pipeline"){["dataLang","dataPII","dataQuality","dataDedup","dataThreshold"].forEach(x=>document.getElementById(x).oninput=updateDataPipeline);updateDataPipeline()}
      if(id==="evaluation"){document.getElementById("evalCheck").onclick=updateEvaluation;updateEvaluation(false)}
      if(id==="grpo"){document.querySelectorAll(".grpoReward,#grpoStd").forEach(x=>x.oninput=updateGrpo);updateGrpo()}
    }

    function updateShapes(){const B=+document.getElementById("shapeB").value,T=+document.getElementById("shapeT").value,D=+document.getElementById("shapeD").value,H=+document.getElementById("shapeH").value,d=D/H;document.getElementById("shapeBOut").value=B;document.getElementById("shapeTOut").value=T;document.getElementById("shapeStage").innerHTML=`<h2>Shape Ledger</h2><div class="stage-metric"><div class="metric"><strong>(${B}, ${T}, ${D})</strong><span>X nach Embedding</span></div><div class="metric"><strong>(${B}, ${H}, ${T}, ${d})</strong><span>Q, K, V pro Kopf</span></div><div class="metric"><strong>(${B}, ${H}, ${T}, ${T})</strong><span>QKᵀ Scores</span></div><div class="metric"><strong>(${B}, ${T}, ${D})</strong><span>Concat + Wₒ</span></div></div><div class="callout"><strong>Kontraktion:</strong> Q (${T}×${d}) · Kᵀ (${d}×${T}) → ${T}×${T}. H teilt D in ${H} Heads mit dₖ=${d}.</div><p class="lab-note">Die Score-Aktivierung wächst mit B·H·T² = ${(B*H*T*T).toLocaleString("de-DE")} Elementen. Die Projektionsparameter hängen nicht von B oder T ab.</p>`;}

    function resetBpe(){const text=document.getElementById("bpeText").value.trim();bpeLabState={words:text.split(/\s+/).filter(Boolean).map(w=>["▁",...w]),merges:[]};renderBpe()}
    function bpePairs(){const counts=new Map();bpeLabState.words.forEach(w=>{for(let i=0;i<w.length-1;i++){const k=w[i]+"¦"+w[i+1];counts.set(k,(counts.get(k)||0)+1)}});return [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))}
    function stepBpe(){const pair=bpePairs()[0];if(!pair){toast("Keine Paare mehr");return;}const [a,b]=pair[0].split("¦");bpeLabState.words=bpeLabState.words.map(w=>{const out=[];for(let i=0;i<w.length;i++){if(i<w.length-1&&w[i]===a&&w[i+1]===b){out.push(a+b);i++}else out.push(w[i])}return out});bpeLabState.merges.push([a,b,pair[1]]);renderBpe()}
    function renderBpe(){const pairs=bpePairs().slice(0,8);document.getElementById("bpeStage").innerHTML=`<h2>Merge ${bpeLabState.merges.length}</h2><div class="token-row">${bpeLabState.words.map(w=>`<span class="token">${w.map(esc).join(" · ")}</span>`).join("")}</div><h3>Häufigste Nachbarpaare</h3><div class="bar-list">${pairs.map(([k,n])=>`<div class="bar-row"><span class="mono">${esc(k.replace("¦"," + "))}</span><div class="bar-track"><div class="bar-fill" style="width:${n/(pairs[0]?.[1]||1)*100}%"></div></div><strong>${n}</strong></div>`).join("")}</div><p class="lab-note">Merge-Regeln: ${bpeLabState.merges.length?bpeLabState.merges.map(([a,b,n])=>`${esc(a)}+${esc(b)} (${n})`).join(" → "):"noch keine"}</p>`;}

    function softmax(values){const finite=values.filter(Number.isFinite),m=Math.max(...finite),e=values.map(v=>Number.isFinite(v)?Math.exp(v-m):0),s=e.reduce((a,b)=>a+b,0);return e.map(x=>x/s)}
    function updateAttention(){
      const tokens=["Der","Hund","jagt","ihn"],base=[[2.2,.8,.2,.1],[.4,2.4,.8,.5],[.2,1.9,2.1,1.4],[.1,1.2,.8,2.3]],q=+document.getElementById("attnQuery").value,temp=+document.getElementById("attnTemp").value,mask=document.getElementById("attnMask").checked;
      document.getElementById("attnTempOut").value=temp.toFixed(2);
      const matrix=base.map((row,i)=>row.map((value,j)=>(mask&&j>i)?-Infinity:value/temp)),probs=softmax(matrix[q]);
      const rows=matrix.map((row,i)=>`<tr><th scope="row">${tokens[i]}</th>${row.map(value=>{const heat=Number.isFinite(value)?Math.max(8,Math.min(75,(value+1)*22)):0;return `<td style="--heat:${heat}%">${Number.isFinite(value)?value.toFixed(2):"−∞"}</td>`}).join("")}</tr>`).join("");
      document.getElementById("attnStage").innerHTML=`<h2>Scorematrix QKᵀ/√d ${mask?"+ Maske":""}</h2><table class="matrix-table"><caption class="sr-only">Attention-Scores: Zeilen sind Queries, Spalten sind Keys.</caption><thead><tr><th scope="col">Query / Key</th>${tokens.map(token=>`<th scope="col">${token}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table><h3>Softmax-Gewichte für Query „${tokens[q]}“</h3><div class="bar-list">${tokens.map((token,i)=>`<div class="bar-row"><span>${token}</span><div class="bar-track" role="progressbar" aria-label="Gewicht für ${token}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${(probs[i]*100).toFixed(1)}"><div class="bar-fill" style="width:${probs[i]*100}%"></div></div><strong>${(probs[i]*100).toFixed(1)}%</strong></div>`).join("")}</div><p class="lab-note">Summe: ${probs.reduce((a,b)=>a+b,0).toFixed(4)}. Niedrigere Temperatur schärft nur Unterschiede zwischen erlaubten Scores.</p>`;
    }

    function schedule(step,warm,max,min=.1){if(step<warm)return max*step/warm;const p=(step-warm)/(100-warm);return min*max+.5*(max-min*max)*(1+Math.cos(Math.PI*p))}
    function updateOptimizer(){const step=+document.getElementById("optStep").value,warm=Math.min(+document.getElementById("optWarmup").value,99),max=+document.getElementById("optLr").value,g=+document.getElementById("optGrad").value,wd=+document.getElementById("optWd").value,lr=schedule(step,warm,max),theta=1,newTheta=(1-lr*wd)*theta-lr*g/(Math.abs(g)+1e-8);[["optStepOut",step],["optWarmupOut",warm],["optLrOut",max.toFixed(4)],["optGradOut",g.toFixed(2)],["optWdOut",wd.toFixed(2)]].forEach(([id,v])=>document.getElementById(id).value=v);const pts=[];for(let t=0;t<=100;t+=2){const y=schedule(t,warm,max),x=35+t*5.2,py=210-y/max*170;pts.push(`${x},${py}`)}document.getElementById("optStage").innerHTML=`<h2>Lernratenverlauf</h2><svg class="svg-chart" viewBox="0 0 590 225" role="img" aria-label="Lernrate über 100 Schritte: Warmup bis zur maximalen Lernrate, danach Cosine-Abfall. Aktueller Schritt ${step}, Lernrate ${lr.toExponential(2)}."><line class="chart-grid-line" x1="35" x2="555" y1="210" y2="210"/><line class="chart-grid-line" x1="35" x2="35" y1="35" y2="210"/><polyline class="chart-line" points="${pts.join(" ")}"/><circle class="chart-dot" cx="${35+step*5.2}" cy="${210-lr/max*170}" r="6"/></svg><div class="chart-axis-labels"><span>0 Schritte · Lernrate 0</span><span>100 Schritte · Lernrate η</span></div><div class="stage-metric"><div class="metric"><strong>${lr.toExponential(2)}</strong><span>η am Step ${step}</span></div><div class="metric"><strong>${newTheta.toFixed(6)}</strong><span>θ neu aus θ=1, vereinfachtem erstem AdamW-Step</span></div></div><p class="lab-note">Beim ersten Moment-korrigierten Schritt ist m̂≈g und √v̂≈|g|. Das zeigt die adaptive Skalierung, ersetzt aber keinen vollständigen Mehrschritt-Simulator.</p>`;}

    function fmtNum(n){if(n>=1e12)return(n/1e12).toFixed(2)+"T";if(n>=1e9)return(n/1e9).toFixed(2)+"B";if(n>=1e6)return(n/1e6).toFixed(2)+"M";return Math.round(n).toLocaleString("de-DE")}
    function fmtBytes(n){const units=["B","KiB","MiB","GiB","TiB"];let i=0;while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(n<10?2:1)+" "+units[i]}
    function updateResources(){const L=+document.getElementById("resL").value,D=+document.getElementById("resD").value,V=+document.getElementById("resV").value,T=+document.getElementById("resT").value,tokens=+document.getElementById("resTokens").value,N=12*L*D*D+V*D,state=N*16,attnElems=L*T*T,flops=6*N*tokens,time=flops/(4e14);document.getElementById("resLOut").value=L;document.getElementById("resStage").innerHTML=`<h2>Napkin Math</h2><div class="stage-metric"><div class="metric"><strong>${fmtNum(N)}</strong><span>Parameter ≈12LD²+VD</span></div><div class="metric"><strong>${fmtBytes(state)}</strong><span>AdamW-State bei 16 Byte/Parameter</span></div><div class="metric"><strong>${fmtNum(attnElems)}</strong><span>T²-Scoreelemente über alle Layer, B=H=1</span></div><div class="metric"><strong>${(time/3600).toFixed(1)} h</strong><span>bei effektiv 400 TFLOP/s</span></div></div><div class="callout warning"><strong>Näherung:</strong> Aktivierungen, GQA/SwiGLU-Details, Embedding-Tying, Kommunikation und Attention-Zusatz-FLOPs sind setupabhängig. Nutze die Rechnung zum Plausibilisieren, nicht als Speicherzusage.</div>`;}

    function updateRoofline(){const ai=+document.getElementById("roofAI").value,bw=+document.getElementById("roofBW").value,peak=+document.getElementById("roofPeak").value,mem=bw*ai,perf=Math.min(peak,mem),ridge=peak/bw,bound=mem<peak?"Memory-bound":"Compute-bound";document.getElementById("roofAIOut").value=ai.toFixed(2)+" FLOP/Byte";document.getElementById("roofBWOut").value=bw.toFixed(1)+" TB/s";document.getElementById("roofPeakOut").value=peak+" TFLOP/s";const x=Math.max(10,Math.min(95,Math.log10(ai/.25)/Math.log10(500/.25)*100));document.getElementById("roofStage").innerHTML=`<h2>${bound}</h2><div class="stage-metric"><div class="metric"><strong>${perf.toFixed(1)} TFLOP/s</strong><span>Roofline-Dach</span></div><div class="metric"><strong>${ridge.toFixed(1)} FLOP/Byte</strong><span>Ridge Point</span></div></div><div class="roofline-plot" role="img" aria-label="Roofline-Diagramm: ${bound} bei ${ai.toFixed(2)} FLOP pro Byte, erreichbare Leistung ${perf.toFixed(1)} TFLOP pro Sekunde und Ridge Point ${ridge.toFixed(1)} FLOP pro Byte."><div aria-hidden="true" style="position:absolute;left:0;bottom:0;width:${Math.min(100,ridge/500*100)}%;height:70%;border-top:3px solid var(--primary);transform:skewY(-32deg);transform-origin:left bottom"></div><div aria-hidden="true" style="position:absolute;right:0;top:30%;width:${Math.max(0,100-Math.min(100,ridge/500*100))}%;border-top:3px solid var(--primary)"></div><div aria-hidden="true" style="position:absolute;left:${x}%;bottom:${Math.min(88,perf/peak*70)}%;width:12px;height:12px;border-radius:50%;background:var(--accent)"></div></div><div class="chart-axis-labels"><span>Niedrige Arithmetic Intensity</span><span>Hohe Arithmetic Intensity</span></div><p class="lab-note">BW·AI = ${mem.toFixed(1)} TFLOP/s; Peak = ${peak} TFLOP/s. Das kleinere Dach begrenzt.</p>`;}

    function updateParallelism(){const mode=document.getElementById("parMode").value,W=+document.getElementById("parWorld").value;const data={ddp:{title:"DDP",param:"voll repliziert",grad:"voll, danach All-Reduce",opt:"voll repliziert",comm:"Gradient All-Reduce",note:"Teilt den Batch; einfache Rechenparallelität, aber State wächst nicht mit W."},zero2:{title:"ZeRO-2",param:"voll repliziert",grad:`1/${W} geshardet`,opt:`1/${W} geshardet`,comm:"Reduce-Scatter + All-Gather",note:"Spart Gradient und Optimizer State; Parameter bleiben repliziert."},fsdp:{title:"FSDP / ZeRO-3",param:`1/${W} idle; all-gather für Compute`,grad:`1/${W}`,opt:`1/${W}`,comm:"Layerweise All-Gather + Reduce-Scatter",note:"Maximaler State-Speichervorteil, mehr Lifecycle- und Peak-Komplexität."},tp:{title:"Tensor Parallel",param:`Operatorachsen 1/${W}`,grad:`Operatorachsen 1/${W}`,opt:`1/${W}`,comm:"All-Reduce / All-Gather im Layer",note:"Teilt Breite; schnelle Interconnects innerhalb eines Nodes bevorzugt."},pp:{title:"Pipeline Parallel",param:`Layergruppen 1/${W}`,grad:`Layergruppen 1/${W}`,opt:`1/${W}`,comm:"Aktivierungen zwischen Stages",note:"Teilt Tiefe; Microbatches amortisieren Pipeline-Bubbles."}}[mode];document.getElementById("parStage").innerHTML=`<h2>${data.title}: Ownership Map</h2><div class="gpu-grid">${Array.from({length:W},(_,i)=>`<div class="gpu"><strong>Rank ${i}</strong><span class="small">P: ${data.param}<br>G: ${data.grad}<br>O: ${data.opt}</span></div>`).join("")}</div><div class="stage-metric"><div class="metric"><strong>${data.comm}</strong><span>dominantes Kommunikationsmuster</span></div></div><div class="callout">${data.note}</div>`;}

    function updateScaling(){const h=+document.getElementById("scaleHours").value,pf=+document.getElementById("scalePflops").value,r=+document.getElementById("scaleRatio").value,C=h*3600*pf*1e15,N=Math.sqrt(C/(6*r)),D=r*N;document.getElementById("scaleHoursOut").value=h+" h";document.getElementById("scalePflopsOut").value=pf.toFixed(2);document.getElementById("scaleRatioOut").value=r;const factors=[.2,.35,.5,.7,1,1.4,2,3,5],vals=factors.map(f=>{const n=N*f,d=C/(6*n),loss=1.7+.18/Math.pow(n/N,.35)+.16/Math.pow(d/D,.28);return{f,n,d,loss}}),min=Math.min(...vals.map(x=>x.loss)),max=Math.max(...vals.map(x=>x.loss)),pts=vals.map((x,i)=>`${40+i*62},${200-(x.loss-min)/(max-min)*145}`).join(" ");document.getElementById("scaleStage").innerHTML=`<h2>Schematisches Compute-Optimum</h2><div class="stage-metric"><div class="metric"><strong>${fmtNum(N)}</strong><span>N bei gewähltem r</span></div><div class="metric"><strong>${fmtNum(D)}</strong><span>D Tokens</span></div><div class="metric"><strong>${C.toExponential(2)}</strong><span>C FLOPs</span></div></div><svg class="svg-chart" viewBox="0 0 590 215" role="img" aria-label="U-förmiges schematisches IsoFLOPs-Lossprofil: links kleine Modelle mit vielen Tokens, rechts große Modelle mit wenigen Tokens."><line class="chart-grid-line" x1="40" x2="540" y1="205" y2="205"/><polyline class="chart-line" points="${pts}"/>${vals.map((x,i)=>`<circle class="chart-dot" cx="${40+i*62}" cy="${200-(x.loss-min)/(max-min)*145}" r="5"/>`).join("")}</svg><div class="chart-axis-labels"><span>Kleines N · viele Tokens</span><span>Großes N · wenige Tokens</span></div><p class="lab-note">Die Losskurve ist absichtlich illustrativ, nicht aus echten Runs gefittet. A3 verlangt Messpunkte beidseits jedes Minimums.</p>`;}

    const dataDocs=[{name:"Tutorial mit Code",lang:"en",pii:false,q:.9,dup:"a"},{name:"Kopiertes Tutorial",lang:"en",pii:false,q:.86,dup:"a"},{name:"Forum mit E-Mail",lang:"en",pii:true,q:.64,dup:"b"},{name:"Deutscher Fachartikel",lang:"de",pii:false,q:.93,dup:"c"},{name:"SEO-Wortsalat",lang:"en",pii:false,q:.22,dup:"d"},{name:"Counter-Speech-Zitat",lang:"en",pii:false,q:.58,dup:"e"}];
    function updateDataPipeline(){const lang=document.getElementById("dataLang").checked,pii=document.getElementById("dataPII").checked,quality=document.getElementById("dataQuality").checked,dedup=document.getElementById("dataDedup").checked,th=+document.getElementById("dataThreshold").value;document.getElementById("dataThresholdOut").value=th.toFixed(2);const seen=new Set(),rows=dataDocs.map(d=>{const reasons=[];if(lang&&d.lang!=="en")reasons.push("Sprache");if(quality&&d.q<th)reasons.push("Qualität");if(dedup&&seen.has(d.dup))reasons.push("Near-Dup");seen.add(d.dup);const keep=!reasons.length;return{...d,reasons,keep,masked:pii&&d.pii}}),kept=rows.filter(x=>x.keep).length;document.getElementById("dataStage").innerHTML=`<h2>${kept}/${rows.length} Dokumente behalten</h2><div style="display:grid;gap:.5rem">${rows.map(d=>`<div class="metric" style="border-left:4px solid ${d.keep?"var(--success)":"var(--danger)"}"><strong style="font-size:1rem">${d.keep?"✓":"×"} ${esc(d.name)}</strong><span>lang=${d.lang} · quality=${d.q.toFixed(2)} · ${d.masked?"PII maskiert":d.pii?"PII sichtbar":"keine PII"} ${d.reasons.length?"· verworfen: "+d.reasons.join(", "):""}</span></div>`).join("")}</div><p class="lab-note">Beobachte den möglichen False Positive „Deutscher Fachartikel“ und den kontextabhängigen Grenzfall „Counter-Speech-Zitat“.</p>`;}

    function updateEvaluation(show=true){const claim=document.getElementById("evalClaim").value,metric=document.getElementById("evalMetric").value,map={likelihood:"ppl",knowledge:"mmlu",instruction:"judge",safety:"safety",systems:"latency"},good=map[claim]===metric,notes={likelihood:"Perplexity braucht gleichen Tokenizer, Kontext und Korpus.",knowledge:"Accuracy braucht Prompt-/Scoringregeln und Kontaminationsprüfung.",instruction:"Pairwise Judges brauchen Judge-Bias-, Kosten- und Einzelfallanalyse.",safety:"Berichte sowohl gefährliche Durchlässe als auch Überverweigerung.",systems:"Latenz allein reicht nicht; Throughput, Batch, Hardware und Kosten gehören dazu."};document.getElementById("evalStage").innerHTML=`<h2>${show?(good?"Plausible Primärmetrik":"Metrik passt nicht zur Behauptung"):"Design vor dem Score"}</h2><div class="callout ${good?"accent":"warning"}">${show?(good?"Gute Richtung. ":"Wähle eine Metrik, die das behauptete Verhalten direkt operationalisiert. "):"Wähle zuerst Behauptung und Messregel – erst danach darf ein Score Bedeutung bekommen. "}${notes[claim]}</div><h3 style="margin-top:1rem">Immer zusätzlich prüfen</h3><ul class="check-list"><li>Einzelinstanzen und Failure Modes</li><li>Prompting, Sampling und Scorer</li><li>Kontamination, Streuung und Kosten</li></ul>`;}

    function updateGrpo(){const rewards=[...document.querySelectorAll(".grpoReward")].map((x,i)=>{const v=+x.value;document.getElementById("grpoOut"+i).value=v.toFixed(2);return v}),mean=rewards.reduce((a,b)=>a+b,0)/rewards.length,variance=rewards.reduce((s,x)=>s+(x-mean)**2,0)/rewards.length,std=Math.sqrt(variance),normStd=document.getElementById("grpoStd").checked,adv=rewards.map(r=>(r-mean)/(normStd?std+1e-8:1));document.getElementById("grpoStage").innerHTML=`<h2>Gruppenrelatives Lernsignal</h2><div class="stage-metric"><div class="metric"><strong>${mean.toFixed(3)}</strong><span>Gruppenmittel μ</span></div><div class="metric"><strong>${std.toFixed(3)}</strong><span>Gruppen-Std σ</span></div></div><div class="bar-list">${adv.map((a,i)=>`<div class="bar-row"><span>Antwort ${i+1}</span><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.abs(a)/(Math.max(...adv.map(Math.abs),1e-8))*100)}%;background:${a>=0?"var(--success)":"var(--danger)"}"></div></div><strong>${a.toFixed(2)}</strong></div>`).join("")}</div><div class="callout ${std<1e-7?"warning":"accent"}" style="margin-top:1rem">${std<1e-7?"Alle Rewards sind gleich: Nach Zentrierung gibt es kein relatives Lernsignal.":`Positive Advantages erhöhen im idealisierten Gradient-Ascent die Logwahrscheinlichkeit; negative senken sie. ${normStd?"Durch σ teilen macht die Skala gruppenabhängig.":"Ohne σ bleibt die Rewardskala erhalten."}`}</div>`;}

    function openModal(title,eyebrow,body){const backdrop=document.getElementById("modalBackdrop"),opening=backdrop.hidden;if(opening)modalInvoker=document.activeElement;document.getElementById("modalTitle").textContent=title;document.getElementById("modalEyebrow").textContent=eyebrow;document.getElementById("modalBody").innerHTML=body;backdrop.hidden=false;document.getElementById("appShell").inert=true;document.body.style.overflow="hidden";if(opening)requestAnimationFrame(()=>document.getElementById("modalClose").focus())}
    function closeModal(){const backdrop=document.getElementById("modalBackdrop");if(backdrop.hidden)return;backdrop.hidden=true;document.getElementById("appShell").inert=false;document.body.style.overflow="";const target=modalInvoker?.isConnected&&!modalInvoker.closest("[inert]")?modalInvoker:document.getElementById("mainContent");modalInvoker=null;requestAnimationFrame(()=>target.focus())}
    function openDiagnostic(){openModal("Grundlagen-Diagnose","12 Minuten · ohne Hilfsmittel",`<p class="muted">Beantworte aus deinem aktuellen Verständnis. Das Ergebnis priorisiert den Lernpfad, benotet dich aber nicht.</p><form id="diagnosticForm">${DIAGNOSTIC.map((q,i)=>quizQuestionHtml(q,i,"diag")).join("")}<button class="button primary" type="submit" style="margin-top:1rem">Auswerten</button></form><div id="diagnosticResult" role="status" aria-live="polite"></div>`);document.getElementById("diagnosticForm").onsubmit=e=>{e.preventDefault();const groups={};DIAGNOSTIC.forEach((q,i)=>{groups[q.area]||={n:0,ok:0};groups[q.area].n++;const chosen=document.querySelector(`input[name="diag-${i}"]:checked`);if(chosen&&+chosen.value===q.a)groups[q.area].ok++});if(document.querySelectorAll('#diagnosticForm input[type="radio"]:checked').length<DIAGNOSTIC.length){toast("Bitte beantworte alle Fragen.");return;}const scores=Object.fromEntries(Object.entries(groups).map(([k,v])=>[k,Math.round(v.ok/v.n*100)]));user.diagnostic={scores,at:new Date().toISOString()};saveUser(true);document.getElementById("diagnosticResult").innerHTML=`<div class="callout accent" style="margin-top:1rem"><strong>Gespeichert.</strong> Niedrigste Bereiche: ${Object.entries(scores).sort((a,b)=>a[1]-b[1]).slice(0,3).map(([k,v])=>`${k} ${v}%`).join(" · ")}. Schließe den Dialog für deinen aktualisierten Fokus.</div>`;renderDashboard()}; }

    let flashIndex=0;
    function openFlashcards(){flashIndex=0;renderFlashcardModal()}
    function renderFlashcardModal(){const cards=[...QUIZ.map(q=>({front:q.q,back:q.opts[q.a]+" — "+q.why})),...FORMULAS.slice(0,15).map(f=>({front:`Erkläre ${f.title} ohne Vorlage.`,back:`${strip(f.expr)} — ${f.intuition}`}))],card=cards[flashIndex%cards.length];openModal("Karteikarten","Aktives Abrufen",`<article class="panel flashcard" aria-labelledby="flashQuestion"><div class="flashcard-inner"><p class="eyebrow">Karte ${flashIndex+1} / ${cards.length}</p><h3 id="flashQuestion">${esc(card.front)}</h3><p class="answer" id="flashAnswer" hidden>${formulaText(card.back)}</p><button class="button" id="flashReveal" aria-controls="flashAnswer" aria-expanded="false">Antwort anzeigen</button></div></article><div class="card-actions" style="justify-content:center;margin-top:1rem"><button class="button" id="flashPrev" ${flashIndex===0?"disabled":""}>Zurück</button><button class="button primary" id="flashNext">Nächste Karte</button></div>`);document.getElementById("flashReveal").onclick=event=>{document.getElementById("flashAnswer").hidden=false;event.currentTarget.setAttribute("aria-expanded","true");event.currentTarget.textContent="Antwort sichtbar";event.currentTarget.disabled=true};document.getElementById("flashPrev").onclick=()=>{flashIndex=Math.max(0,flashIndex-1);renderFlashcardModal()};document.getElementById("flashNext").onclick=()=>{flashIndex=(flashIndex+1)%cards.length;renderFlashcardModal()};requestAnimationFrame(()=>document.getElementById("flashReveal")?.focus())}

    function exportProgress(){const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),data:user},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="cs336-lernfortschritt.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Fortschritt exportiert")}
    function importProgress(e){const file=e.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result);user=normalizeUser(parsed.data||parsed);saveUser(true);applyTheme();renderCurrent();toast("Fortschritt importiert")}catch{toast("Ungültige Fortschrittsdatei")}};reader.readAsText(file)}

    function buildSearchIndex(){return [
      ...MODULES.map(x=>({type:"Modul",title:x.n+" · "+x.title,desc:x.description,id:x.id,kind:"module",text:[x.title,x.description,x.outcome,x.stage].join(" ")})),
      ...CONCEPTS.map(x=>({type:"Konzept",title:x.title,desc:x.summary,id:x.id,kind:"concept",text:[x.title,x.summary,x.mental,x.details,x.pitfalls,x.formulas].flat().join(" ")})),
      ...FORMULAS.map(x=>({type:"Formel",title:x.title,desc:strip(x.expr),id:x.id,kind:"formula",text:Object.values(x).flat(3).join(" ")})),
      ...SYMBOLS.map(x=>({type:"Symbol",title:x.symbol+" · "+x.meaning,desc:x.context+" — "+x.dimension,id:x.id,kind:"symbol",text:Object.values(x).join(" ")})),
      ...ASSIGNMENTS.map(x=>({type:"Assignment",title:x.label+" · "+x.title,desc:x.goal,id:x.id,kind:"assignment",text:Object.values(x).flat(3).join(" ")})),
      ...LABS.map(x=>({type:"Lab",title:x.title,desc:x.desc,id:x.id,kind:"lab",text:Object.values(x).join(" ")})),
      ...GLOSSARY.map(x=>({type:"Glossar",title:x.term,desc:x.def,id:x.id,kind:"glossary",text:x.term+" "+x.def+" "+x.cat}))
    ];}
    const SEARCH_INDEX=buildSearchIndex();
    function searchAll(query){const q=norm(query);if(q.length<2)return[];return SEARCH_INDEX.map(item=>{const title=norm(item.title),text=norm(item.text);let score=0;if(title===q)score=100;if(title.startsWith(q))score=Math.max(score,70);if(title.includes(q))score=Math.max(score,50);if(text.includes(q))score=Math.max(score,20);return{...item,score}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.title.localeCompare(b.title)).slice(0,14)}
    function setSearchOpen(open){const input=document.getElementById("globalSearch"),box=document.getElementById("searchResults");box.hidden=!open;input.setAttribute("aria-expanded",String(open));if(!open){activeSearchIndex=-1;input.removeAttribute("aria-activedescendant");box.querySelectorAll('[role="option"]').forEach(option=>{option.classList.remove("is-active");option.setAttribute("aria-selected","false")})}}
    function setActiveSearchResult(index){if(!searchItems.length)return;activeSearchIndex=(index+searchItems.length)%searchItems.length;const input=document.getElementById("globalSearch"),options=[...document.querySelectorAll("#searchResults [role=option]")];options.forEach((option,i)=>{const active=i===activeSearchIndex;option.classList.toggle("is-active",active);option.setAttribute("aria-selected",String(active))});const active=options[activeSearchIndex];if(active){input.setAttribute("aria-activedescendant",active.id);active.scrollIntoView({block:"nearest"})}}
    function renderSearchResults(){const input=document.getElementById("globalSearch"),box=document.getElementById("searchResults"),status=document.getElementById("searchStatus");searchItems=searchAll(input.value);activeSearchIndex=-1;input.removeAttribute("aria-activedescendant");if(input.value.trim().length<2){box.innerHTML="";status.textContent="";setSearchOpen(false);return}box.innerHTML=searchItems.length?searchItems.map((item,i)=>`<div class="search-result" id="search-option-${i}" role="option" aria-selected="false" data-search-i="${i}"><span class="result-type">${item.type}</span><span class="result-copy"><strong>${esc(item.title)}</strong><small>${formulaText(item.desc)}</small></span></div>`).join(""):`<div class="search-empty" role="option" aria-disabled="true" aria-selected="false"><strong>Kein Treffer</strong><p class="muted small">Probiere englische Begriffe, Unicode-Symbole oder Codebezeichner wie d_model.</p></div>`;status.textContent=searchItems.length?`${searchItems.length} Suchergebnisse verfügbar. Mit Pfeiltasten auswählen.`:"Keine Suchergebnisse.";setSearchOpen(true);box.querySelectorAll("[data-search-i]").forEach(option=>{option.addEventListener("mousedown",event=>event.preventDefault());option.onclick=()=>openSearchItem(searchItems[+option.dataset.searchI])})}
    function handleSearchKeydown(event){const box=document.getElementById("searchResults");if(event.key==="ArrowDown"||event.key==="ArrowUp"){event.preventDefault();if(box.hidden)renderSearchResults();if(searchItems.length){const direction=event.key==="ArrowDown"?1:-1,next=activeSearchIndex<0?(direction>0?0:searchItems.length-1):activeSearchIndex+direction;setActiveSearchResult(next)}return}if(event.key==="Enter"&&!box.hidden&&searchItems.length){event.preventDefault();openSearchItem(searchItems[activeSearchIndex>=0?activeSearchIndex:0]);return}if(event.key==="Escape"&&!box.hidden){event.preventDefault();setSearchOpen(false)}}
    function openSearchItem(item){setSearchOpen(false);document.getElementById("globalSearch").value="";document.getElementById("searchStatus").textContent="";if(["module","concept","formula","assignment","lab"].includes(item.kind)){navigate("detail",{type:item.kind,id:item.id});return}if(item.kind==="symbol"){appState.formulaMode="symbols";appState.formulaQuery=item.title.split(" · ")[0];navigate("formulas");return}if(item.kind==="glossary"){appState.glossaryQuery=item.title;navigate("glossary")}}

    function applyTheme(){document.documentElement.dataset.theme=user.theme;document.querySelector('meta[name="theme-color"]').content=user.theme==="dark"?"#09111f":"#f5f7fb";document.getElementById("themeButton").textContent=user.theme==="dark"?"☼":"☾";document.getElementById("themeButton").setAttribute("aria-label",user.theme==="dark"?"Helles Farbschema":"Dunkles Farbschema")}
    function parseHash(){const route=routeFromLocation();appState.view=route.view;appState.detail=route.detail}
    function init(){
      parseHash();initNav();applyTheme();
      const syncMobileNav=()=>setMobileNav(false,true);if(mobileNavMedia.addEventListener)mobileNavMedia.addEventListener("change",syncMobileNav);else mobileNavMedia.addListener(syncMobileNav);
      document.getElementById("themeButton").onclick=()=>{user.theme=user.theme==="dark"?"light":"dark";saveUser();applyTheme()};
      document.getElementById("notesQuickButton").onclick=()=>navigate("notes");
      document.getElementById("accountButton").onclick=openAccount;
      document.getElementById("menuButton").onclick=()=>setMobileNav(!document.getElementById("sidebar").classList.contains("is-open"));
      document.getElementById("sidebarCloseButton").onclick=()=>setMobileNav(false);
      document.getElementById("navScrim").onclick=()=>setMobileNav(false);
      document.getElementById("modalClose").onclick=closeModal;document.getElementById("modalBackdrop").addEventListener("click",e=>{if(e.target.id==="modalBackdrop")closeModal()});
      document.addEventListener("keydown",e=>{const backdrop=document.getElementById("modalBackdrop"),sidebar=document.getElementById("sidebar");if(!backdrop.hidden){if(e.key==="Escape"){e.preventDefault();closeModal()}else trapFocus(e,backdrop.querySelector(".modal"));return}if(sidebar.classList.contains("is-open")){if(e.key==="Escape"){e.preventDefault();setMobileNav(false)}else trapFocus(e,sidebar);return}if(e.key==="Escape")setSearchOpen(false)});
      document.getElementById("globalSearch").addEventListener("input",renderSearchResults);document.getElementById("globalSearch").addEventListener("keydown",handleSearchKeydown);document.getElementById("globalSearch").addEventListener("blur",()=>requestAnimationFrame(()=>setSearchOpen(false)));
      document.addEventListener("click",e=>{const source=e.target.closest("[data-source-id]");if(source){e.preventDefault();void openSource(source.dataset.sourceId,source.dataset.sourcePage||"")}});
      document.addEventListener("click",e=>{if(!e.target.closest(".search-wrap"))setSearchOpen(false)});
      document.querySelector(".skip-link").addEventListener("click",e=>{e.preventDefault();document.getElementById("mainContent").focus()});
      window.addEventListener("popstate",handleHistoryNavigation);window.addEventListener("hashchange",handleHistoryNavigation);
      window.addEventListener("online",()=>{setCloudStatus(cloud.session?"syncing":cloud.configured?"signedout":"local");scheduleCloudSync(100)});
      window.addEventListener("offline",()=>setCloudStatus("offline"));
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){const notes=document.getElementById("notesArea");if(notes&&user.notes!==notes.value){user.notes=notes.value;saveUser(true)}}else void refreshCloudState()});
      window.addEventListener("beforeinstallprompt",event=>{event.preventDefault();installPrompt=event});
      navigate(appState.view,appState.detail,{historyMode:"replace",focusMain:false});registerPwa();void initCloud();
    }
    init();
  </script>
