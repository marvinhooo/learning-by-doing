    const GLOSSARY_DETAILS = {
      "Autograd": "Autograd ist PyTorchs System für automatische Differentiation; Backpropagation ist der darin ausgeführte Rückwärtsalgorithmus. Im Forward Pass entsteht dynamisch ein Rechengraph: Jede Operation merkt sich, von welchen Tensoren ihr Output abhängt, und speichert nur die Werte, die ihre lokale Ableitung später benötigt. `loss.backward()` startet beim skalaren Loss mit dem Gradienten 1 und läuft den Graphen rückwärts. An jeder Kante wird der ankommende Upstream-Gradient mit der lokalen Ableitung zu einem Vector-Jacobian Product kombiniert; treffen mehrere Pfade zusammen, werden ihre Beiträge addiert. Ein Parameter W erhält dadurch `W.grad` mit derselben Shape wie W. Autograd berechnet diese Gradienten, verändert die Parameter aber nicht – das erledigt erst der Optimizer. PyTorch akkumuliert Leaf-Gradienten, weshalb sie vor dem nächsten unabhängigen Step zurückgesetzt werden müssen. Gespeicherte Aktivierungen kosten Speicher; Activation Checkpointing verwirft ausgewählte davon und berechnet sie im Backward Pass erneut.",
      "BPE": "Byte-Pair Encoding (BPE) hat zwei klar getrennte Phasen. Beim Tokenizer-Training startet jedes Pretoken aus Bytes beziehungsweise kleinen Symbolen. Der Algorithmus zählt benachbarte Paare, wählt das häufigste Paar mit einer festen Tie-Break-Regel, ersetzt nichtüberlappende Vorkommen und speichert den neuen Merge mit seinem Rang. Die geordnete Merge-Liste ist der gelernte Zustand des Tokenizers; dabei gibt es keine Gradienten oder neuronalen Gewichte. Beim späteren Encoding wird Text wieder identisch pretokenisiert und in Bytes zerlegt, dann werden nur diese bereits gelernten Regeln angewandt. Das Ergebnis ist eine variable Folge ganzzahliger Token-IDs, die erst durch ein Embedding zu Vektoren wird. Mehr Merges vergrößern das Vokabular und verkürzen häufig Sequenzen, aber nicht für jede Sprache gleich. Special Tokens bilden harte Grenzen, und `decode(encode(text)) == text` bleibt der zentrale Roundtrip-Vertrag.",
      "BF16": "Brain Floating Point 16 (BF16), meist BFloat16 genannt, verwendet wie FP32 acht Exponentenbits, aber deutlich weniger Bits für die Mantisse. Sein großer Wertebereich macht Über- und Unterläufe beim Mixed-Precision-Training seltener als bei FP16, während Speicherbedarf und Datentransfer gegenüber FP32 sinken. Die geringere Präzision kann kleine Aktualisierungen verschlucken, weshalb kritische Zustände wie Optimizer-Momente häufig in FP32 bleiben.",
      "Bloom Filter": "Ein Bloom Filter speichert approximate Set Membership in einem Bit Array mit m Positionen. Beim Einfügen setzt jede von k Hash Functions ein Bit; eine Query prüft dieselben Positionen. Findet sie ein Nullbit, ist das Element unter dem Standardvertrag definitiv nicht enthalten. Sind alle Bits eins, kann es enthalten sein oder andere Inserts haben diese Kombination erzeugt – ein False Positive. Mit n Inserts ist die modellierte Fehlerrate ungefähr (1−e^(−kn/m))^k und die günstige Hashzahl liegt bei k≈(m/n)ln2. Der normale Bloom Filter speichert keine Originalelemente oder Counts und unterstützt kein sicheres Löschen. Er beantwortet damit eine andere Frage als MinHash und Locality-Sensitive Hashing (LSH), die Mengenähnlichkeit schätzen beziehungsweise Near-Duplicate-Kandidaten suchen.",
      "Checkpoint": "Ein Checkpoint speichert neben den Modellparametern idealerweise auch Optimizer State, Learning-Rate-Scheduler, Trainingsschritt, Zufallszustände und die Position in der Datenpipeline. Damit lässt sich ein unterbrochener Lauf möglichst reproduzierbar fortsetzen oder ein früherer Modellstand evaluieren. Activation Checkpointing ist etwas anderes: Es verwirft ausgewählte Aktivierungen und berechnet sie im Backward Pass erneut, um Speicher gegen zusätzliche Rechenzeit zu tauschen.",
      "Collective": "Eine Collective Communication ist eine gemeinsam ausgeführte Kommunikationsoperation, an der mehrere Ranks, also Prozesse oder Geräte, teilnehmen. All-Reduce synchronisiert beispielsweise aggregierte Werte auf allen Ranks, während Reduce-Scatter das Ergebnis verteilt und All-Gather verteilte Teile wieder zusammensetzt. Alle Teilnehmer müssen Collectives in kompatibler Reihenfolge aufrufen; viele kleine Operationen leiden zudem besonders unter Kommunikationslatenz.",
      "CUDA": "Compute Unified Device Architecture (CUDA) ist NVIDIAs Plattform und Programmiermodell für allgemeine Berechnungen auf Graphics Processing Units (GPUs). Der Host startet dabei GPU-Kernel, deren viele Threads Daten parallel verarbeiten; Compiler, Laufzeit und Bibliotheken übernehmen wesentliche Teile der Hardwareansteuerung. CUDA bietet ein ausgereiftes Ökosystem, bindet Anwendungen jedoch an NVIDIA-Hardware.",
      "DDP": "Distributed Data Parallel (DDP) hält auf jedem Rank eine vollständige Kopie der Modellparameter und des Optimizerzustands. Jeder Rank verarbeitet einen anderen lokalen Batch [b,T] und berechnet im Backward zunächst lokale Gradienten derselben Shapes wie die Parameter. Sobald ein Gradient-Bucket bereit ist, kombiniert All-Reduce die gleich positionierten Werte aller Ranks und gibt jedem Rank denselben gemittelten Gradient zurück; danach führen alle Kopien denselben Optimizer-Step aus und bleiben synchron. Der globale Datenbatch ist ungefähr World Size × lokaler Batch × Gradient-Accumulation-Steps. DDP verändert damit die Ausführung, nicht die mathematische Modellfunktion oder die per-Rank-Modellgröße: Es erhöht den Durchsatz, spart aber keinen persistenten Parameter- oder Optimizer-Speicher pro Gerät. Ein Distributed Sampler muss unterschiedliche Daten liefern, und alle Ranks müssen Collectives in kompatibler Reihenfolge aufrufen.",
      "DPO": "Direct Preference Optimization (DPO) arbeitet mit einem Prompt x, einer bevorzugten Antwort y⁺ und einer abgelehnten Antwort y⁻. Die trainierbare Policy addiert für jede Antwort die Log-Probabilities ihrer Response-Tokens zu einem Sequenzscore; eine eingefrorene Reference Policy berechnet dieselben beiden Scores. Entscheidend ist Δ=[log πθ(y⁺|x)−log πref(y⁺|x)]−[log πθ(y⁻|x)−log πref(y⁻|x)]: Hat die neue Policy die bevorzugte Antwort relativ zur Reference stärker aufgewertet als die abgelehnte, ist Δ positiv. Der Loss −log σ(βΔ) erzeugt andernfalls Druck, die bevorzugte Sequenz wahrscheinlicher und/oder die abgelehnte unwahrscheinlicher zu machen. Nur πθ wird gelernt; Reference, Sigmoid und Präferenzlabels sind fest. β skaliert die Empfindlichkeit und wirkt als weiche Regularisierung, nicht als harte Distanzgrenze. DPO benötigt während dieses Trainings weder neue On-Policy-Rollouts noch ein separates Reward Model, bleibt aber empfindlich gegenüber fehlerhaften Paaren, Response-Masken sowie Längen- und Formatbias.",
      "DSIR": "Data Selection via Importance Resampling (DSIR) soll aus einem großen Raw Corpus R eine Teilmenge ziehen, die einer kleineren Target Distribution T ähnlicher ist. Auf derselben gehashten n-gram Feature-Repräsentation werden eine Target-Dichte p_T und eine Raw- oder Proposal-Dichte p_R geschätzt. Das Importance Weight w(x)=p_T(x)/p_R(x) ist groß, wenn ein Muster für das Target relativ charakteristisch und im Raw Corpus unterrepräsentiert ist. Nach Normalisierung werden Dokumente proportional zu diesen Weights resampled, statt nur deterministisch die größten Target-Scores zu behalten. Ein winziger Nenner erzeugt extreme Weights; deshalb braucht DSIR Smoothing, numerisch stabile Log-Space-Rechnung und ausreichenden Proposal Support. Die Featurewahl und Hash-Kollisionen begrenzen außerdem, welche Verteilungsunterschiede überhaupt sichtbar sind.",
      "EOS": "End of Sequence (EOS) ist ein spezielles Token, dessen Wahrscheinlichkeit das Modell wie die jedes anderen nächsten Tokens lernt. Wird EOS bei der Generierung gewählt, kann das Decoding beendet werden; es sollte dabei klar von Padding zur Batch-Auffüllung getrennt sein. Fehlende oder falsch maskierte EOS-Beispiele führen leicht zu unnötig langen, abrupt abgeschnittenen oder vorzeitig beendeten Ausgaben.",
      "FLOP": "Eine Floating-Point Operation (FLOP) bezeichnet eine einzelne Gleitkommaoperation und dient als grobes Maß für Rechenarbeit. Bei Zählungen wird eine kombinierte Multiplikation und Addition häufig als zwei FLOPs gewertet, weshalb die verwendete Konvention genannt werden sollte. FLOP/s misst dagegen eine Rechenrate, und ein niedriger theoretischer FLOP-Bedarf garantiert wegen Speicherzugriffen und Kommunikation noch keine kurze Laufzeit.",
      "FSDP": "Fully Sharded Data Parallel (FSDP) lässt das Modell logisch unverändert, speichert Parameter, Gradienten und Optimizerzustände physisch aber nur als unterschiedliche Shards auf den Ranks. Vor der Berechnung eines umschlossenen Layers rekonstruiert All-Gather die dafür benötigten vollständigen Parameter vorübergehend; Forward und Backward verwenden dadurch dieselben mathematischen Tensor-Shapes wie ohne Sharding. Im Backward kombiniert Reduce-Scatter die lokalen Gradienten und lässt jedem Rank nur seinen 1/W-Shard, den der lokale Optimizer aktualisiert. Das senkt den persistenten Trainingszustand pro Rank ungefähr um den World-Size-Faktor, kostet aber Layer-für-Layer-Kommunikation und kann während All-Gather, Prefetching oder überlappender Layer kurzzeitig deutlich höhere Peaks erzeugen. Aktivierungsspeicher wird dadurch nicht automatisch geshardet und bleibt ein separates Budget.",
      "fastText": "fastText ist in Lecture 14 ein schneller discriminative Text Classifier, kein Transformer. Wörter und/oder n-Grams werden per Hashing Trick in eine feste Zahl B von Buckets gelegt. Das Modell schlägt die dazugehörigen gelernten Embeddings nach, mittelt sie zu einem Dokumentvektor und berechnet mit einem Linear Layer plus Softmax Klassenwahrscheinlichkeiten, etwa für Language Identification oder ein operationalisiertes Quality Label. Dadurch skaliert der Speicher mit der Bucketzahl statt mit jeder möglichen n-Gram-Zeichenfolge. Kollisionen sind bewusst erlaubt und zwingen verschiedene Features, Parameter zu teilen. Das Modell ist schnell und robust gegen unbekannte Wörter, bildet aber Reihenfolge und langen Kontext nur schwach ab; sein Score übernimmt die Definition und Biases seiner Labels und ist kein objektiver Qualitätsstempel.",
      "GQA": "Grouped-Query Attention (GQA) behält H_q getrennte Query Heads, erzeugt aber nur H_kv getrennte Key- und Value Heads, wobei 1 < H_kv < H_q gilt. Aus X [B,T,D] entstehen Q [B,H_q,T,d_head] sowie K und V [B,H_kv,T,d_head]. Bei G=H_q/H_kv verwenden jeweils G Query Heads dieselbe K/V-Gruppe; die Queries selbst, ihre Q-Projection und die späteren Attention-Outputs werden nicht geteilt. Beim Score-Produkt wird die passende K-Gruppe logisch auf ihre Query-Gruppe abgebildet, sodass die Scores weiterhin [B,H_q,T_query,T_key] besitzen und der Output nach Concat und W_O wieder [B,T,D] wird. GQA reduziert deshalb die gelernten K/V-Projection-Parameter und den KV-Cache ungefähr um H_kv/H_q gegenüber Multi-Head Attention. Es spart besonders Decode-Bandbreite, bewahrt aber mehr K/V-Repräsentationen als Multi-Query Attention. H_q muss sauber durch H_kv teilbar sein; die Zuordnung ist eine Architekturentscheidung und kein nachträglicher Cache-Schalter.",
      "GRPO": "Group Relative Policy Optimization (GRPO) erzeugt für denselben Prompt eine Gruppe aus G Antworten und bewertet jede mit einem festen Grader oder Reward R_i. Aus Gruppenmittel μ und Standardabweichung σ entsteht typischerweise A_i=(R_i−μ)/(σ+ε): Ein positives Advantage bedeutet besser als die Vergleichsgruppe und erhöht über die Token-Log-Probabilities den Lerndruck auf diese Antwort; ein negatives Advantage kehrt die Richtung um. A_i [G] wird entlang der Response-Tokenachse gebroadcastet, während Prompt- und Padding-Positionen maskiert bleiben. Häufig vergleicht ein Importance Ratio ρ_i,t=πθ/πold die aktuelle mit der datenerzeugenden Policy und Clipping begrenzt, wie stark ein einzelnes Sample das Update treiben kann; ein zusätzlicher Reference-Term kann Drift bestrafen. Gelernt wird die Policy, nicht der Reward. GRPO spart ein eigenes Value Model, benötigt aber mehrere Rollouts pro Prompt. Wenn σ nahezu null ist, liefern gleiche Rewards praktisch kein relatives Signal und müssen numerisch stabil behandelt werden.",
      "HBM": "High Bandwidth Memory (HBM) ist gestapelter dynamischer Arbeitsspeicher mit sehr breiter Anbindung, der als großer externer Speicher moderner Beschleuniger dient. Trotz seiner hohen Bandbreite ist HBM im Vergleich zu Registern oder gemeinsamem On-Chip-Speicher weiter entfernt und oft der Engpass datenintensiver Kernel. Tiling, Kernel-Fusion und Verfahren wie FlashAttention beschleunigen Berechnungen deshalb vor allem, indem sie unnötige HBM-Transfers vermeiden.",
      "Head": "Ein Attention Head ist eine vollständige kleine Attention-Berechnung in einem eigenen gelernten Feature-Raum. Aus X [B,T,D] erzeugen Linear Layers zunächst Q, K und V und ordnen sie zu [B,H,T,d_head] um. Innerhalb eines Heads vergleicht jede Queryposition ihren Query-Vektor mit den erlaubten Key-Vektoren; daraus entstehen Scores [B,H,T_query,T_key]. Maske und Softmax machen daraus Gewichte, und deren gewichtete Summe der Values ergibt [B,H,T_query,d_v]. Danach werden alle Head-Ergebnisse zu [B,T,H·d_v] verbunden und durch W_O wieder auf [B,T,D] gemischt. Gelernt werden die Q/K/V/O-Matrizen; Reshape, Maske und Softmax besitzen keine trainierbaren Parameter. Verschiedene Heads können dadurch unterschiedliche Vergleichs- und Inhaltsräume lernen. Bei festem D bedeutet mehr H jedoch kleineres d_head=D/H und nicht automatisch mehr Gesamtbreite. GQA oder MQA teilen zusätzlich Key- und Value-Repräsentationen zwischen mehreren Query Heads.",
      "IsoFLOPs": "IsoFLOPs-Experimente halten den gesamten Trainingscompute näherungsweise konstant und variieren dafür Modellgröße und Zahl der Trainingstokens. Mit der Näherung C ≈ 6ND folgt bei gegebenem Budget C und Modellgröße N eine Tokenzahl D ≈ C/(6N), sodass sich der verlustärmste Kompromiss empirisch suchen lässt. Das Minimum muss durch Messpunkte auf beiden Seiten eingeklammert werden und gilt nur für die untersuchte Architektur, Datenverteilung und Compute-Konvention.",
      "Jaccard": "Die Jaccard-Ähnlichkeit zweier Mengen ist das Verhältnis ihrer Schnittmenge zu ihrer Vereinigungsmenge und liegt zwischen null und eins. Bei der Text-Deduplizierung werden häufig Mengen aus Zeichen- oder Wort-Shingles verglichen, wodurch lokale Überlappung erfasst wird, nicht aber deren Häufigkeit oder vollständige Reihenfolge. MinHash kann Jaccard effizient schätzen, während Locality-Sensitive Hashing Kandidaten findet, die anschließend möglichst exakt geprüft werden.",
      "KenLM": "KenLM ist ein auf Geschwindigkeit und Speicherverbrauch optimiertes Toolkit für geglättete n-gram Language Models. Es zählt lokale Fortsetzungen und verwendet Verfahren wie Modified Kneser-Ney Smoothing, damit ungesehene n-Grams nicht sofort Probability zero erhalten. In Datenfilterpipelines kann ein auf einem gewünschten Target Corpus trainiertes KenLM Dokumente nach längennormalisierter Perplexity ranken: niedriger bedeutet, dass ihre lokalen Tokenfolgen dem Target Model vertrauter sind. Das ist Target-Ähnlichkeit, nicht universelle Qualität. Ein wichtiger API-Vertrag ist die Logarithmusbasis: `Model.score` liefert eine Summe von Log10-Wahrscheinlichkeiten, daher entspricht die Perplexity dort 10^(−score/N); die bekannte Form exp(mean NLL) setzt Natural Logs voraus. Tokenisierung, Satzgrenzen und Trainingskorpus müssen für Vergleiche festgehalten werden.",
      "Kernel": "Ein GPU-Kernel ist eine Funktion, die nach einem Start durch den Host parallel von vielen Threads eines Grids ausgeführt wird. Seine Laufzeit hängt nicht nur von der Zahl der Rechenoperationen ab, sondern auch von Speicherzugriffen, Thread-Divergenz, Belegung der Recheneinheiten und Arithmetic Intensity. Kernel-Fusion kann Startaufwand und HBM-Zwischenwerte sparen, doch übermäßige Fusion erhöht mitunter Registerbedarf und senkt die Parallelität.",
      "KL": "Die Kullback-Leibler-Divergenz D_KL(P||Q) misst, wie stark die betrachtete Verteilung P von der Referenzverteilung Q abweicht, indem sie unter P den Logarithmus des Verhältnisses P/Q mittelt. Beim Training von Sprachmodellen kann sie beispielsweise verhindern, dass sich eine optimierte Policy zu weit von einem Referenzmodell entfernt. Sie ist gerichtet und daher keine symmetrische Distanz; weist Q einem unter P möglichen Ereignis die Wahrscheinlichkeit null zu, kann die Divergenz sogar unendlich werden.",
      "KV-Cache": "Der Key-Value-Cache (KV-Cache) ist anfrageabhängiger Aktivierungszustand, kein Teil der gelernten Modellparameter. Beim Prefill berechnet jeder Attention Layer für alle Promptpositionen K nach seiner Projection und RoPE, falls RoPE verwendet wird, sowie V nur nach seiner Projection; gespeichert werden beide ungefähr als [B,H_kv,S,d_head]. Beim folgenden Decode-Schritt entstehen für das neue Token nur ein neuer Query-, Key- und Value-Vektor. Der neue Key und Value werden an die S-Achse angehängt; der aktuelle Query [B,H_q,1,d_head] liest die gesamte erlaubte Historie. Alte Q-Vektoren und Attention-Gewichte werden nicht gecacht, weil sie für die neue Query nicht erneut gebraucht werden. So entfallen wiederholte K/V-Projections für alte Tokens. Der Speicher wächst aber ungefähr wie 2·L·B·S·H_kv·d_head·Bytes, und beim Decode muss viel Cachehistorie gelesen werden. Deshalb kann Inferenz trotz weniger Rechenarbeit speicherbandbreitenlimitiert sein; GQA und MQA reduzieren vor allem H_kv.",
      "Logit": "Ein Logit ist ein relativer Evidenz-Score vor einer Wahrscheinlichkeitsnormalisierung. Für jeden Tokenzustand h [B,T,D] berechnet der LM Head mit einer gelernten Matrix und optionalem Bias z=hW+b [B,T,V]: Ein Eintrag z[b,t,v] bewertet den Vokabularkandidaten v als nächstes Token an Position t. Der Zahlenwert allein ist keine Wahrscheinlichkeit und hat keine feste Null- oder Einheitsskala; nur Unterschiede zu den anderen V Logits derselben Position beeinflussen Softmax. Softmax selbst besitzt keine trainierbaren Parameter und erzeugt aus einer V-Zeile positive Wahrscheinlichkeiten mit Summe eins. Beim Cross-Entropy-Training wird der Logit des Zieltokens relativ zu den Konkurrenten angehoben; beim Decoding dienen dieselben Logits für Argmax oder Sampling. Temperatur teilt die Logits vor Softmax und verändert dadurch die Schärfe, während eine gemeinsame additive Verschiebung alle Wahrscheinlichkeiten unverändert lässt.",
      "LSH": "Locality-Sensitive Hashing (LSH) organisiert ähnliche MinHash-Signaturen so, dass nicht jedes Dokument mit jedem anderen verglichen werden muss. Dazu wird eine Signatur typischerweise in Bänder aufgeteilt; stimmen alle Werte eines Bands überein, wird das Dokumentpaar als Kandidat betrachtet. Anzahl und Größe der Bänder steuern den Trade-off zwischen übersehenen Duplikaten und zusätzlichen Fehlkandidaten, weshalb anschließend meist noch ein genauer Ähnlichkeitsvergleich folgt.",
      "MFU": "Model FLOPs Utilization (MFU) setzt die pro Sekunde für das Modell ausgeführten Gleitkommaoperationen ins Verhältnis zur theoretischen Spitzenleistung der Hardware. Ein niedriger Wert kann auf Speicherzugriffe, Kommunikation, kleine Matrizen oder andere Wartezeiten hinweisen, während ein hoher Wert eine gute Nutzung der Recheneinheiten signalisiert. Da die gezählten Modelloperationen und Hardware-Peaks von Konvention und Zahlenformat abhängen, sind MFU-Werte nur bei vergleichbarer Berechnung sinnvoll gegenüberzustellen.",
      "MinHash": "MinHash bildet eine Menge, etwa die Shingles eines Dokuments, durch die kleinsten Werte mehrerer unabhängiger Hashordnungen auf eine kompakte Signatur ab. Der erwartete Anteil gleicher Signaturkomponenten zweier Mengen entspricht ihrer Jaccard-Ähnlichkeit. Das spart Speicher und beschleunigt die Suche nach ähnlichen Dokumenten, bleibt aber ein probabilistischer Schätzer und sollte für endgültige Duplikatentscheidungen durch einen exakten Vergleich ergänzt werden.",
      "MLP": "Das Transformer-MLP verarbeitet den bereits kontextualisierten Zustand jedes Tokens unabhängig weiter. Ein einfacher Ablauf ist X [B,T,D] → Up-Projection → U [B,T,F] → Aktivierung oder Gate → G [B,T,F] → Down-Projection → Y [B,T,D]. Die Matrizen der Linear Layers werden gelernt; Funktionen wie SiLU und die elementweise Multiplikation eines Gates sind fest. Die erweiterte Breite F schafft viele Kandidatenfeatures, und die Nichtlinearität entscheidet inputabhängig, welche davon wirksam werden. Sie ist wesentlich: Mehrere Linear Layers ohne Aktivierung dazwischen ließen sich zu einer einzigen linearen Abbildung zusammenfassen. Das MLP mischt nur die Featureachse innerhalb eines Tokens, während Attention Informationen entlang der Tokenachse austauscht. Da dieselben großen Matrizen an jeder Position laufen, enthalten MLPs oft einen großen Anteil der Modellparameter und FLOPs. Der Output kehrt auf D zurück, damit er in den Residual Stream addiert werden kann.",
      "MoE": "Eine Mixture of Experts (MoE) ersetzt das dichte Transformer-MLP durch E getrennte Expert-MLPs. Für jeden Tokenzustand x [B,T,D] berechnet ein gelernter Router mit einem Linear Layer E Routerlogits [B,T,E]. Top-k wählt daraus k Expert-IDs, Softmax oder eine ähnliche Normalisierung liefert Gate-Gewichte, und ein Dispatch ordnet jeden Token nur diesen Experts zu. Jeder ausgewählte Expert transformiert D→F→D; anschließend kombiniert eine gewichtete Summe seine Outputs wieder zu [B,T,D], sodass der Residualvertrag unverändert bleibt. Router- und Expert-Gewichte werden gelernt, Top-k-Auswahl und Datenbewegung sind feste Operationen. Gespeichert werden alle E Experts, aktiv berechnet aber nur k pro Token: Das erhöht Parameterkapazität stärker als aktive FLOPs. Jeder Expert besitzt jedoch nur eine begrenzte Token-Capacity; Overflow muss verworfen, umgeleitet oder gepuffert werden. Auxiliary Load-Balancing vergleicht harte Routing-Anteile mit weichen Routerwahrscheinlichkeiten, damit nicht wenige Experts kollabieren. Auf mehreren GPUs verursacht Dispatch/Combine oft All-to-All-Kommunikation, weshalb gute Balance zugleich ein Qualitäts- und Systemsproblem ist.",
      "MQA": "Multi-Query Attention (MQA) ist der Extremfall von geteilten Key-Value Heads: H_q getrennte Query Heads erzeugen Q [B,H_q,T,d_head], während genau ein Key Head und ein Value Head K,V [B,1,T,d_head] liefern. Jeder Query Head besitzt weiterhin eigene Query-Features und vergleicht sie mit demselben K; beim Score-Produkt wird die einzelne K/V-Aktivierung logisch über H_q gebroadcastet, sodass Scores [B,H_q,T_query,T_key] und getrennte Head-Outputs entstehen. Geteilt werden also K/V-Projections und gecachte K/V-Aktivierungen, nicht Queries, Attention-Gewichte oder der Output Linear Layer. Der KV-Cache wird gegenüber Multi-Head Attention ungefähr um den Faktor H_q kleiner und benötigt beim Decode deutlich weniger Speicherbandbreite. Dafür müssen alle Query Heads dieselbe angebotene K/V-Repräsentation nutzen, was Qualität kosten kann. Grouped-Query Attention ist der Zwischenweg mit 1 < H_kv < H_q.",
      "NCCL": "Die NVIDIA Collective Communications Library (NCCL) stellt optimierte kollektive Kommunikationsoperationen wie All-Reduce, All-Gather und Reduce-Scatter für mehrere GPUs bereit. Distributed Data Parallel nutzt beispielsweise All-Reduce, um die Gradienten der Modellreplikate zu synchronisieren. Die Leistung hängt stark von Netzwerktopologie, Nachrichtengröße und Überlappung mit Berechnungen ab; NCCL ist dabei die Kommunikationsschicht und nicht selbst der Parallelisierungsalgorithmus.",
      "NLL": "Für Logits z [B,T,V] und eine Ziel-ID y [B,T] ist die Negative Log-Likelihood (NLL) pro Position ℓ=−log p_y=logsumexp(z)−z_y. Log-Softmax bildet dabei jeden V-Logitvektor stabil auf Log-Wahrscheinlichkeiten ab; ein Gather wählt nur den Eintrag des tatsächlichen Next Tokens. Der Loss besitzt keine eigenen gelernten Parameter. Ohne Reduktion bleibt ℓ [B,T]; Prompt-, Padding- oder andere ungültige Positionen werden maskiert, danach wird über M gültige Tokens summiert oder gemittelt. Der Gradient bezüglich der Logits ist p−onehot(y): Er hebt den Ziel-Logit relativ zu Konkurrenten an. Bei One-Hot-Zielen ist diese NLL genau die übliche Cross-Entropy. Targets müssen um ein Token zu den Inputs verschoben sein, und Perplexity ist exp(mittlere Token-NLL) nur bei gleichem Tokenizer und Korpus vergleichbar.",
      "Occupancy": "Die Occupancy einer GPU beschreibt, welcher Anteil der maximal möglichen Warps gleichzeitig auf einem Streaming Multiprocessor aktiv sein kann. Registerbedarf, gemeinsam genutzter Speicher und Blockgröße begrenzen, wie viele Blöcke gleichzeitig resident bleiben und Wartezeiten verdecken können. Eine höhere Occupancy ist jedoch nicht automatisch schneller, weil auch Speicherbandbreite, Befehlsparallelität und effiziente Wiederverwendung von Daten entscheidend sind.",
      "On-policy": "On-policy bedeutet im Reinforcement Learning, dass die Trainingsdaten von der aktuell optimierten Policy erzeugt wurden. Nach einer größeren Aktualisierung stammen ältere Trajektorien streng genommen von einer anderen Policy und können deshalb nicht unbegrenzt unverändert wiederverwendet werden. Das verringert Verteilungsabweichungen zwischen Datenerzeugung und Update, ist aber meist weniger sample-effizient als Off-policy-Verfahren.",
      "Perplexity": "Perplexity ist das Exponential der mittleren Negative Log-Likelihood pro Token und kann als effektive Zahl plausibler Fortsetzungen interpretiert werden. Ein niedrigerer Wert bedeutet, dass das Modell den Tokens eines festgelegten Evaluationskorpus im Mittel höhere Wahrscheinlichkeit zuweist. Aussagekräftige Vergleiche erfordern denselben Tokenizer, dieselbe Kontextbehandlung und dieselbe Datenaufbereitung; Faktentreue, Instruktionsfolge oder Sicherheit misst die Kennzahl nicht direkt.",
      "PII": "Personally Identifiable Information (PII) umfasst Informationen, durch die eine Person direkt oder in Kombination mit anderen Merkmalen identifiziert werden kann. Dazu zählen neben Namen und Kennnummern auch kontextabhängige Kombinationen aus Standort-, Kontakt- oder biografischen Daten. Erkennung und Entfernung vor dem Training verringern Datenschutz- und Memorierungsrisiken, sind aber fehleranfällig und müssen mit gelabelten Stichproben auf übersehene sowie fälschlich entfernte Inhalte geprüft werden.",
      "Policy": "Eine Policy ordnet im Reinforcement Learning jedem Zustand oder bisherigen Verlauf eine Wahrscheinlichkeitsverteilung über mögliche Aktionen zu. Bei einem Sprachmodell sind die Aktionen die nächsten Tokens, und die Wahrscheinlichkeit einer gesamten Antwort entsteht aus dem Produkt der bedingten Tokenwahrscheinlichkeiten. Die Policy erzeugt das Verhalten und ist damit vom Reward Model, das Antworten bewertet, sowie vom Value Model, das erwartete zukünftige Belohnung schätzt, zu unterscheiden.",
      "PPO": "Proximal Policy Optimization (PPO) lernt aus Aktionen beziehungsweise Tokens, die eine ältere Policy π_old erzeugt hat. Für jedes Sample vergleicht das Importance Ratio ρ_t=πθ(a_t|s_t)/π_old(a_t|s_t), wie viel wahrscheinlicher die neue Policy genau diese beobachtete Aktion macht. Das Advantage A_t ist der beobachtete Outcome minus einer Baseline: A_t>0 bedeutet besser als erwartet und soll die Aktion wahrscheinlicher machen, A_t<0 entsprechend unwahrscheinlicher. Das clipped Surrogate Objective nimmt min(ρ_tA_t, clip(ρ_t,1−ε,1+ε)A_t). Bei positivem Advantage begrenzt der obere Rand übermäßiges Erhöhen; bei negativem Advantage begrenzt der untere Rand übermäßiges Absenken. Policy und meist ein Value Model werden gelernt, π_old bleibt während der Update-Epoche fest. Clipping macht große Ratio-Änderungen unattraktiv, ist aber keine harte Garantie für eine kleine gesamte Policy-Distanz. PPO benötigt deshalb frische Rollouts, korrekte Response-Masken und zusätzliche Kontrollen wie KL-Divergence, Entropie und Reward-Verlauf.",
      "Pretokenization": "Pretokenization zerlegt Rohtext zunächst in Segmente, bevor ein Verfahren wie Byte-Pair Encoding (BPE) seine gelernten Subword-Merges anwendet. Regeln für Leerzeichen, Satzzeichen, Unicode-Zeichen oder Bytefolgen bestimmen dabei, zwischen welchen Bereichen spätere Merges überhaupt möglich sind. Diese frühe Entscheidung beeinflusst Vokabular, Sequenzlängen und Zeichen-Offsets und muss deshalb bei Training und Inferenz identisch umgesetzt werden.",
      "Rank": "Ein Rank ist ein eindeutig nummerierter Prozess innerhalb einer verteilten Prozessgruppe und wird häufig genau einem Beschleuniger zugeordnet. Kollektive Kommunikationsoperationen verwenden diese Nummer, um die beteiligten Prozesse zu unterscheiden. Der globale Rank gilt über alle Maschinen hinweg, während der lokale Rank nur die Prozesse innerhalb einer Maschine nummeriert.",
      "Residual Stream": "Der Residual Stream ist der laufende Aktivierungstensor X [B,T,D], der beim Embedding beginnt und durch alle Transformer Blocks weitergereicht wird. In einem Pre-Norm Block geschieht typischerweise zuerst X_1 = X + Attention(RMSNorm(X)) und danach X_2 = X_1 + MLP(RMSNorm(X_1)). Attention und MLP berechnen also Korrekturen, ersetzen den Hauptzustand aber nicht. Die Additionen selbst und der direkte Identitätspfad haben keine gelernten Parameter; gelernt werden die Funktionen in den Seitenzweigen. Weil jeder Zweig exakt [B,T,D] zurückgeben muss, bleibt die Shape durch alle L Blocks stabil. Inhaltlich ist der Stream ein gemeinsamer Arbeitsbereich, in dem sich Tokenidentität, Positions- und Kontextinformation schrittweise ansammeln. Mathematisch liefert der Summand X außerdem einen direkten Signal- und Gradientenpfad mit lokaler Ableitung eins, sodass tiefe Netze nicht jede Information durch jeden Seitenzweig neu rekonstruieren müssen.",
      "RLHF": "Reinforcement Learning from Human Feedback (RLHF) nutzt menschliche Präferenzurteile, um meist zunächst ein Reward Model zu trainieren. Anschließend wird die Sprachmodell-Policy so optimiert, dass sie hohen vorhergesagten Reward erhält und durch eine Regularisierung nahe an einer Referenz-Policy bleibt. Das kann schwer formalisierbare menschliche Präferenzen abbilden, ist aber teuer und anfällig für Fehler oder ausnutzbare Schwächen des Reward Models.",
      "RLVR": "Reinforcement Learning from Verifiable Rewards (RLVR) bewertet erzeugte Antworten mit automatisch prüfbaren Kriterien wie exakten Lösungen, Programmiertests oder formalen Beweisen. Die Policy lernt aus ihren eigenen Rollouts, welche Antworten häufiger zu einem erfolgreichen Prüfergebnis führen. Dadurch werden kein gelerntes Reward Model und weniger menschliche Labels benötigt, doch das Verfahren ist vor allem auf Domänen mit zuverlässigen Verifizierern beschränkt und kann unter spärlichen Rewards leiden.",
      "RMSNorm": "RMSNorm kontrolliert die Größenordnung jedes Tokenvektors, ohne Tokens miteinander zu mischen. Für x ∈ R^D berechnet sie r=sqrt((1/D)Σ_i x_i²+ε) und danach y_i=g_i·x_i/r. Bei X [B,T,D] läuft Mittelwert und Division nur über die letzte D-Achse; B, T und die gesamte Shape [B,T,D] bleiben erhalten. Der Gain g [D] wird gelernt und erlaubt jedem Feature nach der gemeinsamen Normierung eine eigene Skala. Die Berechnung von r sowie das kleine feste ε besitzen keine trainierbaren Parameter; in der üblichen RMSNorm gibt es auch keinen Bias und keine Mittelwertzentrierung. In Pre-Norm Transformern steht RMSNorm direkt vor Attention beziehungsweise MLP, damit diese Unterblöcke Inputs mit besser kontrollierter Skala sehen. Sie macht Features nicht unabhängig und erzeugt keinen Kontext – sie reskaliert nur den vorhandenen Zustandsvektor.",
      "Roofline": "Das Roofline-Modell begrenzt die erreichbare Rechenleistung durch das kleinere von maximaler Rechenleistung und Speicherbandbreite mal Arithmetic Intensity. Unterhalb des Ridge Points ist ein Kernel typischerweise memory-bound, oberhalb davon compute-bound. Das Modell hilft bei der Wahl zwischen Datenwiederverwendung, Fusion und Rechenoptimierung, beschreibt aber nur eine theoretische Obergrenze und keine garantierte Laufzeit.",
      "RoPE": "Rotary Position Embedding (RoPE) wird nach den Q- und K-Projections und vor QKᵀ angewandt. Es gruppiert benachbarte Features der letzten Head-Achse zu zweidimensionalen Paaren und rotiert Paar k an Tokenposition p um den Winkel p·ω_k. Bei Standard-RoPE sind Frequenzen sowie Sinus-/Kosinuswerte fest und werden nicht durch Backpropagation gelernt; die Q/K-Projections lernen jedoch, wie sie diese gedrehten Koordinaten nutzen. Q und K behalten ihre Shape [B,H,T,d_head], V wird nicht rotiert, und d_head ist für die Paarbildung normalerweise gerade. Der entscheidende Zusammenhang lautet R_iᵀR_j=R_(j−i): Im Dot Product zweier gedrehter Vektoren bleibt dadurch eine Rotation übrig, die von ihrem relativen Abstand abhängt. Attention kann so Positionsdifferenzen in den Compatibility Scores verwenden. Dass Winkel auch außerhalb des Trainingskontexts berechenbar sind, garantiert trotzdem keine verlässliche sehr lange Extrapolation.",
      "SFT": "Supervised Fine-Tuning (SFT) trainiert ein vortrainiertes Modell mit gewünschten Prompt-Antwort-Paaren und einem Cross-Entropy-Loss. Beim Teacher Forcing soll es jeweils das nächste Zieltoken aus dem korrekten bisherigen Kontext vorhersagen. Das Verfahren ist stabil und vergleichsweise einfach, imitiert jedoch nur die Trainingsbeispiele und optimiert weder direkt menschliche Präferenzen noch den Erfolg einer vollständigen Antwort.",
      "SIMT": "Single Instruction, Multiple Threads (SIMT) ist ein Ausführungsmodell, bei dem viele logisch getrennte Threads dieselbe Instruktion gleichzeitig auf unterschiedlichen Daten anwenden. Eine GPU bündelt solche Threads typischerweise in Warps und plant sie gemeinsam ein. Regelmäßige Berechnungen sind dadurch sehr effizient, während unterschiedliche Verzweigungen innerhalb eines Warps nacheinander ausgeführt werden müssen und Leistung kosten.",
      "SwiGLU": "Die Swish-Gated Linear Unit (SwiGLU) berechnet für X [B,T,D] zwei getrennte gelernte D→F Linear Layers: einen Gate-Zweig und einen Inhaltszweig, beide [B,T,F]. Auf den Gate-Zweig wirkt die feste Nichtlinearität SiLU(z)=z·sigmoid(z); anschließend werden beide Zweige elementweise multipliziert. Ein dritter gelernter F→D Linear Layer liefert wieder [B,T,D] für die Residualaddition. Das Gate ist damit inputabhängig: Es entscheidet für jedes Token und Feature, welche Kandidatenfeatures passieren. Ohne Nichtlinearität würden mehrere Linear Layers zu einer einzigen linearen Abbildung zusammenfallen. SwiGLU mischt ausschließlich Features innerhalb eines Tokens, nicht die T-Achse; Positionsinformation muss zuvor durch Attention im Zustand liegen. Wegen der drei großen Matrizen wird F oft ungefähr 8D/3 statt 4D gewählt, damit Parameter- und FLOP-Vergleiche mit einem klassischen MLP fair bleiben.",
      "Tensor Parallelism": "Tensor Parallelism shardet eine einzelne große Linear-Layer-Rechnung X[...,D_in]·W[D_in,D_out] über mehrere Ranks. Beim Output- oder Column-Sharding besitzt jeder Rank andere Spalten von W und erzeugt einen anderen Slice der D_out-Features; falls der nächste Operator den vollständigen Output braucht, setzt All-Gather diese Slices zusammen. Beim Input- oder Row-Sharding besitzt jeder Rank andere D_in-Zeilen und berechnet nur eine partielle Summe; All-Reduce oder Reduce-Scatter kombiniert diese Beiträge. Die Weight-Shards werden gelernt, und auch Aktivierungen können zwischen Layern geshardet bleiben. Dadurch passt ein einzelner Layer auf mehrere Geräte, aber Collectives liegen innerhalb vieler Transformer-Blöcke und benötigen schnelle Interconnects. Anders als DDP besitzt ein Rank keine vollständige Modellkopie; Shardachsen müssen zudem durch die Tensor-Parallel-World-Size teilbar sein.",
      "Tiling": "Beim Tiling werden große Tensoroperationen in Blöcke zerlegt, deren Daten in Register, Shared Memory oder Cache passen. Ein Block kann geladene Werte mehrfach verwenden, bevor erneut auf den langsameren globalen Speicher zugegriffen werden muss. Geeignete Kachelgrößen erhöhen die Arithmetic Intensity, während zu große Kacheln Registerdruck und zu kleine Kacheln Ladeaufwand verursachen; Randkacheln benötigen zusätzlich korrekte Maskierung.",
      "Tokenizer": "Ein Tokenizer wandelt Text nach festen Regeln reversibel in eine Folge diskreter Token-IDs um und dekodiert diese wieder zurück. Bei Subword-Tokenizern werden häufige Byte- oder Zeichenfolgen gelernt, nicht deren Bedeutung. Die Wahl des Vokabulars beeinflusst Sequenzlänge, Embedding-Parameter, Sprachabdeckung und Rechenkosten; deshalb müssen auch Sondertokens, unbekannte Schriften und die exakte Roundtrip-Rekonstruktion geprüft werden.",
      "Triton": "Triton ist eine Python-nahe, domänenspezifische Sprache zum Schreiben eigener GPU-Kernel. Entwickler beschreiben blockweise Programme und Speicherzugriffe, während der Compiler die Ausführung auf Threads und Hardwareinstruktionen abbildet. Triton erleichtert Kernel-Fusion und Tiling gegenüber hardwarenaher Programmierung, nimmt einem aber die Wahl effizienter Layouts, Kachelgrößen und Randmasken nicht ab.",
      "Warp": "Ein Warp ist auf NVIDIA-GPUs eine Gruppe von üblicherweise 32 Threads, die nach dem Prinzip Single Instruction, Multiple Threads (SIMT) gemeinsam eingeplant wird. Zusammenhängende Speicherzugriffe der Threads können effizient gebündelt werden, während unterschiedliche Kontrollflusspfade innerhalb des Warps serialisiert werden. Ein Warp ist eine Hardware-Ausführungseinheit und nicht mit einem frei synchronisierbaren Threadblock gleichzusetzen.",
      "Weight Tying": "Weight Tying gibt einer einzigen gelernten Matrix E [V,D] zwei operative Rollen. Am Input wählen Token-IDs [B,T] per Lookup Zeilen E[id] aus und erzeugen Embeddings [B,T,D]. Am Output berechnet der LM Head z=hEᵀ und erzeugt für jeden Hidden State h [B,T,D] Logits [B,T,V]; ein optionaler Output-Bias kann separat bleiben. Beide Wege schreiben beim Backward in dieselben Parameter, sodass eine Zeile gleichzeitig lernt, wie ihr Token repräsentiert und wie es als nächstes Token bewertet wird. Gegenüber getrennten Matrizen spart dies ungefähr V·D Parameter, nicht jedoch die D→V Matrixmultiplikation, die Logits oder Softmax-Kosten. Weight Tying erfordert kompatible Modelldimensionen und koppelt zwei Rollen, die manche Architekturen bewusst getrennt lernen lassen.",
      "World Size": "Die World Size ist die Gesamtzahl der Ranks, die zu einer bestimmten verteilten Prozessgruppe gehören. Sie bestimmt, wie viele Teilnehmer eine kollektive Operation wie All-Reduce gemeinsam ausführen. In hybriden Setups können globale, datenparallele und tensorparallele Gruppen unterschiedliche World Sizes besitzen, weshalb die Gesamtzahl der Geräte nicht automatisch der datenparallelen Skalierung entspricht.",
      "ZeRO": "Der Zero Redundancy Optimizer (ZeRO) verteilt redundante Trainingszustände über die datenparallelen Ranks. Stufe 1 shardet Optimizerzustände, Stufe 2 zusätzlich Gradienten und Stufe 3 außerdem Modellparameter. Das senkt den persistenten Speicherbedarf pro Rank stark, erfordert jedoch zusätzliche kollektive Kommunikation und kann während der temporären Rekonstruktion von Parametern relevante Speicherspitzen erzeugen.",
      "Embedding": "Eine Token-ID ist nur ein ganzzahliger Index und besitzt keine numerische semantische Ordnung: ID 101 ist nicht automatisch ähnlicher zu 102 als zu 900. Die gelernte Embedding-Tabelle E [V,D] enthält deshalb für jeden der V Vokabulareinträge eine Zeile mit D Features. Token-IDs [B,T] wählen Zeilen aus E aus und ergeben X [B,T,D]; es findet dabei weder eine Multiplikation der ID-Werte noch eine Mischung verschiedener Tokens statt. Der Lookup selbst ist fest, die Tabellenwerte werden durch Backpropagation gelernt: Verwendete Zeilen erhalten Gradienten aus allen Stellen, an denen sie im Batch vorkommen. Das Embedding macht diskrete Symbole für die kontinuierlichen Transformer-Rechnungen nutzbar. Am Anfang ist derselbe Token immer derselbe Startvektor; Position und Kontext entstehen erst durch Positionsmechanismus und Attention. Bei Weight Tying dient Eᵀ zusätzlich im LM Head dazu, den finalen Zustand gegen alle V Tokenkandidaten zu bewerten.",
      "Softmax": "Softmax verwandelt eine Zeile relativer Logits z in eine Wahrscheinlichkeitsverteilung. Zuerst wird zur numerischen Stabilität m=max(z) subtrahiert, dann werden exp(z_i−m) berechnet und schließlich durch ihre Summe geteilt. Die Exponentialfunktion macht alle Werte positiv und verstärkt Unterschiede; die Division sorgt dafür, dass die gewählte Achse exakt auf eins summiert. Softmax hat keine lernbaren Parameter. Nur Logitdifferenzen zählen, daher ändert eine gemeinsame Verschiebung aller Logits nichts. Entscheidend ist die Achse: Beim LM Head wird jede Zeile [V] über V Vokabulartokens normalisiert; in Attention wird [T_key] für jede feste Query normalisiert. Eine kausale Maske muss verbotene Logits vor Softmax auf minus unendlich setzen. Temperatur teilt die Logits vorher und steuert so die Schärfe, ohne neue Informationen hinzuzufügen.",
      "Cross-Entropy": "Beim Next-Token-Training liegen Logits z [B,T,V] und genau eine Ziel-ID y [B,T] pro bewerteter Position vor. Für eine Position nimmt Cross-Entropy nicht den größten Logit, sondern berechnet stabil ℓ=logsumexp(z)−z_y=−log p(y). Ist der Ziel-Logit relativ zu allen Konkurrenten hoch, wird der Loss klein; eine selbstsichere falsche Verteilung wird stark bestraft. Der Loss besitzt keine eigenen trainierbaren Parameter. Sein Gradient schiebt den Ziel-Logit nach oben und die konkurrierenden Logits entsprechend ihren Softmax-Wahrscheinlichkeiten nach unten; dadurch lernen LM Head und alle vorgelagerten Layer. Ohne Reduktion entsteht ein Loss [B,T]. Padding, Promptanteile oder andere ungültige Ziele werden maskiert, danach wird über die tatsächlich gültigen Tokens zu einem Skalar gemittelt. Für Next-Token Prediction müssen Logits und Targets um eine Position korrekt ausgerichtet sein.",
      "Backpropagation": "Backpropagation ist der Algorithmus, der aus einem skalaren Loss die Gradienten aller beteiligten Parameter berechnet. Der Forward Pass erzeugt Zwischenwerte und einen Rechengraphen. Der Backward Pass startet beim Loss mit Ableitung 1 und geht die Operationen in umgekehrter Reihenfolge durch. Jede Operation erhält einen Upstream-Gradienten, kombiniert ihn über die Kettenregel mit ihrer lokalen Ableitung und gibt Gradienten für ihre Inputs weiter. Werden Parameter an vielen Tokenpositionen oder auf mehreren Pfaden verwendet, summieren sich diese Beiträge zu einem Gradiententensor derselben Shape wie der Parameter. Backpropagation sagt damit lokal, wie eine kleine Parameteränderung den Loss beeinflussen würde; sie ändert den Parameter noch nicht. Autograd automatisiert diese Rechnung, der Optimizer wählt anschließend aus den Gradienten den konkreten Update. Bei zu großen Schritten gilt die lokale lineare Näherung nicht mehr zuverlässig.",
      "Query / Key / Value": "Q, K und V sind Aktivierungen mit derselben häufigen Shape [B,H,T,d_head], aber verschiedenen Aufgaben. Aus demselben Tokenzustand X [B,T,D] erzeugen drei getrennt gelernte Linear Layers zunächst Query-, Key- und Value-Features. Eine Query beschreibt im gelernten Merkmalsraum, welche Information die aktuelle Position sucht. Ein Key beschreibt, wofür die jeweilige Position als Treffer geeignet ist. Ihr Dot Product erzeugt einen Compatibility Score. Der zugehörige Value enthält die Features, die bei hohem Attention-Gewicht tatsächlich in den neuen Zustand einfließen. Diese Bedeutungen sind keine menschlich beschrifteten Felder, sondern entstehen gemeinsam aus dem Trainings-Loss. Q, K und V sind daher keine Modellparameter; W_Q, W_K und W_V sind die gelernten Matrizen, die sie erzeugen. RoPE verändert Q und K vor dem Vergleich, eine Maske begrenzt erlaubte Keys, und beim Decoding werden frühere K und V gecacht, nicht die alten Q-Vektoren.",
      "Attention": "Attention ist der Schritt, in dem eine Tokenposition gezielt Informationen anderer erlaubter Positionen liest. Für Q [B,H,T_q,d_k], K [B,H,T_k,d_k] und V [B,H,T_k,d_v] vergleicht QKᵀ jede Query i mit jedem Key j und erzeugt Scores [B,H,T_q,T_k]. Die Division durch sqrt(d_k) kontrolliert ihre typische Größenordnung. Eine Maske setzt unerlaubte Positionen vor Softmax auf minus unendlich; Softmax normalisiert für jede Query über T_key. Die resultierenden Gewichte summieren sich je Query zu eins und bilden eine gewichtete Summe der Values, sodass der Output [B,H,T_q,d_v] entsteht. Attention selbst fügt in diesem Rechenschritt keine neuen trainierbaren Parameter hinzu; gelernt werden die Q/K/V- und Output-Projections, die den Vergleichs- und Inhaltsraum formen. Self-Attention verwendet Zustände derselben Sequenz, Cross-Attention bezieht K und V aus einer anderen Quelle. Im kausalen Sprachmodell darf Query i nur Keys aus Vergangenheit und Gegenwart lesen.",
      "Causal Mask": "Eine Causal Mask kodiert beim autoregressiven Sprachmodell, welche Keypositionen jede Query sehen darf. Für T Query- und Keypositionen ist M [T,T] typischerweise 0 bei j≤i und −∞ bei j>i: Zeile i darf Gegenwart und Vergangenheit, aber keine zukünftigen Spalten lesen. M wird über Batch und Heads auf Scores [B,H,T,T] gebroadcastet und vor Softmax addiert. Dadurch werden exp(−∞)=0 und die verbleibenden erlaubten Gewichte trotzdem auf eins normalisiert. Maskieren nach Softmax wäre falsch, weil verbotene Positionen bereits Normalisierungsmasse erhalten hätten. Bool-Masken besitzen je nach API unterschiedliche True-Polarität. Eine vollständig maskierte Zeile kann NaN erzeugen; jede ausgewertete Query braucht mindestens einen gültigen Key.",
      "Broadcasting": "Broadcasting erlaubt elementweise Operationen auf unterschiedlich geformten Tensoren, wenn ihre Achsen von rechts nach links entweder gleich groß sind oder eine davon Länge eins hat. Bei X [B,T,D] und g [D] wird g logisch als [1,1,D] behandelt und an jeder Batch- und Tokenposition verwendet; es wird dafür nicht B·T-mal als neuer Parameter gespeichert. Das Resultat besitzt die kombinierte Shape [B,T,D]. Broadcasting mischt oder reduziert keine Werte, sondern wiederholt nur denselben Zugriff entlang kompatibler Achsen. Gefährlich sind zufällig kompatible Shapes: Ein Tensor [T,1] kann ohne Fehler an einer unerwarteten Achse wirken. Deshalb sollten Achsenbedeutung, unsqueeze-Position und resultierende Shape ausdrücklich geprüft werden, besonders bei Masks und Loss-Gewichten.",
      "AdamW": "AdamW ist ein Optimizer, der für jeden lernbaren Parameter zwei persistente Tensoren speichert: m_t als geglätteten signed Gradient und v_t als geglättetes Gradientquadrat. Bias Correction erzeugt m̂_t und v̂_t, weil beide Speicher bei null starten und anfangs sonst systematisch zu klein wären. Der adaptive Term m̂_t/(sqrt(v̂_t)+ε) normalisiert jede Koordinate anhand ihrer Gradientenhistorie; die Learning Rate η skaliert daraus den tatsächlichen Schritt. Weight Decay ist entkoppelt und schrumpft θ separat durch den Faktor 1−ηλ, auch wenn der aktuelle Gradient null ist. Backpropagation berechnet nur g; AdamW aktualisiert danach m, v und θ. Für korrektes Resume müssen deshalb Modellparameter, Optimizer-State, globaler Step und Schedulerzustand gespeichert werden.",
      "Parameter / Buffer": "Ein nn.Parameter ist ein registrierter, standardmäßig gradiententragender Tensor eines PyTorch-Moduls. Wird er als Attribut eines nn.Module oder innerhalb von ParameterList beziehungsweise eines registrierten Submoduls abgelegt, erscheint er in parameters() und state_dict(), wird mit .to(device) verschoben und kann dem Optimizer übergeben werden. Ein Buffer wird mit register_buffer registriert und ebenfalls gespeichert sowie verschoben, erhält aber normalerweise keinen Optimizer-Update; Beispiele sind feste RoPE-Frequenzen oder laufende Statistiken. Ein gewöhnlicher Tensor als beliebiges Attribut kann dagegen bei Device-Transfer und Checkpointing übersehen werden. Ebenso registriert eine normale Python-Liste ihre enthaltenen Layer nicht; dafür existiert ModuleList. Registrierung betrifft Besitz und Lifecycle, nicht die mathematische Operation im Forward Pass.",
      "Stride / Contiguous": "Die Shape eines Tensors sagt, wie viele Indizes jede Achse besitzt; die Strides sagen, wie viele Speicherelemente man beim Erhöhen eines Indexes entlang dieser Achse überspringt. transpose oder permute kann deshalb eine neue Sicht mit geänderter Shape und Strides erzeugen, ohne Daten zu kopieren. Dieser Tensor ist oft nicht contiguous, also nicht in der zur neuen Achsenreihenfolge dichten Standardordnung gespeichert. view darf nur Shapes erzeugen, die mit den vorhandenen Strides ohne Umordnung vereinbar sind, und kann sonst fehlschlagen. reshape darf bei Bedarf eine Kopie anlegen; contiguous() materialisiert ausdrücklich eine passende dichte Kopie. Das ist wichtig bei Head-Aufteilung und Concat: Eine Operation kann mathematisch korrekt aussehen, aber wegen falscher Achsenordnung Werte anders gruppieren oder unerwartet kopieren.",
      "Linear Layer / Projection": "Was passiert? x ist der aktuelle Feature-Vektor eines Tokens. Ein Feature x_i ist dabei zunächst nur eine einzelne Koordinate dieses Vektors; seine Bedeutung ist meist verteilt und wird nicht von Menschen beschriftet. Für jedes Outputfeature o berechnet der Layer y_o=b_o+Σ_i x_iW_i,o: Er multipliziert jedes Inputfeature mit seinem eigenen gelernten Gewicht, addiert alle Beiträge und optional einen Bias. Eine Spalte von W ist also ein Mischrezept für genau ein neues Feature; b_o ist dessen Ausgangswert, falls alle x_i null sind. Backpropagation verändert W und b so, dass diese Mischungen den Trainings-Loss senken. Bei X [B,T,D_in] und W [D_in,D_out] entsteht Y [B,T,D_out]; B und T bleiben gleich, weil dieselbe Matrix jedes Token unabhängig verarbeitet. Das bedeutet nicht, dass ein später Tokenzustand kontextfrei ist: Frühere Attention Layers können bereits Informationen anderer Positionen in X gemischt haben; der Linear Layer mischt diese vorhandenen Features nur nicht direkt zwischen Positionen. Warum und wo? Attention verwendet getrennte Matrizen für Q – welche Information ein Token sucht –, K – welche Information es zum Abgleich anbietet – und V – welchen Inhalt es weitergeben kann. W_O mischt danach die Head-Ergebnisse; MLP-Layer erweitern, gaten und verdichten Features, der LM Head erzeugt einen Logit pro Vokabulartoken. Diese Rollen entstehen end-to-end aus dem Loss. PyTorch speichert nn.Linear.weight als [D_out,D_in] und berechnet x @ weight.T + bias; unsere Schreibweise xW+b nennt dieselbe Matrix transponiert. Streng genommen ist die Operation mit Bias affin, obwohl der Baustein Linear Layer heißt. Projection ist in LLM-Texten nur Kurzform für diese gelernte Abbildung: Sie muss weder orthogonal sein noch P²=P erfüllen und darf die Dimension sogar vergrößern."
    };

        {id:"Grad",title:"4 · Gradient wächst von Step zu Step",code:"for x, y in batches:\n    loss = objective(model(x), y)\n    loss.backward()\n    optimizer.step()",options:[["correct",".grad akkumuliert · vor jedem Update zero_grad und Gradienten zweier kontrollierter Steps vergleichen"],["scheduler","scheduler.step fehlt · nur die Learning Rate loggen"],["eval","model.eval fehlt · Outputs ohne backward vergleichen"]]},
        {id:"Loss",title:"5 · Loss ist noch ein Vektor",code:"token_loss = per_token_loss(logits, labels)  # [B,T]\nloss = token_loss.mean(dim=0)                # [T]\nloss.backward()",options:[["correct","Beabsichtigte maskierte Reduktion und loss.ndim==0 · mit Handwerten und ungleichen Längen prüfen"],["batch","Jeder Loss muss Shape [B,T] behalten · backward ohne Änderung wiederholen"],["sum","mean ist in Language Models verboten · immer unnormalisiert summieren"]]}

ss="calculation-ledger"><div class="calculation-row"><span>Test auswählen</span><strong data-no-i18n>pytest -q -k contract_name</strong></div><div class="calculation-row"><span>Tensorwerte vergleichen</span><strong data-no-i18n>torch.testing.assert_close(actual, expected)</strong></div><div class="calculation-row"><span>Registrierung prüfen</span><strong data-no-i18n>dict(model.named_parameters()) · model.state_dict()</strong></div><div class="calculation-row"><span>Gradienten prüfen</span><strong data-no-i18n>parameter.grad · finite difference</strong></div></div><div class="callout warning" style="margin-top:1rem">Die Snippets sind absichtlich isomorphe Toy-Fälle und keine Implementierungen aus dem Assignment.</div></div></div>`;

      if(id==="bloom-filter") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Bit Budget & Hashes</h2><label class="field">Bits m <input id="bloomM" type="range" min="50" max="500" step="10" value="100"><output id="bloomMOut">100</output></label><label class="field">Eingefügte Elemente n <input id="bloomN" type="range" min="5" max="80" step="5" value="10"><output id="bloomNOut">10</output></label><label class="field">Hash Functions k <input id="bloomK" type="range" min="1" max="72" value="7"><output id="bloomKOut">7</output></label><p class="lab-note">Die Formel nimmt gleichmäßig verteilte, hinreichend unabhängige Hashes an. Reale Hashqualität und Query-Verteilung müssen zusätzlich gemessen werden.</p><fieldset class="question" style="margin-top:1rem"><legend><strong>Objektiver Transfer-Kurzcheck · m=100, n=10</strong></legend><label class="field">Nächstes ganzzahliges k* <select class="select" id="bloomCheckK"><option value="">Noch nicht gewählt</option><option>3</option><option>7</option><option>10</option></select></label><label class="field">Ein geprüftes Bit ist null <select class="select" id="bloomCheckNegative"><option value="">Noch nicht gewählt</option><option value="definite">Definitiv nicht enthalten</option><option value="possible">Möglicherweise enthalten</option></select></label><label class="field">k über das Optimum hinaus erhöhen <select class="select" id="bloomCheckCurve"><option value="">Noch nicht gewählt</option><option value="rise">Die FPR steigt schließlich wieder</option><option value="fall">Die FPR sinkt immer weiter</option></select></label><button class="button" id="bloomCheck" type="button">Kurzcheck prüfen</button><div id="bloomCheckResult" role="status" aria-live="polite"></div></fieldset></div><div class="lab-stage" role="region" aria-label="Interaktiver Bloom-Filter-Simulator" aria-live="polite" id="bloomStage"></div></div>`;
      if(id==="data-pipeline") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Filterstufen</h2><label class="option"><input type="checkbox" id="dataLang" checked><span>Englisch-Sprachfilter</span></label><label class="option"><input type="checkbox" id="dataPII" checked><span>PII maskieren</span></label><label class="option"><input type="checkbox" id="dataQuality" checked><span>Qualitätsschwelle</span></label><label class="option"><input type="checkbox" id="dataDedup" checked><span>Near-Dedup</span></label><label class="field">Qualitätsschwelle <input id="dataThreshold" type="range" min="0" max="1" step="0.05" value="0.55"><output id="dataThresholdOut">0.55</output></label><p class="lab-note">Audit immer sowohl verworfene als auch behaltene Beispiele.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="dataStage"></div></div>`;
      if(id==="dedup-pipeline") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Dedup-Pipeline</h2><div class="card-actions"><button class="button" id="dedupPrev" type="button">← Vorheriger Schritt</button><button class="button primary" id="dedupNext" type="button">Nächster Schritt →</button></div><p class="lab-note"><strong id="dedupStepOut">1 / 7</strong> · Öffne nie die nächste Stufe, bevor du ihren Output vorhergesagt hast.</p><label class="field">Verification-Threshold τ <select class="select" id="dedupThreshold"><option value="0.3">J &gt; 0.3</option><option value="0.5" selected>J &gt; 0.5</option><option value="0.7">J &gt; 0.7</option></select></label><fieldset class="question" style="margin-top:1rem"><legend><strong>Transfer-Kurzcheck für τ=0.5</strong></legend><label class="field">Welche Paare erreichen die exakte Verification? <select class="select" id="dedupCheckCandidates"><option value="">Noch nicht gewählt</option><option value="ab-bc">A–B, B–C</option><option value="ab-bc-ad">A–B, B–C, A–D</option><option value="ab-ac-bc">A–B, A–C, B–C</option></select></label><label class="field">Welche Kanten überleben J &gt; 0.5? <select class="select" id="dedupCheckEdges"><option value="">Noch nicht gewählt</option><option value="ab-bc">A–B, B–C</option><option value="ab-bc-ad">A–B, B–C, A–D</option><option value="none">keine</option></select></label><label class="field">Welche Components entstehen? <select class="select" id="dedupCheckComponents"><option value="">Noch nicht gewählt</option><option value="abc-d">{A,B,C} · {D}</option><option value="ab-cd">{A,B} · {C,D}</option><option value="abcd">{A,B,C,D}</option></select></label><button class="button" id="dedupCheck" type="button">Kurzcheck prüfen</button><div id="dedupCheckResult" role="status" aria-live="polite"></div></fieldset></div><div class="lab-stage" role="region" aria-label="Interaktive Near-Dedup-Pipeline" aria-live="polite" id="dedupStage"></div></div>`;
      if(id==="evaluation") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Behauptung</h2><label class="field">Was möchtest du belegen? <select class="select" id="evalClaim"><option value="likelihood">Das Modell sagt Domänentext gut voraus</option><option value="knowledge">Es beantwortet Wissensfragen</option><option value="instruction">Es folgt Instruktionen</option><option value="safety">Es verweigert schädliche Anfragen angemessen</option><option value="systems">Es ist kosteneffizient im Einsatz</option></select></label><label class="field">Gewählte Metrik <select class="select" id="evalMetric"><option value="ppl">Perplexity</option><option value="mmlu">MMLU-Accuracy</option><option value="judge">Pairwise Judge Win Rate</option><option value="safety">Safety-Test Recall + False Positives</option><option value="latency">Latenz, Durchsatz und Kosten</option></select></label><button class="button primary" id="evalCheck">Paarung prüfen</button></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" aria-live="polite" id="evalStage"></div></div>`;
      if(id==="inference-budget") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Serving-Konfiguration</h2><label class="field">Layer L <input id="infL" type="range" min="8" max="80" value="32"><output id="infLOut">32</output></label><label class="field">Aktive Sequenzen B <input id="infB" type="range" min="1" max="64" value="8"><output id="infBOut">8</output></label><label class="field">Gecachter Kontext S <select class="select" id="infT"><option>512</option><option selected>2048</option><option>8192</option><option>32768</option></select></label><label class="field">Modelldimension D <select class="select" id="infD"><option>1024</option><option selected>2048</option><option>4096</option><option>8192</option></select></label><label class="field">Query Heads H_q <select class="select" id="infHq"><option>8</option><option selected>16</option><option>32</option></select></label><label class="field">Key-Value Heads H_kv <select class="select" id="infHkv"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>16</option><option>32</option></select></label><label class="option"><input id="infTied" type="checkbox"><span>Input-Embedding und LM Head teilen (Weight Tying)</span></label><label class="field">KV-Cache-Dtype <select class="select" id="infKvBytes"><option value="2" selected>BF16 / FP16 · 2 Byte</option><option value="1">8 Bit · 1 Byte</option></select></label><label class="field">Weight-Präzision <select class="select" id="infWeightBits"><option value="16" selected>16 Bit</option><option value="8">8 Bit</option><option value="4">4 Bit</option></select></label><label class="field">HBM-Bandbreite <input id="infBW" type="range" min="0.5" max="5" step="0.05" value="3.35"><output id="infBWOut">3.35 TB/s</output></label><p class="lab-note">Lecture-10-Setup: V=50.000 und gated MLP mit F=4D; Weight Tying ist standardmäßig aus. Ändere genau einen Regler und sage vorher, welche Formelterme reagieren.</p></div><div class="lab-stage" role="region" aria-label="Interaktives Inference-Budget" id="infStage"></div></div>`;
      if(id==="policy-loss-tracer") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Fester Mini-Rollout</h2><div class="callout"><strong>Prompt [7,8] · Padding-ID 0</strong><p>Antwort 1 [21,22], Advantage +1, full tokens [7,8,21,22], aligned target log-probs [−0.10,−0.20,−0.40].</p><p>Antwort 2 [31], Advantage −1, full tokens [7,8,31,0], aligned target log-probs [−0.30,−0.60,−9.00].</p></div><p class="lab-note">Die Log-Probabilities sind bereits entlang der shifted labels gathered. Deine Aufgabe ist, Shift, Maske, Lossvorzeichen und Reduktion korrekt zusammenzusetzen.</p><fieldset class="question" style="margin-top:1rem"><legend><strong>Objektiver Transfer-Kurzcheck</strong></legend><label class="field">1. Welche labels und response_mask sind korrekt? <select class="select" id="policyCheckAlignment"><option value="">Noch nicht gewählt</option><option value="correct">labels [[8,21,22],[8,31,0]] · mask [[0,1,1],[0,1,0]]</option><option value="unshifted">labels [[7,8,21],[7,8,31]] · mask [[0,0,1],[0,0,1]]</option><option value="prompt">labels [[8,21,22],[8,31,0]] · mask [[1,1,1],[1,1,0]]</option></select></label><label class="field">2. Welche Sequenzmittel entstehen aus −A·log p? <select class="select" id="policyCheckMeans"><option value="">Noch nicht gewählt</option><option value="correct">0.30 und −0.60</option><option value="sign">−0.30 und 0.60</option><option value="global">0.20 und −0.20</option></select></label><label class="field">3. Standard: erst je Sequenz mitteln, dann B mitteln <select class="select" id="policyCheckReduction"><option value="">Noch nicht gewählt</option><option value="correct">−0.15</option><option value="token">0.00</option><option value="sum">−0.30</option></select></label><button class="button" id="policyLossCheck" type="button">Kurzcheck prüfen</button><div id="policyLossCheckResult" role="status" aria-live="polite"></div></fieldset><details class="answer-disclosure" data-transient-key="policy-loss-derivation" style="margin-top:1rem"><summary>Geführte Herleitung öffnen, wenn du feststeckst</summary><ol class="steps"><li><strong>Shift:</strong> input_ids sind jeweils die ersten drei Tokens; labels sind die letzten drei. Logits an der ersten Eingabeposition 7 sagen deshalb Label 8 voraus.</li><li><strong>Mask:</strong> Auf der Labelachse zählen nur 21, 22 und 31 als Antworttoken. Promptlabel 8 und Paddinglabel 0 erhalten Gewicht null.</li><li><strong>Token-Loss:</strong> −A·log p ergibt [[0,0.20,0.40],[0,−0.60,0]]. Ein negativer Advantage kehrt das Vorzeichen um.</li><li><strong>Reduce:</strong> Sequenzmittel sind 0.30 und −0.60; ihr Mittel ist −0.15. Ein globales Tokenmittel wäre (0.20+0.40−0.60)/3=0 und gewichtet lange Antworten anders.</li></ol></details></div><div class="lab-stage" role="region" aria-label="Shift-, Masken- und Loss-Pipeline"><h2>Shape Ledger</h2><div class="calculation-ledger"><div class="calculation-row"><span>Full tokens</span><strong>(B=2, T_full=4)</strong></div><div class="calculation-row"><span>input_ids und labels nach Shift</span><strong>(2, 3)</strong></div><div class="calculation-row"><span>Vocabulary logits vor Gather</span><strong>(2, 3, V)</strong></div><div class="calculation-row"><span>Gathered log p und response_mask</span><strong>(2, 3)</strong></div><div class="calculation-row"><span>Sequenzloss nach maskierter Tokenreduktion</span><strong>(2,)</strong></div><div class="calculation-row"><span>Batchloss nach zweiter Reduktion</span><strong>Skalar</strong></div></div><div class="shape-change"><strong>Wichtige Invariante</strong><span>labels, gathered log p und response_mask müssen dieselbe (B,T_shifted)-Shape und dieselbe Positionsbedeutung besitzen.</span></div></div></div>`;
      if(id==="grpo") return `<div class="lab-layout"><div class="panel lab-controls"><h2>Antworten einer Promptgruppe</h2>${[0,1,2,3].map((_,i)=>`<label class="field">Antwort ${i+1}: Reward R${i+1} <input class="grpoReward" data-i="${i}" type="range" min="0" max="1" step="0.05" value="${[0,0.3,0.8,1][i]}"><output id="grpoOut${i}">${[0,0.3,0.8,1][i].toFixed(2)}</output></label><label class="field">Antwort ${i+1}: unmaskierte Token n${i+1} <input class="grpoLength" data-i="${i}" type="range" min="2" max="24" value="${[4,8,12,16][i]}"><output id="grpoLenOut${i}">${[4,8,12,16][i]}</output></label>`).join("")}<label class="option"><input id="grpoStd" type="checkbox" checked><span>Durch Gruppen-Std normalisieren</span></label><label class="field">Standardabweichungs-Konvention <select class="select" id="grpoStdMode"><option value="sample" selected>A5-Implementierung: Sample Std (G−1)</option><option value="population">Vorlesungsformel: Population Std (G)</option></select></label><label class="field">Loss-Aggregation <select class="select" id="grpoAggregation"><option value="sequence" selected>Sequenzmittel · jede Antwort gleiches Gesamtgewicht</option><option value="tokens">Globales Tokenmittel · lange Antworten mehr Gesamtgewicht</option><option value="fixed">Fixer Nenner 16 · Länge bleibt im Gesamtgewicht</option></select></label><p class="lab-note">A5 verlangt für die Implementierung PyTorchs standardmäßiges torch.std und damit die Sample Standard Deviation mit Nenner G−1. Die mathematische Herleitung im Handout zeigt daneben die Populationsform mit G. Dieses Lab macht den Unterschied sichtbar und isoliert anschließend das Reweighting; Importance Ratios, Clipping, KL und Microbatching kommen im vollständigen Training zusätzlich hinzu.</p><fieldset class="question" style="margin-top:1rem"><legend><strong>Transfer-Kurzcheck · A5-Konvention</strong></legend><p class="small muted">Fester Fall: Rewards [1,0,0,1], Sample Standard Deviation mit G−1 und Sequenzmittel. Leite zuerst ohne Regler her.</p><label class="field">Gruppenmittel μ <select class="select" id="grpoCheckMean"><option value="">Noch nicht gewählt</option><option>0.25</option><option>0.50</option><option>0.75</option></select></label><label class="field">Sample-Standardabweichung σ <select class="select" id="grpoCheckStd"><option value="">Noch nicht gewählt</option><option>0.500</option><option>0.577</option><option>1.000</option></select></label><label class="field">Advantage der ersten Antwort <select class="select" id="grpoCheckAdv"><option value="">Noch nicht gewählt</option><option>+0.500</option><option>+0.866</option><option>+1.000</option></select></label><label class="field">Gesamtgewicht der ersten Sequenz nach ihrem Tokenmittel <select class="select" id="grpoCheckWeight"><option value="">Noch nicht gewählt</option><option>+0.217</option><option>+0.866</option><option>+3.464</option></select></label><button class="button" id="grpoCheck" type="button">Kurzcheck prüfen</button><div id="grpoCheckResult" role="status" aria-live="polite"></div></fieldset></div><div class="lab-stage" role="region" aria-label="Interaktives Ergebnis" id="grpoStage"></div></div>`;
      return `<div class="panel">Lab folgt.</div>`;
    }

    function initLab(id){
      if(LAB_OBJECTIVES[id])document.getElementById("objectiveCheck").onclick=()=>checkObjectiveLab(id);
      if(id==="shapes"){["shapeB","shapeT","shapeD","shapeH"].forEach(x=>document.getElementById(x).oninput=()=>updateShapes(x));document.getElementById("shapeCheck").onclick=checkShapeTransfer;updateShapes()}
      if(id==="pytorch-debugger")document.getElementById("pytorchDebugCheck").onclick=checkPytorchDebugger;
      if(id==="bpe"){document.getElementById("bpeReset").onclick=resetBpe;document.getElementById("bpeStep").onclick=stepBpe;["bpeMode","bpeSpecial"].forEach(x=>document.getElementById(x).oninput=resetBpe);resetBpe()}
      if(id==="attention"){["attnQuery","attnTemp","attnMask"].forEach(x=>document.getElementById(x).oninput=updateAttention);updateAttention()}
      if(id==="optimizer"){["optStep","optWarmup","optLr","optGrad","optWd"].forEach(x=>document.getElementById(x).oninput=updateOptimizer);updateOptimizer()}
      if(id==="resources"){["resL","resD","resV","resT","resTokens"].forEach(x=>document.getElementById(x).oninput=updateResources);updateResources()}
      if(id==="triton-tile"){["tritonN","tritonBlock","tritonPid"].forEach(x=>document.getElementById(x).oninput=updateTritonTile);document.getElementById("tritonCheck").onclick=checkTritonTransfer;updateTritonTile()}
      if(id==="online-softmax-kata"){document.getElementById("onlineScore").oninput=()=>{document.getElementById("onlineCheckResult").innerHTML="";updateOnlineSoftmax()};document.getElementById("onlineCheck").onclick=checkOnlineSoftmax;updateOnlineSoftmax()}
      if(id==="roofline"){["roofAI","roofBW","roofPeak"].forEach(x=>document.getElementById(x).oninput=updateRoofline);updateRoofline()}
      if(id==="parallelism"){["parMode","parWorld"].forEach(x=>document.getElementById(x).oninput=updateParallelism);updateParallelism()}
      if(id==="scaling"){["scaleHours","scalePflops","scaleRatio"].forEach(x=>document.getElementById(x).oninput=updateScaling);updateScaling()}
      if(id==="scaling-fit"){document.getElementById("scaleFitCheck").onclick=checkScalingFit;renderScalingFit(Boolean(user.labChecks["scaling-fit"]))}
      if(id==="filtering-mechanics"){document.getElementById("filterMethod").oninput=updateFilteringMechanics;document.getElementById("filterCheck").onclick=checkFilteringMechanics;updateFilteringMechanics()}
      if(id==="bloom-filter"){["bloomM","bloomN","bloomK"].forEach(x=>document.getElementById(x).oninput=updateBloomFilter);document.getElementById("bloomCheck").onclick=checkBloomFilter;updateBloomFilter()}
      if(id==="data-pipeline"){["dataLang","dataPII","dataQuality","dataDedup","dataThreshold"].forEach(x=>document.getElementById(x).oninput=updateDataPipeline);updateDataPipeline()}
      if(id==="dedup-pipeline"){dedupLabStep=Math.max(0,Math.min(6,dedupLabStep));document.getElementById("dedupPrev").onclick=()=>{dedupLabStep=Math.max(0,dedupLabStep-1);updateDedupPipeline()};document.getElementById("dedupNext").onclick=()=>{dedupLabStep=Math.min(6,dedupLabStep+1);updateDedupPipeline()};document.getElementById("dedupThreshold").oninput=()=>{document.getElementById("dedupCheckResult").innerHTML="";updateDedupPipeline()};document.getElementById("dedupCheck").onclick=checkDedupPipeline;updateDedupPipeline()}
      if(id==="evaluation"){document.getElementById("evalCheck").onclick=updateEvaluation;updateEvaluation(false)}
      if(id==="inference-budget"){["infL","infB","infT","infD","infHq","infHkv","infTied","infKvBytes","infWeightBits","infBW"].forEach(x=>document.getElementById(x).oninput=updateInferenceBudget);updateInferenceBudget()}
      if(id==="policy-loss-tracer")document.getElementById("policyLossCheck").onclick=checkPolicyLossTracer;
      if(id==="grpo"){document.querySelectorAll(".grpoReward,.grpoLength,#grpoStd,#grpoStdMode,#grpoAggregation").forEach(x=>x.oninput=updateGrpo);document.getElementById("grpoCheck").onclick=checkGrpoTransfer;updateGrpo()}
      restorePassedLab(id);
    }

    function restorePassedLab(id){
      if(!user.labChecks[id])return;
      if(LAB_OBJECTIVES[id]){LAB_OBJECTIVES[id].answers.forEach((value,index)=>{const field=document.getElementById(`objective-${index}`);if(field)field.value=value});const result=document.getElementById("objectiveResult");if(result)result.innerHTML=objectiveSuccessMarkup(id);return}
      const presets={
        shapes:{shapeCheckQ:"correct",shapeCheckScores:"correct",shapeCheckScaling:"correct"},
        "pytorch-debugger":{ptCheckRegister:"correct",ptCheckDevice:"correct",ptCheckView:"correct",ptCheckGrad:"correct",ptCheckLoss:"correct"},
        "triton-tile":{tritonCheckGrid:"3",tritonCheckValid:"5"},
        "online-softmax-kata":{onlineScore:"2",onlineCheckMax:"2",onlineCheckScale:"e-1",onlineCheckSum:"1.503",onlineCheckProb:"0.665"},
        "scaling-fit":{scaleFit0:"10",scaleFit1:"20",scaleFit2:"40",scaleFit3:"70",scaleFitBoundary:"boundary"},
        "filtering-mechanics":{filterCheckLm:"A",filterCheckFast:"C",filterCheckDsir:"B"},
        "bloom-filter":{bloomCheckK:"7",bloomCheckNegative:"definite",bloomCheckCurve:"rise"},
        "dedup-pipeline":{dedupThreshold:"0.5",dedupCheckCandidates:"ab-bc-ad",dedupCheckEdges:"ab-bc",dedupCheckComponents:"abc-d"},
        "policy-loss-tracer":{policyCheckAlignment:"correct",policyCheckMeans:"correct",policyCheckReduction:"correct"},
        grpo:{grpoCheckMean:"0.50",grpoCheckStd:"0.577",grpoCheckAdv:"+0.866",grpoCheckWeight:"+0.866"}
      }[id]||{};
      Object.entries(presets).forEach(([fieldId,value])=>{const field=document.getElementById(fieldId);if(field&&field.value==="")field.value=value});
      if(id==="shapes")document.getElementById("shapeCheckResult").innerHTML=shapeSuccessMarkup();
      if(id==="pytorch-debugger")document.getElementById("pytorchDebugResult").innerHTML=pytorchDebuggerSuccessMarkup();
      if(id==="triton-tile")document.getElementById("tritonCheckResult").innerHTML=tritonSuccessMarkup();
      if(id==="online-softmax-kata")document.getElementById("onlineCheckResult").innerHTML=onlineSoftmaxSuccessMarkup();
      if(id==="scaling-fit")renderScalingFit(true);
      if(id==="filtering-mechanics")document.getElementById("filterCheckResult").innerHTML=filteringSuccessMarkup();
      if(id==="bloom-filter")document.getElementById("bloomCheckResult").innerHTML=bloomSuccessMarkup();
      if(id==="dedup-pipeline"){dedupLabStep=6;updateDedupPipeline();document.getElementById("dedupCheckResult").innerHTML=dedupSuccessMarkup()}
      if(id==="policy-loss-tracer")document.getElementById("policyLossCheckResult").innerHTML=policyLossSuccessMarkup();
      if(id==="grpo")document.getElementById("grpoCheckResult").innerHTML=grpoSuccessMarkup();

    function updateInferenceBudget(){

      const aiMlp=Tq=>(6*B*Tq*D*F)/(4*B*Tq*D+4*B*Tq*F+6*D*F),aiAttentionMha=Tq=>S*Tq/(S+Tq),aiAttentionGqa=Tq=>S*Tq*D/(Tq*D+S*Hkv*H),phaseNote=B===1?"Batch 1 bietet beim Decode kaum Wiederverwendung der Gewichte; der Pfad ist häufig stark bandbreitenlimitiert.":"Mehr aktive Sequenzen erhöhen die Wiederverwendung der Gewichte und damit oft den Throughput, vergrößern aber KV-Cache und mögliche Queueing-Latenz.";
      document.getElementById("infStage").innerHTML=`<h2>${tr("Serving-Budget aus Lecture 10")}</h2><div class="calculation-ledger"><div class="calculation-row"><span>${tr("Head-Breite, GQA-Gruppe und MLP-Breite")}</span><strong>d_head = D/H_q = ${D}/${Hq} = ${H} · G = H_q/H_kv = ${G} · F = 4D = ${F}</strong></div><div class="calculation-row"><span>${tr("K oder V pro Layer")}</span><strong>[B, H_kv, S, d_head] = [${B}, ${Hkv}, ${S}, ${H}]</strong></div></div><div class="shape-change"><strong>${tr("Was bedeuten die vier Achsen?")}</strong><span>${tr("B zählt parallele Sequenzen, H_kv getrennte Key-Value Heads, S alle bisher gespeicherten Tokenpositionen und d_head die Features jedes Head-Vektors. Bei jedem Decode-Step wächst nur S um eins; B, H_kv und d_head bleiben für die Konfiguration gleich.")}</span></div><h3>${tr("Parameterzerlegung")}</h3><div class="calculation-ledger"><div class="calculation-row"><span>${tr("Vokabular + LM Head")}</span><strong>c_tie·V·D = ${cTie}·${V.toLocaleString(localeCode())}·${D} = ${fmtNum(vocabParams)}</strong></div><div class="calculation-row"><span>${tr("Gated MLP pro Layer")}</span><strong>3·D·F = 3·${D}·${F} = ${fmtNum(mlpPerLayer)}</strong></div><div class="calculation-row"><span>${tr("GQA Attention pro Layer")}</span><strong>2D² + 2D·H_kv·d_head = ${fmtNum(attentionPerLayer)}</strong></div><div class="calculation-row"><span>${tr("Gesamtparameter")}</span><strong>P = c_tie·VD + L(3DF + 2D² + 2D·H_kv·d_head) = ${fmtNum(totalParams)}</strong></div></div><h3>${tr("Speicher und ideale Decode-Grenze")}</h3><div class="calculation-ledger"><div class="calculation-row"><span>${tr("Residenter Weight-Speicher")}</span><strong>${fmtNum(totalParams)} · ${weightBits}/8 Byte = ${fmtBytes(weightMemory)}</strong></div><div class="calculation-row"><span>${tr("Vollständiger KV-Cache")}</span><strong>M_KV = 2·${L}·${B}·${S}·${Hkv}·${H}·${kvBytes} Byte = ${fmtBytes(kvMemory)}</strong></div><div class="calculation-row"><span>${tr("KV-Cache pro Sequenz")}</span><strong>${fmtBytes(perSequence)} · ${tr("linear in S")}</strong></div><div class="calculation-row"><span>${tr("Gemeinsames Mindestbudget")}</span><strong>${fmtBytes(weightMemory)} + ${fmtBytes(kvMemory)} = ${fmtBytes(total)} · ${tr("KV-Anteil")} ${kvShare.toFixed(1)}%</strong></div><div class="calculation-row"><span>${tr("Ideale Decode-Latenz-Untergrenze")}</span><strong>t = M_step/BW_HBM = ${(latencySeconds*1000).toFixed(3)} ms</strong></div><div class="calculation-row"><span>${tr("Ideale Throughput-Obergrenze")}</span><strong>B/t = ${Math.round(throughput).toLocaleString(localeCode())} ${tr("Token/s")}</strong></div></div><div class="shape-change"><strong>${tr("Warum Faktor 2 und warum wächst S?")}</strong><span>${tr("Jeder Layer speichert sowohl K als auch V. Der neue Token erzeugt in jedem Layer genau einen neuen Key- und Value-Vektor pro KV Head und hängt beide an die S-Achse an; alte Werte bleiben, damit sie nicht erneut berechnet werden müssen. Alte Queries und Attention-Gewichte werden nicht gecacht.")}</span></div><h3>${tr("Arithmetic Intensity aus Lecture 10")}</h3><div class="calculation-ledger"><div class="calculation-row"><span>${tr("Gated MLP · Prefill")}</span><strong>AI_MLP(T_q=S) = ${aiMlp(S).toFixed(2)} FLOPs/Byte</strong></div><div class="calculation-row"><span>${tr("Gated MLP · Decode")}</span><strong>AI_MLP(T_q=1) = ${aiMlp(1).toFixed(2)} FLOPs/Byte</strong></div><div class="calculation-row"><span>${tr("Attention · Prefill (MHA-Modell)")}</span><strong>AI_attn = S·T_q/(S+T_q) = ${aiAttentionMha(S).toFixed(2)} FLOPs/Byte</strong></div><div class="calculation-row"><span>${tr("Attention · Decode (MHA-Modell)")}</span><strong>${aiAttentionMha(1).toFixed(2)} FLOPs/Byte</strong></div><div class="calculation-row"><span>${tr("Attention · Decode (ideale GQA-Wiederverwendung)")}</span><strong>${aiAttentionGqa(1).toFixed(2)} FLOPs/Byte</strong></div></div><div class="shape-change"><strong>${tr("Warum spart GQA hier Speicher?")}</strong><span>${tr("MHA würde H_kv = H_q verwenden. Die gewählte Aufteilung reduziert den KV-Cache gegenüber MHA um")} ${(savings*100).toFixed(1)}%. ${tr("Sie senkt außerdem die K/V-Projektionsparameter; Query Heads bleiben erhalten.")}</span></div><div class="shape-change"><strong>${tr("Prefill versus Decode")}</strong><span>${tr("Prefill verarbeitet B·S =")} ${(B*S).toLocaleString(localeCode())} ${tr("Promptpositionen parallel. Decode verarbeitet pro Schritt nur B neue Positionen und liest dafür Gewichte sowie den bisherigen KV-Cache.")} ${tr(phaseNote)}</span></div><div class="callout warning"><strong>${tr("Untere beziehungsweise obere Idealgrenze:")}</strong> ${tr("Die Rechnung nimmt an, dass Gewichte und relevanter KV-Cache je Decode-Schritt genau einmal aus HBM gelesen werden. Compute, Kommunikation, Scheduling, temporäre Aktivierungen, Runtime-Buffer und Fragmentierung fehlen. Sie schätzt nicht die Time to First Token.")}</div>`;
