<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Interactive learning companion for Stanford CS336 Language Models from Scratch">
  <meta name="theme-color" content="#09111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="manifest" href="manifest.webmanifest">

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>CS336 Learning Lab - Language Models from Scratch</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #09111f;
      --surface: #111c2f;
      --surface-2: #17243a;
      --surface-3: #20304a;
      --text: #f4f7fb;
      --muted: #a7b5ca;
      --border: #2a3b57;
      --control-border: #61738f;
      --primary: #74a7ff;
      --on-primary: #07111f;
      --focus-ring: #74a7ff;
      --primary-soft: rgba(116, 167, 255, .14);
      --accent: #59d8c5;
      --accent-soft: rgba(89, 216, 197, .12);
      --warning: #f0bd68;
      --danger: #ff8b98;
      --success: #72d6a0;
      --shadow: 0 18px 50px rgba(0, 0, 0, .24);
      --radius: 18px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      --sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #edf2f8;
      --surface-3: #e5ecf5;
      --text: #142033;
      --muted: #5c6d83;
      --border: #d5dfeb;
      --control-border: #718096;
      --primary: #315fbb;
      --on-primary: #ffffff;
      --focus-ring: #315fbb;
      --primary-soft: rgba(49, 95, 187, .1);
      --accent: #087f72;
      --accent-soft: rgba(8, 127, 114, .1);
      --warning: #825300;
      --danger: #bb3042;
      --success: #176c42;
      --shadow: 0 18px 50px rgba(34, 54, 83, .1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: calc(5.5rem + env(safe-area-inset-top)); }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 4%, var(--primary-soft), transparent 28rem),
        radial-gradient(circle at 85% 15%, var(--accent-soft), transparent 24rem),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.58;
    }

    button, input, select, textarea { font: inherit; }
    a { color: var(--primary); }
    code, .mono { font-family: var(--mono); }
    code {
      padding: .1rem .35rem;
      border-radius: 6px;
      background: var(--surface-3);
      color: var(--text);
    }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, main:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }
    button:active, summary:active, a:active { transform: translateY(1px); }
    ::selection { background: var(--primary); color: var(--bg); }

    .skip-link {
      position: fixed;
      z-index: 200;
      top: max(.65rem, env(safe-area-inset-top));
      left: max(.65rem, env(safe-area-inset-left));
      padding: .7rem 1rem;
      border: 2px solid var(--focus-ring);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      transform: translateY(-180%);
    }
    .skip-link:focus { transform: translateY(0); }

    .app-shell {
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      padding: calc(1.35rem + env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) calc(1.35rem + env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      border-right: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 88%, transparent);
      backdrop-filter: blur(16px);
      z-index: 20;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .8rem;
      padding: .2rem .45rem .7rem;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 13px;
      background: linear-gradient(145deg, var(--primary), var(--accent));
      color: var(--on-primary);
      font-family: var(--mono);
      font-weight: 800;
      box-shadow: 0 9px 24px color-mix(in srgb, var(--primary), transparent 65%);
    }

    .brand strong { display: block; font-size: 1rem; letter-spacing: -.02em; }
    .brand span { display: block; color: var(--muted); font-size: .72rem; }

    .nav-list { display: grid; gap: .3rem; }
    .nav-button {
      width: 100%;
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .68rem .8rem;
      border: 1px solid transparent;
      border-radius: 11px;
      background: transparent;
      color: var(--muted);
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    .nav-button:hover { background: var(--surface-2); color: var(--text); }
    .nav-button.is-active {
      border-color: color-mix(in srgb, var(--primary), transparent 62%);
      background: var(--primary-soft);
      color: var(--text);
    }
    .nav-icon { width: 1.35rem; text-align: center; font-family: var(--mono); color: var(--primary); }

    .sidebar-progress {
      margin-top: auto;
      padding: .9rem;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--surface);
    }
    .sidebar-progress .label-row { display: flex; justify-content: space-between; color: var(--muted); font-size: .78rem; }

    .progress-track {
      height: 8px;
      margin-top: .55rem;
      overflow: hidden;
      border-radius: 99px;
      background: var(--surface-3);
    }
    .progress-bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transition: width .35s ease;
    }

    .main-shell { min-width: 0; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 15;
      display: grid;
      grid-template-columns: minmax(240px, 620px) auto;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      padding: calc(1rem + env(safe-area-inset-top)) max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-right)) 1rem max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-left));
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg) 84%, transparent);
      backdrop-filter: blur(18px);
    }

    .search-wrap, .search-field { position: relative; min-width: 0; }
    .search-input {
      width: 100%;
      padding: .72rem 1rem .72rem 2.65rem;
      border: 1px solid var(--control-border);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
    }
    .search-input::placeholder { color: var(--muted); }
    .search-glyph { position: absolute; left: .95rem; top: .73rem; color: var(--muted); }
    .search-results {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + .45rem);
      max-height: min(60vh, 520px);
      overflow: auto;
      border: 1px solid var(--control-border);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: var(--shadow);
      z-index: 30;
    }
    .search-results[hidden] { display: none; }
    .search-result {
      width: 100%;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: .75rem;
      padding: .75rem .9rem;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
      text-decoration: none;
      cursor: pointer;
    }
    .search-result:last-child { border-bottom: 0; }
    .search-result:hover, .search-result:active, .search-result.is-active, .search-result[aria-selected="true"] { background: var(--surface-2); }
    .result-type { color: var(--accent); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
    .result-copy { min-width: 0; }
    .result-copy strong, .result-copy small { overflow-wrap: anywhere; }
    .result-copy small { display: block; color: var(--muted); }
    .search-empty { padding: 1rem; }

    .toolbar { display: flex; gap: .5rem; }
    .account-button { position: relative; }
    .account-button::after {
      content: "";
      position: absolute;
      right: 5px;
      bottom: 5px;
      width: 8px;
      height: 8px;
      border: 2px solid var(--surface);
      border-radius: 50%;
      background: var(--muted);
    }
    .account-button[data-cloud-status="synced"]::after { background: var(--success); }
    .account-button[data-cloud-status="syncing"]::after { background: var(--warning); }
    .account-button[data-cloud-status="offline"]::after,
    .account-button[data-cloud-status="error"]::after { background: var(--danger); }
    .icon-button, .button, .chip, .seg-button {
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
    }
    .icon-button { width: 44px; height: 44px; display: grid; place-items: center; }
    .language-button { font-size: .76rem; font-weight: 800; letter-spacing: .04em; }
    .icon-button:hover, .button:hover, .chip:hover, .seg-button:hover { border-color: var(--primary); }
    .button { padding: .6rem .9rem; font-weight: 650; }
    .button.primary { border-color: transparent; background: var(--primary); color: var(--on-primary); }
    .button.ghost { background: transparent; }
    .button.danger { color: var(--danger); }
    .button.small { padding: .42rem .65rem; font-size: .82rem; }
    .button[disabled] { opacity: .45; cursor: not-allowed; }

    main { width: min(1480px, 100%); margin: 0 auto; padding: 2rem max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-right)) calc(5rem + env(safe-area-inset-bottom)) max(clamp(1rem, 4vw, 3rem), env(safe-area-inset-left)); scroll-margin-top: calc(5.5rem + env(safe-area-inset-top)); }
    .view[hidden] { display: none; }
    .view-header { margin-bottom: 1.6rem; }
    .eyebrow { margin: 0 0 .35rem; color: var(--accent); font-size: .76rem; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1, h2, h3, h4 { margin-top: 0; line-height: 1.2; letter-spacing: -.025em; }
    h1 { margin-bottom: .55rem; font-size: clamp(2rem, 5vw, 3.65rem); max-width: 20ch; }
    h2 { margin-bottom: .7rem; font-size: clamp(1.45rem, 2.5vw, 2rem); }
    h3 { margin-bottom: .5rem; font-size: 1.12rem; }
    p { margin-top: 0; }
    .lede { max-width: 78ch; color: var(--muted); font-size: 1.04rem; }
    .muted { color: var(--muted); }
    .small { font-size: .82rem; }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.5fr) minmax(280px, .7fr);
      gap: 1.25rem;
      align-items: stretch;
      margin-bottom: 1.5rem;
    }
    .hero-main {
      position: relative;
      overflow: hidden;
      padding: clamp(1.25rem, 4vw, 2.5rem);
      border: 1px solid var(--control-border);
      border-radius: 24px;
      background: linear-gradient(145deg, var(--surface), color-mix(in srgb, var(--surface-2), var(--primary) 8%));
      box-shadow: var(--shadow);
    }
    .hero-main::after {
      content: "Σ  ∇  QKᵀ  π  ⊕";
      position: absolute;
      right: -1rem;
      bottom: -1.4rem;
      color: color-mix(in srgb, var(--primary), transparent 87%);
      font: 800 clamp(2rem, 7vw, 6rem)/1 var(--mono);
      transform: rotate(-6deg);
      pointer-events: none;
    }
    .hero-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.2rem; }
    .panel {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }
    .panel { padding: clamp(1rem, 2.5vw, 1.5rem); }
    .panel + .panel { margin-top: 1rem; }

    .section-row { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin: 2rem 0 1rem; }
    .section-row h2 { margin: 0; }
    .section-row p { margin: .25rem 0 0; color: var(--muted); }

    .card-actions, .filter-row, .meta-row { display: flex; align-items: center; flex-wrap: wrap; gap: .55rem; }
    .module-index { color: var(--accent); font: 800 .8rem var(--mono); }
    .meta-row { color: var(--muted); font-size: .78rem; }

    .tag, .chip, .badge {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      width: fit-content;
      padding: .22rem .52rem;
      border-radius: 999px;
      font-size: .72rem;
    }
    .tag, .badge { border: 1px solid var(--border); color: var(--muted); background: var(--surface-2); }
    .badge.primary { border-color: color-mix(in srgb, var(--primary), transparent 55%); color: var(--primary); background: var(--primary-soft); }
    .badge.accent { border-color: color-mix(in srgb, var(--accent), transparent 55%); color: var(--accent); background: var(--accent-soft); }
    .chip { padding: .42rem .72rem; }
    .chip.is-active { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

    .timeline { position: relative; display: grid; gap: 1rem; margin-left: .5rem; }
    .timeline::before { content: ""; position: absolute; left: 18px; top: 22px; bottom: 22px; width: 2px; background: var(--border); }
    .timeline-item { position: relative; display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 1rem; }
    .timeline-marker { z-index: 1; width: 38px; height: 38px; display: grid; place-items: center; border: 2px solid var(--border); border-radius: 50%; background: var(--bg); color: var(--muted); font: 800 .76rem var(--mono); }
    .timeline-marker.done { border-color: var(--success); color: var(--success); }
    .timeline-marker.active { border-color: var(--warning); color: var(--warning); }
    .timeline-content { padding: .2rem 0 1rem; }

    .filters {
      display: grid;
      grid-template-columns: minmax(200px, 1fr) auto;
      gap: .8rem;
      margin: 1rem 0 1.25rem;
    }
    .filter-row { justify-content: flex-end; }
    .input, .select, .textarea {
      width: 100%;
      padding: .68rem .78rem;
      border: 1px solid var(--control-border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
    }
    .input, .select { min-height: 44px; }
    .textarea { min-height: 140px; resize: vertical; }
    .field { display: grid; gap: .35rem; }
    .field label, label.field { color: var(--muted); font-size: .82rem; }
    .field output { color: var(--text); font-family: var(--mono); }
    input[type="range"] { width: 100%; accent-color: var(--primary); }

    .detail-layout { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 1.25rem; align-items: start; }
    .detail-body { min-width: 0; }
    .detail-aside { position: sticky; top: 88px; display: grid; gap: .8rem; }
    .detail-section { margin-bottom: 1.5rem; }
    .detail-section h3 { padding-bottom: .45rem; border-bottom: 1px solid var(--border); }
    .reading-section { padding-block: .25rem 1.35rem; border-bottom: 1px solid var(--border); }
    .reading-section + .reading-section { padding-top: 1.35rem; }
    .concept-orientation-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: .75rem; }
    .concept-orientation-card { padding: .9rem 1rem; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
    .concept-orientation-card h3 { margin: 0 0 .45rem; padding: 0; border: 0; font-size: .95rem; }
    .concept-orientation-card p { margin: 0; }
    .concept-position { margin-top: .5rem !important; color: var(--muted); font-size: .82rem; }
    .concept-terms { margin-top: 1rem; padding: .9rem 1rem; border-left: 4px solid var(--accent); border-radius: 0 12px 12px 0; background: var(--accent-soft); }
    .concept-terms h3 { margin: 0 0 .65rem; padding: 0; border: 0; font-size: .95rem; }
    .concept-terms dl { display: grid; grid-template-columns: minmax(130px, .45fr) minmax(0, 1fr); gap: .45rem .8rem; margin: 0; }
    .concept-terms dt { font-weight: 750; overflow-wrap: anywhere; }
    .concept-terms dd { margin: 0; }
    .callout { padding: .9rem 1rem; border-left: 4px solid var(--primary); border-radius: 0 12px 12px 0; background: var(--primary-soft); }
    .callout.warning { border-color: var(--warning); background: color-mix(in srgb, var(--warning), transparent 90%); }
    .callout.accent { border-color: var(--accent); background: var(--accent-soft); }
    .check-list { display: grid; gap: .55rem; padding: 0; list-style: none; }
    .check-list li { display: grid; grid-template-columns: 1.25rem 1fr; gap: .5rem; }
    .check-list li::before { content: "→"; color: var(--accent); font-family: var(--mono); }
    .self-check-list { display: grid; gap: 1.1rem; padding-left: 1.4rem; }
    .self-check-list > li { padding-left: .25rem; }
    .self-check-question { margin: 0 0 .45rem; font-weight: 650; }
    .answer-disclosure { padding-left: .85rem; border-left: 2px solid var(--border); }
    .answer-disclosure > summary {
      display: flex;
      align-items: center;
      width: fit-content;
      min-height: 44px;
      color: var(--primary);
      font-weight: 650;
      cursor: pointer;
    }
    .answer-disclosure[open] > summary { margin-bottom: .35rem; }
    .answer-disclosure > p { max-width: 78ch; margin-bottom: .35rem; }
    .answer-disclosure + .button { margin-top: .65rem; }
    .detail-pagination { display: flex; justify-content: flex-end; padding-top: 1rem; border-top: 1px solid var(--border); }
    .detail-next {
      display: grid;
      gap: .15rem;
      width: min(100%, 34rem);
      padding: .8rem 1rem;
      text-align: left;
    }
    .detail-next-label { font: 800 .75rem var(--mono); letter-spacing: .08em; text-transform: uppercase; }
    .detail-next-title { font-size: 1rem; }
    .source-link { display: inline-flex; align-items: center; gap: .35rem; font-size: .82rem; }
    button.source-link { min-height: 24px; padding: 0; border: 0; background: transparent; color: var(--primary); text-align: left; cursor: pointer; }

    .formula-display {
      overflow: visible;
      padding: .9rem;
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      font: 650 1rem/1.65 var(--mono);
      white-space: normal;
      overflow-wrap: anywhere;
    }
    .formula-vars { display: grid; grid-template-columns: auto 1fr; gap: .3rem .7rem; margin: 0; font-size: .82rem; }
    .formula-vars dt { color: var(--accent); font-family: var(--mono); }
    .formula-vars dd { margin: 0; color: var(--muted); }
    .symbol { color: var(--accent); font: 700 1.05rem var(--mono); }

    .hero.is-single { display: block; }
    .next-focus {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: .3rem .8rem;
      max-width: 820px;
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .next-focus span { color: var(--muted); }
    .next-focus strong { font-size: 1.05rem; }
    .next-focus .next-focus-label { color: var(--accent); font: 800 .76rem var(--mono); text-transform: uppercase; letter-spacing: .08em; }

    .progress-strip {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0 1.5rem;
      padding: .85rem 0;
      border-block: 1px solid var(--border);
    }
    .progress-strip-main { min-width: 0; }
    .progress-strip-label { display: flex; justify-content: space-between; gap: 1rem; }
    .progress-strip-meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .35rem 1rem; color: var(--muted); font-size: .82rem; }

    .collection-list, .accordion-list { border-top: 1px solid var(--border); }
    .compact-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-width: 0;
      border-bottom: 1px solid var(--border);
      transition: background .15s ease;
    }
    .compact-row:hover { background: var(--surface-2); }
    .compact-row-main {
      min-width: 0;
      padding: .85rem .75rem;
      border: 0;
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }
    .compact-row-actions { display: flex; align-items: center; gap: .4rem; padding-right: .65rem; }
    .compact-row-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: .35rem .7rem; }
    .compact-row-title { font-weight: 750; }
    .compact-row-summary {
      display: -webkit-box;
      margin-top: .25rem;
      overflow: hidden;
      color: var(--muted);
      font-size: .86rem;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .compact-row-meta { color: var(--muted); font-size: .76rem; }

    .quick-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border); }
    .quick-action {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: .2rem .7rem;
      padding: 1rem .75rem;

      border-bottom: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      text-align: left;
      cursor: pointer;
    }

      "unicode": {

      "transformer-block": {

      "transformer-ledger": {

      {id:"mean-var",cat:"Grundlagen",title:"Mittelwert & Varianz",expr:"μ = (1/n) Σᵢ xᵢ   ·   Var(X) = E[(X−μ)²]",latex:"\\mu=\\frac1n\\sum_i x_i,\\quad \\mathrm{Var}(X)=\\mathbb E[(X-\\mu)^2]",read:"Mittelwert ist die Summe durch n; Varianz ist die erwartete quadratische Abweichung.",purpose:"Beschreibt Lage und Streuung; zentral für Initialisierung, Normalisierung und Policy-Gradient-Varianz.",dims:"xᵢ und μ haben dieselbe Einheit; Varianz hat deren Quadrat.",vars:[["n","Anzahl Beobachtungen"],["xᵢ","Beobachtung i"],["μ","Mittelwert"],["E","Erwartungswert"]],intuition:"Quadrate verhindern, dass sich positive und negative Abweichungen aufheben.",pitfall:"Standardabweichung σ ist √Var und hat wieder die Einheit von x.",example:"Für [1,3] ist μ=2, Varianz (mit 1/n)=1.",check:"Warum ist Varianz nie negativ?",sources:["a5","l17"],aliases:"mean average standard deviation sigma erwartungswert"},
      {id:"matmul",cat:"Lineare Algebra",title:"Matrixmultiplikation",expr:"Cᵢⱼ = Σₖ Aᵢₖ Bₖⱼ    |    (m×k)(k×n) → (m×n)",latex:"C_{ij}=\\sum_k A_{ik}B_{kj}",read:"Jeder Output ist das Skalarprodukt einer A-Zeile mit einer B-Spalte.",purpose:"Grundoperation von Linear Layers, Attention und MLPs.",dims:"Innere Dimension k muss übereinstimmen; äußere m,n bleiben.",vars:[["m","Anzahl Zeilen/Objekte"],["k","kontrahierte Featureachse"],["n","Outputfeatures"],["Cᵢⱼ","Output an Zeile i, Spalte j"]],intuition:"Viele gewichtete Summen gleichzeitig.",pitfall:"Nicht mit elementweisem A⊙B verwechseln.",example:"(B·T×D) @ (D×D_out) → (B·T×D_out).",check:"Welche Achse verschwindet und warum?",sources:["l02","a1"],aliases:"matrix multiplication matmul einsum dot product"},
      {id:"linear-map",cat:"Lineare Algebra",title:"Linear Layer / gelernte Projection",expr:"yₒ = bₒ + Σᵢ xᵢWᵢₒ   |   […,D_in] · [D_in,D_out] → […,D_out]",latex:"y_o=b_o+\\sum_i x_iW_{io}",read:"Jedes Outputfeature o ist eine eigene gelernte gewichtete Mischung aller Inputfeatures desselben Vektors.",purpose:"Erzeugt aus demselben Tokenzustand neue rollenspezifische Features für Q, K, V, Attention-Output, MLP und LM Head.",dims:"x: […,D_in], W: [D_in,D_out], b: [D_out], y: […,D_out]; alle führenden Achsen bleiben erhalten.",vars:[["xᵢ","Koordinate i des aktuellen Tokenzustands; ihre Bedeutung wird verteilt gelernt"],["Wᵢₒ","gelernter Beitrag von Inputfeature i zu Outputfeature o"],["bₒ","optionaler gelernter Ausgangswert von yₒ, wenn x=0 ist"],["yₒ","neu gemischtes Outputfeature o"]],intuition:"Jede Spalte von W ist ein während des Trainings angepasstes Mischrezept; dieselben Rezepte werden unabhängig auf alle Tokens angewandt.",pitfall:"Mit Bias ist y=xW+b mathematisch eine affine Abbildung, obwohl PyTorch den Baustein Linear Layer nennt. PyTorch speichert nn.Linear.weight als [D_out,D_in] und rechnet x @ weight.T. Projection meint in LLMs meist keine orthogonale geometrische Projection und darf die Dimension sogar vergrößern.",example:"x=[2,−1], W=[[1,0,2],[3,−1,1]], b=[0.5,1,−2] ⇒ y=[−0.5,2,1].",check:"Wie entsteht im Beispiel das erste Outputfeature, und welche Achsen würde der Layer bei X [B,T,2] nicht mischen?",sources:["l02","l03","a1"],aliases:"linear layer projection affine dense feature mixer xw bias pytorch"},
      {id:"chain-rule",cat:"Grundlagen",title:"Kettenregel",expr:"∂L/∂x = (∂L/∂y)(∂y/∂x)",latex:"\\frac{\\partial L}{\\partial x}=\\frac{\\partial L}{\\partial y}\\frac{\\partial y}{\\partial x}",read:"Multipliziere den ankommenden Gradient ∂L/∂y mit der lokalen Empfindlichkeit ∂y/∂x, um ∂L/∂x zu erhalten.",purpose:"Backpropagation verfolgt damit rückwärts, welche frühere Aktivierung oder welcher Parameter den Loss wie stark beeinflusst hat.",dims:"∂L/∂x hat dieselbe Shape wie x. Für Tensoren berechnet Autograd Vector-Jacobian Products, ohne den meist riesigen vollständigen Jacobian zu speichern.",vars:[["L","skalarer Loss, dessen Änderung erklärt werden soll"],["x","frühere Aktivierung oder lernbarer Parameter"],["y","aus x berechnetes Zwischenergebnis"],["∂L/∂y","Upstream-Gradient: bereits bekannte Wirkung von y auf den Loss"],["∂y/∂x","lokale Ableitung: Wirkung von x auf genau diese Operation"]],intuition:"Jeder Faktor beantwortet eine Teilfrage: x verändert y, y verändert L. Entlang einer Kette werden die Wirkungen multipliziert; treffen mehrere Wege wieder bei x zusammen, werden ihre Beiträge addiert.",pitfall:"Autograd berechnet nur Gradienten und akkumuliert sie in .grad. Erst der Optimizer verwendet sie später für ein Parameterupdate; ohne zero_grad würden Beiträge aus mehreren Steps unbeabsichtigt addiert.",example:"x=2, y=x²=4, L=3y=12: ∂L/∂y=3 und ∂y/∂x=2x=4, also ∂L/∂x=12. Bei zwei Pfaden L=x²+3x wäre der Gradient 2x+3.",check:"Warum ist kein voller Jacobian nötig, und was passiert bei zwei Pfaden von x zum Loss?",sources:["l02","a1"],aliases:"gradient backprop derivative jacobian vjp upstream local optimizer"},
      {id:"softmax",cat:"Wahrscheinlichkeit",title:"Softmax",expr:"pᵢ = exp(zᵢ−m) / Σⱼ exp(zⱼ−m),   m=maxⱼ zⱼ",latex:"p_i=\\frac{e^{z_i-m}}{\\sum_j e^{z_j-m}},\\quad m=\\max_j z_j",read:"Exponentiere relative Logitdifferenzen und teile jeden Wert durch ihre Summe, sodass eine Wahrscheinlichkeitsverteilung entsteht.",purpose:"Wandelt unnormalisierte Scores in vergleichbare Gewichte um: über V Vokabulartokens im LM Head oder über T_key Positionen in Attention.",dims:"z und p haben dieselbe Shape. Genau eine Achse wird normalisiert: bei Next-Token-Logits V, bei Attention-Scores T_key; jede Zeile entlang dieser Achse summiert sich zu eins.",vars:[["zᵢ","Logit: relativer Score für Kategorie i, noch keine Wahrscheinlichkeit"],["pᵢ","normalisierte Wahrscheinlichkeit beziehungsweise Attention-Gewicht"],["m","größter Logit derselben Zeile; wird nur für numerische Stabilität abgezogen"]],intuition:"Differenzen steuern Verhältnisse direkt: pᵢ/pⱼ=exp(zᵢ−zⱼ). Ein Logitvorsprung von 1 macht eine Kategorie e≈2.72-mal so wahrscheinlich wie die andere; ein gemeinsamer Offset ändert nichts.",pitfall:"Die falsche Achse erzeugt zwar Zahlen zwischen null und eins, beantwortet aber eine andere Frage. In Attention muss jede Query über ihre erlaubten Keys verteilen; maskierte Scores werden vor Softmax auf −∞ gesetzt.",example:"z=[2,1,0] ergibt ungefähr p=[0.665,0.245,0.090]. Nach z+100 ist die Verteilung identisch, weil nur die Differenzen zählen.",check:"Welche Achse normalisierst du für LM-Logits [B,T,V] und für Attention-Scores [B,H,T_q,T_k], und warum verändert −m das Resultat nicht?",sources:["a1","l03"],aliases:"probability logits normalization exp attention axis vocabulary"},
      {id:"logsumexp",cat:"Numerik",title:"Log-Sum-Exp",expr:"LSE(z) = m + log Σⱼ exp(zⱼ−m)",latex:"\\operatorname{LSE}(z)=m+\\log\\sum_j e^{z_j-m}",read:"Ziehe das Maximum heraus, summiere sichere Exponentialwerte und addiere es zurück.",purpose:"Stabile Normalisierung von Logits und Cross-Entropy.",dims:"Skalar pro normalisierter Zeile; gleiche Log-Einheit wie z.",vars:[["z","Logitvektor"],["m","max(z)"],["LSE","Logarithmus der Exponentialsumme"]],intuition:"Vermeidet Overflow bei großen und Underflow bei kleinen Logits.",pitfall:"Naives log(sum(exp(z))) kann inf ergeben, obwohl das mathematische Resultat endlich ist.",example:"z=[1000,1000] ⇒ LSE=1000+log 2.",check:"Welche exp-Argumente entstehen nach Stabilisierung?",sources:["a1","a2"],aliases:"log sum exp numerical stability"},
      {id:"autoregressive",cat:"Sprachmodell",title:"Autoregressive Faktorisierung",expr:"p(x₁:ₜ) = ∏ₜ p(xₜ | x&lt;ₜ)   ⇔   log p = Σₜ log p(xₜ | x&lt;ₜ)",latex:"p(x_{1:T})=\\prod_{t=1}^T p(x_t\\mid x_{<t})",read:"Die Sequenzwahrscheinlichkeit ist das Produkt bedingter Next-Token-Wahrscheinlichkeiten.",purpose:"Definiert Training und Generierung eines Decoder-Sprachmodells.",dims:"Ein Skalar pro Sequenz; jede bedingte Verteilung hat V Kategorien.",vars:[["T","Sequenzlänge"],["xₜ","Token an Position t"],["x&lt;ₜ","alle vorherigen Tokens"]],intuition:"Komplexe Sequenzen werden in lokale Vorhersagen zerlegt.",pitfall:"Die kausale Bedingung darf beim parallelen Training nicht verletzt werden.",example:"p(a,b)=p(a)·p(b|a).",check:"Warum wird das Produkt im Lograum zur Summe?",sources:["a1"],aliases:"language model next token likelihood factorization"},
      {id:"next-token-batch",cat:"Training",title:"Zufällige Next-Token-Batches aus Token-Arrays",expr:"s_b ∈ {0,…,n−m−1};   X_b=x[s_b:s_b+m];   Y_b=x[s_b+1:s_b+m+1]",latex:"s_b\\in\\{0,\\ldots,n-m-1\\},\\quad X_b=x[s_b:s_b+m],\\quad Y_b=x[s_b+1:s_b+m+1]",read:"Ziehe für jedes Batchbeispiel einen gültigen Start und schneide m Inputtokens sowie dieselben um genau eine Position verschobenen m Targets aus.",purpose:"Erzeugt ohne Padding gleich lange Teacher-Forcing-Beispiele aus einem flachen tokenisierten Korpus und erlaubt mit np.memmap beziehungsweise np.load(..., mmap_mode='r') Sampling ohne vollständiges Laden in den Arbeitsspeicher.",dims:"x hat [n], die B Startindizes haben [B], X und Y haben [B,m]. Es muss n≥m+1 gelten; der exklusive obere Zufallsrand ist n−m.",vars:[["x","flaches Integer-Array aus n Token-IDs"],["B","Zahl unabhängig gezogener Fenster im Batch"],["m","Kontextlänge und Länge jedes Input-/Targetfensters"],["s_b","Startindex mit 0≤s_b<n−m"],["X_b,Y_b","Input und um eins verschobenes Next-Token-Target"]],intuition:"Ein einziges Fenster der Länge m+1 enthält beide Tensoren: Die ersten m Werte sind Input, die letzten m Werte Target. Memory Mapping lädt beim Zugriff nur die benötigten Seiten; die kleinen Slices können anschließend als Long-Tensoren auf das Ziel-Device wechseln.",pitfall:"n−m+1 als exklusiven oberen Rand zu verwenden erlaubt s=n−m und erzeugt ein zu kurzes Target. Ein falscher dtype interpretiert dieselben Dateibytes als andere IDs; eine sofortige Vollkopie hebt den memmap-Speichervorteil auf.",example:"n=10,m=4 ⇒ s∈{0,…,5}. Bei s=5 sind X_b=x[5:9] und Y_b=x[6:10], jeweils Länge vier; Y_b[:-1]=X_b[1:].",check:"Warum ist n−m der exklusive Zufallsrand, welche Slice-Invariante muss gelten, und was prüfst du beim Öffnen einer Token-Memory-Map?",sources:["a1"],aliases:"numpy memmap mmap mode random offset get batch context length dtype off by one token array"},
      {id:"cross-entropy",cat:"Loss",title:"Cross-Entropy / NLL",expr:"L = −(1/M) Σᵢ log softmax(zᵢ)ᵧᵢ",latex:"\\mathcal L=-\\frac1M\\sum_i \\log\\operatorname{softmax}(z_i)_{y_i}",read:"Wähle pro Position die Log-Wahrscheinlichkeit des richtigen Next Tokens, negiere sie und mittlere nur über gültige Ziele.",purpose:"Übersetzt die V Output-Logits pro Position in einen skalaren Trainings-Loss. Der anschließende Gradient-Descent-Schritt entlang des negativen Gradienten hebt den Ziel-Logit relativ zu allen Konkurrenten an.",dims:"Logits z: [B,T,V], Target-IDs y und unreduzierter Loss: [B,T], reduzierter Loss L: Skalar. M zählt nur unmaskierte Target-Tokens.",vars:[["zᵢ","V Logits an einer bewerteten Tokenposition i"],["yᵢ","Index des tatsächlich nächsten Tokens an Position i"],["M","Anzahl gültiger Ziele nach Padding- oder Response-Maske"],["p−onehot(y)","Gradient bezüglich der Logits: Zielkomponente p_y−1 ist negativ, jede Nichtzielkomponente p_j positiv; erst das Update z←z−η∇L bewegt die Logits in die entgegengesetzte Richtung"]],intuition:"−log p_y ist klein, wenn das Modell dem Ziel viel Masse gibt, und wächst unbegrenzt, wenn p_y gegen null geht. Der Logarithmus macht Sequenzprodukte additiv und bestraft selbstsichere Fehler stark.",pitfall:"Inputs und Targets müssen für Next-Token-Training um eine Position verschoben sein. Padding muss aus Summe und Nenner verschwinden; ein Mittel über Sequenzen gewichtet sonst unterschiedlich lange Beispiele falsch.",example:"p_y=0.5 ⇒ Loss≈0.693; p_y=0.01 ⇒ Loss≈4.605. Bei uniformen V Kategorien gilt p_y=1/V und L=log V.",check:"Welcher Loss entsteht bei uniformer Verteilung über V Tokens, und wie unterscheiden sich Gradient und Gradient-Descent-Update für Ziel- und Nichtziel-Logits?",sources:["a1","l02"],aliases:"ce loss nll negative log likelihood token loss gradient target shift mask"},
      {id:"perplexity",cat:"Evaluation",title:"Perplexity",expr:"PPL = exp( (1/M) Σᵢ −log p(yᵢ|x&lt;ᵢ) ) = exp(L)",latex:"\\operatorname{PPL}=\\exp\\left(-\\frac1M\\sum_i\\log p(y_i\\mid x_{<i})\\right)",read:"Exponentiere die mittlere Token-NLL.",purpose:"Likelihood-basierte Modellgüte auf festem Korpus und Tokenizer; in Lecture 14 auch als KenLM-Filterranking.",dims:"Dimensionslose positive Zahl, mindestens 1.",vars:[["M","Zahl bewerteter Tokens"],["p","Zieltoken-Wahrscheinlichkeit"],["L","mittlere Cross-Entropy"]],intuition:"Effektive Verzweigungszahl pro Token.",pitfall:"Zwischen verschiedenen Tokenizern nicht direkt vergleichbar. KenLM score summiert Log10-Werte, daher gilt für diese API 10^(−score/M), nicht exp(−score/M).",example:"Natural-Log-Loss log(10) ⇒ PPL 10.",check:"Warum ist PPL bei Loss 0 gleich 1?",sources:["l12","l14","a1"],aliases:"ppl evaluation likelihood kenlm filter"},
      {id:"embedding-lookup",cat:"Transformer",title:"Token-Embedding-Lookup",expr:"X[b,t,:] = E[token_ids[b,t],:]   |   [B,T] + [V,D] → [B,T,D]",latex:"X_{b,t,:}=E_{\\operatorname{token\\_ids}_{b,t},:}",read:"Jede ganzzahlige Token-ID wählt genau eine Zeile aus der gelernten Embedding-Tabelle; die ID selbst wird nicht als Zahl verrechnet.",purpose:"Übersetzt diskrete Token-IDs in kontinuierliche D-dimensionale Aktivierungen, mit denen Linear Layers, Attention und MLPs rechnen können.",dims:"token_ids: [B,T] mit Integern, E: [V,D] lernbare Parameter, X: [B,T,D] Aktivierungen. B und T bleiben erhalten; eine neue Featureachse D kommt hinzu.",vars:[["token_ids[b,t]","Vokabularindex des Tokens an Batchposition b und Sequenzposition t"],["E","gelernte Tabelle mit einer D-dimensionalen Zeile pro Vokabulartoken"],["X[b,t,:]","Startaktivierung dieses Tokenvorkommens vor den Transformer-Blöcken"],["V,D","Vokabulargröße und Modelldimension"]],intuition:"Die ID ist nur eine Adresse. Derselbe Token startet mit derselben Tabellenzeile, aber Position und Kontext verändern seinen Zustand danach in jedem Transformer-Block.",pitfall:"Ein Lookup ist keine gewichtete Mittelung und ID 101 ist nicht automatisch ähnlicher zu 102 als zu 900. Der LM Head verwendet nur bei Weight Tying dieselbe Matrix; sonst besitzt er eigene gelernte Gewichte.",example:"token_ids=[[2,0,2]] und E mit Shape [5,4] ergeben X [1,3,4]; X[0,0] und X[0,2] beginnen als dieselbe Zeile E[2], können später aber unterschiedliche kontextuelle Zustände werden.",check:"Welche Achse kommt beim Lookup hinzu, und warum können zwei Vorkommen derselben Token-ID nach mehreren Transformer-Blöcken verschieden sein?",sources:["a1","l03"],aliases:"embedding lookup table token id gather contextual representation"},
      {id:"embedding-params",cat:"Ressourcen",title:"Embedding-Parameter",expr:"N_embed = V · D",latex:"N_{\\text{embed}}=Vd_{\\text{model}}",read:"Vokabulargröße mal Modelldimension.",purpose:"Parameter- und Speicherrechnung für Token-Embedding; mit Weight Tying kann der Output Head dieselbe Matrix nutzen.",dims:"Parameteranzahl; Bytes = N_embed×Bytes pro Element.",vars:[["V","Vokabulargröße"],["D","Modelldimension"]],intuition:"Für jedes Token eine D-dimensionale Zeile.",pitfall:"Ohne Weight Tying den LM Head ein zweites Mal zählen.",example:"V=32k, D=4096 ⇒ rund 131M Parameter.",check:"Wie verändert Verdopplung von V die Sequenz- und Parameterkosten?",sources:["a1","l03"],aliases:"vocab embedding table lm head weight tying"},
      {id:"linear-params",cat:"Ressourcen",title:"Linear Layer: Parameter & FLOPs",expr:"N = d_in·d_out (+ d_out);   FLOPs ≈ 2·B·T·d_in·d_out",latex:"N=d_{in}d_{out}+d_{out},\\quad F\\approx2BTd_{in}d_{out}",read:"W enthält ein gelerntes Gewicht für jedes Input-Output-Featurepaar; der optionale Bias enthält einen Wert pro Outputfeature.",purpose:"Schätzt Parameter und Rechenarbeit der Q/K/V- und Output-Layer, MLP-Matrizen sowie des LM Heads.",dims:"W: [d_in,d_out], b: [d_out]; N zählt gespeicherte Werte, FLOPs die Wiederholung derselben Abbildung an B·T Positionen.",vars:[["d_in","Inputfeatures pro Token"],["d_out","neu erzeugte Outputfeatures pro Token"],["B","unabhängige Sequenzen im Batch"],["T","Tokenpositionen pro Sequenz"]],intuition:"Die gelernten Mischrezepte stehen nur einmal in W, werden aber für jedes der B·T Tokens erneut ausgeführt.",pitfall:"Forward-Pass- und Trainings-FLOPs nicht gleichsetzen; PyTorch speichert W transponiert zur hier verwendeten Zeilenkonvention.",example:"Ein biasfreier D×D Layer hat D² Parameter; X [B,T,D] erzeugt [B,T,D], ohne B oder T zu mischen.",check:"Warum taucht T nicht in der Parameterzahl auf, obwohl die Rechenarbeit mit T wächst?",sources:["l02","a1"],aliases:"dense projection parameter count flops"},
      {id:"parameter-init",cat:"Transformer",title:"A1-Parameterinitialisierung",expr:"σ_linear = √(2/(d_in+d_out));   W ~ N(0,σ_linear²), W∈[−3σ,3σ]   ·   E ~ N(0,1), E∈[−3,3]   ·   g_RMS = 1",latex:"\\sigma_{linear}=\\sqrt{\\frac{2}{d_{in}+d_{out}}},\\quad W\\sim\\mathcal N(0,\\sigma_{linear}^2),\\quad E\\sim\\mathcal N(0,1),\\quad g_{RMS}=\\mathbf 1",read:"Berechne für Linear-Gewichte zuerst die Standardabweichung als Quadratwurzel der vorgegebenen Varianz, schneide bei drei Standardabweichungen ab, verwende für Embeddings stattdessen std eins und initialisiere den RMSNorm-Gain mit Einsen.",purpose:"Legt den A1-exakten Startzustand der lernbaren Linear-, Embedding- und RMSNorm-Parameter fest, damit Aktivierungs- und Gradientenskalen nicht schon vor dem ersten Update durch ungeeignete Größenordnungen destabilisiert werden.",dims:"W hat [d_out,d_in] beziehungsweise die im Modul dokumentierte äquivalente Orientierung, E hat [V,D], g_RMS hat [D]. d_in und d_out bestimmen nur σ_linear; alle Grenzen besitzen dieselbe Einheit wie ihr Parameter.",vars:[["d_in,d_out","Eingangs- und Ausgangsbreite des jeweiligen Linear Layers"],["σ_linear","an trunc_normal_ als std übergebene Standardabweichung sqrt(2/(d_in+d_out))"],["W","Linear-Gewichte aus der bei ±3σ abgeschnittenen Normalverteilung"],["E","Embeddingmatrix mit eigener Regel std=1 und Grenzen [−3,3]"],["g_RMS","lernbarer RMSNorm-Gain, der vollständig mit Einsen startet"]],intuition:"Fan-in und Fan-out bestimmen, wie viele Beiträge Signale vorwärts mischen und Gradienten rückwärts sammeln. Die symmetrische Breitenregel hält beide Richtungen in einer brauchbaren Größenordnung; Truncation entfernt seltene Startausreißer, und g=1 lässt RMSNorm zunächst ohne zusätzliche Featuregewichtung wirken.",pitfall:"trunc_normal_ erwartet std und nicht die Varianz: 2/(d_in+d_out) muss zuerst gewurzelt werden. Embeddings verwenden nicht σ_linear. Wegen Truncation und endlicher Stichprobe ist die empirische Varianz nicht exakt der übergebene σ²-Wert.",example:"d_in=64,d_out=192 ⇒ σ=sqrt(2/256)≈0,0884 und Grenzen ungefähr ±0,265. Ein Embedding desselben Modells nutzt trotzdem std=1 und Grenzen ±3; jeder RMSNorm-Gain beginnt bei 1.",check:"Welche drei Initialisierungsregeln verlangt A1, welche Argumente gehen an trunc_normal_, und warum ist ein exakter empirischer Varianzvergleich kein korrekter Test?",sources:["a1"],aliases:"trunc normal initialization fan in fan out embedding rmsnorm gain std variance"},
      {id:"rmsnorm",cat:"Transformer",title:"RMSNorm",expr:"RMSNorm(x) = g ⊙ x / √( (1/D)Σⱼ xⱼ² + ε )",latex:"\\operatorname{RMSNorm}(x)=g\\odot\\frac{x}{\\sqrt{\\frac1D\\sum_jx_j^2+\\epsilon}}",read:"Berechne pro Token die Root Mean Square (RMS), teile alle D Features durch diese gemeinsame Skala und multipliziere sie mit einem lernbaren Gain.",purpose:"Hält die Größenordnung der Aktivierungen vor Attention und MLP kontrolliert, ohne Token miteinander zu mischen oder wie LayerNorm den Mittelwert abzuziehen.",dims:"Für X [B,T,D] wird nur über D reduziert; Output bleibt [B,T,D]. Der lernbare Gain g [D] wird über B und T gebroadcastet, ε ist eine feste Stabilitätskonstante.",vars:[["x","D-dimensionaler Aktivierungsvektor eines einzelnen Tokens"],["D","Featurebreite und einzige Normalisierungsachse"],["g","lernbarer Scale pro Feature; verändert relative Featuregewichte nach der Normierung"],["ε","kleine feste Konstante gegen Division durch null"]],intuition:"RMSNorm ändert hauptsächlich die Länge, nicht die Richtung des Vektors; g darf anschließend einzelne Koordinaten wieder verstärken oder dämpfen. Im Pre-Norm-Block wird nur der Seitenzweig normiert, der Residualpfad bleibt direkt.",pitfall:"Nicht über Batch B oder Tokens T mitteln und keinen Mittelwert abziehen. Bei niedriger Präzision werden Quadrat und Mittelwert oft in FP32 berechnet; ε gehört in der gezeigten Definition unter die Wurzel.",example:"Für x=[3,4], D=2 und g=[1,1] ist RMS=√12.5≈3.536 und der Output ungefähr [0.849,1.131]; die Shape bleibt [2].",check:"Welche Achse wird bei X [B,T,D] reduziert, welche Shape hat g, und warum verändert RMSNorm nicht die Sequenzlänge?",sources:["a1","l03"],aliases:"root mean square normalization layer norm prenorm gain axis"},
      {id:"swiglu",cat:"Transformer",title:"SwiGLU",expr:"FFN(x) = W₂( SiLU(W₁x) ⊙ W₃x )",latex:"\\operatorname{FFN}(x)=W_2(\\operatorname{SiLU}(W_1x)\\odot W_3x)",read:"Erzeuge zwei gelernte erweiterte Featureansichten, forme eine davon nichtlinear mit SiLU und gate damit elementweise die andere, bevor ein Down Linear Layer auf D zurückbildet.",purpose:"Verarbeitet nach Attention die Features jedes Tokens unabhängig und kann durch das datenabhängige Gate komplexere Funktionen als eine einzige lineare Abbildung lernen.",dims:"X [B,T,D] → W₁- und W₃-Zweige [B,T,F] → elementweises Produkt [B,T,F] → W₂-Output [B,T,D]. B und T werden nicht gemischt.",vars:[["W₁,W₃","zwei gelernte D→F Linear Layers für Gate- und Inhaltszweig"],["SiLU(z)","feste glatte Funktion z·sigmoid(z), die den Gate-Zweig zusätzlich formt"],["W₂","gelernter F→D Down Linear Layer für Residualkompatibilität"],["⊙","elementweise Multiplikation zweier x-abhängiger [B,T,F]-Tensoren; sie erzeugt bereits eine multiplikative Nichtlinearität"]],intuition:"W₃x erzeugt Kandidatenfeatures; SiLU(W₁x) erzeugt für genau denselben Token ein glattes, eingabeabhängiges Gate. Schon das Produkt zweier x-abhängiger Zweige ist nichtlinear; SiLU ist nicht die einzige Quelle der Nichtlinearität, sondern formt, dämpft und verstärkt den Gate-Zweig zusätzlich.",pitfall:"Nur eine reine Verkettung von Linear Layers ohne Aktivierung und ohne multiplikatives Gate kollabiert zu einer Linear Map. SwiGLU besitzt drei große Gewichtsmatrizen, mischt keine Tokenpositionen und wendet SiLU vor dem elementweisen Produkt auf genau einen Up-Zweig an.",example:"Bei X [3,11,256] und F=704 haben beide Up-Zweige [3,11,704], das Gate-Produkt ebenfalls [3,11,704] und W₂ liefert [3,11,256] für die Residualaddition.",check:"Welche Rollen spielen das elementweise Produkt und SiLU jeweils, welche Achse wird nicht gemischt, und weshalb muss W₂ wieder auf D abbilden?",sources:["a1","l03"],aliases:"mlp ffn silu glu feed forward gate nonlinear positionwise"},
      {id:"rope",cat:"Transformer",title:"RoPE-Rotation",expr:"θᵢ,ₖ = i / Θ^((2k−2)/d), k=1,…,d/2;   [q′₂ₖ₋₁,q′₂ₖ]ᵀ = R(θᵢ,ₖ)[q₂ₖ₋₁,q₂ₖ]ᵀ",latex:"\\theta_{i,k}=\\frac{i}{\\Theta^{(2k-2)/d}},\\quad \\begin{bmatrix}q'_{2k-1}\\\\q'_{2k}\\end{bmatrix}=R(\\theta_{i,k})\\begin{bmatrix}q_{2k-1}\\\\q_{2k}\\end{bmatrix}",read:"Teile die Tokenposition i durch Θ hoch dem normierten Paarindex und rotiere damit exakt die benachbarten Koordinaten 2k−1 und 2k von Q beziehungsweise K.",purpose:"Gibt Query-Key-Vergleichen A1-konforme Positionsinformation, sodass ihr Dot-Product kontrolliert vom relativen Abstand zweier Tokens abhängen kann.",dims:"Q und K bleiben [...,T,d]; d muss gerade sein. k zählt d/2 benachbarte Featurepaare entlang der letzten Achse; beliebig viele führende Batch-ähnliche Achsen und T bleiben unverändert.",vars:[["i","Tokenposition, die den Winkel linear skaliert"],["k","1-basierter Index des benachbarten Featurepaars"],["Θ","positive RoPE-Basis; größere Paarindizes teilen i durch eine größere Potenz"],["d","gerade Query-/Key-Breite und Nenner des Exponenten"],["R(θ)","feste Matrix [[cosθ,−sinθ],[sinθ,cosθ]] für das Paar (2k−1,2k)"]],intuition:"Für zwei Positionen ergibt R_iᵀR_j eine Rotation um ihre Winkeldifferenz. Ein einziges geteiltes Modul kann die festen Sinus-/Kosinuswerte als nicht-persistenten Buffer vorberechnen und in allen Layern wiederverwenden.",pitfall:"A1 verlangt benachbarte Paare [0,1],[2,3],… in 0-basierter Notation. Half-Split-Pairing ist eine andere Konvention und bricht die Tests. Der Winkel ist i geteilt durch Θ^((2k−2)/d), nicht damit multipliziert; die Tabellen sind Buffer, keine Parameter.",example:"d=4, Θ=100, i=2 ⇒ k=1: θ=2 und Paar [0,1]; k=2: θ=0,2 und Paar [2,3]. R rotiert beide Paare, ohne Shape oder Paarnorm zu ändern.",check:"Welche Winkelformel und Pairing-Konvention prüft A1, wo liegt RoPE im Attention-Ablauf, und warum gehört die geteilte Tabelle in register_buffer(..., persistent=False)?",sources:["a1","l03"],aliases:"rotary positional embedding adjacent pair half split buffer persistent theta frequency query key"},
      {id:"attention",cat:"Transformer",title:"Scaled Dot-Product Attention",expr:"Attention(Q,K,V) = softmax(QKᵀ / √dₖ) V",latex:"\\operatorname{Attention}(Q,K,V)=\\operatorname{softmax}\\left(\\frac{QK^\\top}{\\sqrt{d_k}}\\right)V",read:"Vergleiche jede Query mit allen erlaubten Keys, normiere diese Compatibility Scores zu Gewichten und bilde daraus eine gewichtete Summe der Values.",purpose:"Ermöglicht jeder Tokenposition, abhängig von ihrem aktuellen Inhalt gezielt Informationen aus anderen erlaubten Positionen zu lesen.",dims:"Q [B,H,T_q,d_k], K [B,H,T_k,d_k], V [B,H,T_k,d_v] → Scores und Gewichte [B,H,T_q,T_k] → Output [B,H,T_q,d_v]. Softmax reduziert keine Achse, sondern normalisiert T_k.",vars:[["Q","Query-Aktivierungen: gelernte Suchbeschreibung jeder lesenden Position"],["K","Key-Aktivierungen: gelernte Vergleichsbeschreibung jeder angebotenen Position"],["V","Value-Aktivierungen: Inhalt, der bei hoher Gewichtung übertragen wird"],["dₖ","Breite eines Query/Key-Heads; √dₖ stabilisiert die Score-Skala"],["W_Q,W_K,W_V","gelernte Linear-Layer-Gewichte, die Q,K,V aus X erzeugen; Q,K,V selbst sind keine Parameter"]],intuition:"Q und K entscheiden, wo gelesen wird; V entscheidet, was gelesen wird. Jeder Head lernt eigene Featureansichten, sodass dieselben Tokenzustände für Vergleich und übertragbaren Inhalt unterschiedlich kodiert werden.",pitfall:"Softmax läuft über T_k für jede feste Query. Masken wirken vor Softmax auf Scores; Q,K,V sind Batch-Aktivierungen, während nur ihre erzeugenden Linear Layers gelernt werden.",example:"Hat eine Query nach Softmax Gewichte [0.25,0.75] und Values v₁=[2,0], v₂=[0,4], ist ihr Output 0.25v₁+0.75v₂=[0.5,3]. Identische Scores würden die Values gleichmäßig mitteln.",check:"Welche Rollen haben Q/K gegenüber V, welche Score-Shape entsteht, über welche Achse läuft Softmax, und warum teilt man durch √dₖ?",sources:["a1","l03"],aliases:"self attention q k v scaled dot product compatibility weighted sum"},
      {id:"causal-attention",cat:"Transformer",title:"Kausale Attention-Maske",expr:"Sᵢⱼ = (qᵢ·kⱼ)/√dₖ + Mᵢⱼ,   Mᵢⱼ=0 für j≤i, sonst −∞",latex:"S_{ij}=q_i^Tk_j/\\sqrt{d_k}+M_{ij},\\quad M_{ij}=\\begin{cases}0&j\\le i\\\\-\\infty&j>i\\end{cases}",read:"Zukünftige Keypositionen erhalten vor Softmax unmögliche Scores.",purpose:"Verhindert Informationsleck beim Next-Token-Training.",dims:"M und S: T_q×T_k, über Batch und Attention Heads gebroadcastet.",vars:[["i","Queryposition"],["j","Keyposition"],["M","additive Maske"]],intuition:"Zeile i darf nur Vergangenheit und Gegenwart sehen.",pitfall:"Maskieren mit 0 nach Softmax ist falsch.",example:"Zeile 0 hat nur Spalte 0 erlaubt.",check:"Welches Dreieck enthält −∞?",sources:["a1"],aliases:"mask triangular autoregressive future"},
      {id:"residual",cat:"Transformer",title:"Pre-Norm Residualupdate",expr:"x′ = x + F(Norm(x))",latex:"x'=x+F(\\operatorname{Norm}(x))",read:"Führe x unverändert über den Hauptpfad weiter, berechne parallel eine normalisierte, gelernte Korrektur und addiere beide elementweise.",purpose:"Lässt tiefe Transformer Informationen schrittweise ergänzen, während Signal und Gradient bei Bedarf direkt durch eine Identitätsverbindung fließen können.",dims:"x, F(Norm(x)) und x′ haben exakt dieselbe Shape [B,T,D]. Norm, F und Addition verändern weder Batch- noch Sequenzlänge; F muss auf D zurückkehren.",vars:[["x","aktuelle Aktivierung im Residual Stream, kein eigener Parameter"],["Norm","RMSNorm oder LayerNorm auf dem Seitenzweig"],["F","gelernter Attention- oder MLP-Unterblock"],["x′","aktualisierter gemeinsamer Zustandsstrom für den nächsten Unterblock"]],intuition:"Der Unterblock muss nicht den gesamten Zustand neu erzeugen, sondern lernt eine Korrektur Δx. Weil ∂x′/∂x einen Identitätsanteil enthält, existiert auch durch viele Blöcke ein kurzer Gradientpfad.",pitfall:"Im Pre-Norm-Block wird das ursprüngliche x addiert, nicht Norm(x). Die beiden Updates eines Transformer-Blocks sind sequenziell: Das MLP erhält bereits den durch Attention aktualisierten Zustand.",example:"x=[1,−2] und F(Norm(x))=[0.1,0.5] ergeben x′=[1.1,−1.5]. Ein Decoder-Block führt erst Attention-, dann MLP-Korrektur aus.",check:"Wo liegt der direkte Gradientenpfad, warum müssen beide Summanden dieselbe Shape haben, und welchen Zustand sieht das zweite Residualupdate?",sources:["l03","a1"],aliases:"skip connection prenorm postnorm residual stream identity gradient correction"},
      {id:"z-loss",cat:"Architektur",title:"z-loss für Logit-Stabilität",expr:"L_z = α_z · (1/T) Σ_t [log Σ_v exp(z_tv)]²",latex:"\\mathcal L_z=\\alpha_z\\frac1T\\sum_t\\left(\\log\\sum_v e^{z_{tv}}\\right)^2",read:"Bestrafe pro Token das Quadrat der Log-Partition und mittlere es über T Zielpositionen.",purpose:"Begrenzt einen gemeinsamen Drift aller Output- oder Router-Logits, den Cross-Entropy allein kaum bestimmt.",dims:"z hat Form T×V oder T×E; logsumexp liefert einen Skalar pro Zeile, L_z einen Skalar.",vars:[["z_tv","Logit für Tokenposition t und Vokabulareintrag beziehungsweise Expert v"],["α_z","kleiner Gewichtungsfaktor des Auxiliary Loss"],["T","Zahl bewerteter Tokenpositionen"]],intuition:"Softmax sieht nur Differenzen; z-loss verankert die gemeinsame Logitverschiebung.",pitfall:"Nicht als Ersatz für stabile logsumexp-Berechnung oder als Load-Balancing Loss behandeln.",example:"z→z+a lässt Softmax unverändert, verschiebt logsumexp aber um a.",check:"Warum kann z-loss sich ändern, obwohl Cross-Entropy exakt gleich bleibt?",sources:["l03","l04"],aliases:"z loss log partition logits router stability"},
      {id:"logit-soft-cap",cat:"Architektur",title:"Logit Soft-Capping",expr:"cap_c(z) = c · tanh(z/c),   c&gt;0",latex:"\\operatorname{cap}_c(z)=c\\tanh(z/c)",read:"Skaliere den Logit, wende tanh an und skaliere zurück, sodass große Beträge weich sättigen.",purpose:"Begrenzt extreme Attention- oder Output-Logits, ohne kleine Werte hart abzuschneiden.",dims:"Input und Output haben dieselbe Form; c ist ein positiver Skalar in derselben Logitskala.",vars:[["z","ursprünglicher Logit"],["c","Soft-Cap-Grenze"]],intuition:"Nahe null ist tanh(z/c)≈z/c; für große Beträge nähert sich das Ergebnis ±c.",pitfall:"Soft-Capping ist keine Normalisierung und ersetzt weder QK Norm noch stabile Softmax.",example:"Bei c=10 bleibt z=1 fast gleich, während z=100 nahe 10 sättigt.",check:"Was passiert für |z|≪c und für |z|≫c?",sources:["l03"],aliases:"soft cap tanh logits attention stability"},
      {id:"transformer-params",cat:"Ressourcen",title:"Grobe Transformer-Parameterzahl",expr:"N_non-embed ≈ 12 · L · D²",latex:"N_{\\text{non-embed}}\\approx12Ld_{\\text{model}}^2",read:"Zwölf mal Layerzahl mal Modelldimension zum Quadrat.",purpose:"Napkin Math für dichten Decoder mit Attention und etwa 4D-MLP.",dims:"Parameteranzahl; Architekturdetails ändern den Faktor.",vars:[["L","Anzahl Blöcke"],["D","Modelldimension"],["12","ca. 4D² Attention + 8D² MLP"]],intuition:"Breite kostet quadratisch, Tiefe linear.",pitfall:"Embeddings, GQA, SwiGLU-Breite und Bias können die Näherung ändern.",example:"L verdoppeln ⇒ N ungefähr doppelt; D verdoppeln ⇒ vierfach.",check:"Warum dominiert D²?",sources:["l02","a1"],aliases:"model size parameter count decoder 12ld2"},
      {id:"transformer-ledger",cat:"Ressourcen",title:"A1-exaktes Transformer-Ledger",expr:"P=2VD+L(4D²+3DF+2D)+D   ·   F_fwd=L(8TD²+4T²D+6TDF)+2TDV",latex:"P=2VD+L(4D^2+3DF+2D)+D,\\quad F_{fwd}=L(8TD^2+4T^2D+6TDF)+2TDV",read:"Zähle zwei Vokabularmatrizen, vier Attention- und drei SwiGLU-Matrizen pro Block sowie Norm-Gains; führe jede Matrix für T Tokens aus und ergänze die zwei quadratischen Attention-Matmuls.",purpose:"Liefert die A1-exakte Parameter- und Forward-FLOP-Rechnung unter ungeteiltem Embedding und LM Head, ohne Bias und mit 2 FLOPs pro Multiply-Add.",dims:"P zählt skalare Parameter; F_fwd zählt Matrixmultiplikations-FLOPs für eine Sequenz der Länge T. V,D,F,L und T müssen positive ganze Größen sein.",vars:[["V","Vokabulargröße"],["D","Modelldimension"],["F","SwiGLU-Hiddenbreite"],["L","Zahl der Transformer-Blöcke"],["T","Sequenzlänge"]],intuition:"Parameter hängen von Matrizenshapes ab; Laufzeit wiederholt dieselben Gewichte über Tokens und mischt in Attention zusätzlich jedes Query-Key-Paar.",pitfall:"Weight Tying, Biases oder ein klassisches Zwei-Matrix-MLP stillschweigend anzunehmen ändert die Architektur und damit beide Formeln.",example:"V=1000,D=64,F=192,L=3,T=32,H=8 ⇒ P=288192, F_block=3670016 und F_fwd=15106048; H kürzt sich bei H·d_head=D heraus.",check:"Welche Matrix wurde typischerweise vergessen, wenn der SwiGLU-Term nur 4TDF statt 6TDF beträgt?",sources:["a1","l02"],aliases:"exact transformer accounting forward flops swiglu untied head ledger"},
      {id:"temperature",cat:"Sampling",title:"Temperatur",expr:"pᵢ(T) = softmax(zᵢ / T),   T&gt;0",latex:"p_i(T)=\\operatorname{softmax}(z_i/T)",read:"Teile Logits vor Softmax durch eine positive Temperatur.",purpose:"Steuert Schärfe und Diversität beim Sampling.",dims:"T dimensionsloser Skalar.",vars:[["zᵢ","Logit"],["T","Temperatur"],["pᵢ","angepasste Wahrscheinlichkeit"]],intuition:"T&lt;1 vergrößert Differenzen, T&gt;1 glättet.",pitfall:"T=0 nicht numerisch einsetzen; Greedy separat behandeln.",example:"T→∞ nähert sich uniform, T→0 konzentriert auf Maxima.",check:"Welche Richtung erhöht Diversität?",sources:["a1"],aliases:"sampling logits entropy decoding"},
      {id:"adamw",cat:"Optimierung",title:"AdamW-Update",expr:"mₜ=β₁mₜ₋₁+(1−β₁)gₜ;   vₜ=β₂vₜ₋₁+(1−β₂)gₜ²;   θₜ←(1−ηλ)θₜ₋₁−η m̂ₜ/(√v̂ₜ+ε)",latex:"m_t=\\beta_1m_{t-1}+(1-\\beta_1)g_t,\\quad v_t=\\beta_2v_{t-1}+(1-\\beta_2)g_t^2",read:"Nimm nach Backward den aktuellen Gradienten gₜ, aktualisiere für jede Parameterkoordinate das Richtungs-Memory mₜ und das Größen-Memory vₜ, korrigiere ihren Nullstart und führe anschließend Decay- und adaptiven Gradientenschritt aus.",purpose:"AdamW verändert die gelernten Modellparameter nach jedem Optimizer-Step trotz verrauschter und je Koordinate unterschiedlich großer Gradienten. Es wird im Training Loop nach Backward und optionalem Gradient Clipping eingesetzt.",dims:"θ, g, m und v besitzen jeweils exakt die Form des zugehörigen Parameters, etwa [D_in,D_out]; alle Operationen sind elementweise. β₁, β₂, η, λ und ε sind Skalare, und m sowie v sind persistenter Optimizer-State statt Modellaktivierungen.",vars:[["gₜ","aktueller, durch Backpropagation berechneter und gegebenenfalls bereits geclippter Gradient"],["mₜ","exponentiell geglätteter signed Gradient als Richtungs-Memory"],["vₜ","exponentiell geglättetes Gradientenquadrat als Größen-Memory"],["m̂ₜ,v̂ₜ","Bias-korrigierte Momente, weil m₀=v₀=0"],["β₁,β₂","Memory-Faktoren; größere Werte vergessen vergangene Gradienten langsamer"],["η","aktuelle Learning Rate aus dem Schedule"],["λ","Stärke des separat angewandten Weight Decay"],["ε","kleine feste Zahl gegen einen instabilen Nenner"]],intuition:"m merkt sich, in welche Richtung viele Batches zeigen; √v schätzt die typische absolute Gradientengröße derselben Koordinate. Ihr Verhältnis macht Schritte zwischen Koordinaten vergleichbarer, während der getrennte Faktor 1−ηλ den alten Parameter unabhängig davon leicht zu null zieht.",pitfall:"Bias Correction muss mit t=1 beim ersten Update beginnen. Weight Decay darf nicht zusätzlich in g gemischt werden; selbst bei g=0 kann der separate Decay θ verändern. Nur Parameter in den Optimizer-Gruppen werden aktualisiert.",example:"Für θ₀=1, g₁=2, β₁=0,9, β₂=0,999, η=0,001 und λ=0,1 gilt m₁=0,2, v₁=0,004, m̂₁=2 und v̂₁=4. Der Decay liefert 0,9999 und der adaptive Term ungefähr 0,001, also θ₁≈0,9989.",check:"Warum ist AdamW-Decay nicht derselbe Term wie L2 in Adam?",sources:["a1","l02"],aliases:"optimizer moment weight decay bias correction"},
      {id:"cosine-lr",cat:"Optimierung",title:"Warmup + Cosine Decay",expr:"η(t)=ηₘᵢₙ + ½(ηₘₐₓ−ηₘᵢₙ)[1+cos(π(t−T_w)/(T−T_w))]",latex:"\\eta(t)=\\eta_{min}+\\frac12(\\eta_{max}-\\eta_{min})\\left[1+\\cos\\left(\\pi\\frac{t-T_w}{T-T_w}\\right)\\right]",read:"Nach linearem Warmup fällt die Lernrate kosinusförmig vom Maximum zum Minimum.",purpose:"Stabile frühe Schritte und sanfter später Decay.",dims:"t,T,T_w in Optimizer-Steps; η ist Lernrate.",vars:[["T_w","Warmup-Steps"],["T","Gesamtsteps"],["η_max/min","Grenzlernrate"]],intuition:"Keine harte Kante im Decay; Steigung ist an beiden Enden null.",pitfall:"Für t&lt;T_w gilt eine separate lineare Formel.",example:"In der Mitte des Decays liegt η genau mittig zwischen min und max.",check:"Welche η gilt bei t=T?",sources:["a1","l11"],aliases:"learning rate scheduler warmup cosine"},
      {id:"gradient-clip",cat:"Optimierung",title:"Globales Norm-Clipping",expr:"g ← g · min(1, c/(||g||₂+ε))",latex:"g\\leftarrow g\\min\\left(1,\\frac{c}{\\lVert g\\rVert_2+\\epsilon}\\right)",read:"Betrachte alle Parametergradienten gedanklich als einen langen Vektor, berechne dessen globale L2-Norm und multipliziere jeden Eintrag mit demselben Faktor, falls die Norm größer als der Grenzwert c ist.",purpose:"Global Norm Clipping begrenzt einen ungewöhnlich großen Backward-Schritt, bevor er die AdamW-Momente und Parameter stark verändert. Es liegt nach Backward beziehungsweise Mixed-Precision-Unscale und vor optimizer.step().",dims:"Jeder Gradient behält exakt die Form seines Parameters; nur seine Werte ändern sich. ||g||₂ und c sind Skalare mit derselben Einheit, der Multiplikationsfaktor ist dimensionslos und liegt zwischen null und eins.",vars:[["g","Sammlung aller zu clippenden Parametergradienten, konzeptionell zu einem Vektor zusammengesetzt"],["||g||₂","globale L2-Norm: Quadratwurzel aus der Summe aller quadrierten Gradienteneinträge"],["c","positiver maximal erlaubter Normwert"],["ε","kleine feste Zahl, die den Nenner numerisch absichert"]],intuition:"Clipping kürzt einen zu langen Gradient-Pfeil, ohne ihn zu drehen: Alle Komponenten behalten ihre gegenseitigen Verhältnisse. Liegt die Norm bereits unter c, ist der Faktor eins und die Gradienten bleiben unverändert.",pitfall:"Komponentenweises clamp verändert die Richtung und ist nicht dieselbe Operation. Bei Mixed Precision muss zuerst unscale erfolgen; in Distributed Training muss die Norm außerdem über die fachlich richtige Gruppe berechnet werden. Clipping nach optimizer.step() kommt zu spät.",example:"Bei ||g||₂=10 und c=1 ist der gemeinsame Faktor ungefähr 0,1: aus Gradiententeilen [6,8] werden [0,6,0,8], deren Norm eins ist. Bei ||g||₂=0,4 bleibt alles unverändert.",check:"Warum bleibt der Winkel gleich?",sources:["a1"],aliases:"clip grad norm exploding gradient"},
      {id:"global-batch",cat:"Training",title:"Globale Batchgröße",expr:"B_global = B_micro · G_accum · W",latex:"B_{global}=B_{micro}G_{accum}W",read:"Microbatch pro Rank mal Accumulation-Steps mal World Size.",purpose:"Verbindet Datenmenge pro Optimizer-Step mit verteiltem Setup.",dims:"Anzahl Sequenzen; Tokens pro Step zusätzlich ×T.",vars:[["B_micro","Sequenzen pro Forward und Rank"],["G_accum","Gradient-Accumulation"],["W","Anzahl Data-Parallel-Ranks"]],intuition:"Alle Beiträge werden vor einem gemeinsamen Update zusammengeführt.",pitfall:"Bei Tensorparallelismus erhöht nicht jeder Rank die Datenbatchgröße.",example:"2×8×16=256 Sequenzen global.",check:"Welche Parallelitätsachse gehört in W?",sources:["a1","l07","a2"],aliases:"batch accumulation world size tokens per step"},
      {id:"training-flops",cat:"Ressourcen",title:"Training-Compute",expr:"C ≈ 6 · N · D_tokens",latex:"C\\approx6ND",read:"Ungefähr sechs FLOPs pro Parameter und Trainingstoken.",purpose:"Grobe Compute- und Scaling-Rechnung für dichte Transformer.",dims:"C in FLOPs, N Parameter, D_tokens Tokenzahl.",vars:[["C","gesamter Trainingscompute"],["N","Nicht-Embedding- oder Modellparameter je Konvention"],["D_tokens","verarbeitete Tokens"]],intuition:"Forward etwa 2N, Backward grob doppelt so viel zusätzlich.",pitfall:"Konvention für N und Attention-Zusatzkosten offenlegen.",example:"Verdopple Tokens ⇒ ungefähr doppelter Compute.",check:"Woher kommt der Faktor 6 grob?",sources:["l02","l09","a3"],aliases:"6nd compute flops tokens model size"},
      {id:"mfu",cat:"Ressourcen",title:"MFU (Model FLOPs Utilization)",expr:"MFU = modellierte FLOP/s ÷ Hardware-Peak-FLOP/s",latex:"\\operatorname{MFU}=\\frac{\\text{model FLOP/s}}{\\text{peak hardware FLOP/s}}",read:"Teile nützliche modellierte Rechenrate durch theoretische Peakrate.",purpose:"Vergleicht End-to-End-Trainingseffizienz grob über Setups.",dims:"Dimensionsloser Anteil oder Prozent.",vars:[["Model FLOP/s","nach Konvention gezählte LM-Operationen pro Sekunde"],["Peak","Hardwaremaximum für passenden Datentyp"]],intuition:"Wie viel des idealisierten Rechendachs wird als Modellarbeit umgesetzt?",pitfall:"Andere FLOP-Konventionen oder sparsity machen Vergleiche schief.",example:"400 TFLOP/s bei 1000 Peak ⇒ 40% MFU.",check:"Warum kann schlechte Datenpipeline MFU senken?",sources:["l02","a2"],aliases:"model flops utilization throughput efficiency"},
      {id:"speedup",cat:"Systems",title:"Speedup & Skalierungseffizienz",expr:"S(p)=T₁/Tₚ;   E(p)=S(p)/p",latex:"S(p)=T_1/T_p,\\quad E(p)=S(p)/p",read:"Speedup vergleicht Laufzeit; Effizienz teilt zusätzlich durch Ressourcenzahl p.",purpose:"Bewertet parallele Beschleunigung.",dims:"Beide dimensionslos; T in gleicher Zeiteinheit.",vars:[["p","Geräte/Prozesse"],["T₁","Laufzeit auf einer Ressource"],["Tₚ","Laufzeit auf p Ressourcen"]],intuition:"Linearer Speedup p bedeutet 100% Skalierungseffizienz.",pitfall:"Strong und Weak Scaling nicht vermischen.",example:"1 GPU 8s, 4 GPUs 2.5s ⇒ S=3.2,E=80%.",check:"Warum kann E mit p sinken?",sources:["l06","l07","a2"],aliases:"parallel scaling strong weak efficiency amdahl"},
      {id:"arithmetic-intensity",cat:"GPU",title:"Arithmetic Intensity",expr:"AI = FLOPs / Bytes aus langsamem Speicher",latex:"AI=\\frac{\\text{FLOPs}}{\\text{bytes transferred}}",read:"Nützliche Rechenoperationen pro übertragenem Byte.",purpose:"Klassifiziert, ob ein Kernel eher Bandbreite oder Rechenleistung braucht.",dims:"FLOPs/Byte.",vars:[["FLOPs","Operationen"],["Bytes","relevanter Speichertraffic, meist HBM"]],intuition:"Daten oft wiederverwenden, bevor sie zurück ins langsame HBM gehen.",pitfall:"Welche Cacheebene gezählt wird, muss benannt sein.",example:"200 FLOPs bei 100 Byte ⇒ AI=2 FLOPs/Byte.",check:"Warum erhöht Fusion meist AI?",sources:["l05","a2"],aliases:"compute intensity operational intensity bytes memory"},
      {id:"triton-grid-mask",cat:"GPU",title:"Triton Grid, Offsets & Randmaske",expr:"P = ⌈N/BLOCK_SIZE⌉   ·   oₚᵣ = p·BLOCK_SIZE+r   ·   mₚᵣ = [oₚᵣ&lt;N]",latex:"P=\\left\\lceil\\frac{N}{B}\\right\\rceil,\\quad o_{p,r}=pB+r,\\quad m_{p,r}=\\mathbf 1[o_{p,r}<N]",read:"Starte genügend Programs für alle N Elemente, bilde lokale Lanes auf globale Offsets ab und prädiziere jeden Randzugriff.",purpose:"Grundvertrag eines eindimensionalen Triton-Kernels ohne ausgelassene oder doppelt besessene Elemente.",dims:"P, N, BLOCK_SIZE und Offsets sind ganzzahlig; m ist ein Boolescher Vektor pro Program.",vars:[["P","Zahl gestarteter Programs"],["N","Zahl gültiger Elemente"],["p","program_id"],["r","lokale Lane 0…BLOCK_SIZE−1"],["oₚᵣ","globale Speicherposition"],["mₚᵣ","Gültigkeitsmaske für den Speicherzugriff"]],intuition:"ceil_div stellt vollständige Abdeckung sicher; die Maske macht das absichtlich überhängende letzte Tile sicher.",pitfall:"False-Masken entfernen keine Lanes. Loads brauchen ein operationsneutrales other, und Stores müssen unabhängig maskiert werden.",example:"N=17,BLOCK_SIZE=8 ⇒ P=3; p=2 besitzt offsets 16…23, davon ist nur 16 gültig.",check:"Was geht bei floor(N/BLOCK_SIZE) verloren, und wie viele Tail-Lanes entstehen?",sources:["l06","a2"],aliases:"triton program id grid ceil div offsets lanes mask boundary"},
      {id:"roofline",cat:"GPU",title:"Roofline-Grenze",expr:"Performance ≤ min(P_peak,   BW · AI)",latex:"P\\le\\min(P_{peak},BW\\cdot AI)",read:"Erreichbare Leistung ist höchstens das kleinere von Compute-Peak und Bandbreitendach.",purpose:"Einfaches Engpassmodell für GPU-Kernel.",dims:"P in FLOP/s; BW Byte/s; AI FLOP/Byte.",vars:[["P_peak","theoretische Rechenleistung"],["BW","Speicherbandbreite"],["AI","Arithmetic Intensity"]],intuition:"Links zählt Datenlieferung, rechts Recheneinheiten.",pitfall:"Ein Dach ist keine zugesicherte Messleistung.",example:"BW=1 TB/s, AI=10 ⇒ Bandbreitendach 10 TFLOP/s.",check:"Wie berechnet sich der Ridge Point?",sources:["l05","a2"],aliases:"memory bound compute bound bandwidth ridge point"},
      {id:"online-softmax",cat:"GPU",title:"Online Softmax-Update",expr:"m′=max(m,m_b);   ℓ′=e^(m−m′)ℓ + Σⱼ e^(sⱼ−m′)",latex:"m'=\\max(m,m_b),\\quad \\ell'=e^{m-m'}\\ell+\\sum_j e^{s_j-m'}",read:"Aktualisiere laufendes Maximum und reskaliere die bisherige Normierung, bevor ein neuer Block addiert wird.",purpose:"Ermöglicht exakte blockweise Softmax in FlashAttention.",dims:"m,ℓ skalar pro Queryzeile; s_j Block-Scores.",vars:[["m","bisheriges Maximum"],["m_b","Blockmaximum"],["ℓ","bisherige Exponentialsumme"],["sⱼ","neue Scores"]],intuition:"Wenn ein größeres Maximum erscheint, müssen alte Beiträge in die neue Skala umgerechnet werden.",pitfall:"Output-Akkumulator muss mit demselben Faktor reskaliert werden.",example:"Neues Maximum +2 ⇒ alte exp-Summe ×e⁻².",check:"Welche zwei Statistiken reichen für die Normalisierung?",sources:["a2","l05"],aliases:"flash attention running max sum logsumexp"},
      {id:"flash-backward",cat:"GPU",title:"FlashAttention-Backward-Recomputation",expr:"D_row=rowsum(O⊙dO); P=exp(QKᵀ/√d−L); dS=P⊙(dOVᵀ−D_row); dQ=dSK/√d; dK=dSᵀQ/√d; dV=PᵀdO",latex:"D_i=\\sum_j O_{ij}dO_{ij},\\quad P=e^{QK^T/\\sqrt d-L},\\quad dS=P\\odot(dOV^T-D)",read:"Rekonstruiere die maskierten Softmax-Wahrscheinlichkeiten aus Q, K und zeilenweisem Log-Sum-Exp und bilde daraus dV, dS, dQ und dK.",purpose:"Ermöglicht exakten Attention-Backward ohne die vollständige T×T-Wahrscheinlichkeitsmatrix im High Bandwidth Memory zu speichern.",dims:"Q,K,dQ,dK haben Headshape [T,d], V,O,dV,dO [T,d_v], L und D_row [T], P und dS [T,T] nur blockweise.",vars:[["L","gespeicherte zeilenweise Log-Sum-Exp-Statistik"],["D_row","Zeilensumme O⊙dO"],["P","rekonstruierte maskierte Softmax-Wahrscheinlichkeiten"],["dS","Gradient der skalierten, maskierten Scores"]],intuition:"Gespeicherte Zeilenstatistiken reichen, um P tileweise exakt wiederherzustellen; Compute wird gegen vermiedenen Speicherverkehr getauscht.",pitfall:"Forward- und Backward-Maske müssen identisch sein; maskierte Einträge bleiben null und jede gültige dS-Zeile summiert numerisch ungefähr zu null.",example:"Für eine vollständig erlaubte Zeile gilt rowsum(dS)≈0, weil eine gemeinsame Verschiebung aller Softmax-Logits den Output nicht ändert.",check:"Warum ist rowsum(dS) eine nützliche Gradient-Invariante?",sources:["l05","a2"],aliases:"flash attention backward recompute logsumexp drow ds dq dk dv"},
      {id:"memory-state",cat:"Systems",title:"Trainingszustand pro Parameter",expr:"M ≈ M_param + M_grad + M_master + M_m + M_v",latex:"M=M_{param}+M_{grad}+M_{master}+M_m+M_v",read:"Addiere Gewicht, Gradient, optionales Mastergewicht und zwei Adam-Momente.",purpose:"Speicherbudget und Sharding-Analyse.",dims:"Bytes pro Parameter × N.",vars:[["param","Modellgewicht, oft BF16"],["grad","Gradient"],["master","FP32-Kopie, setupabhängig"],["m,v","FP32-Adamzustand"]],intuition:"Das sichtbare Modell ist nur ein Teil des Trainingsspeichers.",pitfall:"Framework-Details verändern die genaue Bytezahl; Aktivierungen kommen zusätzlich.",example:"2+2+4+4+4=16 Byte/Parameter in einem häufigen Mischpräzisionsmodell.",check:"Welche Anteile shardet ZeRO-1/2/3?",sources:["l02","a2"],aliases:"adam memory bytes parameters gradients optimizer state"},
      {id:"kv-cache",cat:"Inferenz",title:"KV-Cache-Größe",expr:"M_KV = 2 · L · B · S · H_kv · d_head · b_KV",latex:"M_{KV}=2LBSH_{kv}d_{head}b_{KV}",read:"Zähle pro Layer, Sequenz und früherer Position je einen gespeicherten Key- und Value-Vektor für jeden Key-Value Head.",purpose:"Schätzt den persistenten Attention-Speicher beim autoregressiven Decoding und zeigt, warum lange Kontexte, große Batches und viele KV Heads Speicherbandbreite kosten.",dims:"K und V haben pro Layer jeweils [B,H_kv,S,d_head]; multipliziert mit L, dem Faktor 2 und b_KV Bytes pro Element ergibt M_KV in Bytes.",vars:[["2","zwei getrennte Aktivierungstensoren: Keys und Values"],["L","Transformer-Layer, von denen jeder einen eigenen Cache führt"],["B","gleichzeitig decodierte Sequenzen"],["S","bereits verarbeitete und gespeicherte Tokenpositionen"],["H_kv","Key-Value Heads; bei GQA oft kleiner als H_q"],["d_head","Featurebreite eines Heads, meist D/H_q"],["b_KV","Bytes pro gespeichertem Cacheelement"]],intuition:"Beim Prefill berechnet jeder Layer K und V für das gesamte Prompt. Bei jedem Decode-Step entstehen nur K und V des neuen Tokens, werden entlang S angehängt und beim nächsten Schritt wieder gelesen; Q wird nur für die aktuelle Position benötigt und deshalb nicht historisch gecacht.",pitfall:"Der KV-Cache enthält Laufzeitaktivierungen, keine Modellparameter und keine Attention-Gewichte. H_q statt H_kv überschätzt GQA; S ist die Cachehistorie und darf nicht mit der Zahl aktuell berechneter Querypositionen verwechselt werden.",example:"Sinkt H_kv bei gleichen übrigen Größen von 16 auf 4, fällt der Cache auf ein Viertel. Jedes neu generierte Token erhöht S um eins und fügt in jedem Layer genau einen K- und V-Vektor je KV Head hinzu.",check:"Woher stammen Faktor 2 und Achse S, warum wird Q nicht historisch gecacht, und welche Größe reduziert GQA?",sources:["l10","l03"],aliases:"key value cache inference gqa mqa memory context prefill decode bandwidth"},
      {id:"inference-params-gqa",cat:"Inferenz",title:"GQA-Transformer: Matrix-Parameterzerlegung",expr:"P = c_tie·V·D + L(3DF + 2D² + 2D·H_kv·d_head)",latex:"P=c_{tie}VD+L\\left(3DF+2D^2+2DH_{kv}d_{head}\\right)",read:"Zähle Embedding und LM Head, drei gated-MLP-Matrizen sowie Query-, Key-, Value- und Output-Projektionen in jedem Layer.",purpose:"Lecture-10-Rechnung der dominanten Matrixparameter für ein gated MLP und Grouped-Query Attention (GQA).",dims:"Jeder Summand ist eine Parameteranzahl. Norm-Scales, Biases und weitere kleine Parameter sind wie in der Lecture-10-Näherung nicht enthalten.",vars:[["c_tie","1 bei Weight Tying, sonst 2"],["V","Vokabulargröße"],["D","Modelldimension"],["L","Layer"],["F","MLP-Zwischenbreite"],["H_kv","Key-Value Heads"],["d_head","Headbreite; D=H_q·d_head"]],intuition:"Q und Output bleiben D×D; nur K und V werden mit weniger KV-Heads schmaler.",pitfall:"Die grobe 12LD²-Näherung einsetzen, obwohl gated MLP, F=4D und GQA explizit gegeben sind – oder H als Headanzahl und Headbreite zugleich zu verwenden.",example:"Bei F=4D wird der Layerterm LD²(14+2H_kv/H_q).",check:"Warum ändern weniger KV-Heads die Attention-Parameter, aber nicht den Q- oder Output-Term?",sources:["l10"],aliases:"inference parameters gqa gated mlp weight tying projection count head width"},
      {id:"mlp-arithmetic-intensity",cat:"Inferenz",title:"Gated-MLP Arithmetic Intensity",expr:"AI_MLP = 6BT_qDF / (4BT_qD + 4BT_qF + 6DF)",latex:"AI_{MLP}=\\frac{6BT_qDF}{4BT_qD+4BT_qF+6DF}",read:"Teile die modellierten gated-MLP-FLOPs durch die unter BF16 angenommenen HBM-Bytes.",purpose:"Erklärt, warum Prefill dieselben Gewichte über viele Tokenzeilen wiederverwendet, Decode dagegen wenig.",dims:"FLOPs pro Byte.",vars:[["B","Batchgröße"],["T_q","jetzt gemeinsam verarbeitete Querypositionen: S bei Prefill, 1 bei Decode"],["D","Input- und Outputbreite"],["F","gated-MLP-Zwischenbreite"]],intuition:"Wenn B·T_q klein gegenüber D und F ist, dominiert das Lesen der drei Gewichtsmatrizen und AI nähert sich B·T_q.",pitfall:"Die Formel als vollständiges Hardwaremodell behandeln; Nonlinearities, Caches und zusätzliche Reads sind vereinfacht.",example:"Decode mit B=8 und breitem Modell ergibt ungefähr 8 FLOPs/Byte; Prefill mit langem S kann viel höher liegen.",check:"Welcher Term lässt AI beim Prefill wachsen, ohne die Parameterzahl zu ändern?",sources:["l10"],aliases:"mlp ai arithmetic intensity prefill decode bf16 hbm"},
      {id:"attention-arithmetic-intensity",cat:"Inferenz",title:"Attention Arithmetic Intensity",expr:"AI_attn = S·T_q/(S+T_q)   ⇒   Prefill: S/2   ·   Decode: S/(S+1)",latex:"AI_{attn}=\\frac{ST_q}{S+T_q}",read:"Vergleiche die FLOPs von QKᵀ und AV mit dem Lesen von Q, K und V unter der Lecture-10-MHA-Näherung.",purpose:"Zeigt den fundamentalen Unterschied zwischen langem parallelem Prefill und einem einzelnen Decode-Query.",dims:"FLOPs pro Byte unter BF16 und ohne materialisierte Scorematrix in HBM.",vars:[["S","Key-Value-Länge beziehungsweise gecachter Kontext"],["T_q","aktuell berechnete Querypositionen"]],intuition:"Prefill vergleicht viele Queries mit vielen Keys; Decode liest den ganzen Cache für nur einen neuen Query.",pitfall:"B in die Formel multiplizieren: Jede Anfrage besitzt andere Keys und Values, daher verbessert Batch die Kern-Attention-Wiederverwendung nicht automatisch.",example:"S=2048 ⇒ Prefill AI=1024, Decode AI≈1 im MHA-Modell.",check:"Warum bleibt Decode für sehr großes S knapp unter 1 statt mit S zu wachsen?",sources:["l10"],aliases:"attention ai arithmetic intensity mha prefill decode flashattention"},
      {id:"decode-bandwidth",cat:"Inferenz",title:"Bandbreitenlimit für Decode",expr:"M_step = P·b_w + M_KV   ·   t_ideal = M_step/BW_HBM   ·   throughput_ideal = B/t_ideal",latex:"M_{step}=Pb_w+M_{KV},\\quad t_{ideal}=\\frac{M_{step}}{BW_{HBM}},\\quad throughput_{ideal}=\\frac{B}{t_{ideal}}",read:"Addiere mindestens einmal gelesene Gewichte und KV-Cache, teile durch HBM-Bandbreite und leite daraus eine ideale Tokenrate ab.",purpose:"Gibt eine Latenz-Untergrenze und Throughput-Obergrenze für memory-bound Decode.",dims:"M_step in Bytes, Bandbreite in Bytes/s, t in Sekunden, Throughput in Token/s.",vars:[["P","Parameterzahl"],["b_w","Bytes pro Gewicht"],["M_KV","KV-Cache-Bytes"],["BW_HBM","High-Bandwidth-Memory-Bandbreite"],["B","pro Schritt erzeugte Tokens bei B aktiven Sequenzen"]],intuition:"Selbst ohne jede Rechenzeit dauert das Bewegen unvermeidbarer Bytes endlich lange.",pitfall:"Die Idealgrenze als gemessene Latenz oder Time to First Token ausgeben; Runtime, Compute, Kommunikation und Queueing fehlen.",example:"5.38 GB pro Schritt bei 3.35 TB/s ergeben mindestens etwa 1.6 ms.",check:"Warum ist t_ideal eine Untergrenze, Throughput_ideal aber eine Obergrenze?",sources:["l10"],aliases:"decode latency throughput bandwidth hbm lower bound upper bound"},
      {id:"ssm-recurrence",cat:"Inferenz",title:"State-Space-Rekurrenz",expr:"h_t = Āh_{t−1} + B̄u_t   ·   y_t = Ch_t + D_su_t",latex:"h_t=\\bar A h_{t-1}+\\bar B u_t,\\quad y_t=Ch_t+D_su_t",read:"Aktualisiere einen festen Zustand aus altem Zustand und aktuellem Input; lies daraus den Output aus.",purpose:"Grundmodell eines diskreten State-Space Models (SSM) für Sequenzen.",dims:"u_t, h_t und y_t können verschiedene Featurebreiten haben; die Matrizen bilden zwischen ihnen ab.",vars:[["u_t","Input am Schritt t"],["h_t","komprimierter rekurrenter Zustand"],["y_t","Output"],["Ā,B̄,C,D_s","gelernte Zustands-, Input-, Output- und Direktpfadmatrizen"]],intuition:"Die gesamte Vergangenheit wirkt nur noch durch h_{t−1}; der Decode-State wächst daher nicht mit Kontext S.",pitfall:"O(1) in S mit unbegrenzter Erinnerung verwechseln: Der feste Zustand kann Details komprimieren oder vergessen.",example:"Ohne Inputterm B̄u_t könnte neue Information den Zustand nie verändern.",check:"Welcher Informationspfad ersetzt den direkten Zugriff auf einzelne frühere KV-Einträge?",sources:["l10"],aliases:"ssm state space recurrence mamba s4 hidden state"},
      {id:"diffusion-generation",cat:"Inferenz",title:"Diffusion-Generationsschleife",expr:"x_K ~ p_noise   ·   x_{k−1} ~ p_θ(x_{k−1}|x_k),   k=K,…,1   ·   decode(x₀)",latex:"x_K\\sim p_{noise},\\quad x_{k-1}\\sim p_\\theta(x_{k-1}\\mid x_k)",read:"Starte mit Noise und verfeinere die gesamte Sequenz schrittweise bis zu einer decodierbaren Repräsentation.",purpose:"Schematisiert nicht-autoregressive Textgenerierung durch wiederholtes Denoising.",dims:"x_k repräsentiert eine vollständige Sequenz auf Noise-Level k.",vars:[["K","Anzahl Denoising-Schritte"],["x_k","Sequenzzustand im Schritt k"],["p_θ","gelerntes Reverse-Transition-Modell"]],intuition:"Positionen sind innerhalb eines Schritts parallel, die K Zustandsübergänge bleiben sequenziell.",pitfall:"Parallel über Tokenpositionen mit One-Pass-Generation verwechseln.",example:"K=20 benötigt mindestens 20 abhängige Modellübergänge, auch wenn jeder alle Positionen gemeinsam verarbeitet.",check:"Was ist parallel und was bleibt sequenziell?",sources:["l10"],aliases:"diffusion text generation denoising parallel tokens"},
