name: Deploy CS336 Lernwerk to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # build-site.mjs imports check-i18n.mjs, so the guards run as part of the build.
      # They use Math.f16round for the fp16 rounding in mixed-precision, which needs
      # Node 24 or newer; the runner's default Node 22 fails with "not a function".
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: node scripts/build-site.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
